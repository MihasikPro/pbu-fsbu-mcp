# Развёртывание на внутреннем сервере 192.168.100.172.
#
# Порядок:
#   git clone https://github.com/MihasikPro/pbu-fsbu-mcp.git
#   cd pbu-fsbu-mcp/deploy
#   docker compose -f compose.server.yml up -d --build
#
# Образ собирается на сервере из исходников, а не тянется из реестра: корпус
# (data/build/pbu_fsbu.db) намеренно не хранится в git, он собирается на этапе
# build и там же проверяется валидатором - невалидный корпус роняет сборку
# вместо того, чтобы уехать в рантайм.
#
# Доступ строго из локальной сети: порт публикуется на конкретный LAN-адрес,
# а не на 0.0.0.0. Это важнее, чем кажется - если у хоста появится второй
# интерфейс (VPN, публичный IP), привязка к 0.0.0.0 выставит сервис туда молча,
# а такая запись физически не сможет.
#
# TLS и аутентификации нет намеренно: корпус - публичные нормативные тексты без
# секретов, сеть закрытая. Если сервис когда-нибудь понадобится снаружи, это
# отдельное решение с TLS и авторизацией, а не проброс порта.
services:
  pbu-fsbu-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    image: pbu-fsbu-mcp:local
    container_name: pbu-fsbu-mcp
    restart: unless-stopped
    ports:
      - "192.168.100.172:18010:18010"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # /healthz отвечает 503, если корпус не собрался. Без healthcheck такой
      # контейнер остался бы «живым», отдавая клиенту пустой список инструментов
      # вместо ошибки - это уже случалось в этом проекте трижды в других местах.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:18010/healthz').status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
