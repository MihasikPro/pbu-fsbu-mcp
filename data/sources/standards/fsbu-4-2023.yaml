id: fsbu-4-2023
kind: ФСБУ
number: 4/2023
year: 2023
title: Бухгалтерская (финансовая) отчетность
order_date: 2023-10-04
order_no: 157н
effective_from: &id001 2025-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящий Стандарт устанавливает состав и содержание информации, раскрываемой в бухгалтерской
      (финансовой) отчетности (далее – бухгалтерская отчетность) (в том числе образцы форм бухгалтерской
      отчетности), состав приложений к бухгалтерскому балансу и отчету о финансовых результатах и состав
      приложений к бухгалтерскому балансу и отчету о целевом использовании средств, состав промежуточной
      бухгалтерской отчетности, а также условия, при которых бухгалтерская отчетность дает достоверное
      представление о финансовом положении экономического субъекта на отчетную дату, финансовом результате
      его деятельности и движении денежных средств за отчетный период (далее – условия достоверности бухгалтерской
      отчетности).
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Информация, раскрываемая в бухгалтерской отчетности (включаемая в бухгалтерскую отчетность),
      формируется в порядке, установленном соответствующими федеральными стандартами бухгалтерского учета
      и отраслевыми стандартами бухгалтерского учета, принимаемыми в соответствии с Федеральным законом
      от 6 декабря 2011 г. № 402‑ФЗ «О бухгалтерском учете» (далее соответственно – федеральные стандарты,
      отраслевые стандарты, Федеральный закон «О бухгалтерском учете»).
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: Состав и содержание информации, раскрываемой в бухгалтерской отчетности (в том числе образцы
      форм бухгалтерской отчетности) кредитных организаций, некредитных финансовых организаций, бюро кредитных
      историй, кредитных рейтинговых агентств, устанавливаются отраслевыми стандартами и (или) нормативными
      актами Центрального банка Российской Федерации, утверждаемыми Центральным банком Российской Федерации
      в соответствии с Федеральным законом «О бухгалтерском учете».
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: 'Настоящий Стандарт не применяется:'
  - path: 4.а
    parent_path: '4'
    heading: null
    text: организациями бюджетной сферы;
  - path: 4.б
    parent_path: '4'
    heading: null
    text: Центральным банком Российской Федерации при составлении финансовой отчетности, предусмотренной
      Федеральным законом от 10 июля 2002 г. № 86-ФЗ «О Центральном банке Российской Федерации (Банке
      России)»;
  - path: 4.в
    parent_path: '4'
    heading: null
    text: при составлении консолидированной финансовой отчетности, предусмотренной Федеральным законом
      от 27 июля 2010 г. № 208-ФЗ «О консолидированной финансовой отчетности»;
  - path: 4.г
    parent_path: '4'
    heading: null
    text: при создании информации, необходимой для составления отчетности для целей, отличных от предусмотренных
      Федеральным законом «О бухгалтерском учете», если иное не предусмотрено законодательством Российской
      Федерации и принятыми в соответствии с ним правилами составления такой отчетности. Отчетность, составленная
      для целей, отличных от предусмотренных Федеральным законом «О бухгалтерском учете», в соответствии
      с настоящим Стандартом, не является бухгалтерской отчетностью и не включается в ее состав.
  - path: '5'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В соответствии с частями 1 – 3 статьи 14 Федерального закона «О бухгалтерском учете»:'
  - path: 5.а
    parent_path: '5'
    heading: null
    text: годовая и промежуточная бухгалтерская отчетность, за исключением случаев, установленных Федеральным
      законом «О бухгалтерском учете», состоит из бухгалтерского баланса, отчета о финансовых результатах
      и приложений к ним;
  - path: 5.б
    parent_path: '5'
    heading: null
    text: годовая и промежуточная бухгалтерская отчетность некоммерческой организации, за исключением
      случаев, установленных Федеральным законом «О бухгалтерском учете» и иными федеральными законами,
      состоит из бухгалтерского баланса, отчета о целевом использовании средств и приложений к ним.
  - path: '6'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Приложения к бухгалтерскому балансу и отчету о финансовых результатах состоят из отчета об изменениях
      капитала, отчета о движении денежных средств, пояснений к бухгалтерскому балансу и отчету о финансовых
      результатах. Приложения к бухгалтерскому балансу и отчету о целевом использовании средств состоят
      из отчета о финансовых результатах, отчета о движении денежных средств, пояснений к бухгалтерскому
      балансу и отчету о целевом использовании средств, за исключением случая, когда некоммерческая организация
      принимает решение не составлять отчет о финансовых результатах и (или) отчет о движении денежных
      средств. В случае, когда некоммерческая организация приняла решение не составлять отчет о финансовых
      результатах и (или) отчет о движении денежных средств, информация, подлежащая раскрытию в таких
      отчетах, включается в пояснения к бухгалтерскому балансу и отчету о целевом использовании средств.
      Пояснения к бухгалтерскому балансу и отчету о финансовых результатах и пояснения к бухгалтерскому
      балансу и отчету о целевом использовании средств именуются вместе пояснениями.
  - path: '7'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: В случае, когда бухгалтерская отчетность представляется и (или) раскрывается в соответствии
      с законодательством Российской Федерации в составе какого-либо документа (например, годового отчета
      экономического субъекта), должно быть обеспечено однозначное понимание состава бухгалтерской отчетности
      пользователями такого документа. III. Состав и содержание информации, раскрываемой в бухгалтерской
      отчетности Бухгалтерский баланс
  - path: '8'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Бухгалтерский баланс должен давать представление о финансовом положении экономического субъекта
      на отчетную дату. В бухгалтерском балансе раскрывается информация обо всех активах, обязательствах
      и источниках финансирования деятельности экономического субъекта.
  - path: '9'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'Представление о финансовом положении экономического субъекта на отчетную дату обеспечивается
      раскрытием в бухгалтерском балансе, как минимум, показателей: нематериальных активов; основных средств;
      инвестиционной недвижимости; отложенных налоговых активов; финансовых вложений; запасов; долгосрочных
      активов к продаже; налога на добавленную стоимость по приобретенным ценностям; дебиторской задолженности;
      денежных средств и денежных эквивалентов; капитала (в коммерческих организациях)/целевого финансирования
      (в некоммерческих организациях); заемных средств; кредиторской задолженности; отложенных налоговых
      обязательств; оценочных обязательств.'
  - path: '10'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'Помимо показателей, предусмотренных в пункте 9 настоящего Стандарта, в бухгалтерском балансе
      раскрываются иные показатели (с учетом существенности) в следующих случаях:'
  - path: 10.а
    parent_path: '10'
    heading: null
    text: когда такие показатели предусмотрены другими федеральными и (или) отраслевыми стандартами;
  - path: 10.б
    parent_path: '10'
    heading: null
    text: по собственному решению экономического субъекта исходя из особенностей его деятельности и (или)
      с целью детализации показателей, предусмотренных в пункте 9 настоящего Стандарта.
  - path: 10.заключение
    parent_path: '10'
    heading: null
    text: 'В частности, в бухгалтерский баланс могут быть включены показатели: гудвила; нематериальных
      поисковых активов; материальных поисковых активов; капитальных вложений в объекты нематериальных
      активов; капитальных вложений в объекты основных средств; прав пользования активами; инвестиций
      в аренду; не предъявленной к оплате начисленной выручки; обязательств по аренде. Для целей настоящего
      Стандарта информация считается существенной, если ее пропуск или искажение могут оказать влияние
      на экономические решения, принимаемые пользователями на основе бухгалтерской отчетности. Информация
      признается существенной экономическим субъектом самостоятельно исходя из ее величины, характера
      и потенциального влияния на экономические решения, принимаемые пользователями на основе бухгалтерской
      отчетности.'
  - path: '11'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В бухгалтерском балансе допускается замена показателей, предусмотренных в пункте 9 настоящего
      Стандарта, группой соответствующих показателей, включающей в том числе показатели, предусмотренные
      в пункте 10 настоящего Стандарта. В частности, в бухгалтерском балансе информация об основных средствах
      может быть представлена группой показателей: непосредственно основных средств, капитальных вложений
      в объекты основных средств, прав пользования активами.'
  - path: '12'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Показатели, представляющие активы экономического субъекта, приводятся в бухгалтерском балансе
      отдельно от показателей, представляющих обязательства и источники финансирования деятельности экономического
      субъекта. Совокупность показателей бухгалтерского баланса, представляющих активы, именуется «Актив»,
      совокупность показателей бухгалтерского баланса, представляющих обязательства и источники финансирования
      деятельности экономического субъекта, – «Пассив».
  - path: '13'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: В бухгалтерском балансе активы представляются как оборотные или внеоборотные в зависимости от
      срока их обращения или погашения. Оборотные активы приводятся в разделе «Оборотные активы» бухгалтерского
      баланса. Внеоборотные активы приводятся в разделе «Внеоборотные активы» бухгалтерского баланса.
  - path: '14'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'Если иное не установлено другими федеральными стандартами, актив представляется в бухгалтерском
      балансе как оборотный, когда выполняется одно из следующих условий:'
  - path: 14.а
    parent_path: '14'
    heading: null
    text: актив предназначен для использования (потребления) или продажи в течение обычного операционного
      цикла или периода не более двенадцати месяцев (в частности, запасы). Для целей настоящего Стандарта
      под обычным операционным циклом понимается время между приобретением экономическим субъектом актива,
      предназначенного для продажи или для однократного потребления при производстве продукции, выполнении
      работ, оказании услуг, и получением денежных средств от продажи этого актива, произведенной продукции,
      выполненных работ, оказанных услуг. В случае, когда обычный операционный цикл не может быть надежно
      определен экономическим субъектом, его продолжительность принимается равной двенадцати месяцам;
      (в ред. приказа Минфина России от 07.11.2025 № 159н)
  - path: 14.б
    parent_path: '14'
    heading: null
    text: актив предназначен для продажи (в частности, внеоборотные активы к продаже);
  - path: 14.в
    parent_path: '14'
    heading: null
    text: актив подлежит погашению в течение обычного операционного цикла (в частности, дебиторская задолженность
      покупателей и заказчиков, прочая дебиторская задолженность, связанная с обычным операционным циклом,
      независимо от срока ее погашения);
  - path: 14.г
    parent_path: '14'
    heading: null
    text: актив подлежит погашению в течение двенадцати месяцев после отчетной даты (в частности, краткосрочные
      финансовые вложения);
  - path: 14.д
    parent_path: '14'
    heading: null
    text: актив является денежными средствами или денежными эквивалентами, за исключением случаев, когда
      существуют ограничения на их использование экономическим субъектом, действующие в течение, как минимум,
      двенадцати месяцев после отчетной даты.
  - path: '15'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Краткосрочная часть внеоборотных финансовых вложений представляется в бухгалтерском балансе
      как оборотный актив.
  - path: '16'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Активы, отличные от указанных в пунктах 14 и 15 настоящего Стандарта, а также авансы, предварительная
      оплата поставщикам и подрядчикам, связанные с приобретением (созданием) внеоборотных активов, представляются
      в бухгалтерском балансе как внеоборотные.
  - path: '17'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: В бухгалтерском балансе обязательства представляются как краткосрочные или долгосрочные в зависимости
      от срока погашения. Краткосрочные обязательства приводятся в разделе «Краткосрочные обязательства»
      бухгалтерского баланса. Долгосрочные обязательства приводятся в разделе «Долгосрочные обязательства»
      бухгалтерского баланса.
  - path: '18'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'Если иное не установлено другими федеральными стандартами, обязательство представляется в бухгалтерском
      балансе как краткосрочное, когда выполняется одно из следующих условий:'
  - path: 18.а
    parent_path: '18'
    heading: null
    text: обязательство подлежит погашению в течение двенадцати месяцев после отчетной даты (в частности,
      заемные средства, кредиторская задолженность поставщикам и подрядчикам, связанная с приобретением
      (созданием) внеоборотных активов);
  - path: 18.б
    parent_path: '18'
    heading: null
    text: обязательство связано с обычным операционным циклом независимо от срока погашения (в частности,
      кредиторская задолженность поставщикам и подрядчикам за товары, работы, услуги, авансы и предварительная
      оплата, полученные от покупателей и заказчиков, обязательства, связанные с оплатой труда работников);
  - path: 18.в
    parent_path: '18'
    heading: null
    text: у экономического субъекта отсутствует безусловное право на отсрочку погашения обязательства
      не менее чем на двенадцать месяцев после отчетной даты (в частности, заемные средства, кредиторская
      задолженность перед поставщиками и подрядчиками, связанная с приобретением (созданием) внеоборотных
      активов).
  - path: '19'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Часть долгосрочного обязательства, подлежащая погашению в течение двенадцати месяцев после отчетной
      даты, а также обязательство, которое должно было быть погашено в течение двенадцати месяцев после
      отчетной даты, но в отношении которого в период между отчетной датой и датой составления бухгалтерской
      отчетности заключено соглашение о реструктуризации долга между экономическим субъектом и кредитором
      на период, превышающий двенадцать месяцев после отчетной даты, представляются в бухгалтерском балансе
      как краткосрочные обязательства.
  - path: '20'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Обязательства, отличные от указанных в пунктах 18 и 19 настоящего Стандарта, представляются
      в бухгалтерском балансе как долгосрочные.
  - path: '21'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'Показатели капитала приводятся коммерческой организацией в разделе «Капитал» бухгалтерского
      баланса. Состав показателей капитала (составляющие капитала) определяется коммерческой организацией
      самостоятельно в зависимости от организационно-правовой формы, источников финансирования деятельности
      и может включать, в частности, показатели: уставного капитала; собственных акций, принадлежащих
      обществу, задолженности акционеров по оплате акций; накопленной дооценки внеоборотных активов; добавочного
      капитала (без накопленной дооценки внеоборотных активов); резервного капитала; нераспределенной
      прибыли (непокрытого убытка).'
  - path: '22'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'Показатели целевого финансирования приводятся некоммерческой организацией в разделе «Целевое
      финансирование» бухгалтерского баланса. Состав показателей целевого финансирования определяется
      некоммерческой организацией самостоятельно в зависимости от организационно-правовой формы, источников
      финансирования деятельности и может включать, в частности, показатели: паевого фонда; целевого капитала;
      целевых средств; фонда недвижимого и особо ценного движимого имущества; резервного фонда; прочих
      целевых фондов.'
  - path: '23'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Показатели приводятся в бухгалтерском балансе в нетто-оценке, то есть за вычетом регулирующих
      величин (в частности, накопленной амортизации, накопленного обесценения, резервов под обесценение
      запасов, резервов по сомнительным долгам, резервов под обесценение финансовых вложений, других оценочных
      резервов), раскрываемых в пояснениях. Представление показателей в бухгалтерском балансе в нетто-оценке
      не является зачетом между этими показателями.
  - path: '24'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: В бухгалтерском балансе приводятся итоговые показатели Актива и Пассива, а также итоговые показатели
      разделов, указанных в пунктах 13, 17, 21, 22 настоящего Стандарта. В бухгалтерском балансе итоговый
      показатель Актива должен быть равен итоговому показателю Пассива. Отчет о финансовых результатах
  - path: '25'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Отчет о финансовых результатах должен давать представление о финансовом результате деятельности
      экономического субъекта за отчетный период. В отчете о финансовых результатах раскрывается информация
      обо всех доходах и расходах экономического субъекта.
  - path: '26'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'Представление о финансовом результате деятельности экономического субъекта за отчетный период
      обеспечивается раскрытием в отчете о финансовых результатах, как минимум, показателей: выручки (за
      минусом налога на добавленную стоимость, акцизов и иных аналогичных обязательных платежей); себестоимости
      продаж; коммерческих расходов; управленческих расходов; доходов от участия в других организациях;
      процентов к получению; процентов к уплате; прочих доходов; прочих расходов; налога на прибыль организаций;
      прибыли (убытка) от прекращаемой деятельности (за вычетом относящегося к ней налога на прибыль организаций);
      результата переоценки внеоборотных активов, не включаемого в чистую прибыль (убыток); результата
      прочих операций, не включаемого в чистую прибыль (убыток); налога на прибыль организаций, относящегося
      к результатам переоценки внеоборотных активов и прочих операций, не включаемых в чистую прибыль
      (убыток).'
  - path: '27'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В отчете о финансовых результатах приводятся следующие итоговые показатели:'
  - path: 27.а
    parent_path: '27'
    heading: null
    text: валовая прибыль (убыток), представляющая собой разность выручки и себестоимости продаж;
  - path: 27.б
    parent_path: '27'
    heading: null
    text: прибыль (убыток) от продаж, представляющая собой разность валовой прибыли (убытка) и коммерческих
      и управленческих расходов;
  - path: 27.в
    parent_path: '27'
    heading: null
    text: прибыль (убыток) от продолжающейся деятельности до налогообложения, представляющая собой арифметическую
      сумму прибыли (убытка) от продаж, доходов от участия в других организациях, процентов к получению,
      процентов к уплате, прочих доходов, прочих расходов;
  - path: 27.г
    parent_path: '27'
    heading: null
    text: чистая прибыль (убыток), представляющая собой арифметическую сумму прибыли (убытка) от продолжающейся
      деятельности до налогообложения, налога на прибыль организаций, прибыли (убытка) от прекращаемой
      деятельности (за вычетом относящегося к ней налога на прибыль организаций);
  - path: 27.д
    parent_path: '27'
    heading: null
    text: совокупный финансовый результат, представляющий собой арифметическую сумму чистой прибыли (убытка),
      результатов переоценки внеоборотных активов и прочих операций, не включаемых в чистую прибыль (убыток),
      и налога на прибыль организаций, относящегося к этим результатам.
  - path: '28'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В отчете о финансовых результатах показатели прочих доходов и прочих расходов, связанные с
      одним (в частности, результат от выбытия объекта основных средств) или несколькими аналогичными
      (в частности, курсовые разницы, результат переоценки внеоборотных активов, включаемый в доходы или
      расходы отчетного периода, результат обесценения внеоборотных активов и восстановления обесценения,
      включаемый в расходы или доходы отчетного периода) фактами хозяйственной жизни, зачитываются, за
      исключением случаев, когда:'
  - path: 28.а
    parent_path: '28'
    heading: null
    text: раздельное представление таких доходов и расходов способно повлиять на решения пользователей
      бухгалтерской отчетности;
  - path: 28.б
    parent_path: '28'
    heading: null
    text: иной порядок представления показателей таких доходов и расходов установлен федеральными или
      отраслевыми стандартами.
  - path: '29'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В отчете о финансовых результатах или пояснениях раскрываются (с учетом существенности) показатели
      доходов и (или) расходов за отчетный период, связанные с:'
  - path: 29.а
    parent_path: '29'
    heading: null
    text: обесценением запасов и восстановлением такого обесценения;
  - path: 29.б
    parent_path: '29'
    heading: null
    text: обесценением внеоборотных активов и восстановлением такого обесценения;
  - path: 29.в
    parent_path: '29'
    heading: null
    text: переоценкой внеоборотных активов;
  - path: 29.г
    parent_path: '29'
    heading: null
    text: выбытием внеоборотных активов;
  - path: 29.д
    parent_path: '29'
    heading: null
    text: урегулированием судебных разбирательств;
  - path: 29.е
    parent_path: '29'
    heading: null
    text: списанием оценочных обязательств.
  - path: '30'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В пояснениях раскрывается информация о составе расходов по обычным видам деятельности, признанных
      в отчете о финансовых результатах (с учетом изменения остатков незавершенного производства и готовой
      продукции). При этом состав расходов приводится в разрезе следующих экономических элементов: материальные
      затраты; затраты на оплату труда; отчисления на социальные нужды; амортизация; прочие затраты.'
  - path: '31'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: В случае, когда экономический субъект обязан раскрывать информацию о прибыли на акцию в своей
      бухгалтерской отчетности, в отчете о финансовых результатах (в том числе в промежуточной бухгалтерской
      отчетности) после показателя «Совокупный финансовый результат» приводятся показатели базовой и разводненной
      прибыли (убытка) на акцию. Значения показателей базовой и разводненной прибыли (убытка) на акцию
      представляются в рублях и копейках.
  - path: '32'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: В случае если некоммерческая организация включает отчет о финансовых результатах в состав бухгалтерской
      отчетности, такой отчет составляется в соответствии с положениями настоящей главы. Отчет о целевом
      использовании средств
  - path: '33'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Отчет о целевом использовании средств должен давать представление о поступлении и использовании
      (расходовании) целевых средств, полученных некоммерческой организацией для обеспечения ее уставной
      деятельности, за отчетный период.
  - path: '34'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'Представление о поступлении и использовании (расходовании) целевых средств обеспечивается раскрытием
      в отчете о целевом использовании средств, как минимум, показателей: остатка целевых средств на начало
      отчетного периода; вступительных взносов; членских взносов; целевых взносов; добровольных имущественных
      взносов и пожертвований; прибыли от приносящей доход деятельности; расходов на целевые мероприятия;
      расходов на содержание аппарата управления; приобретения основных средств, инвентаря и иного имущества;
      остатка целевых средств на конец отчетного периода.'
  - path: '35'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Информация о поступлении и использовании (расходовании) целевых средств приводится в отчете
      о целевом использовании средств по видам источников поступления и направлениям их использования
      (расходования).
  - path: '36'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В отчете о целевом использовании средств приводятся следующие итоговые показатели:'
  - path: 36.а
    parent_path: '36'
    heading: null
    text: всего поступило средств, представляющий собой сумму показателей поступления средств из всех
      источников;
  - path: 36.б
    parent_path: '36'
    heading: null
    text: всего использовано (израсходовано) средств, представляющий собой сумму показателей всех направлений
      использования (расходования) средств.
  - path: 36.заключение
    parent_path: '36'
    heading: null
    text: Отчет об изменениях капитала
  - path: '37'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Отчет об изменениях капитала должен давать представление об изменении капитала экономического
      субъекта за отчетный период.
  - path: '38'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'Представление об изменении капитала экономического субъекта за отчетный период обеспечивается
      раскрытием в отчете об изменениях капитала показателей: величины капитала на начало отчетного периода;
      изменения величины капитала в отчетном периоде; величины капитала на конец отчетного периода. Значения
      показателей приводятся для всего капитала в целом и для каждой составляющей капитала. Кроме того,
      показатели изменения величины капитала в отчетном периоде приводятся в разрезе изменений: за счет
      чистой прибыли (убытка); за счет результата переоценки внеоборотных активов; в результате операций
      с собственниками (акционерами, участниками, учредителями) экономического субъекта; за счет дивидендов;
      в результате прочих изменений.'
  - path: '39'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В отчете об изменениях капитала обособленно приводится информация о влиянии на каждую составляющую
      капитала:'
  - path: 39.а
    parent_path: '39'
    heading: null
    text: корректировок, связанных с отражением последствий изменения учетной политики;
  - path: 39.б
    parent_path: '39'
    heading: null
    text: корректировок, связанных с исправлением существенных ошибок в бухгалтерском учете.
  - path: '40'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В отчете об изменениях капитала или в пояснениях раскрывается:'
  - path: 40.а
    parent_path: '40'
    heading: null
    text: информация о составе резервного капитала и назначении его составляющих;
  - path: 40.б
    parent_path: '40'
    heading: null
    text: сумма дивидендов, начисленных в отчетном периоде, сумма дивидендов в расчете на одну акцию (отдельно
      по обыкновенным и привилегированным акциям) или иные аналогичные показатели. Значение показателей
      сумм дивидендов в расчете на одну акцию представляется в рублях и копейках.
  - path: 40.заключение
    parent_path: '40'
    heading: null
    text: Отчет о движении денежных средств
  - path: '41'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Отчет о движении денежных средств должен давать представление о движении денежных средств экономического
      субъекта за отчетный период.
  - path: '42'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Отчет о движении денежных средств составляется в соответствии с Положением по бухгалтерскому
      учету «Отчет о движении денежных средств» (ПБУ 23/2011), утвержденным приказом Министерства финансов
      Российской Федерации от 2 февраля 2011 г. № 11н (зарегистрирован Министерством юстиции Российской
      Федерации 29 марта 2011 г., регистрационный № 20336) (далее – ПБУ 23/2011).
  - path: '43'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: В случае если некоммерческая организация включает отчет о движении денежных средств в состав
      бухгалтерской отчетности, такой отчет составляется применительно к правилам, установленным ПБУ 23/2011.
      Пояснения
  - path: '44'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: В пояснениях раскрывается информация, необходимая пользователям бухгалтерской отчетности для
      принятия экономических решений, но не раскрытая в бухгалтерском балансе, отчете о финансовых результатах,
      отчете о целевом использовании средств, отчете об изменениях капитала, отчете о движении денежных
      средств.
  - path: '45'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: В случае, когда бухгалтерская отчетность составлена в соответствии с федеральными и отраслевыми
      стандартами, в пояснениях должно быть указано, что бухгалтерская отчетность составлена в соответствии
      с федеральными и отраслевыми стандартами. В иных случаях в пояснениях не может быть указано, что
      бухгалтерская отчетность составлена в соответствии с федеральными и отраслевыми стандартами, независимо
      от раскрытия в бухгалтерской отчетности информации о способах ведения бухгалтерского учета, принятых
      экономическим субъектом, и (или) иной соответствующей информации.
  - path: '46'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В пояснениях должны быть раскрыты:'
  - path: 46.а
    parent_path: '46'
    heading: null
    text: основные виды экономической деятельности экономического субъекта;
  - path: 46.б
    parent_path: '46'
    heading: null
    text: информация об учетной политике экономического субъекта в соответствии с Положением по бухгалтерскому
      учету «Учетная политика организации» (ПБУ 1/2008), утвержденным приказом Министерства финансов Российской
      Федерации от 6 октября 2008 г. № 106н (зарегистрирован Министерством юстиции Российской Федерации
      27 октября 2008 г., регистрационный № 12522) [1] (далее – ПБУ 1/2008);
  - path: 46.в
    parent_path: '46'
    heading: null
    text: информация, дополняющая и (или) поясняющая показатели бухгалтерского баланса, отчета о финансовых
      результатах, отчета о целевом использовании средств, отчета об изменениях капитала, отчета о движении
      денежных средств, подлежащая раскрытию в бухгалтерской отчетности в соответствии с федеральными
      стандартами (в частности, информация о наличии и движении отдельных видов активов и обязательств);
  - path: 46.г
    parent_path: '46'
    heading: null
    text: информация, не раскрываемая в бухгалтерском балансе, отчете о финансовых результатах, отчете
      о целевом использовании средств, отчете об изменениях капитала, отчете о движении денежных средств,
      но подлежащая раскрытию в бухгалтерской отчетности в соответствии с федеральными стандартами (в
      частности, информация о событиях после отчетной даты, связанных сторонах, условных обязательствах
      и условных активах, средствах индивидуализации, созданных собственными силами экономического субъекта);
  - path: 46.д
    parent_path: '46'
    heading: null
    text: наименование основного хозяйственного товарищества или общества экономического субъекта, если
      такая информация не раскрыта в соответствии с Положением по бухгалтерскому учету «Информация о связанных
      сторонах» (ПБУ 11/2008), утвержденным приказом Министерства финансов Российской Федерации от 29
      апреля 2008 г. № 48н (зарегистрирован Министерством юстиции Российской Федерации 26 мая 2008 г.,
      регистрационный № 11749) [2] . В случае если экономический субъект контролируется (непосредственно
      или через третьи лица) хозяйственным товариществом или обществом, отличным от основного, физическим
      лицом (сторона, обладающая конечным контролем), в пояснениях раскрывается также наименование такого
      хозяйственного товарищества или общества, информация о таком физическом лице. В случаях, когда раскрытие
      информации в пояснениях в объеме, предусмотренном настоящим пунктом, приведет или может привести
      к потерям экономического характера и (или) урону деловой репутации экономического субъекта и (или)
      его контрагентов, и (или) связанных с ним сторон, экономический субъект может раскрывать информацию
      в пояснениях в ограниченном объеме, не раскрывая те сведения, которые обусловливают указанные потери
      и (или) урон;
  - path: 46.е
    parent_path: '46'
    heading: null
    text: дата государственной регистрации экономического субъекта, в случае создания его, в том числе
      путем реорганизации, в отчетном периоде;
  - path: 46.ж
    parent_path: '46'
    heading: null
    text: продолжительность деятельности экономического субъекта, созданного на ограниченный срок, с указанием
      такого срока;
  - path: 46.з
    parent_path: '46'
    heading: null
    text: величина выплаченного (подлежащего выплате) аудиторской организации вознаграждения за проведение
      аудита бухгалтерской отчетности экономического субъекта, относящегося к общественно значимым организациям
      в соответствии с Федеральным законом от 30 декабря 2008 г. № 307-ФЗ «Об аудиторской деятельности»,
      за отчетный год, а также величины выплаченных (подлежащих выплате) этой же аудиторской организации
      вознаграждения за иные аудиторские услуги, оказанные в отчетном году, и вознаграждения за прочие
      связанные с аудиторской деятельностью услуги, оказанные в отчетном году;
  - path: 46.и
    parent_path: '46'
    heading: null
    text: иная информация, необходимая пользователям бухгалтерской отчетности для принятия экономических
      решений, но не раскрытая в бухгалтерском балансе, отчете о финансовых результатах, отчете о целевом
      использовании средств, отчете об изменениях капитала, отчете о движении денежных средств. Состав
      и содержание такой информации определяются экономическим субъектом.
  - path: '47'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В бухгалтерской отчетности акционерного общества в пояснениях раскрывается следующая информация
      по каждой категории (каждому типу) акций:'
  - path: 47.а
    parent_path: '47'
    heading: null
    text: количество размещенных акций, в том числе оплаченных и неоплаченных акционерами, собственных
      акций, принадлежащих обществу, а также объявленных акций;
  - path: 47.б
    parent_path: '47'
    heading: null
    text: номинальная стоимость акций;
  - path: 47.в
    parent_path: '47'
    heading: null
    text: сверка количества размещенных акций на начало и конец отчетного периода;
  - path: 47.г
    parent_path: '47'
    heading: null
    text: права, предоставляемые размещенными акциями;
  - path: 47.д
    parent_path: '47'
    heading: null
    text: количество размещенных акций, принадлежащих дочерним обществам или иным связанным сторонам;
  - path: 47.е
    parent_path: '47'
    heading: null
    text: количество акций, право на приобретение которых предоставляют опционы общества, цена (порядок
      определения цены) приобретения таких акций владельцем опциона общества, срок и (или) обстоятельства,
      при наступлении которых могут быть осуществлены права владельца опциона общества, порядок осуществления
      прав владельца опциона общества, в том числе срок (порядок определения срока) для заявления владельцем
      опциона общества требования о приобретении дополнительных акций, срок и порядок оплаты дополнительных
      акций владельцем опциона общества, срок конвертации опциона общества в дополнительные акции.
  - path: '48'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: В бухгалтерской отчетности экономического субъекта, отличного от акционерного общества, в пояснениях
      раскрывается информация, аналогичная информации, предусмотренной пунктом 47 настоящего Стандарта
      (например, о долях в уставном капитале).
  - path: '49'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Последовательность представления информации в пояснениях должна соответствовать последовательности
      представления информации в бухгалтерском балансе, отчете о финансовых результатах, отчете о целевом
      использовании средств, отчете об изменениях капитала, отчете о движении денежных средств, за исключением
      случаев, когда это противоречит содержанию информации.
  - path: '50'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Каждое пояснение должно иметь номер. Показатель бухгалтерского баланса, отчета о финансовых
      результатах, отчета о целевом использовании средств, отчета об изменениях капитала, отчета о движении
      денежных средств, к которому в бухгалтерской отчетности имеется пояснение, должен сопровождаться
      указанием на такое пояснение (номером пояснения). Упрощенная бухгалтерская отчетность
  - path: '51'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Упрощенная бухгалтерская отчетность может составляться экономическим субъектом, который вправе
      применять упрощенные способы ведения бухгалтерского учета, включая упрощенную бухгалтерскую отчетность.
  - path: '52'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В состав упрощенной бухгалтерской отчетности включаются:'
  - path: 52.а
    parent_path: '52'
    heading: null
    text: бухгалтерский баланс, отчет о финансовых результатах и пояснения (для коммерческих организаций);
  - path: 52.б
    parent_path: '52'
    heading: null
    text: бухгалтерский баланс, отчет о целевом использовании средств и пояснения (для некоммерческих
      организаций).
  - path: '53'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: При составлении бухгалтерского баланса, отчета о финансовых результатах и отчета о целевом использовании
      средств в составе упрощенной бухгалтерской отчетности показатели, предусмотренные соответственно
      пунктами 9, 26, 34, 35 настоящего Стандарта, могут объединяться в группы. При этом в бухгалтерском
      балансе, отчете о финансовых результатах, отчете о целевом использовании средств приводятся только
      итоговые показатели таких групп (без детализации по показателям, входящим в группу).
  - path: '54'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В упрощенной бухгалтерской отчетности приводятся, как минимум, следующие пояснения:'
  - path: 54.а
    parent_path: '54'
    heading: null
    text: указание, что бухгалтерская отчетность составлена в соответствии с федеральными и отраслевыми
      стандартами;
  - path: 54.б
    parent_path: '54'
    heading: null
    text: информация об учетной политике экономического субъекта в соответствии с ПБУ 1/2008 (в отношении
      показателей (групп показателей), приведенных в бухгалтерском балансе, отчете о финансовых результатах,
      отчете о целевом использовании средств);
  - path: 54.в
    parent_path: '54'
    heading: null
    text: иная существенная информация о финансовом положении экономического субъекта на отчетную дату,
      финансовых результатах его деятельности за отчетный период. В случае существенности информации,
      подлежащей раскрытию в соответствии с настоящим Стандартом в отчете об изменениях капитала и (или)
      отчете о движении денежных средств, в упрощенной бухгалтерской отчетности, данная информация раскрывается
      в виде таких отчетов либо в пояснениях.
  - path: 54.заключение
    parent_path: '54'
    heading: null
    text: Промежуточная бухгалтерская отчетность
  - path: '55'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: Промежуточная бухгалтерская отчетность составляется нарастающим итогом с 1 января по отчетную
      дату периода, за который составляется такая отчетность (далее – промежуточный отчетный период),
      включительно.
  - path: '56'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В промежуточной бухгалтерской отчетности:'
  - path: 56.а
    parent_path: '56'
    heading: null
    text: раскрывается информация, состав и содержание которой установлены пунктами 8 – 50 настоящего
      Стандарта, либо по решению экономического субъекта только информация об имевших место в промежуточный
      отчетный период существенных фактах хозяйственной жизни, актуализирующая информацию, раскрытую в
      годовой бухгалтерской отчетности за год, предшествовавший промежуточному отчетному периоду;
  - path: 56.б
    parent_path: '56'
    heading: null
    text: приводятся наименования и значения всех итоговых показателей, которые были приведены в годовой
      бухгалтерской отчетности экономического субъекта за год, предшествовавший промежуточному отчетному
      периоду;
  - path: 56.в
    parent_path: '56'
    heading: null
    text: могут быть объединены показатели, приведенные в годовой бухгалтерской отчетности за год, предшествовавший
      промежуточному отчетному периоду, по которым отсутствовали существенные изменения в промежуточном
      отчетном периоде;
  - path: 56.г
    parent_path: '56'
    heading: null
    text: могут быть приведены обособленно показатели, значения которых существенно изменились в промежуточном
      отчетном периоде.
  - path: '57'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В промежуточной бухгалтерской отчетности раскрывается следующая информация (с учетом существенности):'
  - path: 57.а
    parent_path: '57'
    heading: null
    text: об изменении учетной политики экономического субъекта в промежуточном отчетном периоде;
  - path: 57.б
    parent_path: '57'
    heading: null
    text: о сезонности и (или) цикличности фактов хозяйственной жизни в промежуточном отчетном периоде;
  - path: 57.в
    parent_path: '57'
    heading: null
    text: о фактах хозяйственной жизни, которые оказали влияние на активы, обязательства, источники финансирования
      деятельности экономического субъекта, его чистую прибыль (убыток) или денежные потоки в промежуточном
      отчетном периоде и существенно отличаются по характеру, величине или периодичности от обычных фактов
      хозяйственной жизни данного экономического субъекта, а также последствия такого влияния;
  - path: 57.г
    parent_path: '57'
    heading: null
    text: о характере и величине изменений оценочных значений, признанных в предшествовавших промежуточных
      отчетных периодах отчетного года или в году, предшествовавшем промежуточному отчетному периоду;
  - path: 57.д
    parent_path: '57'
    heading: null
    text: о выпуске, выкупе или погашении акций и иных ценных бумаг;
  - path: 57.е
    parent_path: '57'
    heading: null
    text: о суммах дивидендов, выплаченных в промежуточном отчетном периоде, и сумме дивидендов в расчете
      на одну акцию (отдельно по обыкновенным и привилегированным акциям);
  - path: 57.ж
    parent_path: '57'
    heading: null
    text: по отчетным сегментам, если экономический субъект обязан раскрывать такую информацию в годовой
      бухгалтерской отчетности;
  - path: 57.з
    parent_path: '57'
    heading: null
    text: о фактах хозяйственной жизни, которые оказали или могут оказать влияние на финансовое положение
      экономического субъекта на отчетную дату, финансовые результаты его деятельности или движение денежных
      средств в промежуточном отчетном периоде и которые имели место между отчетной датой промежуточного
      отчетного периода и датой составления промежуточной бухгалтерской отчетности;
  - path: 57.и
    parent_path: '57'
    heading: null
    text: о влиянии изменений в структуре экономического субъекта, имевших место в промежуточном отчетном
      периоде (в частности, принятие решения о реорганизации, прекращении деятельности, приобретении предприятия);
  - path: 57.к
    parent_path: '57'
    heading: null
    text: о выручке в соответствии с Положением по бухгалтерскому учету «Доходы организации» ПБУ 9/99,
      утвержденным приказом Министерства финансов Российской Федерации от 6 мая 1999 г. № 32н (зарегистрирован
      Министерством юстиции Российской Федерации 31 мая 1999 г., регистрационный № 1791) [3] .
  - path: 57.заключение
    parent_path: '57'
    heading: null
    text: Информация, указанная в настоящем пункте, раскрывается в промежуточной бухгалтерской отчетности
      непосредственно либо посредством отсылок на иные публичные источники информации, в которых она приведена,
      при условии доступности таких источников пользователям бухгалтерской отчетности на тех же условиях
      и в те же сроки, что и промежуточная бухгалтерская отчетность. Заголовочная часть бухгалтерской
      отчетности и ее составляющих
  - path: '58'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'Заголовочная часть бухгалтерской отчетности (в том числе упрощенной бухгалтерской отчетности)
      должна содержать:'
  - path: 58.а
    parent_path: '58'
    heading: null
    text: наименование «Бухгалтерская отчетность»;
  - path: 58.б
    parent_path: '58'
    heading: null
    text: отчетный период, за который составлена бухгалтерская отчетность;
  - path: 58.в
    parent_path: '58'
    heading: null
    text: наименование экономического субъекта с указанием его организационно-правовой формы, идентификационный
      номер налогоплательщика;
  - path: 58.г
    parent_path: '58'
    heading: null
    text: адрес экономического субъекта в пределах его места нахождения.
  - path: '59'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В заголовочной части бухгалтерской отчетности (в том числе упрощенной бухгалтерской отчетности),
      представляемой в налоговый орган, в том числе в целях формирования государственного информационного
      ресурса бухгалтерской (финансовой) отчетности, в орган государственной статистики, другие органы
      исполнительной власти (далее соответственно – представляемая бухгалтерская отчетность, представляемая
      упрощенная бухгалтерская отчетность), помимо предусмотренного пунктом 58 настоящего Стандарта, должны
      быть указаны:'
  - path: 59.а
    parent_path: '59'
    heading: null
    text: форма собственности экономического субъекта;
  - path: 59.б
    parent_path: '59'
    heading: null
    text: подлежит ли бухгалтерская отчетность обязательному аудиту, а в случае, если подлежит – также
      наименование аудиторской организации, осуществившей обязательный аудит бухгалтерской отчетности,
      ее идентификационный номер налогоплательщика и основной государственный регистрационный номер;
  - path: 59.в
    parent_path: '59'
    heading: null
    text: подлежит ли бухгалтерская отчетность утверждению, а в случае, если подлежит – также наименование
      органа, утверждающего бухгалтерскую отчетность.
  - path: '60'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'Заголовочная часть каждой составляющей бухгалтерской отчетности (в том числе упрощенной бухгалтерской
      отчетности) должна содержать:'
  - path: 60.а
    parent_path: '60'
    heading: null
    text: наименование («Бухгалтерский баланс», «Отчет о финансовых результатах», «Отчет о целевом использовании
      средств», «Отчет об изменениях капитала», «Отчет о движении денежных средств», «Пояснения к бухгалтерскому
      балансу и отчету о финансовых результатах», «Пояснения к бухгалтерскому балансу и отчету о целевом
      использовании средств»);
  - path: 60.б
    parent_path: '60'
    heading: null
    text: отчетную дату или отчетный период;
  - path: 60.в
    parent_path: '60'
    heading: null
    text: наименование экономического субъекта;
  - path: 60.г
    parent_path: '60'
    heading: null
    text: формат представления значений показателей. В бухгалтерской отчетности значения показателей представляются
      в тысячах рублей, если иное не установлено настоящим Стандартом или другими федеральными стандартами.
  - path: '61'
    parent_path: null
    heading: Состав бухгалтерской отчетности
    text: 'В заголовочных частях представляемой бухгалтерской отчетности и ее составляющих (в том числе
      представляемой упрощенной бухгалтерской отчетности) по предусмотренной пунктами 58 – 60 настоящего
      Стандарта информации, в отношении которой подлежат применению соответствующие общероссийские классификаторы
      технико-экономической и социальной информации в социально-экономической области, помимо наименования
      информации, приводятся коды в соответствии с этими общероссийскими классификаторами. Например, заголовочная
      часть бухгалтерского баланса в составе представляемой бухгалтерской отчетности (в том числе представляемой
      упрощенной бухгалтерской отчетности): Бухгалтерский баланс на _____________ 20__ г. Коды Форма по
      ОКУД 0710001 Отчетная дата (число, месяц, год) Организация по ОКПО Единица измерения: тыс. руб.
      по ОКЕИ 384'
  - path: '62'
    parent_path: null
    heading: Порядок оформления бухгалтерской отчетности
    text: Образцы заголовочных частей бухгалтерской отчетности (в том числе упрощенной бухгалтерской отчетности)
      и представляемой бухгалтерской отчетности (в том числе представляемой упрощенной бухгалтерской отчетности)
      приведены соответственно в приложениях № 1 и № 2 к настоящему Стандарту. Формы бухгалтерского баланса,
      отчета о финансовых результатах, отчета о целевом использовании средств, отчета об изменениях капитала,
      отчета о движении денежных средств, пояснений (в том числе в составе представляемой бухгалтерской
      отчетности) определяются экономическим субъектом на основе образцов, приведенных в приложениях №
      3 – № 8 к настоящему Стандарту.
  - path: '63'
    parent_path: null
    heading: Порядок оформления бухгалтерской отчетности
    text: Формы упрощенной бухгалтерской отчетности (в том числе представляемой упрощенной бухгалтерской
      отчетности) определяются экономическим субъектом, который вправе применять упрощенные способы ведения
      бухгалтерского учета, включая упрощенную бухгалтерскую отчетность, на основе образцов, приведенных
      в приложениях № 6 – № 9 к настоящему Стандарту.
  - path: '64'
    parent_path: null
    heading: Порядок оформления бухгалтерской отчетности
    text: В формах бухгалтерского баланса, отчета о финансовых результатах, отчета о целевом использовании
      средств, отчета об изменениях капитала, отчета о движении денежных средств в составе представляемой
      бухгалтерской отчетности (в том числе представляемой упрощенной бухгалтерской отчетности) по каждому
      показателю, помимо его наименования, указывается код в соответствии с приложением № 10 к настоящему
      Стандарту. В представляемой упрощенной бухгалтерской отчетности для группы показателей указывается
      код (из кодов в соответствии с приложением № 10 к настоящему Стандарту), по которому отражается
      показатель, имеющий наибольший удельный вес в данной группе показателей.
  - path: '65'
    parent_path: null
    heading: Порядок оформления бухгалтерской отчетности
    text: При наличии технической возможности бухгалтерская отчетность может быть оформлена как открытые
      данные для размещения на официальном сайте экономического субъекта в информационно-телекоммуникационной
      сети «Интернет» (без составления ее по формам, предусмотренным пунктами 62 и 63 настоящего Стандарта),
      за исключением случаев, когда в соответствии с законодательством Российской Федерации или договором
      обязательным является представление бухгалтерской отчетности на бумажном носителе или (и) в виде
      электронного документа (в частности, представление в налоговый орган, в том числе в целях формирования
      государственного информационного ресурса бухгалтерской (финансовой) отчетности, в орган государственной
      статистики, другие органы исполнительной власти, Банк России). В случае, когда в соответствии с
      законодательством Российской Федерации или договором обязательным является представление бухгалтерской
      отчетности на бумажном носителе или (и) в виде электронного документа, бухгалтерская отчетность
      может быть оформлена как открытые данные в дополнение к составлению ее по формам, предусмотренным
      пунктами 62 и 63 настоящего Стандарта. При этом бухгалтерская отчетность в форме открытых данных
      должна соответствовать бухгалтерской отчетности на бумажном носителе или (и) в виде электронного
      документа. (п. 65 в ред. приказа Минфина России от 07.11.2025 № 159н)
  - path: '66'
    parent_path: null
    heading: Порядок оформления бухгалтерской отчетности
    text: 'В формах бухгалтерской отчетности:'
  - path: 66.а
    parent_path: '66'
    heading: null
    text: вычитаемые или отрицательные значения показателей приводятся в круглых скобках;
  - path: 66.б
    parent_path: '66'
    heading: null
    text: показатели, отсутствующие у экономического субъекта, не приводятся. Бухгалтерская отчетность,
      как правило, не должна содержать указание на отсутствие информации (в том числе показателей), подлежащей
      раскрытию в соответствии с федеральными и (или) отраслевыми стандартами, у экономического субъекта;
  - path: 66.в
    parent_path: '66'
    heading: null
    text: не допускается зачет между показателями, за исключением случаев, когда такой зачет предусмотрен
      федеральными стандартами;
  - path: 66.г
    parent_path: '66'
    heading: null
    text: пояснения составляются в табличной и (или) текстовой форме;
  - path: 66.д
    parent_path: '66'
    heading: null
    text: код показателя, предусмотренный пунктом 64 настоящего Стандарта, приводится в отдельной графе,
      которая включается в формы бухгалтерского баланса, отчета о финансовых результатах, отчета о целевом
      использовании средств, отчета об изменениях капитала, отчета о движении денежных средств в составе
      представляемой бухгалтерской отчетности (в том числе представляемой упрощенной бухгалтерской отчетности)
      после графы «Наименование показателя».
  - path: '67'
    parent_path: null
    heading: Порядок оформления бухгалтерской отчетности
    text: Бухгалтерская отчетность должна быть составлена на русском языке.
  - path: '68'
    parent_path: null
    heading: Порядок оформления бухгалтерской отчетности
    text: 'Бухгалтерская отчетность подписывается руководителем экономического субъекта, а также иными
      лицами в случае, если это предусмотрено учредительными документами экономического субъекта. В бухгалтерской
      отчетности указывается дата подписания ее руководителем экономического субъекта. Подпись в бухгалтерской
      отчетности включает: наименование должности лица, подписавшего бухгалтерскую отчетность; его собственноручную
      подпись или иные реквизиты, необходимые для идентификации этого лица; расшифровку подписи (инициалы,
      фамилия).'
  - path: '69'
    parent_path: null
    heading: Условия достоверности бухгалтерской отчетности
    text: 'Представление о финансовом положении экономического субъекта на отчетную дату, финансовом результате
      его деятельности и движении денежных средств за отчетный период, отраженное в бухгалтерской отчетности,
      считается достоверным, если бухгалтерская отчетность отвечает следующим условиям:'
  - path: 69.а
    parent_path: '69'
    heading: null
    text: бухгалтерская отчетность содержит информацию, сформированную в соответствии с федеральными и
      отраслевыми стандартами и систематизированную в соответствии с требованиями, установленными Федеральным
      законом «О бухгалтерском учете» и настоящим Стандартом. В случае если при составлении бухгалтерской
      отчетности экономическим субъектом выявляется недостаточность информации, указанной в абзаце первом
      настоящего подпункта, для формирования представления о финансовом положении экономического субъекта
      на отчетную дату, финансовом результате его деятельности и движении денежных средств за отчетный
      период, необходимого пользователям этой отчетности для принятия экономических решений, в бухгалтерской
      отчетности раскрывается дополнительная информация (в том числе показатели); (в ред. приказа Минфина
      России от 07.11.2025 № 159н)
  - path: 69.б
    parent_path: '69'
    heading: null
    text: информация, раскрываемая в бухгалтерской отчетности, нейтральна, то есть исключает преимущества
      одних групп пользователей бухгалтерской отчетности перед другими в удовлетворении их интересов в
      информации, содержащейся в бухгалтерской отчетности. Информация, раскрываемая в бухгалтерской отчетности,
      не является нейтральной, если посредством отбора или формы представления она влияет на экономические
      решения пользователей бухгалтерской отчетности с целью достижения предопределенных результатов или
      последствий;
  - path: 69.в
    parent_path: '69'
    heading: null
    text: принятые экономическим субъектом содержание и формы бухгалтерской отчетности применяются им
      последовательно от одного отчетного периода к другому. Изменение принятых содержания и форм бухгалтерской
      отчетности допускается в случае изменения учетной политики экономического субъекта или существенности
      информации, раскрываемой в бухгалтерской отчетности экономического субъекта, в иных исключительных
      случаях (в частности, при изменении вида экономической деятельности). Существенное изменение принятых
      содержания и форм бухгалтерской отчетности раскрыто в пояснениях с указанием причин, вызвавших это
      изменение;
  - path: 69.г
    parent_path: '69'
    heading: null
    text: 'по каждому показателю в бухгалтерской отчетности за отчетный год, за исключением бухгалтерской
      отчетности за первый отчетный год, приведены значения, как минимум, за два периода – отчетный и
      аналогичный период года, предшествовавшего отчетному. Данное условие подлежит исполнению как в отношении
      числовых показателей бухгалтерской отчетности, так и в отношении иной информации, раскрываемой в
      бухгалтерской отчетности, если такая информация необходима пользователям для принятия экономических
      решений . В промежуточной бухгалтерской отчетности числовые показатели приведены, как минимум: 1)
      в бухгалтерском балансе – по состоянию на отчетную дату и на дату окончания года, предшествовавшего
      промежуточному отчетному периоду; 2) в отчете о финансовых результатах, отчете о целевом использовании
      средств, отчете об изменениях капитала, отчете о движении денежных средств – за промежуточный отчетный
      период и за аналогичный период года, предшествовавшего промежуточному отчетному периоду. Информация,
      раскрытая в бухгалтерской отчетности, сопоставима с соответствующей информацией за аналогичный период
      года, предшествовавшего отчетному. Если значение показателя за аналогичный период года, предшествовавшего
      отчетному, несопоставимо со значением этого же показателя за отчетный период, то первое значение
      подлежит корректировке в соответствии с правилами, установленными федеральными стандартами. Информация
      о каждой существенной корректировке раскрыта в пояснениях с указанием причин, вызвавших эту корректировку;'
  - path: 69.д
    parent_path: '69'
    heading: null
    text: в бухгалтерской отчетности раскрыта существенная информация. В случае, когда информация (за
      исключением предусмотренного пунктами 9, 26, 34 и 38 настоящего Стандарта) не является существенной,
      она может не раскрываться в бухгалтерской отчетности, даже если обязанность раскрывать ее установлена
      федеральными и (или) отраслевыми стандартами;
  - path: 69.е
    parent_path: '69'
    heading: null
    text: существенная информация об отдельных объектах бухгалтерского учета приведена в бухгалтерском
      балансе, отчете о финансовых результатах, отчете о целевом использовании средств обособленно.
  - path: 69.заключение
    parent_path: '69'
    heading: null
    text: Информация об отдельных объектах бухгалтерского учета, обладающих сходными признаками, может
      объединяться и приводиться в бухгалтерском балансе, отчете о финансовых результатах, отчете о целевом
      использовании средств общей суммой с детализацией в пояснениях, если информация о каждом из этих
      объектов в отдельности несущественна, но существенна их общая сумма, либо представление общей суммы
      необходимо в связи с раскрытием другой информации в бухгалтерской отчетности. В данном случае в
      наименование общей суммы включается слово «прочие» (например, прочие внеоборотные активы, прочие
      доходы).
