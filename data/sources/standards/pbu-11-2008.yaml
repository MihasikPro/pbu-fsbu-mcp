id: pbu-11-2008
kind: ПБУ
number: 11/2008
year: 2008
title: Информация о связанных сторонах
order_date: 2008-04-29
order_no: 48н
effective_from: &id001 2008-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает порядок раскрытия информации о связанных сторонах в бухгалтерской
      отчетности коммерческих организаций, за исключением кредитных организаций (далее - организация,
      составляющая бухгалтерскую отчетность).
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение не применяется при формировании отчетности, разрабатываемой для внутренних
      целей организацией, составляющей бухгалтерскую отчетность; отчетности, составляемой для государственного
      статистического наблюдения; отчетной информации, предоставляемой кредитной организации в соответствии
      с ее требованиями; отчетной информации, представляемой для иных специальных целей.
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение может не применяться при формировании бухгалтерской отчетности организациями,
      которые вправе применять упрощенные способы ведения бухгалтерского учета, включая упрощенную бухгалтерскую
      (финансовую) отчетность. (в ред. приказа Минфина России от 06.04.2015 № 57н)
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: 'Юридическими и (или) физическими лицами, способными оказывать влияние на деятельность организации,
      составляющей бухгалтерскую отчетность, или на деятельность которых организация, составляющая бухгалтерскую
      отчетность, способна оказывать влияние (связанными сторонами), могут являться:'
  - path: 4.а
    parent_path: '4'
    heading: null
    text: юридическое и (или) физическое лицо и организация, составляющая бухгалтерскую отчетность, которые
      являются аффилированными лицами в соответствии с законодательством Российской Федерации;
  - path: 4.б
    parent_path: '4'
    heading: null
    text: юридическое и (или) физическое лицо, зарегистрированное в качестве индивидуального предпринимателя,
      и организация, составляющая бухгалтерскую отчетность, которые участвуют в совместной деятельности;
  - path: 4.в
    parent_path: '4'
    heading: null
    text: организация, составляющая бухгалтерскую отчетность, и негосударственный пенсионный фонд, который
      действует в интересах работников такой организации или иной организации, являющейся связанной стороной
      организации, составляющей бухгалтерскую отчетность.
  - path: '5'
    parent_path: null
    heading: Общие положения
    text: 'Операцией между организацией, составляющей бухгалтерскую отчетность, и связанной стороной считается
      любая операция по передаче (поступлению) активов, оказанию (потреблению) услуг или возникновению
      (прекращению) обязательств (независимо от получения платы или иного встречного предоставления) между
      организацией, составляющей бухгалтерскую отчетность, и связанной стороной. Операциями со связанной
      стороной могут быть: приобретение и продажа товаров, работ, услуг; приобретение и продажа основных
      средств и других активов; аренда имущества и предоставление имущества в аренду; финансовые операции,
      включая предоставление займов; передача в виде вклада в уставные (складочные) капиталы; предоставление
      и получение обеспечений исполнения обязательств; другие операции.'
  - path: '6'
    parent_path: null
    heading: Раскрытие информации о связанных сторонах
    text: 'Организация, составляющая бухгалтерскую отчетность, раскрывает информацию о связанных сторонах
      в случаях, когда: такая организация контролируется или на нее оказывается значительное влияние юридическим
      и (или) физическим лицом; такая организация контролирует или оказывает значительное влияние на юридическое
      лицо; такая организация и юридическое лицо контролируются или на них оказывается значительное влияние
      (непосредственно или через третьи юридические лица) одним и тем же юридическим и (или) одним и тем
      же физическим лицом (одной и той же группой лиц).'
  - path: '7'
    parent_path: null
    heading: Раскрытие информации о связанных сторонах
    text: 'Юридическое и (или) физическое лицо, как правило, имеет возможность определять решения, принимаемые
      другим юридическим лицом, с целью получения экономической выгоды от деятельности последнего (контролирует
      другое юридическое лицо), когда такое юридическое и (или) физическое лицо имеет: в силу своего участия
      в хозяйственном обществе (товариществе) либо в соответствии с полномочиями, полученными от других
      лиц, более пятидесяти процентов общего количества голосов, приходящихся на голосующие акции (доли)
      в уставном (складочном) капитале этого хозяйственного общества (товарищества); право распоряжаться
      (непосредственно или через свои дочерние общества) более чем двадцатью процентами общего количества
      голосов, приходящихся на голосующие акции (доли) в уставном (складочном) капитале этого хозяйственного
      общества (товарищества) либо составляющих уставный (складочный) капитал вкладов, долей данного юридического
      лица и имеет возможность определять решения, принимаемые таким юридическим лицом.'
  - path: '8'
    parent_path: null
    heading: Раскрытие информации о связанных сторонах
    text: Юридическое и (или) физическое лицо оказывает значительное влияние на другое юридическое лицо,
      когда имеет возможность участвовать в принятии решений другого юридического лица, но не контролирует
      его. Значительное влияние может иметь место в силу участия в уставном (складочном) капитале, положений
      учредительных документов, заключенного соглашения, участия в наблюдательном совете и других обстоятельств.
  - path: '9'
    parent_path: null
    heading: Раскрытие информации о связанных сторонах
    text: Перечень связанных сторон, информация о которых раскрывается в бухгалтерской отчетности организации,
      составляющей бухгалтерскую отчетность, устанавливается такой организацией самостоятельно на основе
      настоящего Положения исходя из содержания отношений между организацией, составляющей бухгалтерскую
      отчетность, и связанной стороной с учетом требования приоритета содержания перед формой.
  - path: '10'
    parent_path: null
    heading: Раскрытие информации о связанных сторонах
    text: 'Если в отчетном периоде организация, составляющая бухгалтерскую отчетность, проводила операции
      со связанными сторонами, то в бухгалтерской отчетности по каждой связанной стороне раскрывается,
      как минимум, следующая информация: характер отношений (в соответствии с пунктом 6 настоящего Положения);
      виды операций; объем операций каждого вида (в абсолютном или относительном выражении); стоимостные
      показатели по не завершенным на конец отчетного периода операциям; условия и сроки осуществления
      (завершения) расчетов по операциям, а также форму расчетов; величина образованных резервов по сомнительным
      долгам на конец отчетного периода; величина списанной дебиторской задолженности, по которой срок
      исковой давности истек, других долгов, нереальных для взыскания, в том числе за счет резерва по
      сомнительным долгам. Показатели, отражающие аналогичные по характеру отношения и операции со связанными
      сторонами, могут быть сгруппированы, за исключением случаев, когда обособленное раскрытие их необходимо
      для понимания влияния операций со связанными сторонами на бухгалтерскую отчетность организации,
      составляющей бухгалтерскую отчетность.'
  - path: '11'
    parent_path: null
    heading: Раскрытие информации о связанных сторонах
    text: 'Информация, подлежащая раскрытию в соответствии с пунктом 10 настоящего Положения, должна раскрываться
      отдельно для каждой из следующих групп связанных сторон: основного хозяйственного общества (товарищества);
      дочерних хозяйственных обществ; преобладающих (участвующих) хозяйственных обществ; зависимых хозяйственных
      обществ; участников совместной деятельности; основного управленческого персонала организации, составляющей
      бухгалтерскую отчетность. Для целей настоящего Положения под основным управленческим персоналом
      организации понимаются руководители (генеральный директор, иные лица, осуществляющие полномочия
      единоличного исполнительного органа организации), их заместители, члены коллегиального исполнительного
      органа, члены совета директоров (наблюдательного совета) или иного коллегиального органа управления
      организации, а также иные должностные лица, наделенные полномочиями и ответственностью в вопросах
      планирования, руководства и контроля над деятельностью организации; других связанных сторон.'
  - path: '12'
    parent_path: null
    heading: Раскрытие информации о связанных сторонах
    text: 'В составе информации о связанных сторонах организация, составляющая бухгалтерскую отчетность,
      раскрывает информацию о размерах вознаграждений, выплачиваемых такой организацией основному управленческому
      персоналу в совокупности и по каждому из следующих видов выплат: краткосрочные вознаграждения -
      суммы, подлежащие выплате в течение отчетного периода и 12 месяцев после отчетной даты (оплата труда
      за отчетный период, начисленные на нее налоги и иные обязательные платежи в соответствующие бюджеты
      и внебюджетные фонды, ежегодный оплачиваемый отпуск за работу в отчетном периоде, оплата организацией
      лечения, медицинского обслуживания, коммунальных услуг и т.п. платежи в пользу основного управленческого
      персонала); долгосрочные вознаграждения - суммы, подлежащие выплате по истечении 12 месяцев после
      отчетной даты: - вознаграждения по окончании трудовой деятельности (платежи (взносы) организации,
      составляющей бухгалтерскую отчетность, по договорам добровольного страхования (договорам негосударственного
      пенсионного обеспечения), заключенным в пользу основного управленческого персонала со страховыми
      организациями (негосударственными пенсионными фондами), и иные платежи, обеспечивающие выплаты пенсий
      и другие социальные гарантии основному управленческому персоналу по окончании ими трудовой деятельности);
      - вознаграждения в виде опционов эмитента, акций, паев, долей участия в уставном (складочном) капитале
      и выплаты на их основе; - иные долгосрочные вознаграждения.'
  - path: '13'
    parent_path: null
    heading: Раскрытие информации о связанных сторонах
    text: Если юридическое и (или) физическое лицо контролирует другое юридическое лицо, или юридические
      лица контролируются (непосредственно или через третьи юридические лица) одним и тем же юридическим
      и (или) одним и тем же физическим лицом (одной и той же группой лиц), то характер отношений между
      ними подлежит описанию в бухгалтерской отчетности независимо от того, имели ли место в отчетном
      периоде операции между ними.
  - path: '14'
    parent_path: null
    heading: Раскрытие информации о связанных сторонах
    text: Информация о связанных сторонах, предусмотренная настоящим Положением, включается в пояснения
      к бухгалтерскому балансу и отчету о финансовых результатах. (в ред. приказа Минфина России от 27.11.2020
      № 287н)
  - path: '15'
    parent_path: null
    heading: Раскрытие информации о связанных сторонах
    text: Построение аналитического учета должно обеспечивать формирование информации о связанных сторонах,
      предусмотренной настоящим Положением.
  - path: '16'
    parent_path: null
    heading: Раскрытие информации о связанных сторонах
    text: В случаях, когда раскрытие информации в объеме, предусмотренном настоящим Положением, приведет
      или может привести к потерям экономического характера и (или) урону деловой репутации организации
      и (или) ее контрагентов, и (или) связанных с ней сторон, организация может раскрывать информацию
      в ограниченном объеме, не раскрывая те сведения, которые обусловливают указанные потери и (или)
      урон. (п. 16 введен приказом Минфина России от 27.11.2020 № 287н)