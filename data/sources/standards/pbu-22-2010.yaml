id: pbu-22-2010
kind: ПБУ
number: 22/2010
year: 2010
title: Исправление ошибок в бухгалтерском учете и отчетности
order_date: 2010-06-28
order_no: 63н
effective_from: &id001 2010-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает правила исправления ошибок и порядок раскрытия информации
      об ошибках в бухгалтерском учете и отчетности организаций, являющихся юридическими лицами по законодательству
      Российской Федерации (за исключением кредитных организаций и организаций бюджетной сферы) (далее
      - организации). (в ред. приказов Минфина России от 25.10.2010 № 132н, от 07.02.2020 № 19н)
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: 'Неправильное отражение (неотражение) фактов хозяйственной деятельности в бухгалтерском учете
      и (или) бухгалтерской отчетности организации (далее - ошибка) может быть обусловлено, в частности:
      неправильным применением законодательства Российской Федерации о бухгалтерском учете и (или) нормативных
      правовых актов по бухгалтерскому учету; неправильным применением учетной политики организации; неточностями
      в вычислениях; неправильной классификацией или оценкой фактов хозяйственной деятельности; неправильным
      использованием информации, имеющейся на дату подписания бухгалтерской отчетности; недобросовестными
      действиями должностных лиц организации. Не являются ошибками неточности или пропуски в отражении
      фактов хозяйственной деятельности в бухгалтерском учете и (или) бухгалтерской отчетности организации,
      выявленные в результате получения новой информации, которая не была доступна организации на момент
      отражения (неотражения) таких фактов хозяйственной деятельности.'
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: Ошибка признается существенной, если она в отдельности или в совокупности с другими ошибками
      за один и тот же отчетный период может повлиять на экономические решения пользователей, принимаемые
      ими на основе бухгалтерской отчетности, составленной за этот отчетный период. Существенность ошибки
      организация определяет самостоятельно, исходя как из величины, так и характера соответствующей статьи
      (статей) бухгалтерской отчетности.
  - path: '4'
    parent_path: null
    heading: Порядок исправления ошибок
    text: Выявленные ошибки и их последствия подлежат обязательному исправлению.
  - path: '5'
    parent_path: null
    heading: Порядок исправления ошибок
    text: Ошибка отчетного года, выявленная до окончания этого года, исправляется записями по соответствующим
      счетам бухгалтерского учета в том месяце отчетного года, в котором выявлена ошибка.
  - path: '6'
    parent_path: null
    heading: Порядок исправления ошибок
    text: Ошибка отчетного года, выявленная после окончания этого года, но до даты подписания бухгалтерской
      отчетности за этот год, исправляется записями по соответствующим счетам бухгалтерского учета за
      декабрь отчетного года (года, за который составляется годовая бухгалтерская отчетность).
  - path: '7'
    parent_path: null
    heading: Порядок исправления ошибок
    text: Существенная ошибка предшествующего отчетного года, выявленная после даты подписания бухгалтерской
      отчетности за этот год, но до даты представления такой отчетности акционерам акционерного общества,
      участникам общества с ограниченной ответственностью, органу государственной власти, органу местного
      самоуправления или иному органу, уполномоченному осуществлять права собственника, и т.п., исправляется
      в порядке, установленном пунктом 6 настоящего Положения. Если указанная бухгалтерская отчетность
      была представлена каким-либо иным пользователям, то бухгалтерская отчетность, в которой выявленная
      существенная ошибка исправлена (исправленная бухгалтерская отчетность), подлежит повторному представлению
      этим пользователям. (в ред. приказа Минфина России от 07.02.2020 № 19н)
  - path: '8'
    parent_path: null
    heading: Порядок исправления ошибок
    text: Существенная ошибка предшествующего отчетного года, выявленная после представления бухгалтерской
      отчетности за этот год акционерам акционерного общества, участникам общества с ограниченной ответственностью,
      органу государственной власти, органу местного самоуправления или иному органу, уполномоченному
      осуществлять права собственника, и т.п., но до даты утверждения такой отчетности в установленном
      законодательством Российской Федерации порядке, исправляется в порядке, установленном пунктом 6
      настоящего Положения. При этом в исправленной бухгалтерской отчетности раскрывается информация о
      том, что данная бухгалтерская отчетность заменяет первоначально представленную бухгалтерскую отчетность,
      а также об основаниях составления исправленной бухгалтерской отчетности. Исправленная бухгалтерская
      отчетность представляется во все адреса, в которые была представлена первоначальная бухгалтерская
      отчетность. (п. 8 в ред. приказа Минфина России от 07.02.2020 № 19н)
  - path: '9'
    parent_path: null
    heading: Порядок исправления ошибок
    text: 'Существенная ошибка предшествующего отчетного года, выявленная после утверждения бухгалтерской
      отчетности за этот год, исправляется: 1) записями по соответствующим счетам бухгалтерского учета
      в текущем отчетном периоде. При этом корреспондирующим счетом в записях является счет учета нераспределенной
      прибыли (непокрытого убытка); 2) путем пересчета сравнительных показателей бухгалтерской отчетности
      за отчетные периоды, отраженные в бухгалтерской отчетности организации за текущий отчетный год,
      за исключением случаев, когда невозможно установить связь этой ошибки с конкретным периодом либо
      невозможно определить влияние этой ошибки накопительным итогом в отношении всех предшествующих отчетных
      периодов. Пересчет сравнительных показателей бухгалтерской отчетности осуществляется путем исправления
      показателей бухгалтерской отчетности, как если бы ошибка предшествующего отчетного периода никогда
      не была допущена (ретроспективный пересчет). Ретроспективный пересчет производится в отношении сравнительных
      показателей начиная с того предшествующего отчетного периода, представленного в бухгалтерской отчетности
      за текущий отчетный год, в котором была допущена соответствующая ошибка. Организации, которые вправе
      применять упрощенные способы ведения бухгалтерского учета, включая упрощенную бухгалтерскую (финансовую)
      отчетность, могут исправлять существенную ошибку предшествующего отчетного года, выявленную после
      утверждения бухгалтерской отчетности за этот год, в порядке, установленном пунктом 14 настоящего
      Положения, без ретроспективного пересчета. (абзац введен приказом Минфина России от 08.11.2010 №
      144н, в ред. приказов Минфина России от 27.04.2012 № 55н, от 06.04.2015 № 57н)'
  - path: '10'
    parent_path: null
    heading: Порядок исправления ошибок
    text: В случае исправления существенной ошибки предшествующего отчетного года, выявленной после утверждения
      бухгалтерской отчетности, утвержденная бухгалтерская отчетность за предшествующие отчетные периоды
      не подлежит исправлению и повторному представлению пользователям бухгалтерской отчетности. (в ред.
      приказа Минфина России от 07.02.2020 № 19н)
  - path: '11'
    parent_path: null
    heading: Порядок исправления ошибок
    text: В случае если существенная ошибка была допущена до начала самого раннего из представленных в
      бухгалтерской отчетности за текущий отчетный год предшествующих отчетных периодов, корректировке
      подлежат вступительные сальдо по соответствующим статьям активов, обязательств и капитала на начало
      самого раннего из представленных отчетных периодов.
  - path: '12'
    parent_path: null
    heading: Порядок исправления ошибок
    text: В случае если определить влияние существенной ошибки на один или более предшествующих отчетных
      периодов, представленных в бухгалтерской отчетности, невозможно, организация должна скорректировать
      вступительное сальдо по соответствующим статьям активов, обязательств и капитала на начало самого
      раннего из периодов, пересчет за который возможен.
  - path: '13'
    parent_path: null
    heading: Порядок исправления ошибок
    text: Влияние существенной ошибки на предшествующий отчетный период определить невозможно, если требуются
      сложные и (или) многочисленные расчеты, при выполнении которых невозможно выделить информацию, свидетельствующую
      об обстоятельствах, существовавших на дату совершения ошибки, либо необходимо использовать информацию,
      полученную после даты утверждения бухгалтерской отчетности за такой предшествующий отчетный период.
  - path: '14'
    parent_path: null
    heading: Порядок исправления ошибок
    text: Ошибка предшествующего отчетного года, не являющаяся существенной, выявленная после даты подписания
      бухгалтерской отчетности за этот год, исправляется записями по соответствующим счетам бухгалтерского
      учета в том месяце отчетного года, в котором выявлена ошибка. Прибыль или убыток, возникшие в результате
      исправления указанной ошибки, отражаются в составе прочих доходов или расходов текущего отчетного
      периода.
  - path: '15'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'В пояснительной записке к годовой бухгалтерской отчетности организация обязана раскрывать следующую
      информацию в отношении существенных ошибок предшествующих отчетных периодов, исправленных в отчетном
      периоде: 1) характер ошибки; 2) сумму корректировки по каждой статье бухгалтерской отчетности -
      по каждому предшествующему отчетному периоду в той степени, в которой это практически осуществимо;
      3) сумму корректировки по данным о базовой и разводненной прибыли (убытку) на акцию (если организация
      обязана раскрывать информацию о прибыли, приходящейся на одну акцию); 4) сумму корректировки вступительного
      сальдо самого раннего из представленных отчетных периодов.'
  - path: '16'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: Если определить влияние существенной ошибки на один или более предшествующих отчетных периодов,
      представленных в бухгалтерской отчетности, невозможно, то в пояснительной записке к годовой бухгалтерской
      отчетности раскрываются причины этого, а также приводится описание способа отражения исправления
      существенной ошибки в бухгалтерской отчетности организации и указывается период, начиная с которого
      внесены исправления.