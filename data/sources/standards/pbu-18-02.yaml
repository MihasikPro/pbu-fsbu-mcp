  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение (далее - Положение) устанавливает правила формирования в бухгалтерском учете
      и порядок раскрытия в бухгалтерской отчетности информации о расчетах по налогу на прибыль организаций
      (далее - налог на прибыль) для организаций, признаваемых в установленном законодательством Российской
      Федерации порядке налогоплательщиками налога на прибыль (кроме кредитных организаций и организаций
      государственного сектора), а также определяет взаимосвязь показателя, отражающего прибыль (убыток),
      исчисленного в порядке, установленном нормативными правовыми актами по бухгалтерскому учету Российской
      Федерации (далее - бухгалтерская прибыль (убыток)), и налоговой базы по налогу на прибыль за отчетный
      период (далее - налогооблагаемая прибыль (убыток)), рассчитанной в порядке, установленном законодательством
      Российской Федерации о налогах и сборах. (в ред. приказов Минфина России от 11.02.2008 № 23н, от
      25.10.2010 № 132н, от 20.11.2018 № 236н) Абзац утратил силу - приказ Минфина России от 20.11.2018
      № 236н. Положение предусматривает отражение в бухгалтерском учете не только суммы налога на прибыль,
      подлежащей уплате в бюджет, или суммы излишне уплаченного и (или) взысканного налога, причитающейся
      организации, либо суммы произведенного зачета по налогу в отчетном периоде, но и отражение в бухгалтерском
      учете сумм, способных оказать влияние на величину налога на прибыль последующих отчетных периодов
      в соответствии с законодательством Российской Федерации. (в ред. приказа Минфина России от 11.02.2008
      № 23н)
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Положение может не применяться организациями, которые вправе применять упрощенные способы ведения
      бухгалтерского учета, включая упрощенную бухгалтерскую (финансовую) отчетность. (в ред. приказов
      Минфина России от 11.02.2008 № 23н, от 06.04.2015 № 57н)
  - path: '3'
    parent_path: null
    heading: Постоянные и временные разницы
    text: Разница между бухгалтерской прибылью (убытком) и налогооблагаемой прибылью (убытком) отчетного
      периода, образовавшаяся в результате применения различных правил признания доходов и расходов, которые
      установлены в нормативных правовых актах по бухгалтерскому учету и законодательством Российской
      Федерации о налогах и сборах, состоит из постоянных и временных разниц. Информация о постоянных
      и временных разницах формируется в бухгалтерском учете либо на основании первичных учетных документов
      непосредственно по счетам бухгалтерского учета, либо в ином порядке, определяемом организацией самостоятельно.
      При этом постоянные и временные разницы отражаются в бухгалтерском учете обособленно. В аналитическом
      учете временные разницы учитываются дифференцированно по видам активов и обязательств, в оценке
      которых возникла временная разница. (абзац введен приказом Минфина России от 11.02.2008 № 23н) Участником
      консолидированной группы налогоплательщиков временные и постоянные разницы определяются исходя из
      его налоговой базы, включаемой в налоговую базу по консолидированной группе налогоплательщиков (далее
      – консолидированная налоговая база) в соответствии с законодательством Российской Федерации о налогах
      и сборах. (абзац введен приказом Минфина России от 20.11.2018 № 236н)
  - path: '4'
    parent_path: null
    heading: Постоянные разницы
    text: 'Для целей Положения под постоянными разницами понимаются доходы и расходы: (в ред. приказа
      Минфина России от 11.02.2008 № 23н) формирующие бухгалтерскую прибыль (убыток) отчетного периода,
      но не учитываемые при определении налоговой базы по налогу на прибыль как отчетного, так и последующих
      отчетных периодов; (в ред. приказа Минфина России от 11.02.2008 № 23н) учитываемые при определении
      налоговой базы по налогу на прибыль отчетного периода, но не признаваемые для целей бухгалтерского
      учета доходами и расходами как отчетного, так и последующих отчетных периодов. (в ред. приказа Минфина
      России от 11.02.2008 № 23н) Постоянные разницы возникают в результате: превышения фактических расходов,
      учитываемых при формировании бухгалтерской прибыли (убытка), над расходами, принимаемыми для целей
      налогообложения, по которым предусмотрены ограничения по расходам; непризнания для целей налогообложения
      расходов, связанных с передачей на безвозмездной основе имущества (товаров, работ, услуг), в сумме
      стоимости имущества (товаров, работ, услуг) и расходов, связанных с этой передачей; абзац исключен
      - приказ Минфина России от 11.02.2008 № 23н; образования убытка, перенесенного на будущее, который
      по истечении определенного времени, согласно законодательству Российской Федерации о налогах и сборах,
      уже не может быть принят в целях налогообложения как в отчетном, так и в последующих отчетных периодах;
      прочих аналогичных различий. 5 - 6. Исключены - приказ Минфина России от 11.02.2008 № 23н.'
  - path: '7'
    parent_path: null
    heading: Постоянные разницы
    text: Для целей Положения под постоянным налоговым расходом (доходом) понимается сумма налога, которая
      приводит к увеличению (уменьшению) налоговых платежей по налогу на прибыль в отчетном периоде. (в
      ред. приказов Минфина России от 11.02.2008 № 23н, от 20.11.2018 № 236н) Постоянный налоговый расход
      (доход) признается организацией в том отчетном периоде, в котором возникает постоянная разница.
      (в ред. приказов Минфина России от 11.02.2008 № 23н, от 20.11.2018 № 236н) Постоянный налоговый
      расход (доход) равняется величине, определяемой как произведение постоянной разницы, возникшей в
      отчетном периоде, на ставку налога на прибыль, установленную законодательством Российской Федерации
      о налогах и сборах и действующую на отчетную дату. (в ред. приказов Минфина России от 11.02.2008
      № 23н, от 20.11.2018 № 236н) Абзац исключен - приказ Минфина России от 11.02.2008 № 23н.
  - path: '8'
    parent_path: null
    heading: Временные разницы
    text: Для целей Положения под временными разницами понимаются доходы и расходы, формирующие бухгалтерскую
      прибыль (убыток) в одном отчетном периоде, а налоговую базу по налогу на прибыль - в другом или
      в других отчетных периодах, а также результаты операций, не включаемые в бухгалтерскую прибыль (убыток),
      но формирующие налоговую базу по налогу на прибыль в другом или в других отчетных периодах. Временная
      разница по состоянию на отчетную дату определяется как разница между балансовой стоимостью актива
      (обязательства) и его стоимостью, принимаемой для целей налогообложения. (в ред. приказа Минфина
      России от 20.11.2018 № 236н)
  - path: '9'
    parent_path: null
    heading: Временные разницы
    text: Временные разницы приводят к образованию отложенного налога на прибыль. (в ред. приказа Минфина
      России от 20.11.2018 № 236н) Для целей Положения под отложенным налогом на прибыль понимается сумма,
      которая оказывает влияние на величину налога на прибыль, подлежащего уплате в бюджет в следующем
      за отчетным или в последующих отчетных периодах.
  - path: '10'
    parent_path: null
    heading: Временные разницы
    text: 'Временные разницы в зависимости от характера их влияния на налогооблагаемую прибыль (убыток)
      подразделяются на: вычитаемые временные разницы; налогооблагаемые временные разницы.'
  - path: '11'
    parent_path: null
    heading: Временные разницы
    text: 'Вычитаемые временные разницы приводят к образованию отложенного налога на прибыль, который
      должен уменьшить сумму налога на прибыль, подлежащего уплате в бюджет в следующем за отчетным или
      в последующих отчетных периодах. Налогооблагаемые временные разницы приводят к образованию отложенного
      налога на прибыль, который должен увеличить сумму налога на прибыль, подлежащего уплате в бюджет
      в следующем за отчетным или в последующих отчетных периодах. Временные разницы образуются в результате:
      применения разных правил оценки первоначальной стоимости и амортизации внеоборотных активов для
      целей бухгалтерского учета и целей налогообложения; применения разных способов формирования себестоимости
      проданных продукции, товаров, работ, услуг для целей бухгалтерского учета и целей налогообложения;
      применения, в случае продажи объектов основных средств, разных правил признания для целей бухгалтерского
      учета и целей налогообложения доходов и расходов, связанных с их продажей; переоценки активов по
      рыночной стоимости для целей бухгалтерского учета; признания в бухгалтерском учете обесценения финансовых
      вложений, по которым не определяется их текущая рыночная стоимость, запасов и других активов; применения
      разных правил создания резервов по сомнительным долгам и других аналогичных резервов для целей бухгалтерского
      учета и целей налогообложения; признания в бухгалтерском учете оценочных обязательств; применения
      различных правил отражения процентов, уплачиваемых организацией за предоставление ей в пользование
      денежных средств (кредитов, займов) для целей бухгалтерского учета и целей налогообложения; убытка,
      перенесенного на будущее, не использованного для уменьшения налога на прибыль в отчетном периоде,
      но который будет принят в целях налогообложения в последующих отчетных периодах; прочих аналогичных
      различий. (п. 11 в ред. приказа Минфина России от 20.11.2018 № 236н)'
  - path: '12'
    parent_path: null
    heading: Временные разницы
    text: Утратил силу - приказ Минфина России от 20.11.2018 № 236н.
  - path: '13'
    parent_path: null
    heading: Временные разницы
    text: Исключен - приказ Минфина России от 11.02.2008 № 23н.
  - path: '14'
    parent_path: null
    heading: Отложенные налоговые активы и отложенные налоговые обязательства, их признание и отражение
      в бухгалтерском учете
    text: 'Для целей Положения под отложенным налоговым активом понимается та часть отложенного налога
      на прибыль, которая должна привести к уменьшению налога на прибыль, подлежащего уплате в бюджет
      в следующем за отчетным или в последующих отчетных периодах. Организация признает отложенные налоговые
      активы в том отчетном периоде, когда возникают вычитаемые временные разницы, при условии существования
      вероятности того, что она получит налогооблагаемую прибыль в последующих отчетных периодах. Отложенные
      налоговые активы отражаются в бухгалтерском учете с учетом всех вычитаемых временных разниц, за
      исключением случаев, когда существует вероятность того, что вычитаемая временная разница не будет
      уменьшена или полностью погашена в последующих отчетных периодах, а также за исключением суммы убытка,
      полученного участником консолидированной группы налогоплательщиков в отчетном периоде, учитываемой
      при определении консолидированной налоговой базы за этот период. (в ред. приказа Минфина России
      от 20.11.2018 № 236н) Изменение величины отложенных налоговых активов в отчетном периоде равняется
      произведению вычитаемых временных разниц, возникших (погашенных) в отчетном периоде, на ставку налога
      на прибыль, установленную законодательством Российской Федерации о налогах и сборах и действующую
      на отчетную дату. В случае изменения ставок налога на прибыль в соответствии с законодательством
      Российской Федерации о налогах и сборах величина отложенных налоговых активов подлежит пересчету
      на дату, предшествующую дате начала применения измененных ставок с отнесением возникшей в результате
      пересчета разницы на счет учета прибылей и убытков. (в ред. приказов Минфина России от 11.02.2008
      № 23н, от 24.12.2010 № 186н) Отложенные налоговые активы отражаются в бухгалтерском учете на отдельном
      синтетическом счете по учету отложенных налоговых активов. (в ред. приказа Минфина России от 11.02.2008
      № 23н) Пример возникновения вычитаемой временной разницы, которая приводит к образованию отложенного
      налогового актива Базовые данные Организация «А» 20 февраля 2003 года приняла к бухгалтерскому учету
      объект основных средств на сумму 120 000 руб. со сроком полезного использования 5 лет. Ставка налога
      на прибыль составила 24 процента. В целях бухгалтерского учета организация осуществляет начисление
      амортизации путем применения способа уменьшаемого остатка, а в целях определения налоговой базы
      по налогу на прибыль - линейный метод. При составлении бухгалтерской отчетности и налоговой декларации
      по налогу на прибыль за 2003 год организация «А» получила следующие данные: Для целей бухгалтерского
      учета (руб.) Для целей определения налогооблагаемой базы по налогу на прибыль (руб.) Принят к бухгалтерскому
      учету объект основных средств 20 февраля 2003 г. со сроком полезного использования 5 лет 120 000
      120 000 Сумма начисленной амортизации за 2003 год составила 40 000 20 000 Балансовая стоимость объекта
      основного средства на 01.01.2004 80 000 100 000 Вычитаемая временная разница при определении налоговой
      базы по налогу на прибыль за 2003 год составила: 20 000 руб. (40 000 руб. - 20 000 руб.). Отложенный
      налоговый актив при определении налоговой базы по налогу на прибыль за 2003 год составил: 20 000
      руб. x 24% / 100 = 4 800 руб.'
  - path: '15'
    parent_path: null
    heading: Отложенные налоговые активы и отложенные налоговые обязательства, их признание и отражение
      в бухгалтерском учете
    text: 'Для целей Положения под отложенным налоговым обязательством понимается та часть отложенного
      налога на прибыль, которая должна привести к увеличению налога на прибыль, подлежащего уплате в
      бюджет в следующем за отчетным или в последующих отчетных периодах. Отложенные налоговые обязательства
      признаются в том отчетном периоде, когда возникают налогооблагаемые временные разницы. Изменение
      величины отложенных налоговых обязательств в отчетном периоде равняется произведению налогооблагаемых
      временных разниц, возникших (погашенных) в отчетном периоде, на ставку налога на прибыль, установленную
      законодательством Российской Федерации о налогах и сборах и действующую на отчетную дату. В случае
      изменения ставок налога на прибыль в соответствии с законодательством Российской Федерации о налогах
      и сборах величина отложенных налоговых обязательств подлежит пересчету на дату, предшествующую дате
      начала применения измененных ставок с отнесением возникшей в результате пересчета разницы на счет
      учета прибылей и убытков. (в ред. приказов Минфина России от 11.02.2008 № 23н, от 24.12.2010 № 186н)
      Отложенные налоговые обязательства отражаются в бухгалтерском учете на отдельном синтетическом счете
      по учету отложенных налоговых обязательств. (в ред. приказа Минфина России от 11.02.2008 № 23н)
      Пример возникновения налогооблагаемой временной разницы, которая приводит к образованию отложенного
      налогового обязательства Базовые данные Организация «Б» 25 декабря 2002 года приняла к бухгалтерскому
      учету объект основных средств на сумму 120 000 руб. со сроком полезного использования 5 лет. Ставка
      налога на прибыль составила 24 процента. Для целей бухгалтерского учета организация осуществляет
      начисление амортизации линейным способом, а для целей определения налоговой базы по налогу на прибыль
      - нелинейным методом. При составлении бухгалтерской отчетности и налоговой декларации за 2003 год
      организация «Б» получила следующие данные: Для целей бухгалтерского учета (руб.) Для целей определения
      налогооблагаемой базы по налогу на прибыль (руб.) 1 2 3 Принят к бухгалтерскому учету объект основных
      средств 25 декабря 2002 г. со сроком полезного использования 5 лет 120 000 120 000 Сумма начисленной
      амортизации за 2003 год составила 24 000 40 130 Балансовая стоимость основного средства на 01.01.2004
      96 000 79 870 Налогооблагаемая временная разница при определении налоговой базы по налогу на прибыль
      за 2003 год составила: 16 130 руб. (40 130 руб. - 24 000 руб.). Отложенное налоговое обязательство
      при определении налоговой базы по налогу на прибыль за 2003 год составило: 16 130 руб. x 24% / 100
      = 3 871 руб.'
  - path: '16'
    parent_path: null
    heading: Отложенные налоговые активы и отложенные налоговые обязательства, их признание и отражение
      в бухгалтерском учете
    text: В случае, если законодательством Российской Федерации о налогах и сборах предусмотрены разные
      ставки налога на прибыль по отдельным видам доходов, то при оценке отложенного налогового актива
      или отложенного налогового обязательства ставка налога на прибыль должна соответствовать тому виду
      дохода, который ведет к уменьшению или полному погашению вычитаемой или налогооблагаемой временной
      разницы в следующем за отчетным или последующих отчетных периодах.
  - path: '17'
    parent_path: null
    heading: Отложенные налоговые активы и отложенные налоговые обязательства, их признание и отражение
      в бухгалтерском учете
    text: Абзац исключен - приказ Минфина России от 11.02.2008 № 23н. По мере уменьшения или полного погашения
      вычитаемых временных разниц будут уменьшаться или полностью погашаться отложенные налоговые активы.
      (в ред. приказа Минфина России от 11.02.2008 № 23н) В случае, если в текущем отчетном периоде отсутствует
      налогооблагаемая прибыль, но существует вероятность того, что налогооблагаемая прибыль возникнет
      в последующих отчетных периодах, то суммы отложенного налогового актива останутся без изменения
      до такого отчетного периода, когда возникнет в организации налогооблагаемая прибыль, если иное не
      предусмотрено законодательством Российской Федерации о налогах и сборах. Отложенный налоговый актив
      при выбытии актива, по которому он был начислен, списывается в сумме, на которую по законодательству
      Российской Федерации о налогах и сборах не будет уменьшена налогооблагаемая прибыль, как отчетного
      периода, так и последующих отчетных периодов. (в ред. приказа Минфина России от 11.02.2008 № 23н)
  - path: '18'
    parent_path: null
    heading: Отложенные налоговые активы и отложенные налоговые обязательства, их признание и отражение
      в бухгалтерском учете
    text: Абзац исключен - приказ Минфина России от 11.02.2008 № 23н. По мере уменьшения или полного погашения
      налогооблагаемых временных разниц будут уменьшаться или полностью погашаться отложенные налоговые
      обязательства. (в ред. приказа Минфина России от 11.02.2008 № 23н) Отложенное налоговое обязательство
      при выбытии актива или вида обязательства, по которому оно было начислено, списывается в сумме,
      на которую по законодательству Российской Федерации о налогах и сборах не будет увеличена налогооблагаемая
      прибыль, как отчетного, так и последующих отчетных периодов. (в ред. приказа Минфина России от 11.02.2008
      № 23н)
  - path: '19'
    parent_path: null
    heading: Отложенные налоговые активы и отложенные налоговые обязательства, их признание и отражение
      в бухгалтерском учете
    text: При составлении бухгалтерской отчетности организации предоставляется право отражать в бухгалтерском
      балансе сальдированную (свернутую) сумму отложенного налогового актива и отложенного налогового
      обязательства, кроме случаев, когда законодательством Российской Федерации о налогах и сборах предусмотрено
      раздельное формирование налоговой базы. (в ред. приказа Минфина России от 24.12.2010 № 186н) Абзацы
      второй - четвертый утратили силу - приказ Минфина России от 24.12.2010 № 186н.
  - path: '20'
    parent_path: null
    heading: Учет налога на прибыль
    text: Для целей Положения сумма налога на прибыль, определяемая исходя из бухгалтерской прибыли (убытка)
      и отраженная в бухгалтерском учете независимо от суммы налогооблагаемой прибыли (убытка), является
      условным расходом (условным доходом) по налогу на прибыль. Условный расход (условный доход) по налогу
      на прибыль равняется величине, определяемой как произведение бухгалтерской прибыли, сформированной
      в отчетном периоде, на ставку налога на прибыль, установленную законодательством Российской Федерации
      о налогах и сборах и действующую на отчетную дату. Для целей Положения под расходом (доходом) по
      налогу на прибыль понимается сумма налога на прибыль, признаваемая в отчете о финансовых результатах
      в качестве величины, уменьшающей (увеличивающей) прибыль (убыток) до налогообложения при расчете
      чистой прибыли (убытка) за отчетный период. Расход (доход) по налогу на прибыль определяется как
      сумма текущего налога на прибыль и отложенного налога на прибыль. При этом отложенный налог на прибыль
      за отчетный период определяется как суммарное изменение отложенных налоговых активов и отложенных
      налоговых обязательств за этот период, за исключением результатов операций, не включаемых в бухгалтерскую
      прибыль (убыток). Практический пример определения расхода (дохода) по налогу на прибыль и связанных
      с ним показателей приведен в приложении к Положению. (в ред. приказа Минфина России от 20.11.2018
      № 236н) Абзацы четвертый - пятый исключены - приказ Минфина России от 11.02.2008 № 23н.
  - path: '21'
    parent_path: null
    heading: Учет налога на прибыль
    text: Для целей Положения текущим налогом на прибыль признается налог на прибыль для целей налогообложения,
      определяемый в соответствии с законодательством Российской Федерации о налогах и сборах. (п. 21
      в ред. приказа Минфина России от 20.11.2018 № 236н)
  - path: '22'
    parent_path: null
    heading: Учет налога на прибыль
    text: 'Способ определения величины текущего налога на прибыль закрепляется в учетной политике организации.
      Организация может использовать следующие способы определения величины текущего налога на прибыль:
      на основе данных, сформированных в бухгалтерском учете. При этом величина текущего налога на прибыль
      должна соответствовать сумме исчисленного налога на прибыль, отраженного в налоговой декларации
      по налогу на прибыль; (в ред. приказа Минфина России от 20.11.2018 № 236н) на основе налоговой декларации
      по налогу на прибыль. При этом величина текущего налога на прибыль соответствует сумме исчисленного
      налога на прибыль, отраженного в налоговой декларации по налогу на прибыль. Сумма доплаты (переплаты)
      налога на прибыль в связи с обнаружением ошибок (искажений) в предыдущие отчетные (налоговые) периоды,
      не влияющая на текущий налог на прибыль отчетного периода, отражается по отдельной статье отчета
      о финансовых результатах (после статьи текущего налога на прибыль). (в ред. приказов Минфина России
      от 11.02.2008 № 23н, от 06.04.2015 № 57н) Текущий налог на прибыль участниками (включая ответственного
      участника) консолидированной группы налогоплательщиков формируется на отдельном счете по учету расчетов
      с участниками консолидированной группы налогоплательщиков. На этом счете отражается в бухгалтерском
      учете ответственного участника консолидированной группы налогоплательщиков сумма налога на прибыль
      по консолидированной группе налогоплательщиков в целом, подлежащая уплате ответственным участником
      консолидированной группы налогоплательщиков в бюджет на основе консолидированной налоговой базы,
      сформированной вне системы бухгалтерского учета в соответствии с законодательством Российской Федерации
      о налогах и сборах. (абзац введен приказом Минфина России от 20.11.2018 № 236н)'
  - path: '23'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: Отложенные налоговые активы и отложенные налоговые обязательства отражаются в бухгалтерском
      балансе соответственно в качестве внеоборотных активов и долгосрочных обязательств. Задолженность
      либо переплата по текущему налогу на прибыль за каждый отчетный период отражаются в бухгалтерском
      балансе соответственно в качестве краткосрочного обязательства в размере неоплаченной суммы налога
      или дебиторской задолженности в размере переплаты и (или) излишне взысканной суммы налога. (абзац
      введен приказом Минфина России от 11.02.2008 № 23н)
  - path: '24'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: Расход (доход) по налогу на прибыль с подразделением на отложенный налог на прибыль и текущий
      налог на прибыль отражается в отчете о финансовых результатах в качестве статьи, уменьшающей прибыль
      (убыток) до налогообложения при формировании чистой прибыли (убытка) за отчетный период. Налог на
      прибыль, относящийся к операциям, не включаемым в бухгалтерскую прибыль (убыток), отражается в отчете
      о финансовых результатах в качестве статьи, уменьшающей (увеличивающей) чистую прибыль (убыток)
      при формировании совокупного финансового результата периода. Разница между суммой текущего налога
      на прибыль, исчисленного участником (включая ответственного участника) консолидированной группы
      налогоплательщиков для включения в консолидированную налоговую базу консолидированной группы налогоплательщиков,
      и суммой денежных средств, причитающейся с участника (участнику) исходя из условий договора о создании
      консолидированной группы налогоплательщиков, раскрывается в отчете о финансовых результатах обособленно
      и обозначается как перераспределение налога на прибыль внутри консолидированной группы налогоплательщиков.
      (п. 24 в ред. приказа Минфина России от 20.11.2018 № 236н)
  - path: '25'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'В пояснениях к бухгалтерскому балансу и отчету о финансовых результатах раскрываются:'
  - path: 25.а
    parent_path: '25'
    heading: null
    text: 'отложенный налог на прибыль, обусловленный: возникновением (погашением) временных разниц в
      отчетном периоде; изменениями правил налогообложения, изменениями применяемых налоговых ставок;
      признанием (списанием) отложенных налоговых активов в связи с изменением вероятности того, что организация
      получит налогооблагаемую прибыль в последующих отчетных периодах;'
  - path: 25.б
    parent_path: '25'
    heading: null
    text: 'величины, объясняющие взаимосвязь между расходом (доходом) по налогу на прибыль и показателем
      прибыли (убытка) до налогообложения, в том числе: применяемые налоговые ставки; условный расход
      (условный доход) по налогу на прибыль; постоянный налоговый расход (доход);'
  - path: 25.в
    parent_path: '25'
    heading: null
    text: иная информация, необходимая пользователям для понимания характера показателей, связанных с
      налогом на прибыль организаций.
