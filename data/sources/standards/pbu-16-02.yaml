id: pbu-16-02
kind: ПБУ
number: 16/02
year: 2002
title: Информация по прекращаемой деятельности
order_date: 2002-07-02
order_no: 66н
effective_from: &id001 2003-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает порядок раскрытия информации по прекращаемой деятельности
      в бухгалтерской отчетности коммерческих организаций (кроме кредитных организаций), являющихся юридическими
      лицами по законодательству Российской Федерации. Некоммерческие организации (за исключением государственных,
      муниципальных учреждений) применяют настоящее Положение при раскрытии информации о прекращении использования
      отдельных активов, которые в соответствии с настоящим Положением считаются долгосрочными активами
      к продаже. (в ред. Приказа Минфина России от 05.04.2019 N 54н)
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение определяет требования по раскрытию информации по прекращаемой деятельности
      в бухгалтерской отчетности организации.
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение не применяется организацией при прекращении деятельности вследствие обстоятельств,
      носящих чрезвычайный характер (стихийного бедствия, пожара, аварии и т.п.), вследствие принудительного
      изъятия имущества по основаниям, предусмотренным законодательством, а также вследствие обращения
      имущества в государственную собственность (национализации).
  - path: '3.1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение может не применяться организациями, которые вправе применять упрощенные
      способы ведения бухгалтерского учета, включая упрощенную бухгалтерскую (финансовую) отчетность.
      (п. 3.1 введен Приказом Минфина России от 08.11.2010 N 144н, в ред. Приказа Минфина России от 06.04.2015
      N 57н)
  - path: '4'
    parent_path: null
    heading: Прекращаемая деятельность, долгосрочные активы к продаже, их признание и оценка
    text: Для целей настоящего Положения под информацией по прекращаемой деятельности понимается информация,
      раскрывающая часть деятельности организации (такую как сегмент, его часть либо совокупность сегментов)
      по производству продукции, продаже товаров, выполнению работ, оказанию услуг, которая может быть
      выделена операционно и (или) функционально для целей составления бухгалтерской отчетности и в соответствии
      с принятым организацией решением подлежит прекращению. Также под информацией по прекращаемой деятельности
      понимается информация о прекращении использования отдельных активов, если такие активы считаются
      в соответствии с настоящим Положением долгосрочными активами к продаже. (в ред. Приказа Минфина
      России от 05.04.2019 N 54н) Приостановление части деятельности организации без намерения прекратить
      ее не рассматривается и не раскрывается в бухгалтерской отчетности как прекращаемая деятельность.
  - path: '5'
    parent_path: null
    heading: Прекращаемая деятельность, долгосрочные активы к продаже, их признание и оценка
    text: Прекращаемая деятельность может быть выделена операционно и (или) функционально для целей составления
      бухгалтерской отчетности, если активы, обязательства, доходы и расходы по обычным видам деятельности
      организации (или основная их часть) относятся или могут быть прямо отнесены к прекращаемой деятельности
      организации. Активы, обязательства, доходы, расходы относятся или могут быть отнесены к прекращаемой
      деятельности в том случае, если они будут проданы, погашены или иным образом выбывают в результате
      осуществления прекращения части деятельности организации.
  - path: '6'
    parent_path: null
    heading: Прекращаемая деятельность, долгосрочные активы к продаже, их признание и оценка
    text: 'Прекращение части деятельности организации может осуществляться:'
  - path: 6.а
    parent_path: '6'
    heading: null
    text: путем продажи имущественного комплекса (предприятия) или его части, представляющих собой совокупность
      активов и обязательств, относящихся к прекращаемой деятельности, в результате заключения единой
      сделки;
  - path: 6.б
    parent_path: '6'
    heading: null
    text: путем продажи отдельных активов и прекращения (исполнения) в установленном законодательством
      порядке отдельных обязательств, относящихся к прекращаемой деятельности;
  - path: 6.в
    parent_path: '6'
    heading: null
    text: путем отказа от продолжения части деятельности.
  - path: 6.заключение
    parent_path: '6'
    heading: null
    text: Кроме того, прекращение деятельности может осуществляться при реорганизации организации в форме
      выделения из ее состава одного или нескольких юридических лиц.
  - path: '7'
    parent_path: null
    heading: Прекращаемая деятельность, долгосрочные активы к продаже, их признание и оценка
    text: 'Для целей настоящего Положения деятельность признается прекращаемой при условии принятия уполномоченным
      органом организации решения о прекращении части деятельности организации и выработки единой программы
      прекращения на дату возникновения наиболее раннего из следующих событий: заключения организацией
      договоров купли-продажи активов, без которых деятельность, выделяемая как прекращаемая, практически
      неосуществима; доведения информации о решении прекращения деятельности до сведения юридических и
      физических лиц, чьи интересы непосредственно будут затронуты (акционерам, работникам организации,
      поставщикам и др.).'
  - path: '8'
    parent_path: null
    heading: Прекращаемая деятельность, долгосрочные активы к продаже, их признание и оценка
    text: Вследствие признания деятельности прекращаемой у организации, как правило, возникают обязательства,
      обусловленные требованиями законодательства, условиями договоров либо добровольно принятые на себя
      организацией перед физическими и юридическими лицами, интересы которых будут затронуты в результате
      прекращения деятельности. Для урегулирования подобных обязательств, в отношении величины либо срока
      исполнения которых существует неопределенность, организация признает в установленном порядке оценочное
      обязательство. (в ред. Приказа Минфина России от 05.04.2019 N 54н) Абзацы третий - девятый утратили
      силу. - Приказ Минфина России от 05.04.2019 N 54н.
  - path: '9'
    parent_path: null
    heading: Прекращаемая деятельность, долгосрочные активы к продаже, их признание и оценка
    text: Признание деятельности прекращаемой в соответствии с пунктом 7 настоящего Положения требует
      уточнения отражаемой в бухгалтерском балансе стоимости активов организации, относящихся к прекращаемой
      деятельности, исходя из возможного снижения их стоимости. Абзац утратил силу. - Приказ Минфина России
      от 05.04.2019 N 54н. Применительно к настоящему Положению снижение стоимости активов определяется
      с учетом следующих особенностей. При прекращении деятельности путем продажи имущественного комплекса
      (предприятия) или его части, представляющих собой совокупность активов и обязательств, относящихся
      к прекращаемой деятельности, в результате заключения единой сделки снижение стоимости активов признается
      в бухгалтерском учете только в случае заключения предварительного договора купли-продажи или договора
      купли-продажи, в соответствии с условиями которого срок исполнения обязательств по передаче имущества
      приходится на последующие отчетные периоды. При этом сумма снижения стоимости каждого актива определяется
      организацией самостоятельно на основе расчета и признается в бухгалтерском учете на основании договора
      купли-продажи. При прекращении деятельности путем продажи отдельных активов и прекращения (исполнения)
      отдельных обязательств величина убытка от снижения стоимости актива определяется как разница между
      отражаемой в бухгалтерском балансе стоимостью актива и его текущей рыночной стоимостью за вычетом
      расходов по его выбытию. При прекращении деятельности путем отказа от ее продолжения, в случае невозможности
      продажи актива, величина снижения стоимости актива будет совпадать с его стоимостью, отражаемой
      в бухгалтерском балансе.
  - path: '10'
    parent_path: null
    heading: Прекращаемая деятельность, долгосрочные активы к продаже, их признание и оценка
    text: При прекращении деятельности путем продажи имущественного комплекса (предприятия) или его части,
      представляющих собой совокупность активов и обязательств, относящихся к прекращаемой деятельности,
      в результате заключения единой сделки финансовый результат от продажи формируется как разница между
      доходами, получаемыми в результате продажи, и расходами по ее осуществлению и отражается в бухгалтерском
      учете на счете по учету прочих доходов и расходов.
  - path: '10.1'
    parent_path: null
    heading: Прекращаемая деятельность, долгосрочные активы к продаже, их признание и оценка
    text: Для целей настоящего Положения под долгосрочным активом к продаже понимается объект основных
      средств или других внеоборотных активов (за исключением финансовых вложений), использование которого
      прекращено в связи с принятием решения о его продаже и имеется подтверждение того, что возобновление
      использования этого объекта не предполагается (принято соответствующее решение руководства, начаты
      действия по подготовке актива к продаже, заключено соглашение о продаже, другое). Долгосрочными
      активами к продаже считаются также предназначенные для продажи материальные ценности, остающиеся
      от выбытия, в том числе частичного, внеоборотных активов или извлекаемые в процессе их текущего
      содержания, ремонта, модернизации, реконструкции, за исключением случая, когда такие ценности классифицируются
      в качестве запасов. Долгосрочные активы к продаже учитываются в составе оборотных активов обособленно
      от других активов. Внеоборотные активы, использование которых временно прекращено, не считаются
      долгосрочными активами к продаже. (п. 10.1 введен Приказом Минфина России от 05.04.2019 N 54н)
  - path: '10.2'
    parent_path: null
    heading: Прекращаемая деятельность, долгосрочные активы к продаже, их признание и оценка
    text: Долгосрочный актив к продаже оценивается по балансовой стоимости соответствующего основного
      средства или другого внеоборотного актива на момент его переклассификации в долгосрочный актив к
      продаже. Последующая оценка долгосрочных активов к продаже осуществляется в порядке, предусмотренном
      для оценки запасов. (п. 10.2 введен Приказом Минфина России от 05.04.2019 N 54н)
  - path: '11'
    parent_path: null
    heading: Раскрытие информации по прекращаемой деятельности в бухгалтерской отчетности
    text: 'Организация в годовой бухгалтерской отчетности раскрывает следующую информацию по прекращаемой
      деятельности:'
  - path: 11.а
    parent_path: '11'
    heading: null
    text: 'описание прекращаемой деятельности: сегмент (часть сегмента, совокупность сегментов), в рамках
      которого (которых) происходит прекращение деятельности; (в ред. Приказа Минфина России от 05.04.2019
      N 54н) дату признания деятельности прекращаемой; дату или период, в котором ожидается завершение
      прекращения деятельности организации, если они известны или определимы;'
  - path: 11.б
    parent_path: '11'
    heading: null
    text: стоимость активов и обязательств организации, предполагаемых к выбытию или погашению в рамках
      прекращения деятельности;
  - path: 11.в
    parent_path: '11'
    heading: null
    text: суммы доходов, расходов, прибылей или убытков до налогообложения, а также сумму начисленного
      налога на прибыль, относящиеся к прекращаемой деятельности;
  - path: 11.г
    parent_path: '11'
    heading: null
    text: движение денежных средств, относящееся к прекращаемой деятельности, в разрезе текущей, инвестиционной
      и финансовой деятельности в течение текущего отчетного периода.
  - path: 11.заключение
    parent_path: '11'
    heading: null
    text: Информация, указанная в подпунктах "а" и "б", раскрывается организацией в пояснениях к бухгалтерскому
      балансу и отчету о финансовых результатах. (в ред. Приказа Минфина России от 05.04.2019 N 54н) Информацию,
      предусмотренную подпунктами "в" и "г" настоящего пункта, рекомендуется раскрывать в отчете о финансовых
      результатах и отчете о движении денежных средств соответственно или в пояснениях к ним. (в ред.
      Приказов Минфина России от 06.04.2015 N 57н, от 05.04.2019 N 54н) Примеры раскрытия информации по
      прекращаемой деятельности в бухгалтерской отчетности организации приведены в Приложении к настоящему
      Положению. Абзац утратил силу. - Приказ Минфина России от 05.04.2019 N 54н.
  - path: '12'
    parent_path: null
    heading: Раскрытие информации по прекращаемой деятельности в бухгалтерской отчетности
    text: По мере выбытия активов или погашения обязательств, относящихся к прекращаемой деятельности,
      организация раскрывает непосредственно в отчете о финансовых результатах или в пояснениях к нему
      сумму прибыли (убытка), связанных с выбытием активов или погашением обязательств, до налогообложения
      и сумму соответствующего налога на прибыль. (в ред. Приказов Минфина России от 06.04.2015 N 57н,
      от 05.04.2019 N 54н) Для тех активов и обязательств, по которым организация заключила договор(а)
      купли-продажи, в пояснениях к бухгалтерскому балансу раскрываются продажная цена актива (после вычета
      расчетных расходов на выбытие), сроки поступления денежных средств и отражаемая в бухгалтерском
      балансе сумма соответствующих активов и обязательств. (в ред. Приказа Минфина России от 05.04.2019
      N 54н)
  - path: '13'
    parent_path: null
    heading: Раскрытие информации по прекращаемой деятельности в бухгалтерской отчетности
    text: Утратил силу. - Приказ Минфина России от 05.04.2019 N 54н.
  - path: '14'
    parent_path: null
    heading: Раскрытие информации по прекращаемой деятельности в бухгалтерской отчетности
    text: Сумма снижения стоимости актива подлежит раскрытию в отчете о финансовых результатах. (в ред.
      Приказов Минфина России от 06.04.2015 N 57н, от 05.04.2019 N 54н)
  - path: '15'
    parent_path: null
    heading: Раскрытие информации по прекращаемой деятельности в бухгалтерской отчетности
    text: Организация раскрывает информацию по прекращаемой деятельности начиная с отчетного года, в котором
      деятельность признана прекращаемой в соответствии с пунктом 7 настоящего Положения, до отчетного
      периода (включая его), когда завершены расчеты, связанные с получением доходов и выполнением обязательств,
      связанных с прекращением, или организация от нее отказалась. (в ред. Приказа Минфина России от 05.04.2019
      N 54н)
  - path: '16'
    parent_path: null
    heading: Раскрытие информации по прекращаемой деятельности в бухгалтерской отчетности
    text: Утратил силу. - Приказ Минфина России от 05.04.2019 N 54н.
  - path: '17'
    parent_path: null
    heading: Раскрытие информации по прекращаемой деятельности в бухгалтерской отчетности
    text: На конец отчетного периода, в котором деятельность признается прекращаемой, организация, исходя
      из требований пункта 9 настоящего Положения, признает убыток от снижения стоимости активов. При
      этом в бухгалтерском балансе суммы активов показываются с учетом признанного снижения их стоимости,
      а сумма снижения стоимости активов раскрывается в отчете о финансовых результатах. (в ред. Приказов
      Минфина России от 18.09.2006 N 116н, от 06.04.2015 N 57н, от 05.04.2019 N 54н) По состоянию на конец
      каждого отчетного года в течение периода от признания деятельности прекращаемой до завершения прекращения
      деятельности организация уточняет отражаемую в бухгалтерском балансе сумму активов исходя из возможного
      изменения их рыночной стоимости. При повышении текущей рыночной стоимости актива организация признает
      доход в пределах сумм ранее признанного убытка от снижения стоимости этого актива. (в ред. Приказов
      Минфина России от 18.09.2006 N 116н, от 05.04.2019 N 54н)
  - path: '18'
    parent_path: null
    heading: Раскрытие информации по прекращаемой деятельности в бухгалтерской отчетности
    text: Помимо информации, раскрываемой в соответствии с пунктами 11 и 12 настоящего Положения, организация
      на конец каждого отчетного года в течение периода от признания деятельности, прекращаемой до завершения
      прекращения деятельности, раскрывает любые существенные изменения в суммах или сроках поступления
      (выбытия) денежных средств, относящихся к активам и обязательствам, предназначенным для выбытия
      или погашения, а также события, вызвавшие соответствующие изменения.
  - path: '19'
    parent_path: null
    heading: Раскрытие информации по прекращаемой деятельности в бухгалтерской отчетности
    text: В том случае, если признание деятельности прекращаемой происходит после окончания годового отчетного
      периода, но до даты подписания годовой бухгалтерской отчетности организации, такая отчетность должна
      быть уточнена в части раскрытия показателей, предусмотренных пунктом 11 настоящего Положения, за
      период, охватываемый данной отчетностью. Последствия признания деятельности прекращаемой (признание
      оценочных обязательств, снижение стоимости активов и убыток от снижения их стоимости) в таком случае
      отражаются в порядке, предусмотренном для учета событий после отчетной даты. (в ред. Приказа Минфина
      России от 05.04.2019 N 54н)
  - path: '20'
    parent_path: null
    heading: Раскрытие информации по прекращаемой деятельности в бухгалтерской отчетности
    text: В случае отмены программы прекращения деятельности этот факт находит отражение в пояснениях
      к бухгалтерскому балансу и отчету о финансовых результатах. При этом суммы признанных ранее в соответствии
      с настоящим Положением объектов бухгалтерского учета подлежат корректировке. (п. 20 в ред. Приказа
      Минфина России от 05.04.2019 N 54н)
  - path: '21'
    parent_path: null
    heading: Раскрытие информации по прекращаемой деятельности в бухгалтерской отчетности
    text: Любая информация, раскрываемая в соответствии с настоящим Положением, должна представляться
      раздельно по каждой части деятельности организации, выделяемой как прекращаемая.
  - path: '22'
    parent_path: null
    heading: Раскрытие информации по прекращаемой деятельности в бухгалтерской отчетности
    text: Информация за периоды, предшествующие отчетному, представленная в бухгалтерской отчетности,
      подготовленной после признания деятельности прекращаемой, должна быть скорректирована с целью выделения
      активов, обязательств, доходов, расходов и потоков денежных средств по прекращаемой деятельности
      для сопоставимости отчетных данных с показателями предшествующих отчетных периодов.
  - path: '23'
    parent_path: null
    heading: Раскрытие информации по прекращаемой деятельности в бухгалтерской отчетности
    text: 'Организация в бухгалтерской отчетности раскрывает следующую информацию о долгосрочных активах
      к продаже с учетом существенности:'
  - path: 23.а
    parent_path: '23'
    heading: null
    text: описание долгосрочных активов к продаже;
  - path: 23.б
    parent_path: '23'
    heading: null
    text: описание фактов и обстоятельств продажи, включая предполагаемый способ и период продажи;
  - path: 23.в
    parent_path: '23'
    heading: null
    text: связанную с долгосрочными активами к продаже прибыль (убыток) и статью отчета о финансовых результатах,
      в которую эта прибыль (убыток) включена (за исключением случая ее обособленного представления непосредственно
      в отчете о финансовых результатах);
  - path: 23.г
    parent_path: '23'
    heading: null
    text: в случае представления информации по сегментам - отчетный сегмент, к которому относятся показатели,
      связанные с долгосрочным активом к продаже.
  - path: 23.заключение
    parent_path: '23'
    heading: null
    text: (п. 23 введен Приказом Минфина России от 05.04.2019 N 54н)
