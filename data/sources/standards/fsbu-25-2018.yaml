id: fsbu-25-2018
kind: ФСБУ
number: 25/2018
year: 2018
title: Бухгалтерский учет аренды
order_date: 2018-10-16
order_no: 208н
effective_from: &id001 2022-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящий Стандарт устанавливает требования к формированию в бухгалтерском учете организаций
      информации об объектах бухгалтерского учета при получении (предоставлении) за плату во временное
      пользование имущества, допустимые способы ведения бухгалтерского учета таких объектов, состав и
      содержание указанной информации, раскрываемой в бухгалтерской (финансовой) отчетности организаций.
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Настоящий Стандарт применяется сторонами договоров аренды (субаренды), а также иных договоров,
      положения которых по отдельности или во взаимосвязи предусматривают предоставление арендодателем,
      лизингодателем, правообладателем, иным лицом (далее - арендодатель) за плату арендатору, лизингополучателю,
      пользователю, иному лицу (далее - арендатор) имущества во временное пользование (далее - договор
      аренды). Настоящий Стандарт применяется вне зависимости от наличия в договорах финансовой аренды
      (лизинга) и иных сходных договорах условий в соответствии с которыми имущество, предоставляемое
      за плату во временное пользование в целом или отдельно по каждой из частей (далее - предмет аренды),
      учитывается на балансе арендодателя или арендатора.
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: 'Настоящий Стандарт не применяется при предоставлении:'
  - path: 3.а
    parent_path: '3'
    heading: null
    text: участков недр для геологического изучения, разведки и (или) добычи полезных ископаемых;
  - path: 3.б
    parent_path: '3'
    heading: null
    text: результатов интеллектуальной деятельности или средств индивидуализации, а также материальных
      носителей, в которых эти результаты и средства выражены;
  - path: 3.в
    parent_path: '3'
    heading: null
    text: объектов концессионного соглашения.
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: Настоящий Стандарт не распространяется на организации бюджетной сферы. (в ред. приказа Минфина
      России от 29.06.2022 № 101н)
  - path: '5'
    parent_path: null
    heading: Общие положения
    text: 'В целях настоящего Стандарта объекты бухгалтерского учета классифицируются как объекты учета
      аренды при единовременном выполнении следующих условий: 1) арендодатель предоставляет арендатору
      предмет аренды на определенный срок; 2) предмет аренды идентифицируется (предмет аренды определен
      в договоре аренды, и этим договором не предусмотрено право арендодателя по своему усмотрению заменить
      предмет аренды в любой момент в течение срока аренды); 3) арендатор имеет право на получение экономических
      выгод от использования предмета аренды в течение срока аренды; 4) арендатор имеет право определять,
      как и для какой цели используется предмет аренды в той степени, в которой это не предопределено
      техническими характеристиками предмета аренды. Настоящий стандарт не применяется к объектам бухгалтерского
      учета не классифицированным как объекты учета аренды в соответствии с настоящим пунктом.'
  - path: '6'
    parent_path: null
    heading: Общие положения
    text: 'Классификация объектов учета аренды производится на раннюю из двух дат: дату, на которую предмет
      аренды становится доступным для использования арендатором (далее - дата предоставления предмета
      аренды), или дату заключения договора аренды. Классификация объектов учета аренды пересматривается
      при изменении соответствующего договора аренды.'
  - path: '7'
    parent_path: null
    heading: Общие положения
    text: 'В целях настоящего Стандарта в состав арендных платежей включаются платежи (за вычетом сумм
      налога на добавленную стоимость), обусловленные договором аренды, в том числе: (в ред. приказа Минфина
      России от 29.06.2022 № 101н)'
  - path: 7.а
    parent_path: '7'
    heading: null
    text: определенные в твердой сумме платежи арендатора арендодателю, вносимые периодически или единовременно,
      за вычетом платежей, осуществляемых арендодателем в пользу арендатора, в том числе возмещение арендодателем
      расходов арендатора;
  - path: 7.б
    parent_path: '7'
    heading: null
    text: переменные платежи, зависящие от ценовых индексов или процентных ставок, определенные на дату
      предоставления предмета аренды);
  - path: 7.в
    parent_path: '7'
    heading: null
    text: справедливая стоимость иного встречного предоставления, определенная на дату предоставления
      предмета аренды;
  - path: 7.г
    parent_path: '7'
    heading: null
    text: платежи, связанные с продлением или сокращением срока аренды, установленные договором аренды,
      когда такое изменение учитывается при расчете срока аренды;
  - path: 7.д
    parent_path: '7'
    heading: null
    text: платежи, связанные с правом выкупа предмета аренды арендатором, в случае, когда арендатор намерен
      воспользоваться таким правом;
  - path: 7.е
    parent_path: '7'
    heading: null
    text: суммы, подлежащие оплате (получению) в связи с гарантиями выкупа предмета аренды по окончании
      срока аренды.
  - path: '8'
    parent_path: null
    heading: Общие положения
    text: Для целей настоящего Стандарта справедливая стоимость определяется в порядке, предусмотренном
      Международным стандартом финансовой отчетности (IFRS) 16 «Аренда» [1] и другими Международными стандартами
      финансовой отчетности и Разъяснениями Международных стандартов финансовой отчетности, принимаемыми
      Фондом Международных стандартов финансовой отчетности, введенными в действие на территории Российской
      Федерации, в порядке, установленном законодательством Российской Федерации.
  - path: '9'
    parent_path: null
    heading: Общие положения
    text: Срок аренды для целей бухгалтерского учета рассчитывается исходя из сроков и условий, установленных
      договором аренды (включая периоды, не предусматривающие арендных платежей). При этом учитываются
      возможности сторон изменять указанные сроки и условия и намерения реализации таких возможностей.
      Срок аренды пересматривается в случае наступления событий, изменяющих допущения, которые использовались
      при первоначальном определении срока аренды (при предыдущем пересмотре срока аренды). Связанные
      с таким пересмотром корректировки отражаются в бухгалтерском учете как изменения оценочных значений.
      Течение срока аренды начинается с даты предоставления предмета аренды.
  - path: '10'
    parent_path: null
    heading: Учет у арендатора
    text: Арендатор признает предмет аренды на дату предоставления предмета аренды в качестве права пользования
      активом с одновременным признанием обязательства по аренде, если иное не установлено настоящим Стандартом.
      Организация должна применять единую учетную политику в отношении права пользования активом и в отношении
      схожих по характеру использования активов (незавершенных капитальных вложений, основных средств
      и других), с учетом особенностей, установленных настоящим Стандартом.
  - path: '11'
    parent_path: null
    heading: Учет у арендатора
    text: 'При выполнении условий, установленных пунктом 12 настоящего Стандарта, арендатор может не признавать
      предмет аренды в качестве права пользования активом и не признавать обязательство по аренде в любом
      из следующих случаев:'
  - path: 11.а
    parent_path: '11'
    heading: null
    text: срок аренды не превышает 12 месяцев на дату предоставления предмета аренды;
  - path: 11.б
    parent_path: '11'
    heading: null
    text: рыночная стоимость предмета аренды без учета износа (то есть стоимость аналогичного нового объекта)
      не превышает 300 000 руб. и при этом арендатор имеет возможность получать экономические выгоды от
      предмета аренды преимущественно независимо от других активов;
  - path: 11.в
    parent_path: '11'
    heading: null
    text: арендатор относится к экономическим субъектам, которые вправе применять упрощенные способы ведения
      бухгалтерского учета, включая упрощенную бухгалтерскую (финансовую) отчетность (далее - упрощенные
      способы учета).
  - path: 11.заключение
    parent_path: '11'
    heading: null
    text: В случае, указанном в подпункте «а» настоящего пункта, решение о применении настоящего пункта
      принимается арендатором в отношении группы однородных по характеру и способу использования предметов
      аренды. В случаях, указанных в подпунктах «б» и «в» настоящего пункта, решение о применении настоящего
      пункта принимается в отношении каждого предмета аренды. При применении настоящего пункта арендные
      платежи признаются в качестве расхода равномерно в течение срока аренды или на основе другого систематического
      подхода, отражающего характер использования арендатором экономических выгод от предмета аренды.
  - path: '12'
    parent_path: null
    heading: Учет у арендатора
    text: 'Применение арендатором пункта 11 настоящего Стандарта допускается при одновременном выполнении
      следующих условий:'
  - path: 12.а
    parent_path: '12'
    heading: null
    text: договором аренды не предусмотрен переход права собственности на предмет аренды к арендатору
      и отсутствует возможность выкупа арендатором предмета аренды по цене значительно ниже его справедливой
      стоимости на дату выкупа;
  - path: 12.б
    parent_path: '12'
    heading: null
    text: предмет аренды не предполагается предоставлять в субаренду.
  - path: '13'
    parent_path: null
    heading: Учет у арендатора
    text: 'Право пользования активом признается по фактической стоимости. Фактическая стоимость права
      пользования активом включает:'
  - path: 13.а
    parent_path: '13'
    heading: null
    text: величину первоначальной оценки обязательства по аренде;
  - path: 13.б
    parent_path: '13'
    heading: null
    text: арендные платежи, осуществленные на дату предоставления предмета аренды или до такой даты;
  - path: 13.в
    parent_path: '13'
    heading: null
    text: затраты арендатора в связи с поступлением предмета аренды и приведением его в состояние, пригодное
      для использования в запланированных целях;
  - path: 13.г
    parent_path: '13'
    heading: null
    text: величину подлежащего исполнению арендатором оценочного обязательства, в частности, по демонтажу,
      перемещению предмета аренды, восстановлению окружающей среды, восстановлению предмета аренды до
      требуемого договором аренды состояния, если возникновение такого обязательства у арендатора обусловлено
      получением предмета аренды.
  - path: 13.заключение
    parent_path: '13'
    heading: null
    text: Арендатор, который вправе применять упрощенные способы учета, может рассчитывать фактическую
      стоимость права пользования активом исходя из подпунктов «а» и «б» настоящего пункта. При принятии
      такого решения затраты, указанные в подпунктах «в» и «г» настоящего пункта, признаются расходами
      периода, в котором были понесены.
  - path: '14'
    parent_path: null
    heading: Учет у арендатора
    text: Обязательство по аренде первоначально оценивается как сумма приведенной стоимости будущих арендных
      платежей на дату этой оценки. Арендатор, который вправе применять упрощенные способы учета, может
      первоначально оценивать обязательство по аренде как сумму номинальных величин будущих арендных платежей
      на дату этой оценки.
  - path: '15'
    parent_path: null
    heading: Учет у арендатора
    text: Приведенная стоимость будущих арендных платежей определяется путем дисконтирования их номинальных
      величин. Дисконтирование производится с применением ставки, при использовании которой приведенная
      стоимость будущих арендных платежей и негарантированной ликвидационной стоимости предмета аренды
      становится равна справедливой стоимости предмета аренды. При этом негарантированной ликвидационной
      стоимостью предмета аренды считается предполагаемая справедливая стоимость предмета аренды, которую
      он будет иметь к концу срока аренды, за вычетом сумм, указанных в подпункте «е» пункта 7 настоящего
      Стандарта, которые учтены в составе арендных платежей. В случае если ставка дисконтирования не может
      быть определена в соответствие с первым абзацем настоящего пункта, применяется ставка, по которой
      арендатор привлекает или мог бы привлечь заемные средства на срок, сопоставимый со сроком аренды.
  - path: '16'
    parent_path: null
    heading: Учет у арендатора
    text: В случае если предмет аренды по характеру его использования относится к группе основных средств,
      по которой арендатор принял решение о проведении переоценки, арендатор может переоценивать соответствующее
      право пользования активом. (в ред. приказа Минфина России от 29.06.2022 № 101н)
  - path: '17'
    parent_path: null
    heading: Учет у арендатора
    text: Стоимость права пользования активом погашается посредством амортизации, за исключением случаев,
      когда схожие по характеру использования активы не амортизируются. Срок полезного использования права
      пользования активом не должен превышать срок аренды, если не предполагается переход к арендатору
      права собственности на предмет аренды.
  - path: '18'
    parent_path: null
    heading: Учет у арендатора
    text: Величина обязательства по аренде после признания увеличивается на величину начисляемых процентов
      и уменьшается на величину фактически уплаченных арендных платежей.
  - path: '19'
    parent_path: null
    heading: Учет у арендатора
    text: Величина начисляемых процентов определяется как произведение обязательства по аренде на начало
      периода, за который начисляются проценты, и процентной ставки, определенной в соответствии с пунктом
      15 настоящего Стандарта. Периодичность начисления процентов выбирается арендатором в зависимости
      от периодичности арендных платежей и от наступления отчетных дат.
  - path: '20'
    parent_path: null
    heading: Учет у арендатора
    text: Начисленные по обязательству по аренде проценты отражаются в составе расходов арендатора, за
      исключением той их части, которая включается в стоимость актива.
  - path: '21'
    parent_path: null
    heading: Учет у арендатора
    text: 'Фактическая стоимость права пользования активом и величина обязательства по аренде пересматриваются
      в случаях: изменения условий договора аренды; изменения намерения продлевать или сокращать срок
      аренды, которое учитывалось ранее при расчете срока аренды; изменения величины арендных платежей
      по сравнению с тем, как они учитывались при первоначальной оценке обязательства по аренде. Изменение
      величины обязательства по аренде относится на стоимость права пользования активом. Уменьшение обязательства
      по аренде сверх балансовой стоимости права пользования активом включается в доходы текущего периода.'
  - path: '22'
    parent_path: null
    heading: Учет у арендатора
    text: При изменении величины обязательства по аренде ставка дисконтирования пересматривается исходя
      из пункта 15 настоящего Стандарта.
  - path: '23'
    parent_path: null
    heading: Учет у арендатора
    text: При полном или частичном прекращении договора аренды балансовая стоимость права пользования
      активом и обязательства по аренде списываются в соответствующей части. Образовавшаяся при этом разница
      признается в качестве дохода или расхода в составе прибыли (убытка).
  - path: '24'
    parent_path: null
    heading: Учет у арендодателя
    text: Объекты учета аренды классифицируются арендодателем на дату, указанную в пункте 6 настоящего
      Стандарта, в качестве объектов учета операционной аренды или объектов учета неоперационной (финансовой)
      аренды. Данная классификация производится арендодателем по каждому договору аренды (промежуточным
      арендодателем - по каждому договору субаренды) с учетом требования приоритета содержания перед формой.
  - path: '25'
    parent_path: null
    heading: Учет у арендодателя
    text: 'Объекты учета аренды классифицируются арендодателем в качестве объектов учета неоперационной
      (финансовой) аренды, если к арендатору переходят экономические выгоды и риски, обусловленные правом
      собственности арендодателя на предмет аренды. Соблюдением указанного условия является любое из следующих
      обстоятельств:'
  - path: 25.а
    parent_path: '25'
    heading: null
    text: условиями договора аренды предусмотрен переход к арендатору права собственности на предмет аренды;
  - path: 25.б
    parent_path: '25'
    heading: null
    text: арендатор имеет право на покупку предмета аренды по цене значительно ниже его справедливой стоимости
      на дату реализации этого права;
  - path: 25.в
    parent_path: '25'
    heading: null
    text: срок аренды сопоставим с периодом, в течение которого предмет аренды останется пригодным к использованию;
  - path: 25.г
    parent_path: '25'
    heading: null
    text: на дату заключения договора аренды приведенная стоимость будущих арендных платежей сопоставима
      со справедливой стоимостью предмета аренды;
  - path: 25.д
    parent_path: '25'
    heading: null
    text: возможность использовать предмет аренды без существенных изменений имеется только у арендатора;
  - path: 25.е
    parent_path: '25'
    heading: null
    text: арендатор имеет возможность продлить установленный договором аренды срок аренды с арендной платой
      значительно ниже рыночной;
  - path: 25.ж
    parent_path: '25'
    heading: null
    text: иное обстоятельство, свидетельствующее о переходе к арендатору экономических выгод и рисков,
      обусловленных правом собственности арендодателя на предмет аренды.
  - path: '26'
    parent_path: null
    heading: Учет у арендодателя
    text: 'Объекты учета аренды классифицируются арендодателем в качестве объектов учета операционной
      аренды, если экономические выгоды и риски, обусловленные правом собственности на предмет аренды,
      несет арендодатель. Соблюдением указанного условия является любое из следующих обстоятельств:'
  - path: 26.а
    parent_path: '26'
    heading: null
    text: срок аренды существенно меньше и несопоставим с периодом, в течение которого предмет аренды
      останется пригодным к использованию;
  - path: 26.б
    parent_path: '26'
    heading: null
    text: предметом аренды являются имеющие неограниченный срок использования объекты, потребительские
      свойства которых с течением времени не изменяются;
  - path: 26.в
    parent_path: '26'
    heading: null
    text: на дату предоставления предмета аренды приведенная стоимость будущих арендных платежей существенно
      меньше справедливой стоимости предмета аренды;
  - path: 26.г
    parent_path: '26'
    heading: null
    text: иное обстоятельство, свидетельствующее о том, что экономические выгоды и риски, обусловленные
      правом собственности на предмет аренды, несет арендодатель.
  - path: '27'
    parent_path: null
    heading: Учет у арендодателя
    text: Объекты учета субаренды классифицируются арендатором (промежуточным арендодателем) исходя из
      соответствующих условий договора аренды. При этом если арендатор (промежуточный арендодатель) применяет
      пункт 14 настоящего Стандарта, то соответствующие объекты учета субаренды классифицируются как объекты
      учета операционной аренды.
  - path: '28'
    parent_path: null
    heading: Учет у арендодателя
    text: Арендодатель, который вправе применять упрощенные способы учета, может классифицировать все
      объекты учета аренды в качестве объектов учета операционной аренды, за исключением случаев, указанных
      в подпунктах «а» и «б» пункта 25 настоящего Стандарта.
  - path: '29'
    parent_path: null
    heading: Учет у арендодателя
    text: Объекты учета неоперационной (финансовой) аренды учитываются арендодателем в соответствии с
      пунктами 32 - 40 настоящего Стандарта. Объекты учета операционной аренды учитываются арендодателем
      в соответствии с пунктами 41 - 42 настоящего Стандарта.
  - path: '30'
    parent_path: null
    heading: Учет у арендодателя
    text: Классификация объекта учета аренды пересматривается в случае изменения договора аренды. Изменения
      оценочных значений или изменения фактов и обстоятельств, не меняющие условия договора аренды, не
      могут рассматриваться в качестве оснований пересмотра арендодателем классификации объекта учета
      аренды.
  - path: '31'
    parent_path: null
    heading: Учет у арендодателя
    text: 'При изменении договора аренды объекты бухгалтерского учета учитываются арендодателем в качестве
      вновь возникших объектов учета аренды с даты вступления в силу указанных изменений в следующих случаях:'
  - path: 31.а
    parent_path: '31'
    heading: null
    text: если объекты учета аренды изначально классифицированы арендодателем как объекты учета операционной
      аренды;
  - path: 31.б
    parent_path: '31'
    heading: null
    text: если объекты учета аренды изначально классифицированы арендодателем как объекты учета неоперационной
      (финансовой) аренды, но вступление в силу изменений договора аренды на дату заключения договора
      аренды привело бы к классификации таких объектов в качестве объектов учета операционной аренды.
  - path: '32'
    parent_path: null
    heading: Учет у арендодателя
    text: В случае классификации объекта учета аренды в качестве объекта учета неоперационной (финансовой)
      аренды арендодатель признает инвестицию в аренду в качестве актива на дату предоставления предмета
      аренды.
  - path: '33'
    parent_path: null
    heading: Учет у арендодателя
    text: Инвестиция в аренду оценивается в размере ее чистой стоимости. Чистая стоимость инвестиции в
      аренду определяется путем дисконтирования ее валовой стоимости по процентной ставке, при использовании
      которой приведенная валовая стоимость инвестиции в аренду на дату предоставления предмета аренды
      равна сумме справедливой стоимости предмета аренды и понесенных арендодателем затрат в связи с договором
      аренды. Валовая стоимость инвестиции в аренду определяется как сумма номинальных величин причитающихся
      арендодателю будущих арендных платежей по договору аренды и негарантированной ликвидационной стоимости
      предмета аренды.
  - path: '34'
    parent_path: null
    heading: Учет у арендодателя
    text: Связанные с договором аренды затраты арендодателя включаются в чистую стоимость инвестиции в
      аренду по мере осуществления этих затрат, за исключением случая, указанного в пункте 35 настоящего
      Стандарта. Справедливая стоимость предмета аренды включается арендодателем в чистую стоимость инвестиции
      в аренду на дату предоставления предмета аренды с отнесением указанной стоимости на расчеты с поставщиком
      (в случае договора лизинга) или с одновременным списанием переданного в аренду актива (в иных случаях,
      если предмет аренды признавался в составе активов). Образующаяся при этом разница относится на доходы
      (расходы) периода, в котором признана инвестиция в аренду.
  - path: '35'
    parent_path: null
    heading: Учет у арендодателя
    text: 'В случае если предмет неоперационной (финансовой) аренды перед началом аренды отражался в бухгалтерском
      учете арендодателя в качестве запасов (готовой продукции, товаров), арендодатель на дату предоставления
      предмета аренды:'
  - path: 35.а
    parent_path: '35'
    heading: null
    text: признает выручку в размере справедливой стоимости предмета аренды;
  - path: 35.б
    parent_path: '35'
    heading: null
    text: признает актив в размере чистой стоимости инвестиции в аренду;
  - path: 35.в
    parent_path: '35'
    heading: null
    text: списывает переданные в аренду запасы;
  - path: 35.г
    parent_path: '35'
    heading: null
    text: признает расходы в размере списанной балансовой стоимости запасов за вычетом приведенной негарантированной
      ликвидационной стоимости предмета аренды;
  - path: 35.д
    parent_path: '35'
    heading: null
    text: признает в качестве расходов связанные с договором аренды затраты арендодателя.
  - path: '36'
    parent_path: null
    heading: Учет у арендодателя
    text: Чистая стоимость инвестиции в аренду после даты предоставления предмета аренды увеличивается
      на величину начисляемых процентов и уменьшается на величину фактически полученных арендных платежей.
  - path: '37'
    parent_path: null
    heading: Учет у арендодателя
    text: Проценты, начисляемые по инвестиции в аренду, признаются арендодателем в качестве доходов периода,
      за который они начислены. Для расчета такого процентного дохода чистая стоимость инвестиции в аренду
      на начало периода, за который рассчитывается доход, умножается на процентную ставку за такой период,
      определенную в соответствии с пунктом 33 Настоящего Стандарта.
  - path: '38'
    parent_path: null
    heading: Учет у арендодателя
    text: Чистая стоимость инвестиции в аренду проверяется на обесценение в соответствии с Международным
      стандартом финансовой отчетности (IFRS) 9 «Финансовые инструменты» в редакции 2014 года [2] .
  - path: '39'
    parent_path: null
    heading: Учет у арендодателя
    text: Изменение чистой стоимости инвестиции в аренду в связи с изменением оценки негарантированной
      ликвидационной стоимости предмета аренды учитывается как изменение оценочных значений.
  - path: '40'
    parent_path: null
    heading: Учет у арендодателя
    text: При возврате предмета неоперационной (финансовой) аренды арендодателю такой предмет принимается
      к бухгалтерскому учету в качестве актива определенного вида исходя из соответствующих условий признания
      с одновременным списанием оставшейся чистой стоимости инвестиции в аренду.
  - path: '41'
    parent_path: null
    heading: Учет у арендодателя
    text: В случае классификации объектов учета аренды в качестве объектов учета операционной аренды арендодатель
      не изменяет прежний принятый порядок учета актива в связи с его передачей в аренду, за исключением
      изменения оценочных значений.
  - path: '42'
    parent_path: null
    heading: Учет у арендодателя
    text: Доходы по операционной аренде признаются равномерно или на основе другого систематического подхода,
      отражающего характер использования арендатором экономических выгод от предмета аренды.
  - path: '43'
    parent_path: null
    heading: Раскрытие информации
    text: В бухгалтерской (финансовой) отчетности организации раскрывается информация об объектах учета
      аренды, которая оказывает или способна оказать влияние на финансовое положение организации, финансовые
      результаты ее деятельности и движение денежных средств. Указанная информация раскрывается в табличной
      форме, за исключением случаев, когда другая форма раскрытия в большей степени соответствует виду
      раскрываемой информации.
  - path: '44'
    parent_path: null
    heading: Раскрытие информации
    text: Данные об активах и обязательствах, являющихся объектами учета аренды, представляются в бухгалтерской
      (финансовой) отчетности развернуто и не подлежат взаимоисключению (взаимозачету).
  - path: '45'
    parent_path: null
    heading: Раскрытие информации
    text: 'В бухгалтерской (финансовой) отчетности организации подлежит раскрытию с учетом существенности:'
  - path: 45.а
    parent_path: '45'
    heading: null
    text: характер деятельности организации, связанной с договорами аренды;
  - path: 45.б
    parent_path: '45'
    heading: null
    text: проценты, начисленные на задолженность по арендным платежам;
  - path: 45.в
    parent_path: '45'
    heading: null
    text: основание и порядок расчета процентной ставки;
  - path: 45.г
    parent_path: '45'
    heading: null
    text: допущения, использованные при определении переменных арендных платежей;
  - path: 45.д
    parent_path: '45'
    heading: null
    text: доходы и расходы, относящиеся к переменным платежам, которые не учитываются при оценке задолженности
      по аренде;
  - path: 45.е
    parent_path: '45'
    heading: null
    text: затраты, связанные с произведенными улучшениями предмета аренды, и порядок их компенсации;
  - path: 45.ж
    parent_path: '45'
    heading: null
    text: потенциальные денежные потоки, обусловленные договором аренды до даты предоставления предмета
      аренды;
  - path: 45.з
    parent_path: '45'
    heading: null
    text: ограничения использования предмета аренды, обусловленные договором аренды (в частности, необходимость
      соответствия определенным финансовым показателям);
  - path: 45.и
    parent_path: '45'
    heading: null
    text: иная информация о влиянии договоров аренды на финансовое положение организации, финансовые результаты
      ее деятельности и движение денежных средств, необходимая пользователям бухгалтерской (финансовой)
      отчетности для принятия экономических решений.
  - path: '46'
    parent_path: null
    heading: Раскрытие информации
    text: 'В бухгалтерской (финансовой) отчетности арендатора помимо предусмотренного пунктом 45 настоящего
      Стандарта подлежит раскрытию с учетом существенности:'
  - path: 46.а
    parent_path: '46'
    heading: null
    text: факт использования арендатором права, предусмотренного пунктом 11 настоящего Стандарта, с описанием
      характера договоров аренды, в отношении которых он применяется;
  - path: 46.б
    parent_path: '46'
    heading: null
    text: в отношении права пользования активом - информация, подлежащая раскрытию в отношении соответствующих
      предмету аренды активов (основных средств, инвестиционной недвижимости);
  - path: 46.в
    parent_path: '46'
    heading: null
    text: расходы и будущие арендные платежи арендатора в случае использования арендатором возможности,
      предусмотренной пунктом 11 настоящего Стандарта, с обособленным раскрытием расходов и будущих арендных
      платежей, относящихся к договорам аренды со сроком аренды не более 12 месяцев;
  - path: 46.г
    parent_path: '46'
    heading: null
    text: затраты арендатора, понесенные в связи с поступлением предмета аренды и приведением его в состояние,
      пригодное для использования в запланированных целях;
  - path: 46.д
    parent_path: '46'
    heading: null
    text: информация о пересмотре фактической стоимости и обязательства по аренде.
  - path: '47'
    parent_path: null
    heading: Раскрытие информации
    text: 'В бухгалтерской (финансовой) отчетности арендодателя помимо предусмотренного пунктом 45 настоящего
      Стандарта подлежит раскрытию с учетом существенности:'
  - path: 47.а
    parent_path: '47'
    heading: null
    text: сверка валовой и чистой стоимости инвестиции в неоперационную (финансовую) аренду;
  - path: 47.б
    parent_path: '47'
    heading: null
    text: информация о значительных изменениях чистой стоимости инвестиции в неоперационную (финансовую)
      аренду;
  - path: 47.в
    parent_path: '47'
    heading: null
    text: характер и порядок расчета негарантированной ликвидационной стоимости предмета аренды;
  - path: 47.г
    parent_path: '47'
    heading: null
    text: потенциальные денежные потоки, обусловленные гарантиями выкупа предмета аренды по окончании
      срока аренды;
  - path: 47.д
    parent_path: '47'
    heading: null
    text: распределение, причитающихся арендодателю арендных платежей по срокам погашения с отражением
      номинальных сумм арендных платежей для первых пяти лет отдельно по каждому году, для оставшегося
      периода - в общей сумме;
  - path: 47.е
    parent_path: '47'
    heading: null
    text: доходы и расходы от выбытия предмета аренды;
  - path: 47.ж
    parent_path: '47'
    heading: null
    text: общая сумма дохода по операционной аренде с выделением дохода, относящегося к переменным арендным
      платежам;
  - path: 47.з
    parent_path: '47'
    heading: null
    text: порядок управления рисками, связанными с правами на предмет аренды.
  - path: '48'
    parent_path: null
    heading: Переходные положения
    text: Организация применяет настоящий Стандарт, начиная с бухгалтерской (финансовой) отчетности за
      2022 год. Организация может принять решение о применении настоящего Стандарта до указанного срока.
      Такое решение подлежит раскрытию в бухгалтерской (финансовой) отчетности организации.
  - path: '49'
    parent_path: null
    heading: Переходные положения
    text: Последствия изменения учетной политики в связи с началом применения настоящего Стандарта отражаются
      ретроспективно, если иное не установлено пунктами 50 - 52 настоящего Стандарта.
  - path: '50'
    parent_path: null
    heading: Переходные положения
    text: Вместо ретроспективного пересчета, предусмотренного пунктом 49 настоящего Стандарта, арендатор
      может по каждому договору аренды единовременно признать на конец года, предшествующего году, начиная
      с которого применяется настоящий Стандарт, право пользования активом и обязательство по аренде с
      отнесением разницы на нераспределенную прибыль. При этом ретроспективное влияние на какие-либо другие
      объекты бухгалтерского учета не признается, сравнительные данные за год, предшествующий году, начиная
      с которого применяется настоящий стандарт, не пересчитываются. В целях применения настоящего пункта
      стоимость права пользования активом принимается равной его справедливой стоимости, а стоимость обязательства
      по аренде - приведенной стоимости остающихся не уплаченными арендных платежей, дисконтированных
      по ставке, по которой арендатор привлекал или мог бы привлечь заемные средства на сопоставимых с
      договором аренды условиях.
  - path: '51'
    parent_path: null
    heading: Переходные положения
    text: Организация может не применять настоящий Стандарт в отношении договоров аренды, исполнение которых
      истекает до конца года, начиная с отчетности за который применяется настоящий Стандарт.
  - path: '52'
    parent_path: null
    heading: Переходные положения
    text: Организация, которая вправе применять упрощенные способы учета, может принять решение о применении
      настоящего Стандарта только в отношении договоров аренды, исполнение которых начинается с 1 января
      2022 года.
  - path: '53'
    parent_path: null
    heading: Переходные положения
    text: Организация раскрывает примененный ею порядок изменения учетной политики в связи с началом применения
      настоящего Стандарта в своей бухгалтерской (финансовой) отчетности, начиная с которой применяется
      настоящий Стандарт.
