year: 2006
title: Учет активов и обязательств, стоимость которых выражена в иностранной валюте
order_date: 2006-11-27
order_no: 154н
effective_from: &id001 2007-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает особенности формирования в бухгалтерском учете и бухгалтерской
      отчетности информации об активах и обязательствах, стоимость которых выражена в иностранной валюте,
      в том числе подлежащих оплате в рублях, организациями, являющимися юридическими лицами по законодательству
      Российской Федерации (за исключением кредитных организаций и государственных (муниципальных) учреждений).
      (в ред. приказа Минфина России от 25.10.2010 N 132н)
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: 'Настоящее Положение не применяется: при пересчете показателей бухгалтерской отчетности, составленной
      в рублях, в иностранные валюты в случаях требования таких пересчетов учредительными документами,
      при заключении кредитных договоров с иностранными юридическими лицами и т.п. (в ред. приказа Минфина
      России от 09.11.2017 № 180н)'
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: 'Для целей настоящего Положения указанные ниже понятия означают следующее: деятельность за пределами
      Российской Федерации - деятельность, осуществляемая организацией, являющейся юридическим лицом по
      законодательству Российской Федерации, за пределами Российской Федерации через представительство,
      филиал; дата совершения операции в иностранной валюте - день возникновения у организации права в
      соответствии с законодательством Российской Федерации или договором принять к бухгалтерскому учету
      активы и обязательства, которые являются результатом этой операции; курсовая разница - разница между
      рублевой оценкой актива или обязательства, стоимость которых выражена в иностранной валюте, на дату
      исполнения обязательств по оплате или отчетную дату данного отчетного периода, и рублевой оценкой
      этого же актива или обязательства на дату принятия его к бухгалтерскому учету в отчетном периоде
      или отчетную дату предыдущего отчетного периода. II. Пересчет выраженной в иностранной валюте стоимости
      активов и обязательств в рубли'
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: Стоимость активов и обязательств (денежных знаков в кассе организации, средств на банковских
      счетах (банковских вкладах), денежных и платежных документов, финансовых вложений, средств в расчетах,
      включая по заемным обязательствам, с юридическими и физическими лицами, вложений во внеоборотные
      активы (основные средства, нематериальные активы, др.), материально-производственных запасов, а
      также других активов и обязательств организации), выраженная в иностранной валюте, для отражения
      в бухгалтерском учете и бухгалтерской отчетности подлежит пересчету в рубли.
  - path: '5'
    parent_path: null
    heading: Общие положения
    text: Пересчет стоимости актива или обязательства, выраженной в иностранной валюте, в рубли производится
      по официальному курсу этой иностранной валюты к рублю, устанавливаемому Центральным банком Российской
      Федерации, а в случае отсутствия такого курса – по кросс-курсу соответствующей валюты, рассчитанному
      исходя из курсов иностранных валют, установленных Центральным банком Российской Федерации. В случае
      если для пересчета выраженной в иностранной валюте стоимости актива или обязательства, подлежащей
      оплате в рублях, законом или соглашением сторон установлен иной курс, то пересчет производится по
      такому курсу. (в ред. приказа Минфина России от 09.11.2017 № 180н)
  - path: '6'
    parent_path: null
    heading: Общие положения
    text: Для целей бухгалтерского учета указанный пересчет в рубли производится по курсу, действующему
      на дату совершения операции в иностранной валюте. Даты совершения отдельных операций в иностранной
      валюте для целей бухгалтерского учета приведены в приложении к настоящему Положению. При несущественном
      изменении официального курса иностранной валюты к рублю, устанавливаемого Центральным банком Российской
      Федерации, пересчет в рубли, связанный с совершением большого числа однородных операций в такой
      иностранной валюте, может производиться по среднему курсу, исчисленному за месяц или более короткий
      период. ( в ред. приказа Минфина России от 25.12.2007 N 147н)
  - path: '7'
    parent_path: null
    heading: Общие положения
    text: Пересчет стоимости денежных знаков в кассе организации, средств на банковских счетах (банковских
      вкладах), денежных и платежных документов, ценных бумаг (за исключением акций), средств в расчетах,
      включая по заемным обязательствам с юридическими и физическими лицами (за исключением средств полученных
      и выданных авансов и предварительной оплаты, задатков), не предъявленной к оплате начисленной выручки,
      превышающей сумму полученного аванса (предварительной оплаты), выраженной в иностранной валюте,
      в рубли должен производиться на дату совершения операции в иностранной валюте, а также на отчетную
      дату. Пересчет стоимости денежных знаков в кассе организации и средств на банковских счетах (банковских
      вкладах), выраженной в иностранной валюте, может производиться, кроме того, по мере изменения курса.
      ( в ред. приказов Минфина России от 25.12.2007 № 147н, от 09.11.2017 № 180н)
  - path: '8'
    parent_path: null
    heading: Общие положения
    text: Для составления бухгалтерской отчетности пересчет стоимости перечисленных в пункте 7 настоящего
      Положения активов и обязательств в рубли производится по курсу, действующему на отчетную дату.
  - path: '9'
    parent_path: null
    heading: Общие положения
    text: Для составления бухгалтерской отчетности стоимость вложений во внеоборотные активы (основные
      средства, нематериальные активы, др.), материально-производственных запасов и других активов, не
      перечисленных в пункте 7 настоящего Положения, а также средства полученных и выданных авансов и
      предварительной оплаты, задатков принимаются в оценке в рублях по курсу, действовавшему на дату
      совершения операции в иностранной валюте, в результате которой указанные активы и обязательства
      принимаются к бухгалтерскому учету. Активы и расходы, которые оплачены организацией в предварительном
      порядке либо в счет оплаты которых организация перечислила аванс или задаток, признаются в бухгалтерском
      учете этой организации в оценке в рублях по курсу, действовавшему на дату пересчета в рубли средств
      выданного аванса, задатка, предварительной оплаты (в части, приходящейся на аванс, задаток, предварительную
      оплату). Доходы организации при условии получения аванса, задатка, предварительной оплаты признаются
      в бухгалтерском учете этой организации в оценке в рублях по курсу, действовавшему на дату пересчета
      в рубли средств полученного аванса, задатка, предварительной оплаты (в части, приходящейся на аванс,
      задаток, предварительную оплату). ( в ред. приказа Минфина России от 25.12.2007 № 147н)
  - path: '10'
    parent_path: null
    heading: Общие положения
    text: Пересчет стоимости вложений во внеоборотные активы, активов, перечисленных в пункте 9 настоящего
      Положения, а также средств полученных и выданных авансов, предварительной оплаты, задатков после
      принятия их к бухгалтерскому учету в связи с изменением курса не производится. ( в ред. приказа
      Минфина России от 25.12.2007 N 147н)
  - path: '11'
    parent_path: null
    heading: Учет курсовой разницы
    text: 'В бухгалтерском учете и бухгалтерской отчетности отражается курсовая разница, возникающая по:
      операциям по полному или частичному погашению дебиторской или кредиторской задолженности, выраженной
      в иностранной валюте, если курс на дату исполнения обязательств по оплате отличался от курса на
      дату принятия этой дебиторской или кредиторской задолженности к бухгалтерскому учету в отчетном
      периоде либо от курса на отчетную дату, в котором эта дебиторская или кредиторская задолженность
      была пересчитана в последний раз; операциям по пересчету стоимости активов и обязательств, перечисленных
      в пункте 7 настоящего Положения.'
  - path: '12'
    parent_path: null
    heading: Учет курсовой разницы
    text: Курсовая разница отражается в бухгалтерском учете и бухгалтерской отчетности в том отчетном
      периоде, к которому относится дата исполнения обязательств по оплате или за который составлена бухгалтерская
      отчетность.
  - path: '13'
    parent_path: null
    heading: Учет курсовой разницы
    text: Курсовая разница подлежит зачислению на финансовые результаты организации как прочие доходы
      или прочие расходы (кроме случаев, предусмотренных пунктами 14, 14.1 и 19 настоящего Положения или
      иными нормативными правовыми актами по бухгалтерскому учету). (в ред. приказов Минфина России от
      25.12.2007 № 147н, от 24.12.2010 № 186н, от 09.11.2017 № 180н)
  - path: '14'
    parent_path: null
    heading: Учет курсовой разницы
    text: Курсовая разница, связанная с расчетами с учредителями по вкладам, в том числе в уставный (складочный)
      капитал организации, подлежит зачислению в добавочный капитал этой организации.
  - path: '14.1'
    parent_path: null
    heading: Учет курсовой разницы
    text: В случае использования организацией активов и обязательств, стоимость которых выражена в иностранной
      валюте, с целью хеджирования валютных рисков организация может учитывать курсовые разницы, связанные
      с такими активами и обязательствами, в порядке, определенном Международными стандартами финансовой
      отчетности, введенными в действие на территории Российской Федерации в соответствии с Положением
      о признании Международных стандартов финансовой отчетности и Разъяснений Международных стандартов
      финансовой отчетности для применения на территории Российской Федерации, утвержденным постановлением
      Правительства Российской Федерации от 25 февраля 2011 г. № 107 (Собрание законодательства Российской
      Федерации, 2011, № 10, ст. 1385; 2013, № 36, ст. 4578). (пункт 14.1 введен приказом Минфина России
      от 09.11.2017 № 180н) IV. Учет активов и обязательств, используемых организацией для ведения деятельности
      за пределами Российской Федерации
  - path: '15'
    parent_path: null
    heading: Учет курсовой разницы
    text: Для составления бухгалтерской отчетности выраженная в иностранной валюте стоимость активов и
      обязательств, используемых организацией для ведения деятельности за пределами Российской Федерации,
      подлежит пересчету в рубли. Указанный пересчет в рубли производится по официальному курсу этой иностранной
      валюты к рублю, устанавливаемому Центральным банком Российской Федерации, за исключением случаев,
      перечисленных в пункте 18 настоящего Положения.
  - path: '16'
    parent_path: null
    heading: Учет курсовой разницы
    text: Пересчет выраженной в иностранной валюте стоимости активов и обязательств, используемых организацией
      для ведения деятельности за пределами Российской Федерации, в рубли производится по официальному
      курсу этой иностранной валюты к рублю, устанавливаемому Центральным банком Российской Федерации,
      действующему на отчетную дату. (в ред. приказа Минфина России от 09.11.2017 № 180н)
  - path: '17'
    parent_path: null
    heading: Учет курсовой разницы
    text: Утратил силу. ( приказ Минфина России от 09.11.2017 № 180н)
  - path: '18'
    parent_path: null
    heading: Учет курсовой разницы
    text: Пересчет выраженных в иностранной валюте доходов и расходов, формирующих финансовые результаты
      от ведения организацией деятельности за пределами Российской Федерации, в рубли производится с использованием
      официального курса этой иностранной валюты к рублю, устанавливаемого Центральным банком Российской
      Федерации, действовавшего на соответствующую дату совершения операции в иностранной валюте, либо
      с использованием средней величины курсов, исчисленной как результат от деления суммы произведений
      величин официальных курсов этой иностранной валюты к рублю, устанавливаемых Центральным банком Российской
      Федерации, и дней их действия в отчетном периоде на количество дней в отчетном периоде.
  - path: '19'
    parent_path: null
    heading: Учет курсовой разницы
    text: Разница, возникающая в результате пересчета выраженной в иностранной валюте стоимости активов
      и обязательств организации, используемых для ведения деятельности за пределами Российской Федерации,
      в рубли, отражается в бухгалтерском учете отчетного периода, за который составляется бухгалтерская
      отчетность организации. Указанная разница подлежит зачислению в добавочный капитал организации.
      При прекращении организацией деятельности за пределами Российской Федерации (полном или частичном)
      часть добавочного капитала, соответствующая сумме курсовых разниц, относящихся к прекращаемой деятельности,
      присоединяется к финансовому результату организации в качестве прочих доходов или прочих расходов.
      (в ред. приказа Минфина России от 24.12.2010 № 186н)
  - path: '19.1'
    parent_path: null
    heading: Учет курсовой разницы
    text: Порядок учета, предусмотренный пунктами 15-19 настоящего Положения, может применяться также
      в отношении сегмента, в котором основные операции (приобретение и продажа товаров, работ, услуг,
      получение кредитов и займов, предоставление займов, иное) осуществляются преимущественно в иностранной
      валюте, независимо от осуществления таких операций за пределами или в пределах Российской Федерации.
      (пункт 19.1введен приказом Минфина России от 09.11.2017 № 180н) V. Порядок формирования учетной
      и отчетной информации об операциях в иностранной валюте
  - path: '20'
    parent_path: null
    heading: Учет курсовой разницы
    text: Записи в регистрах бухгалтерского учета по счетам учета активов и обязательств, стоимость которых
      выражена в иностранной валюте, производятся организацией, осуществляющей деятельность как на территории
      Российской Федерации, так и за ее пределами, в рублях. Указанные записи по активам и обязательствам,
      перечисленным в пункте 7 настоящего Положения, одновременно производятся в валюте расчетов и платежей.
      Составление бухгалтерской отчетности производится в рублях. В случаях когда законодательство или
      правила страны - места ведения организацией деятельности за пределами Российской Федерации требуют
      составления бухгалтерской отчетности в иной валюте, то бухгалтерская отчетность составляется также
      в этой иностранной валюте.
  - path: '21'
    parent_path: null
    heading: Учет курсовой разницы
    text: Курсовые разницы отражаются в бухгалтерском учете отдельно от других видов доходов и расходов
      организации, в том числе финансовых результатов от операций с иностранной валютой.
  - path: '22'
    parent_path: null
    heading: Учет курсовой разницы
    text: 'В бухгалтерской отчетности раскрывается: величина курсовых разниц, образовавшихся по операциям
      пересчета выраженной в иностранной валюте стоимости активов и обязательств, подлежащих оплате в
      иностранной валюте; величина курсовых разниц, образовавшихся по операциям пересчета выраженной в
      иностранной валюте стоимости активов и обязательств, подлежащих оплате в рублях; величина курсовых
      разниц, зачисленных на счета бухгалтерского учета, отличные от счета учета финансовых результатов
      организации; официальный курс иностранной валюты к рублю, установленный Центральным банком Российской
      Федерации, на отчетную дату. В случае если для пересчета выраженной в иностранной валюте стоимости
      активов или обязательств, подлежащей оплате в рублях, законом или соглашением сторон установлен
      иной курс, то в бухгалтерской отчетности раскрывается такой курс.'