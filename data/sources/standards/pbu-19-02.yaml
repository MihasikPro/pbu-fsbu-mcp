id: pbu-19-02
kind: ПБУ
number: 19/02
year: 2002
title: Учет финансовых вложений
order_date: 2002-12-10
order_no: 126н
effective_from: &id001 2003-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает правила формирования в бухгалтерском учете и бухгалтерской
      отчетности информации о финансовых вложениях организации. Под организацией в дальнейшем понимается
      юридическое лицо по законодательству Российской Федерации (за исключением кредитных организаций
      и государственных (муниципальных) учреждений). (в ред. приказа Минфина России от 25.10.2010 № 132н)
      Настоящее Положение применяется при установлении особенностей учета финансовых вложений для профессиональных
      участников рынка ценных бумаг, страховых организаций, негосударственных пенсионных фондов.
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: 'Для целей настоящего Положения для принятия к бухгалтерскому учету активов в качестве финансовых
      вложений необходимо единовременное выполнение следующих условий: наличие надлежаще оформленных документов,
      подтверждающих существование права у организации на финансовые вложения и на получение денежных
      средств или других активов, вытекающее из этого права; переход к организации финансовых рисков,
      связанных с финансовыми вложениями (риск изменения цены, риск неплатежеспособности должника, риск
      ликвидности и др.); способность приносить организации экономические выгоды (доход) в будущем в форме
      процентов, дивидендов либо прироста их стоимости (в виде разницы между ценой продажи (погашения)
      финансового вложения и его покупной стоимостью в результате его обмена, использования при погашении
      обязательств организации, увеличения текущей рыночной стоимости и т.п.).'
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: 'К финансовым вложениям организации относятся: государственные и муниципальные ценные бумаги,
      ценные бумаги других организаций, в том числе долговые ценные бумаги, в которых дата и стоимость
      погашения определена (облигации, векселя); вклады в уставные (складочные) капиталы других организаций
      (в том числе дочерних и зависимых хозяйственных обществ); предоставленные другим организациям займы,
      депозитные вклады в кредитных организациях, дебиторская задолженность, приобретенная на основании
      уступки права требования, и пр. Для целей настоящего Положения в составе финансовых вложений учитываются
      также вклады организации-товарища по договору простого товарищества. К финансовым вложениям организации
      не относятся: собственные акции, выкупленные акционерным обществом у акционеров для последующей
      перепродажи или аннулирования; векселя, выданные организацией-векселедателем организации-продавцу
      при расчетах за проданные товары, продукцию, выполненные работы, оказанные услуги; вложения организации
      в недвижимое и иное имущество, имеющее материально-вещественную форму, предоставляемые организацией
      за плату во временное пользование (временное владение и пользование) с целью получения дохода; драгоценные
      металлы, ювелирные изделия, произведения искусства и иные аналогичные ценности, приобретенные не
      для осуществления обычных видов деятельности.'
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: Активы, имеющие материально-вещественную форму, такие как основные средства, материально-производственные
      запасы, а также нематериальные активы не являются финансовыми вложениями.
  - path: '5'
    parent_path: null
    heading: Общие положения
    text: Единица бухгалтерского учета финансовых вложений выбирается организацией самостоятельно таким
      образом, чтобы обеспечить формирование полной и достоверной информации об этих вложениях, а также
      надлежащий контроль за их наличием и движением. В зависимости от характера финансовых вложений,
      порядка их приобретения и использования единицей финансовых вложений может быть серия, партия и
      т.п. однородная совокупность финансовых вложений.
  - path: '6'
    parent_path: null
    heading: Общие положения
    text: 'Организация ведет аналитический учет финансовых вложений таким образом, чтобы обеспечить информацию
      по единицам бухгалтерского учета финансовых вложений и организациям, в которые осуществлены эти
      вложения (эмитентам ценных бумаг, другим организациям, участником которых является организация,
      организациям-заемщикам и т.п.). По принятым к бухгалтерскому учету государственным ценным бумагам
      и ценным бумагам других организаций в аналитическом учете должна быть сформирована как минимум следующая
      информация: наименование эмитента и название ценной бумаги, номер, серия и т.д., номинальная цена,
      цена покупки, расходы, связанные с приобретением ценных бумаг, общее количество, дата покупки, дата
      продажи или иного выбытия, место хранения. Организация может формировать в аналитическом учете дополнительную
      информацию о финансовых вложениях организации, в том числе в разрезе их групп (видов).'
  - path: '7'
    parent_path: null
    heading: Общие положения
    text: Особенности оценки и дополнительные правила раскрытия в бухгалтерской отчетности информации
      о финансовых вложениях в зависимые хозяйственные общества устанавливаются отдельным нормативным
      актом по бухгалтерскому учету.
  - path: '8'
    parent_path: null
    heading: Первоначальная оценка финансовых вложений
    text: Финансовые вложения принимаются к бухгалтерскому учету по первоначальной стоимости.
  - path: '9'
    parent_path: null
    heading: Первоначальная оценка финансовых вложений
    text: 'Первоначальной стоимостью финансовых вложений, приобретенных за плату, признается сумма фактических
      затрат организации на их приобретение, за исключением налога на добавленную стоимость и иных возмещаемых
      налогов (кроме случаев, предусмотренных законодательством Российской Федерации о налогах и сборах).
      Фактическими затратами на приобретение активов в качестве финансовых вложений являются: суммы, уплачиваемые
      в соответствии с договором продавцу; суммы, уплачиваемые организациям и иным лицам за информационные
      и консультационные услуги, связанные с приобретением указанных активов. В случае, если организации
      оказаны информационные и консультационные услуги, связанные с принятием решения о приобретении финансовых
      вложений, и организация не принимает решения о таком приобретении, стоимость указанных услуг относится
      на финансовые результаты коммерческой организации (в составе прочих расходов) или увеличение расходов
      некоммерческой организации того отчетного периода, когда было принято решение не приобретать финансовые
      вложения; (в ред. приказа Минфина России от 18.09.2006 № 116н) вознаграждения, уплачиваемые посреднической
      организации или иному лицу, через которое приобретены активы в качестве финансовых вложений; иные
      затраты, непосредственно связанные с приобретением активов в качестве финансовых вложений. При приобретении
      финансовых вложений за счет заемных средств затраты по полученным кредитам и займам учитываются
      в соответствии с Положением по бухгалтерскому учету «Расходы организации» ПБУ 10/99, утвержденным
      приказом Министерства финансов Российской Федерации от 6 мая 1999 г. № 33н (зарегистрирован в Министерстве
      юстиции Российской Федерации 31 мая 1999 г., регистрационный № 1790), и Положением по бухгалтерскому
      учету «Учет займов и кредитов и затрат по их обслуживанию» ПБУ 15/01, утвержденным приказом Министерства
      финансов Российской Федерации от 2 августа 2001 г. № 60н (согласно письму Министерства юстиции Российской
      Федерации от 7 сентября 2001 г. № 07/8985-ЮД приказ не нуждается в государственной регистрации).
      Не включаются в фактические затраты на приобретение финансовых вложений общехозяйственные и иные
      аналогичные расходы, кроме случаев, когда они непосредственно связаны с приобретением финансовых
      вложений.'
  - path: '10'
    parent_path: null
    heading: Первоначальная оценка финансовых вложений
    text: Исключен - приказ Минфина России от 27.11.2006 № 156н.
  - path: '11'
    parent_path: null
    heading: Первоначальная оценка финансовых вложений
    text: В случае несущественности величины затрат (кроме сумм, уплачиваемых в соответствии с договором
      продавцу) на приобретение таких финансовых вложений, как ценные бумаги, по сравнению с суммой, уплачиваемой
      в соответствии с договором продавцу, такие затраты организация вправе признавать прочими расходами
      организации в том отчетном периоде, в котором были приняты к бухгалтерскому учету указанные ценные
      бумаги. (в ред. приказа Минфина России от 18.09.2006 № 116н)
  - path: '12'
    parent_path: null
    heading: Первоначальная оценка финансовых вложений
    text: Первоначальной стоимостью финансовых вложений, внесенных в счет вклада в уставный (складочный)
      капитал организации, признается их денежная оценка, согласованная учредителями (участниками) организации,
      если иное не предусмотрено законодательством Российской Федерации.
  - path: '13'
    parent_path: null
    heading: Первоначальная оценка финансовых вложений
    text: 'Первоначальной стоимостью финансовых вложений, полученных организацией безвозмездно, таких
      как ценные бумаги, признается: их текущая рыночная стоимость на дату принятия к бухгалтерскому учету.
      Для целей настоящего Положения под текущей рыночной стоимостью ценных бумаг понимается их рыночная
      цена, рассчитанная в установленном порядке организатором торговли на рынке ценных бумаг; сумма денежных
      средств, которая может быть получена в результате продажи полученных ценных бумаг на дату их принятия
      к бухгалтерскому учету, - для ценных бумаг, по которым организатором торговли на рынке ценных бумаг
      не рассчитывается рыночная цена.'
  - path: '14'
    parent_path: null
    heading: Первоначальная оценка финансовых вложений
    text: Первоначальной стоимостью финансовых вложений, приобретенных по договорам, предусматривающим
      исполнение обязательств (оплату) неденежными средствами, признается стоимость активов, переданных
      или подлежащих передаче организацией. Стоимость активов, переданных или подлежащих передаче организацией,
      устанавливается исходя из цены, по которой в сравнимых обстоятельствах обычно организация определяет
      стоимость аналогичных активов. При невозможности установить стоимость активов, переданных или подлежащих
      передаче организацией, стоимость финансовых вложений, полученных организацией по договорам, предусматривающим
      исполнение обязательств (оплату) неденежными средствами, определяется исходя из стоимости, по которой
      в сравнимых обстоятельствах приобретаются аналогичные финансовые вложения.
  - path: '15'
    parent_path: null
    heading: Первоначальная оценка финансовых вложений
    text: Первоначальной стоимостью финансовых вложений, внесенных в счет вклада организации-товарища
      по договору простого товарищества, признается их денежная оценка, согласованная товарищами в договоре
      простого товарищества.
  - path: '16'
    parent_path: null
    heading: Первоначальная оценка финансовых вложений
    text: Исключен - приказ Минфина России от 27.11.2006 № 156н.
  - path: '17'
    parent_path: null
    heading: Первоначальная оценка финансовых вложений
    text: Ценные бумаги, не принадлежащие организации на праве собственности, хозяйственного ведения или
      оперативного управления, но находящиеся в ее пользовании или распоряжении в соответствии с условиями
      договора, принимаются к бухгалтерскому учету в оценке, предусмотренной в договоре.
  - path: '18'
    parent_path: null
    heading: Последующая оценка финансовых вложений
    text: Первоначальная стоимость финансовых вложений, по которой они приняты к бухгалтерскому учету,
      может изменяться в случаях, установленных законодательством и настоящим Положением.
  - path: '19'
    parent_path: null
    heading: Последующая оценка финансовых вложений
    text: 'Для целей последующей оценки финансовые вложения подразделяются на две группы: финансовые вложения,
      по которым можно определить текущую рыночную стоимость в установленном настоящим Положением порядке,
      и финансовые вложения, по которым их текущая рыночная стоимость не определяется. Организации, которые
      вправе применять упрощенные способы ведения бухгалтерского учета, включая упрощенную бухгалтерскую
      (финансовую) отчетность, могут осуществлять последующую оценку всех финансовых вложений в порядке,
      установленном настоящим Положением для финансовых вложений, по которым их текущая рыночная стоимость
      не определяется. При этом указанные организации могут принять решение не отражать обесценение финансовых
      вложений в бухгалтерском учете в случаях, когда расчет величины такого обесценения затруднителен.
      (в ред. приказов Минфина России от 08.11.2010 № 144н, от 27.04.2012 № 55н, от 06.04.2015 № 57н)'
  - path: '20'
    parent_path: null
    heading: Последующая оценка финансовых вложений
    text: Финансовые вложения, по которым можно определить в установленном порядке текущую рыночную стоимость,
      отражаются в бухгалтерской отчетности на конец отчетного года по текущей рыночной стоимости путем
      корректировки их оценки на предыдущую отчетную дату. Указанную корректировку организация может производить
      ежемесячно или ежеквартально. Разница между оценкой финансовых вложений по текущей рыночной стоимости
      на отчетную дату и предыдущей оценкой финансовых вложений относится на финансовые результаты у коммерческой
      организации (в составе прочих доходов или расходов) или увеличение доходов или расходов у некоммерческой
      организации в корреспонденции со счетом учета финансовых вложений. (в ред. приказа Минфина России
      от 18.09.2006 № 116н)
  - path: '21'
    parent_path: null
    heading: Последующая оценка финансовых вложений
    text: Финансовые вложения, по которым не определяется текущая рыночная стоимость, подлежат отражению
      в бухгалтерском учете и в бухгалтерской отчетности на отчетную дату по первоначальной стоимости.
  - path: '22'
    parent_path: null
    heading: Последующая оценка финансовых вложений
    text: По долговым ценным бумагам, по которым не определяется текущая рыночная стоимость, организации
      разрешается разницу между первоначальной стоимостью и номинальной стоимостью в течение срока их
      обращения равномерно, по мере причитающегося по ним в соответствии с условиями выпуска дохода, относить
      на финансовые результаты коммерческой организации (в составе прочих доходов или расходов) или уменьшение
      или увеличение расходов некоммерческой организации. (в ред. приказа Минфина России от 18.09.2006
      № 116н)
  - path: '23'
    parent_path: null
    heading: Последующая оценка финансовых вложений
    text: По долговым ценным бумагам и предоставленным займам организация может составлять расчет их оценки
      по дисконтированной стоимости. При этом записи в бухгалтерском учете не производятся. Организация
      должна обеспечить подтверждение обоснованности такого расчета.
  - path: '24'
    parent_path: null
    heading: Последующая оценка финансовых вложений
    text: Финансовые вложения отражаются в бухгалтерском балансе на отчетную дату по стоимости, определенной
      исходя из требований настоящего Положения. В случае, если по объекту финансовых вложений, ранее
      оцениваемому по текущей рыночной стоимости, на отчетную дату текущая рыночная стоимость не определяется,
      такой объект финансовых вложений отражается в бухгалтерской отчетности по стоимости его последней
      оценки.
  - path: '25'
    parent_path: null
    heading: Выбытие финансовых вложений
    text: Выбытие финансовых вложений признается в бухгалтерском учете организации на дату прекращения
      действия условий принятия их к бухгалтерскому учету, приведенных в пункте 2 настоящего Положения.
      (в ред. приказа Минфина России от 06.04.2015 № 57н) Выбытие финансовых вложений имеет место в случаях
      погашения, продажи, безвозмездной передачи, передачи в виде вклада в уставный (складочный) капитал
      других организаций, передачи в счет вклада по договору простого товарищества и пр.
  - path: '26'
    parent_path: null
    heading: Выбытие финансовых вложений
    text: 'При выбытии актива, принятого к бухгалтерскому учету в качестве финансовых вложений, по которому
      не определяется текущая рыночная стоимость, его стоимость определяется исходя из оценки, определяемой
      одним из следующих способов: по первоначальной стоимости каждой единицы бухгалтерского учета финансовых
      вложений; по средней первоначальной стоимости; по первоначальной стоимости первых по времени приобретения
      финансовых вложений (способ ФИФО). Применение одного из указанных способов по группе (виду) финансовых
      вложений производится исходя из допущения последовательности применения учетной политики.'
  - path: '27'
    parent_path: null
    heading: Выбытие финансовых вложений
    text: Вклады в уставные (складочные) капиталы других организаций (за исключением акций акционерных
      обществ), предоставленные другим организациям займы, депозитные вклады в кредитных организациях,
      дебиторская задолженность, приобретенная на основании уступки права требования, оцениваются по первоначальной
      стоимости каждой выбывающей из приведенных единиц бухгалтерского учета финансовых вложений.
  - path: '28'
    parent_path: null
    heading: Выбытие финансовых вложений
    text: Ценные бумаги могут оцениваться организацией при выбытии по средней первоначальной стоимости,
      которая определяется по каждому виду ценных бумаг как частное от деления первоначальной стоимости
      вида ценных бумаг на их количество, складывающихся соответственно из первоначальной стоимости и
      количества остатка на начало месяца и поступивших ценных бумаг в течение данного месяца.
  - path: '29'
    parent_path: null
    heading: Выбытие финансовых вложений
    text: Оценка по первоначальной стоимости первых по времени приобретения финансовых вложений (способ
      ФИФО) основана на допущении, что ценные бумаги списываются в течение месяца и иного периода в последовательности
      их приобретения (поступления), т.е. ценные бумаги, первыми списываемые, должны быть оценены по первоначальной
      стоимости ценных бумаг первых по времени приобретений с учетом первоначальной стоимости ценных бумаг,
      числящихся на начало месяца. При применении этого способа оценка ценных бумаг, находящихся в остатке
      на конец месяца, производится по первоначальной стоимости последних по времени приобретений, а в
      стоимости проданных ценных бумаг учитывается стоимость ранних по времени приобретений.
  - path: '30'
    parent_path: null
    heading: Выбытие финансовых вложений
    text: При выбытии активов, принятых к бухгалтерскому учету в качестве финансовых вложений, по которым
      определяется текущая рыночная стоимость, их стоимость определяется организацией исходя из последней
      оценки.
  - path: '31'
    parent_path: null
    heading: Выбытие финансовых вложений
    text: По каждой группе (виду) финансовых вложений в течение отчетного года применяется один способ
      оценки.
  - path: '32'
    parent_path: null
    heading: Выбытие финансовых вложений
    text: Оценка финансовых вложений на конец отчетного периода производится в зависимости от принятого
      способа оценки финансовых вложений при их выбытии, т.е. по текущей рыночной стоимости, по первоначальной
      стоимости каждой единицы бухгалтерского учета финансовых вложений, по средней первоначальной стоимости,
      по первоначальной стоимости первых по времени приобретения финансовых вложений (способ ФИФО).
  - path: '33'
    parent_path: null
    heading: Выбытие финансовых вложений
    text: Примеры использования способов оценки при выбытии финансовых вложений приведены в приложении
      к настоящему Положению.
  - path: '34'
    parent_path: null
    heading: Доходы и расходы по финансовым вложениям
    text: Доходы по финансовым вложениям признаются доходами от обычных видов деятельности либо прочими
      поступлениями в соответствии с Положением по бухгалтерском учету «Доходы организации» ПБУ 9/99,
      утвержденным приказом Министерства финансов Российской Федерации от 6 мая 1999 г. № 32н (зарегистрирован
      в Министерстве юстиции Российской Федерации 31 мая 1999 г., регистрационный номер 1791).
  - path: '35'
    parent_path: null
    heading: Доходы и расходы по финансовым вложениям
    text: Расходы, связанные с предоставлением организацией другим организациям займов, признаются прочими
      расходами организации. (в ред. приказа Минфина России от 18.09.2006 № 116н)
  - path: '36'
    parent_path: null
    heading: Доходы и расходы по финансовым вложениям
    text: Расходы, связанные с обслуживанием финансовых вложений организации, такие как оплата услуг банка
      и/или депозитария за хранение финансовых вложений, предоставление выписки со счета депо и т.п.,
      признаются прочими расходами организации. (в ред. приказа Минфина России от 18.09.2006 № 116н)
  - path: '37'
    parent_path: null
    heading: Обесценение финансовых вложений
    text: 'Устойчивое существенное снижение стоимости финансовых вложений, по которым не определяется
      их текущая рыночная стоимость, ниже величины экономических выгод, которые организация рассчитывает
      получить от данных финансовых вложений в обычных условиях ее деятельности, признается обесценением
      финансовых вложений. В этом случае на основе расчета организации определяется расчетная стоимость
      финансовых вложений, равная разнице между их стоимостью, по которой они отражены в бухгалтерском
      учете (учетной стоимостью), и суммой такого снижения. Устойчивое снижение стоимости финансовых вложений
      характеризуется одновременным наличием следующих условий: на отчетную дату и на предыдущую отчетную
      дату учетная стоимость существенно выше их расчетной стоимости; в течение отчетного года расчетная
      стоимость финансовых вложений существенно изменялась исключительно в направлении ее уменьшения;
      на отчетную дату отсутствуют свидетельства того, что в будущем возможно существенное повышение расчетной
      стоимости данных финансовых вложений. Примерами ситуаций, в которых может произойти обесценение
      финансовых вложений, являются: появление у организации-эмитента ценных бумаг, имеющихся в собственности
      у организации, либо у ее должника по договору займа признаков банкротства либо объявление его банкротом;
      совершение на рынке ценных бумаг значительного количества сделок с аналогичными ценными бумагами
      по цене существенно ниже их учетной стоимости; отсутствие или существенное снижение поступлений
      от финансовых вложений в виде процентов или дивидендов при высокой вероятности дальнейшего уменьшения
      этих поступлений в будущем и т.д.'
  - path: '38'
    parent_path: null
    heading: Обесценение финансовых вложений
    text: В случае возникновения ситуации, в которой может произойти обесценение финансовых вложений,
      организация должна осуществить проверку наличия условий устойчивого снижения стоимости финансовых
      вложений. Указанная проверка производится по всем финансовым вложениям организации, указанным в
      пункте 37 настоящего Положения, по которым наблюдаются признаки их обесценения. В случае, если проверка
      на обесценение подтверждает устойчивое существенное снижение стоимости финансовых вложений, организация
      образует резерв под обесценение финансовых вложений на величину разницы между учетной стоимостью
      и расчетной стоимостью таких финансовых вложений. Коммерческая организация образует указанный резерв
      за счет финансовых результатов организации (в составе прочих расходов), а некоммерческая - за счет
      увеличения расходов. (в ред. приказа Минфина России от 18.09.2006 № 116н) В бухгалтерской отчетности
      стоимость таких финансовых вложений показывается по учетной стоимости за вычетом суммы образованного
      резерва под их обесценение. Проверка на обесценение финансовых вложений производится не реже одного
      раза в год по состоянию на 31 декабря отчетного года при наличии признаков обесценения. Организация
      имеет право производить указанную проверку на отчетные даты промежуточной бухгалтерской отчетности.
      Организацией должно быть обеспечено подтверждение результатов указанной проверки.
  - path: '39'
    parent_path: null
    heading: Обесценение финансовых вложений
    text: Если по результатам проверки на обесценение финансовых вложений выявляется дальнейшее снижение
      их расчетной стоимости, то сумма ранее созданного резерва под обесценение финансовых вложений корректируется
      в сторону его увеличения и уменьшения финансового результата у коммерческой организации (в составе
      прочих расходов) или увеличения расходов у некоммерческой организации. (в ред. приказа Минфина России
      от 18.09.2006 № 116н) Если по результатам проверки на обесценение финансовых вложений выявляется
      повышение их расчетной стоимости, то сумма ранее созданного резерва под обесценение финансовых вложений
      корректируется в сторону его уменьшения и увеличения финансового результата у коммерческой организации
      (в составе прочих доходов) или уменьшения расходов у некоммерческой организации. (в ред. приказа
      Минфина России от 18.09.2006 № 116н)
  - path: '40'
    parent_path: null
    heading: Обесценение финансовых вложений
    text: Если на основе имеющейся информации организация делает вывод о том, что финансовое вложение
      более не удовлетворяет критериям устойчивого существенного снижения стоимости, а также при выбытии
      финансовых вложений, расчетная стоимость которых вошла в расчет резерва под обесценение финансовых
      вложений, сумма ранее созданного резерва под обесценение по указанным финансовым вложениям относится
      на финансовые результаты у коммерческой организации (в составе прочих доходов) или уменьшение расходов
      у некоммерческой организации в конце года или того отчетного периода, когда произошло выбытие указанных
      финансовых вложений. (в ред. приказа Минфина России от 18.09.2006 № 116н)
  - path: '41'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: В бухгалтерской отчетности финансовые вложения должны представляться с подразделением в зависимости
      от срока обращения (погашения) на краткосрочные и долгосрочные.
  - path: '42'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'В бухгалтерской отчетности подлежит раскрытию с учетом требования существенности, как минимум,
      следующая информация: способы оценки финансовых вложений при их выбытии по группам (видам); последствия
      изменений способов оценки финансовых вложений при их выбытии; стоимость финансовых вложений, по
      которым можно определить текущую рыночную стоимость, и финансовых вложений, по которым текущая рыночная
      стоимость не определяется; разница между текущей рыночной стоимостью на отчетную дату и предыдущей
      оценкой финансовых вложений, по которым определялась текущая рыночная стоимость; по долговым ценным
      бумагам, по которым не определялась текущая рыночная стоимость, - разница между первоначальной стоимостью
      и номинальной стоимостью в течение срока их обращения, начисляемая в соответствии с порядком, установленным
      пунктом 22 настоящего Положения; стоимость и виды ценных бумаг и иных финансовых вложений, обремененных
      залогом; стоимость и виды выбывших ценных бумаг и иных финансовых вложений, переданных другим организациям
      или лицам (кроме продажи); данные о резерве под обесценение финансовых вложений с указанием: вида
      финансовых вложений, величины резерва, созданного в отчетном году, величины резерва, признанного
      прочим доходом отчетного периода; сумм резерва, использованных в отчетном году; (в ред. приказа
      Минфина России от 18.09.2006 № 116н) по долговым ценным бумагам и предоставленным займам - данные
      об их оценке по дисконтированной стоимости, о величине их дисконтированной стоимости, о примененных
      способах дисконтирования (раскрываются в пояснениях к бухгалтерскому балансу и отчету о финансовых
      результатах). (в ред. приказа Минфина России от 06.04.2015 № 57н)'