id: fsbu-9-2025
kind: ФСБУ
number: 9/2025
year: 2025
title: Доходы
order_date: 2025-05-16
order_no: 56н
effective_from: &id001 2027-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящий Стандарт устанавливает требования к формированию информации о доходах экономических
      субъектов (за исключением некоммерческих организаций) в бухгалтерском учете. Некоммерческие организации,
      за исключением организаций бюджетной сферы, формируют информацию о доходах от предпринимательской
      и иной деятельности в бухгалтерском учете с учетом положений настоящего Стандарта.
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Порядок отражения на счетах бухгалтерского учета доходов кредитными организациями, некредитными
      финансовыми организациями, бюро кредитных историй, кредитными рейтинговыми агентствами устанавливается
      нормативными актами Центрального банка Российской Федерации, утверждаемыми Центральным банком Российской
      Федерации в соответствии со статьей 21 Федерального закона от 6 декабря 2011 г. № 402‑ФЗ «О бухгалтерском
      учете» (далее – Федеральный закон «О бухгалтерском учете»).
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: Доходами экономического субъекта признается увеличение экономических выгод в результате поступления
      (увеличения стоимости) активов и (или) погашения (уменьшения величины) обязательств, приводящее
      к увеличению капитала этого экономического субъекта, не связанному с вкладами (взносами) учредителей
      (участников, акционеров, собственников имущества) экономического субъекта.
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: 'Если иное не предусмотрено настоящим Стандартом, доходами экономического субъекта не признаются
      поступления:'
  - path: 4.а
    parent_path: '4'
    heading: null
    text: сумм налога на добавленную стоимость, акцизов и иных аналогичных обязательных платежей;
  - path: 4.б
    parent_path: '4'
    heading: null
    text: активов по договорам комиссии, поручения, агентским договорам в пользу комитента, доверителя,
      принципала, а также в обеспечение комиссионера, поверенного, агента средствами, необходимыми для
      исполнения поручения, и (или) в возмещение сумм, израсходованных на исполнение поручения, отличные
      от вознаграждения комиссионера, поверенного, агента;
  - path: 4.в
    parent_path: '4'
    heading: null
    text: предварительной оплаты продукции, товаров, работ, услуг (далее совместно – продукция), иного
      имущества, прав на результаты интеллектуальной деятельности и средства индивидуализации;
  - path: 4.г
    parent_path: '4'
    heading: null
    text: аванса;
  - path: 4.д
    parent_path: '4'
    heading: null
    text: задатка;
  - path: 4.е
    parent_path: '4'
    heading: null
    text: залога, если договором предусмотрена передача залогодержателю заложенного имущества, прав на
      результаты интеллектуальной деятельности и средства индивидуализации;
  - path: 4.ж
    parent_path: '4'
    heading: null
    text: активов в погашение займа, предоставленного заемщику.
  - path: '5'
    parent_path: null
    heading: Общие положения
    text: Доходы экономического субъекта подразделяются на включаемые и не включаемые в чистую прибыль
      (убыток) этого субъекта.
  - path: '6'
    parent_path: null
    heading: Общие положения
    text: 'Доходы, включаемые в чистую прибыль (убыток), подразделяются на:'
  - path: 6.а
    parent_path: '6'
    heading: null
    text: выручку;
  - path: 6.б
    parent_path: '6'
    heading: null
    text: доходы, отличные от выручки.
  - path: '7'
    parent_path: null
    heading: Общие положения
    text: Положения настоящего Стандарта не применяются, если другими федеральными стандартами бухгалтерского
      учета, принятыми в соответствии с Федеральным законом «О бухгалтерском учете» (далее – федеральные
      стандарты), установлены иные требования к формированию информации о доходах, включаемых в чистую
      прибыль (убыток), в бухгалтерском учете. Случаи, когда доходы экономического субъекта не включаются
      в чистую прибыль (убыток), определяются настоящим Стандартом и другими федеральными стандартами.
      Информация о доходах, не включаемых в чистую прибыль (убыток), формируется в бухгалтерском учете
      в соответствии с другими федеральными стандартами.
  - path: '8'
    parent_path: null
    heading: Общие положения
    text: Бухгалтерский учет доходов от предоставления во временное пользование имущества по договору
      аренды (субаренды), а также иным договорам, положения которых по отдельности или во взаимосвязи
      предусматривают предоставление арендодателем, лизингодателем, правообладателем, иным лицом за плату
      арендатору, лизингополучателю, пользователю, иному лицу имущества во временное пользование (далее
      – договор аренды), ведется в соответствии с требованиями, установленными Федеральным стандартом
      бухгалтерского учета ФСБУ 25/2018 «Бухгалтерский учет аренды», утвержденным приказом Министерства
      финансов Российской Федерации от 16 октября 2018 г. № 208н (зарегистрирован Министерством юстиции
      Российской Федерации 25 декабря 2018 г., регистрационный № 53162).
  - path: '9'
    parent_path: null
    heading: Общие положения
    text: Бухгалтерский учет доходов по договорам страхования ведется в соответствии с Международным стандартом
      финансовой отчетности (IFRS) 17 «Договоры страхования», введенным в действие на территории Российской
      Федерации приказом Министерства финансов Российской Федерации от 20 апреля 2021 г. № 65н (зарегистрирован
      Министерством юстиции Российской Федерации 21 мая 2021 г., регистрационный № 63562).
  - path: '10'
    parent_path: null
    heading: Выручка
    text: 'Для целей бухгалтерского учета доходы от продажи продукции признаются выручкой. В случае, когда
      предметом деятельности экономического субъекта является деятельность, отличная от продажи продукции,
      экономический субъект самостоятельно признает доходы выручкой исходя из требований настоящего Стандарта
      и других федеральных стандартов, предмета и целей своей деятельности, вида дохода (в частности,
      от предоставления за плату прав на результаты интеллектуальной деятельности, от участия в уставных
      капиталах других организаций, от предоставления во временное пользование имущества по договору аренды)
      и условий его получения. В частности, в случае, когда предметом деятельности экономического субъекта
      является:'
  - path: 10.а
    parent_path: '10'
    heading: null
    text: предоставление за плату прав на результаты интеллектуальной деятельности и средства индивидуализации,
      выручкой признаются доходы от данной деятельности (в частности, вознаграждение по лицензионному
      договору за пользование объектами интеллектуальной собственности);
  - path: 10.б
    parent_path: '10'
    heading: null
    text: осуществление финансовых вложений, включая участие в уставных капиталах других организаций,
      выручкой признаются доходы от данной деятельности;
  - path: 10.в
    parent_path: '10'
    heading: null
    text: предоставление во временное пользование имущества по договору аренды, выручкой признаются доходы
      от данной деятельности. Бухгалтерский учет такой выручки ведется в соответствии с пунктом 8 настоящего
      Стандарта.
  - path: 10.заключение
    parent_path: '10'
    heading: null
    text: Доходы, указанные в подпунктах «а» – «в» настоящего пункта, признаются доходами, отличными от
      выручки, когда деятельность, указанная в этих подпунктах, не относится к предмету деятельности экономического
      субъекта.
  - path: '11'
    parent_path: null
    heading: Выручка
    text: 'Информация о выручке формируется в бухгалтерском учете:'
  - path: 11.а
    parent_path: '11'
    heading: null
    text: экономическими субъектами, которые представляют и (или) раскрывают консолидированную финансовую
      отчетность или финансовую отчетность организации, не создающей группу, составленную в соответствии
      с Международными стандартами финансовой отчетности, – в соответствии с Международным стандартом
      финансовой отчетности (IFRS) 15 «Выручка по договорам с покупателями», введенным в действие на территории
      Российской Федерации приказом Министерства финансов Российской Федерации от 27 июня 2016 г. № 98н
      (зарегистрирован Министерством юстиции Российской Федерации 15 июля 2016 г., регистрационный № 42869)
      (далее – МСФО (IFRS) 15);
  - path: 11.б
    parent_path: '11'
    heading: null
    text: экономическими субъектами, отличными от указанных в подпункте «а» настоящего пункта, бухгалтерская
      (финансовая) отчетность которых подлежит обязательному аудиту в соответствии с законодательством
      Российской Федерации, – в соответствии с настоящим Стандартом или в соответствии с МСФО (IFRS) 15
      по решению экономического субъекта;
  - path: 11.в
    parent_path: '11'
    heading: null
    text: экономическими субъектами, отличными от указанных в подпунктах «а» и «б» настоящего пункта,
      – в соответствии с настоящим Стандартом.
  - path: '12'
    parent_path: null
    heading: Выручка
    text: 'Выручка признается в бухгалтерском учете при одновременном выполнении следующих условий:'
  - path: 12.а
    parent_path: '12'
    heading: null
    text: экономический субъект имеет право на получение выручки, вытекающее из договора (контракта),
      заключенного с покупателем, заказчиком, иным лицом (далее совместно – контрагент) в рамках обычной
      деятельности экономического субъекта, или подтвержденное иным образом (далее – договор). Договор
      имеет коммерческое содержание, то есть ожидается, что его исполнение приведет к изменению распределения
      рисков, связанных с исполнением договора, денежных потоков сторон договора в будущем. В договоре
      определены права сторон в отношении продукции, передаваемой экономическим субъектом по договору,
      и условия ее оплаты;
  - path: 12.б
    parent_path: '12'
    heading: null
    text: к контрагенту перешел контроль над продукцией, переданной экономическим субъектом, то есть контрагент
      может определять способ использования переданной ему продукции, получать экономические выгоды от
      нее, ограничивать права других лиц определять способ использования продукции и получать экономические
      выгоды от нее;
  - path: 12.в
    parent_path: '12'
    heading: null
    text: имеется уверенность в том, что в результате передачи продукции экономическим субъектом контрагенту
      произойдет увеличение экономических выгод экономического субъекта. Такая уверенность имеется в случае,
      когда экономический субъект получил в оплату актив либо отсутствует неопределенность в отношении
      получения актива;
  - path: 12.г
    parent_path: '12'
    heading: null
    text: величина выручки может быть определена;
  - path: 12.д
    parent_path: '12'
    heading: null
    text: величина расходов, которые произведены или будут произведены в связи с исполнением обязанности
      передать продукцию контрагенту, может быть определена.
  - path: '13'
    parent_path: null
    heading: Выручка
    text: Для признания выручки от предоставления за плату прав на результаты интеллектуальной деятельности
      и средства индивидуализации в бухгалтерском учете должны быть одновременно выполнены условия, предусмотренные
      подпунктами «а» – «г» пункта 12 настоящего Стандарта, с учетом условий получения такой выручки.
  - path: '14'
    parent_path: null
    heading: Выручка
    text: Для признания выручки от осуществления финансовых вложений, включая участие в уставных капиталах
      других организаций, в бухгалтерском учете должны быть одновременно выполнены условия, предусмотренные
      подпунктами «а» – «г» пункта 12 или подпунктами «а», «в» и «г» пункта 12 настоящего Стандарта, с
      учетом условий получения такой выручки.
  - path: '15'
    parent_path: null
    heading: Выручка
    text: Экономический субъект, имеющий право применять упрощенные способы ведения бухгалтерского учета,
      включая упрощенную бухгалтерскую (финансовую) отчетность (далее – упрощенный учет), может признавать
      выручку от продажи продукции по мере получения активов от контрагентов при одновременном выполнении
      условий, предусмотренных подпунктами «а», «в», «г» и «д» пункта 12 настоящего Стандарта.
  - path: '16'
    parent_path: null
    heading: Выручка
    text: До выполнения условий, предусмотренных пунктами 12 – 15 настоящего Стандарта, одновременно с
      признанием в бухгалтерском учете актива, поступившего от контрагента в счет оплаты по договору,
      признается кредиторская задолженность, а не выручка.
  - path: '17'
    parent_path: null
    heading: Выручка
    text: 'Для целей бухгалтерского учета выручки два и более договоров, заключенных экономическим субъектом
      с одним контрагентом и (или) связанными сторонами контрагента, признаются единым договором при одновременном
      выполнении следующих условий:'
  - path: 17.а
    parent_path: '17'
    heading: null
    text: договоры взаимосвязаны и заключались сторонами с одной коммерческой целью;
  - path: 17.б
    parent_path: '17'
    heading: null
    text: величина оплаты по одному договору зависит от цены или исполнения другого договора (других договоров);
  - path: 17.в
    parent_path: '17'
    heading: null
    text: обязанности передать продукцию контрагенту и (или) связанным сторонам контрагента при исполнении
      договоров фактически представляют собой единую обязанность экономического субъекта.
  - path: '18'
    parent_path: null
    heading: Выручка
    text: 'При выполнении условий, предусмотренных пунктами 12 – 14 настоящего Стандарта, выручка признается
      в бухгалтерском учете по мере передачи контроля над продукцией контрагенту, когда:'
  - path: 18.а
    parent_path: '18'
    heading: null
    text: исходя из условий договора обязанность передать продукцию контрагенту подлежит исполнению в
      течение периода, превышающего один отчетный период;
  - path: 18.б
    parent_path: '18'
    heading: null
    text: может быть определена степень исполнения обязанности передать продукцию контрагенту (далее –
      степень готовности).
  - path: 18.заключение
    parent_path: '18'
    heading: null
    text: Если в отношении выручки не выполняется хотя бы одно из условий, предусмотренных подпунктами
      «а» и «б» настоящего пункта, то выручка признается в бухгалтерском учете в момент передачи контроля
      над продукцией контрагенту.
  - path: '19'
    parent_path: null
    heading: Выручка
    text: 'Для целей бухгалтерского учета выручки обязанность передать продукцию контрагенту считается
      подлежащей исполнению в течение периода, превышающего один отчетный период, в следующих случаях:'
  - path: 19.а
    parent_path: '19'
    heading: null
    text: контрагент одновременно получает и потребляет экономические выгоды от продукции по мере исполнения
      экономическим субъектом обязанности передать продукцию контрагенту (в частности, при оказании услуг
      в течение периода, превышающего один отчетный период);
  - path: 19.б
    parent_path: '19'
    heading: null
    text: в ходе исполнения экономическим субъектом обязанности передать продукцию контрагенту создается
      или улучшается актив, контроль над которым контрагент получает по мере его создания или улучшения
      (в частности, при производстве продукции, выполнении работ в течение периода, превышающего один
      отчетный период);
  - path: 19.в
    parent_path: '19'
    heading: null
    text: экономический субъект производит продукцию, которая не может быть использована для целей, отличных
      от исполнения обязанности передать ее контрагенту по договору, причем экономический субъект обладает
      безусловным правом на получение актива в оплату исполненной части обязанности передать продукцию
      контрагенту (в частности, при производстве продукции, выполнении работ в течение периода, превышающего
      один отчетный период).
  - path: 19.заключение
    parent_path: '19'
    heading: null
    text: Если, исходя из условий договора, в случаях, указанных в настоящем пункте, период исполнения
      обязанности передать продукцию контрагенту не превышает 12 месяцев, экономический субъект может
      считать, что такая обязанность подлежит исполнению в момент передачи контроля над продукцией контрагенту.
  - path: '20'
    parent_path: null
    heading: Выручка
    text: 'Степень готовности определяется следующими способами:'
  - path: 20.а
    parent_path: '20'
    heading: null
    text: по доле объема продукции (в натуральном или денежном измерении), контроль над которой перешел
      к контрагенту на отчетную дату, в общем объеме этой продукции, подлежащем передаче контрагенту по
      договору;
  - path: 20.б
    parent_path: '20'
    heading: null
    text: по доле расходов, понесенных в связи с исполнением обязанности передать продукцию, контроль
      над которой перешел к контрагенту на отчетную дату, в расчетной величине общих расходов на исполнение
      обязанности передать продукцию контрагенту по договору.
  - path: 20.заключение
    parent_path: '20'
    heading: null
    text: Расчетная величина общих расходов на исполнение обязанности передать конкретную продукцию контрагенту
      определяется как сумма фактических расходов, понесенных экономическим субъектом на отчетную дату,
      и ожидаемой (плановой) величины расходов, которые экономическому субъекту предстоит понести для
      завершения исполнения обязанности передать эту продукцию контрагенту. В сумму фактических расходов
      не включаются расходы, понесенные экономическим субъектом по договору, не связанные с продукцией,
      контроль над которой перешел к контрагенту на отчетную дату. При определении степени готовности
      в расчет не принимается продукция, контроль над которой не перешел к контрагенту на отчетную дату.
  - path: '21'
    parent_path: null
    heading: Выручка
    text: 'Способ определения степени готовности:'
  - path: 21.а
    parent_path: '21'
    heading: null
    text: устанавливается экономическим субъектом из способов, предусмотренных в пункте 20 настоящего
      Стандарта, исходя из вида продукции и условий ее передачи контрагенту. Экономический субъект вправе
      применять разные способы определения степени готовности для разных видов продукции и условий ее
      передачи контрагенту;
  - path: 21.б
    parent_path: '21'
    heading: null
    text: должен применяться на протяжении всего периода исполнения обязанности передать продукцию контрагенту
      по договору;
  - path: 21.в
    parent_path: '21'
    heading: null
    text: должен последовательно применяться экономическим субъектом в отношении аналогичных вида продукции
      и условий ее передачи контрагенту.
  - path: '22'
    parent_path: null
    heading: Выручка
    text: Степень готовности определяется экономическим субъектом на каждую отчетную дату. При необходимости
      экономический субъект принимает решение об изменении степени готовности. Возникшие в связи с этим
      корректировки отражаются в бухгалтерском учете как изменения оценочных значений в соответствии с
      Положением по бухгалтерскому учету «Изменения оценочных значений» (ПБУ 21/2008), утвержденным приказом
      Министерства финансов Российской Федерации от 6 октября 2008 г. № 106н (зарегистрирован Министерством
      юстиции Российской Федерации 27 октября 2008 г., регистрационный № 12522) (далее – ПБУ 21/2008).
  - path: '23'
    parent_path: null
    heading: Выручка
    text: Экономический субъект, который вправе применять упрощенный учет, вправе считать обязанность
      передать продукцию контрагенту подлежащей исполнению в момент передачи контроля над продукцией контрагенту
      независимо от условий договора.
  - path: '24'
    parent_path: null
    heading: Выручка
    text: При признании в бухгалтерском учете выручки по мере передачи контроля над продукцией контрагенту
      выручка признается в бухгалтерском учете независимо от того, предъявляется ли к оплате продукция,
      в отношении которой признается эта выручка, в отчетном периоде. Одновременно с признанием выручки
      в бухгалтерском учете признается актив – не предъявленная к оплате начисленная выручка. По мере
      возникновения у экономического субъекта права предъявить контрагенту к оплате часть продукции, в
      отношении которой в бухгалтерском учете признана выручка в соответствии с абзацем первым настоящего
      пункта, соответствующая часть признанной не предъявленной к оплате начисленной выручки классифицируется
      в качестве дебиторской задолженности.
  - path: '25'
    parent_path: null
    heading: Выручка
    text: В случае, отличном от указанного в абзаце первом пункта 24 настоящего Стандарта, одновременно
      с признанием выручки в бухгалтерском учете признается актив – дебиторская задолженность.
  - path: '26'
    parent_path: null
    heading: Выручка
    text: При признании в бухгалтерском учете выручка оценивается в денежном выражении в сумме, исчисленной
      исходя из цены договора либо исходя из цены, устанавливаемой исходя из условий договора, в части,
      относящейся к исполненной обязанности передать продукцию контрагенту. Если цена не предусмотрена
      в договоре и не может быть установлена исходя из условий договора, то для оценки выручки принимается
      цена, по которой в сравнимых обстоятельствах обычно экономический субъект определяет выручку в отношении
      аналогичной продукции.
  - path: '27'
    parent_path: null
    heading: Выручка
    text: 'Величина выручки определяется с учетом всех скидок независимо от формы их предоставления при
      одновременном соблюдении следующих условий:'
  - path: 27.а
    parent_path: '27'
    heading: null
    text: сумма скидки может быть определена;
  - path: 27.б
    parent_path: '27'
    heading: null
    text: контрагент имеет право на получение скидки либо существует вероятность возникновения такого
      права у контрагента. Наличие права на получение скидки и вероятность возникновения такого права
      у контрагента определяется экономическим субъектом на основании условий договора и (или) условий,
      на которых в сравнимых обстоятельствах обычно контрагент получает право на скидку при исполнении
      экономическим субъектом аналогичных обязанностей передать продукцию контрагентам.
  - path: '28'
    parent_path: null
    heading: Выручка
    text: 'Если сумма скидки не может быть определена исходя из условий договора, то экономический субъект
      может определить ее одним из следующих способов:'
  - path: 28.а
    parent_path: '28'
    heading: null
    text: путем расчета средневзвешенного значения на основании набора значений скидок, которые обычно
      получают контрагенты в сравнимых обстоятельствах при исполнении экономическим субъектом аналогичных
      обязанностей передать продукцию контрагентам, как среднего из произведений каждого значения на его
      вероятность;
  - path: 28.б
    parent_path: '28'
    heading: null
    text: путем выбора единственного наиболее вероятного значения суммы скидки из набора ее возможных
      значений, вытекающих из условий договора.
  - path: 28.заключение
    parent_path: '28'
    heading: null
    text: При выборе способа определения суммы скидки экономический субъект должен исходить из условий
      договора и (или) условий, на которых в сравнимых обстоятельствах обычно контрагент получает право
      на скидку при исполнении экономическим субъектом аналогичных обязанностей передать продукцию контрагенту.
      Выбранный экономическим субъектом способ определения суммы скидки по договору должен последовательно
      применяться при исполнении этого договора.
  - path: '29'
    parent_path: null
    heading: Выручка
    text: Выручка по договору, предусматривающему исполнение контрагентом обязательств по оплате продукции
      полностью или частично неденежными средствами, оценивается в бухгалтерском учете по справедливой
      стоимости актива (в части неденежных средств), полученного или подлежащего получению в оплату по
      договору. При невозможности определить справедливую стоимость актива (в части неденежных средств),
      полученного или подлежащего получению в оплату по договору, выручка оценивается по справедливой
      стоимости продукции, контроль над которой перешел к контрагенту, а при невозможности определить
      последнюю – исходя из цены, по которой в сравнимых обстоятельствах обычно экономический субъект
      определяет величину выручки при исполнении аналогичной обязанности передать продукцию контрагенту.
      Для целей настоящего Стандарта справедливая стоимость определяется в порядке, предусмотренном Международным
      стандартом финансовой отчетности (IFRS) 13 «Оценка справедливой стоимости», введенным в действие
      на территории Российской Федерации приказом Министерства финансов Российской Федерации от 28 декабря
      2015 г. № 217н (зарегистрирован Министерством юстиции Российской Федерации 2 февраля 2016 г., регистрационный
      № 40940).
  - path: '30'
    parent_path: null
    heading: Выручка
    text: При продаже продукции на условиях отсрочки (рассрочки) платежа величина выручки определяется
      как сумма денежных средств, которая была бы получена экономическим субъектом от контрагента при
      отсутствии указанной отсрочки (рассрочки) платежа. После признания в бухгалтерском учете выручки
      и соответствующей ей дебиторской задолженности последняя увеличивается на величину начисляемых процентов
      и уменьшается на величину поступления актива в оплату по договору. Величина начисляемых процентов
      не увеличивает выручку.
  - path: '31'
    parent_path: null
    heading: Выручка
    text: 'В случае, предусмотренном абзацем первым пункта 30 настоящего Стандарта, экономический субъект
      может определять величину выручки в сумме номинальной величины актива, подлежащего поступлению в
      оплату по договору в будущем, при соблюдении одного из следующих условий:'
  - path: 31.а
    parent_path: '31'
    heading: null
    text: период отсрочки (рассрочки) платежа не превышает 12 месяцев с момента перехода контрагенту контроля
      над продукцией;
  - path: 31.б
    parent_path: '31'
    heading: null
    text: представление отсрочки (рассрочки) платежа контрагенту не имеет коммерческого содержания, в
      частности, является способом обеспечения исполнения обязанностей экономического субъекта по договору;
  - path: 31.в
    parent_path: '31'
    heading: null
    text: величина и сроки поступления актива в оплату по договору зависят от наступления или ненаступления
      в будущем события, которое не контролируется сторонами договора (в частности, при определении вознаграждения
      по лицензионному договору в форме процентных отчислений от дохода (выручки) контрагента).
  - path: '32'
    parent_path: null
    heading: Выручка
    text: 'Экономический субъект, который вправе применять упрощенный учет, имеет право:'
  - path: 32.а
    parent_path: '32'
    heading: null
    text: определять величину выручки исходя из цены договора без учета скидок независимо от условий договора.
      При этом сумма скидки, которая должна была быть учтена при определении величины выручки в соответствии
      с настоящим Стандартом, признается расходом периода, в котором она была фактически предоставлена
      контрагенту;
  - path: 32.б
    parent_path: '32'
    heading: null
    text: оценивать выручку по договору, предусматривающему исполнение контрагентом обязательств по оплате
      полностью или частично неденежными средствами (в части оплаты неденежными средствами), исходя из
      цены, по которой в сравнимых обстоятельствах обычно экономический субъект определяет величину выручки
      при исполнении аналогичной обязанности передать продукцию контрагенту, независимо от возможности
      определить справедливую стоимость как полученного или подлежащего получению в оплату по договору
      актива, так и продукции, контроль над которой перешел к контрагенту;
  - path: 32.в
    parent_path: '32'
    heading: null
    text: определять величину выручки в сумме номинальной величины актива, подлежащего поступлению в оплату
      по договору в будущем (независимо от условий договора), при продаже продукции на условиях отсрочки
      (рассрочки) платежа.
  - path: '33'
    parent_path: null
    heading: Выручка
    text: В случае исполнения обязанности передать продукцию контрагенту в течение периода, превышающего
      один отчетный период, величина выручки по договору определяется исходя из цены договора в сумме,
      рассчитанной с учетом степени готовности на отчетную дату. При этом определение величины выручки
      в каждом отчетном периоде производится с учетом выручки, признанной в предыдущие отчетные периоды
      по этому договору в части, относящейся к исполняемой обязанности передать продукцию контрагенту.
      Если выручка в части, относящейся к обязанности передать продукцию контрагенту, исполненной в отчетном
      периоде, не может быть определена, то она признается в бухгалтерском учете в сумме признанных в
      бухгалтерском учете расходов, понесенных в отчетном периоде в связи с исполнением этой обязанности,
      которые будут возмещены экономическому субъекту.
  - path: '34'
    parent_path: null
    heading: Выручка
    text: 'В случае изменения предмета и (или) цены договора величина выручки в отношении обязанности
      передать продукцию контрагенту, подлежащей исполнению после изменения договора, определяется с учетом
      следующего:'
  - path: 34.а
    parent_path: '34'
    heading: null
    text: если продукция, которая подлежит передаче контрагенту после изменения договора, отличается от
      продукции, которая была передана контрагенту до изменения договора, величина выручки, принятая к
      бухгалтерскому учету до изменения договора, не корректируется, а выручка от передачи продукции контрагенту
      после изменения договора оценивается исходя из суммы части цены договора, не признанной выручкой
      на момент изменения договора, и предусмотренной измененным договором суммы, на которую увеличена
      цена договора;
  - path: 34.б
    parent_path: '34'
    heading: null
    text: если продукция, которая подлежит передаче контрагенту после изменения договора, не отличается
      от продукции, которая была передана контрагенту до изменения договора, и соответственно является
      частью одной исполняемой по договору обязанности передать продукцию контрагенту, величина выручки,
      принятая к бухгалтерскому учету до изменения договора, подлежит единовременной корректировке (увеличению
      или уменьшению) с учетом изменения цены договора и (или) оценки степени готовности. Такая корректировка
      отражается в бухгалтерском учете на момент изменения договора без корректировки сопоставимых данных
      за предшествующие отчетные периоды. Влияние изменения предмета и (или) цены договора на признание
      выручки от передачи продукции контрагенту после изменения договора отражается в бухгалтерском учете
      как изменение оценочных значений в соответствии с ПБУ 21/2008.
  - path: '35'
    parent_path: null
    heading: Выручка
    text: За исключением случаев, установленных настоящим Стандартом, величина выручки, признанной в бухгалтерском
      учете, не изменяется, в том числе на величину резервов по сомнительным долгам, созданных в отношении
      признанных одновременно с признанием выручки дебиторской задолженности и (или) не предъявленной
      к оплате начисленной выручки .
  - path: '36'
    parent_path: null
    heading: Доходы, отличные от выручки
    text: 'Доходами, отличными от выручки, признаются:'
  - path: 36.а
    parent_path: '36'
    heading: null
    text: доходы, связанные с предоставлением за плату прав на результаты интеллектуальной деятельности
      и средства индивидуализации (с учетом положений пункта 10 настоящего Стандарта);
  - path: 36.б
    parent_path: '36'
    heading: null
    text: доходы от осуществления финансовых вложений, включая участие в уставных капиталах других организаций
      (с учетом положений пункта 10 настоящего Стандарта);
  - path: 36.в
    parent_path: '36'
    heading: null
    text: доходы от предоставления во временное пользование имущества по договору аренды (с учетом положений
      пункта 10 настоящего Стандарта);
  - path: 36.г
    parent_path: '36'
    heading: null
    text: проценты, полученные за предоставление в пользование денежных средств экономического субъекта,
      а также проценты за пользование банком денежными средствами, находящимися на счете экономического
      субъекта в этом банке;
  - path: 36.д
    parent_path: '36'
    heading: null
    text: активы, полученные безвозмездно, в том числе по договору дарения;
  - path: 36.е
    parent_path: '36'
    heading: null
    text: неустойки за нарушение условий договоров;
  - path: 36.ж
    parent_path: '36'
    heading: null
    text: доходы, связанные с возмещением убытков, причиненных экономическому субъекту;
  - path: 36.з
    parent_path: '36'
    heading: null
    text: суммы кредиторской задолженности, по которой истек срок исковой давности;
  - path: 36.и
    parent_path: '36'
    heading: null
    text: прибыль прошлых лет, выявленная в отчетном году;
  - path: 36.к
    parent_path: '36'
    heading: null
    text: иные доходы, отличные от указанных в подпунктах «а» – «и» настоящего пункта, в случаях, установленных
      другими федеральными стандартами.
  - path: '37'
    parent_path: null
    heading: Доходы, отличные от выручки
    text: 'Оценка и признание доходов, отличных от выручки, производятся:'
  - path: 37.а
    parent_path: '37'
    heading: null
    text: в сумме, равной величине выручки, определяемой в соответствии с настоящим Стандартом, при соблюдении
      условий, предусмотренных пунктом 13 настоящего Стандарта, – для доходов, указанных в подпункте «а»
      пункта 36 настоящего Стандарта;
  - path: 37.б
    parent_path: '37'
    heading: null
    text: в сумме, равной величине поступления актива, при одновременном соблюдении условий, предусмотренных
      пунктом 14 настоящего Стандарта, – для доходов, указанных в подпунктах «б» и «г» пункта 36 настоящего
      Стандарта. При этом для целей бухгалтерского учета проценты начисляются в соответствии с условиями
      договора на конец каждого отчетного периода;
  - path: 37.в
    parent_path: '37'
    heading: null
    text: в соответствии с пунктом 8 настоящего Стандарта – для доходов, указанных в подпункте «в» пункта
      36 настоящего Стандарта;
  - path: 37.г
    parent_path: '37'
    heading: null
    text: в сумме, равной величине поступления актива в момент признания этого актива в бухгалтерском
      учете, в порядке, предусмотренном федеральными стандартами, устанавливающими требования к формированию
      информации об отдельных видах объектов бухгалтерского учета, – для доходов, указанных в подпункте
      «д» пункта 36 настоящего Стандарта;
  - path: 37.д
    parent_path: '37'
    heading: null
    text: в суммах, присужденных судом или признанных должником, при одновременном соблюдении условий,
      предусмотренных подпунктами «а», «в» и «г» пункта 12 настоящего Стандарта, с учетом вида и условий
      получения дохода, – для доходов, указанных в подпунктах «е» и «ж» пункта 36 настоящего Стандарта;
  - path: 37.е
    parent_path: '37'
    heading: null
    text: в сумме кредиторской задолженности, отраженной в бухгалтерском учете экономического субъекта,
      в отчетном периоде, в котором срок исковой давности такой кредиторской задолженности истек, – для
      доходов, указанных в подпункте «з» пункта 36 настоящего Стандарта;
  - path: 37.ж
    parent_path: '37'
    heading: null
    text: в фактической сумме в отчетном периоде, в котором такие доходы были выявлены экономическим субъектом,
      – для доходов, указанных в подпункте «и» пункта 36 настоящего Стандарта;
  - path: 37.з
    parent_path: '37'
    heading: null
    text: в сумме и порядке, установленных другими федеральными стандартами, – для доходов, указанных
      в подпункте «к» пункта 36 настоящего Стандарта.
  - path: '38'
    parent_path: null
    heading: Раскрытие информации
    text: В бухгалтерской (финансовой) отчетности информация о выручке, доходах, отличных от выручки,
      доходах, не включаемых в чистую прибыль (убыток), приводится обособленно в соответствии с настоящим
      Стандартом и другими федеральными стандартами.
  - path: '39'
    parent_path: null
    heading: Раскрытие информации
    text: Экономические субъекты, указанные в подпункте «а» пункта 11 настоящего Стандарта, а также указанные
      в подпункте «б» пункта 11 настоящего Стандарта экономические субъекты, которые приняли решение формировать
      в бухгалтерском учете информацию о выручке в соответствии с МСФО (IFRS) 15, раскрывают информацию
      о выручке в бухгалтерской (финансовой) отчетности в соответствии с МСФО (IFRS) 15.
  - path: '40'
    parent_path: null
    heading: Раскрытие информации
    text: Экономические субъекты, указанные в подпункте «в» пункта 11 настоящего Стандарта, а также указанные
      в подпункте «б» пункта 11 настоящего Стандарта экономические субъекты, которые приняли решение формировать
      в бухгалтерском учете информацию о выручке в соответствии с настоящим Стандартом, раскрывают информацию
      о выручке в бухгалтерской (финансовой) отчетности в соответствии с пунктами 41 и 42 настоящего Стандарта.
  - path: '41'
    parent_path: null
    heading: Раскрытие информации
    text: 'В бухгалтерской (финансовой) отчетности раскрывается с учетом существенности как минимум следующая
      информация:'
  - path: 41.а
    parent_path: '41'
    heading: null
    text: величина выручки, признанной в отчетном периоде;
  - path: 41.б
    parent_path: '41'
    heading: null
    text: детализация информации о выручке исходя из ее величины, вида и влияния на экономические решения,
      принимаемые пользователями на основе бухгалтерской (финансовой) отчетности. В случае если экономический
      субъект раскрывает в бухгалтерской (финансовой) отчетности информацию в соответствии с требованиями
      Положения по бухгалтерскому учету «Информация по сегментам» (ПБУ 12/2010), утвержденного приказом
      Министерства финансов Российской Федерации от 8 ноября 2010 г. № 143н (зарегистрирован Министерством
      юстиции Российской Федерации 14 декабря 2010 г., регистрационный № 19171), в бухгалтерской (финансовой)
      отчетности должна быть раскрыта информация о сопоставлении детализированной информации о выручке,
      раскрываемой в соответствии с настоящим Стандартом, и информации о выручке, раскрываемой по отчетным
      сегментам;
  - path: 41.в
    parent_path: '41'
    heading: null
    text: сверка остатков на начало и конец отчетного периода дебиторской задолженности, не предъявленной
      к оплате начисленной выручки, а также созданных в отношении них резервов по сомнительным долгам,
      кредиторской задолженности по договорам с контрагентами с представлением показателей остатков на
      начало отчетного периода, изменения (увеличение, уменьшение) в отчетном периоде, остатков на конец
      отчетного периода;
  - path: 41.г
    parent_path: '41'
    heading: null
    text: информация об обязанностях экономического субъекта по договорам с контрагентами;
  - path: 41.д
    parent_path: '41'
    heading: null
    text: информация о способах и допущениях, примененных для признания выручки в бухгалтерском учете
      (в частности, подлежит ли обязанность передать продукцию контрагенту исполнению в момент передачи
      контроля над продукцией или в течение периода, превышающего один отчетный период, способы определения
      степени готовности, способы определения суммы скидки, способы определения величины выручки в случаях,
      предусмотренных пунктом 29 настоящего Стандарта).
  - path: '42'
    parent_path: null
    heading: Раскрытие информации
    text: В случае, когда раскрытие информации о доходах в бухгалтерской (финансовой) отчетности в объеме,
      предусмотренном настоящим Стандартом, приведет или может привести к потерям экономического характера
      и (или) урону деловой репутации экономического субъекта, и (или) его контрагентов, и (или) связанных
      с экономическим субъектом сторон, экономический субъект может раскрывать информацию о доходах в
      бухгалтерской (финансовой) отчетности в ограниченном объеме, не раскрывая те сведения, которые обусловливают
      указанные потери и (или) урон.
  - path: '43'
    parent_path: null
    heading: Изменение учетной политики
    text: Последствия изменений учетной политики в связи с началом применения настоящего Стандарта отражаются
      ретроспективно в соответствии с Положением по бухгалтерскому учету «Учетная политика организации»
      (ПБУ 1/2008), утвержденным приказом Министерства финансов Российской Федерации от 6 октября 2008
      г. № 106н (зарегистрирован Министерством юстиции Российской Федерации 27 октября 2008 г., регистрационный
      № 12522) (далее – ПБУ 1/2008), если иное не установлено настоящим Стандартом.
  - path: '44'
    parent_path: null
    heading: Изменение учетной политики
    text: 'При отражении последствий изменения учетной политики в соответствии с пунктом 43 настоящего
      Стандарта, экономический субъект вправе:'
  - path: 44.а
    parent_path: '44'
    heading: null
    text: не применять настоящий Стандарт к договорам, обязанности по которым полностью исполнены экономическим
      субъектом до начала самого раннего отчетного периода, представленного в бухгалтерской (финансовой)
      отчетности за период, начиная с которого применяется настоящий Стандарт;
  - path: 44.б
    parent_path: '44'
    heading: null
    text: использовать информацию о суммах скидок, фактически предоставленных контрагенту на дату исполнения
      обязанностей по договору, при применении настоящего Стандарта к договорам, обязанности по которым
      исполнены до начала периода, начиная с которого применяется настоящий Стандарт;
  - path: 44.в
    parent_path: '44'
    heading: null
    text: отразить единовременно совокупную корректировку, связанную с определением исполненных и неисполненных
      обязанностей передать продукцию контрагенту по состоянию на дату начала самого раннего отчетного
      периода, представленного в бухгалтерской (финансовой) отчетности за период, начиная с которого применяется
      настоящий Стандарт, в отношении всех изменений предмета и (или) цены договора, внесенных в него
      до указанной даты, вместо ретроспективного отражения последствий изменений учетной политики в связи
      с началом применения настоящего Стандарта как это определено пунктом 43 настоящего Стандарта.
  - path: '45'
    parent_path: null
    heading: Изменение учетной политики
    text: 'В бухгалтерской (финансовой) отчетности, начиная с которой применяется настоящий Стандарт,
      допускается не пересчитывать сравнительные показатели за периоды, предшествующие отчетному. При
      этом:'
  - path: 45.а
    parent_path: '45'
    heading: null
    text: последствия изменения учетной политики, связанные с началом применения настоящего Стандарта,
      отражаются на начало года, начиная с которого применяется настоящий Стандарт, посредством единовременной
      корректировки нераспределенной прибыли экономического субъекта и соответствующих статей бухгалтерского
      баланса;
  - path: 45.б
    parent_path: '45'
    heading: null
    text: экономический субъект может отражать последствия изменения учетной политики только в отношении
      договоров с контрагентами, обязанности по которым не исполнены на начало года, начиная с которого
      применяется настоящий Стандарт;
  - path: 45.в
    parent_path: '45'
    heading: null
    text: экономический субъект вправе применять подпункты «б» и «в» пункта 44 настоящего Стандарта при
      оценке последствий изменения учетной политики, связанных с началом применения настоящего Стандарта.
  - path: '46'
    parent_path: null
    heading: Изменение учетной политики
    text: Экономический субъект, который вправе применять упрощенный учет, вправе начать применять настоящий
      Стандарт перспективно в соответствии с ПБУ 1/2008.
  - path: '47'
    parent_path: null
    heading: Изменение учетной политики
    text: Экономический субъект раскрывает выбранный им способ отражения последствий изменения учетной
      политики в связи с началом применения настоящего Стандарта и последствия изменения учетной политики,
      соответствующие выбранному способу их отражения, в своей первой бухгалтерской (финансовой) отчетности,
      составленной с применением настоящего Стандарта.
