id: pbu-9-99
kind: ПБУ
number: 9/99
year: 1999
title: Доходы организации
order_date: 1999-05-06
order_no: 32н
effective_from: &id001 2000-01-01
effective_to: 2027-01-01
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает правила формирования в бухгалтерском учете информации о доходах
      коммерческих организаций (кроме кредитных и страховых организаций), являющихся юридическими лицами
      по законодательству Российской Федерации. Применительно к настоящему Положению некоммерческие организации
      (кроме государственных (муниципальных) учреждений) признают доходы от предпринимательской и иной
      деятельности. (в ред. приказов Минфина России от 30.12.1999 № 107н, от 25.10.2010 № 132н)
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Доходами организации признается увеличение экономических выгод в результате поступления активов
      (денежных средств, иного имущества) и (или) погашения обязательств, приводящее к увеличению капитала
      этой организации, за исключением вкладов участников (собственников имущества).
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: 'Для целей настоящего Положения не признаются доходами организации поступления от других юридических
      и физических лиц: сумм налога на добавленную стоимость, акцизов, налога с продаж, экспортных пошлин
      и иных аналогичных обязательных платежей; по договорам комиссии, агентским и иным аналогичным договорам
      в пользу комитента, принципала и т.п.; в порядке предварительной оплаты продукции, товаров, работ,
      услуг; авансов в счет оплаты продукции, товаров, работ, услуг; задатка; в залог, если договором
      предусмотрена передача заложенного имущества залогодержателю; в погашение кредита, займа, предоставленного
      заемщику.'
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: 'Доходы организации в зависимости от их характера, условия получения и направлений деятельности
      организации подразделяются на:'
  - path: 4.а
    parent_path: '4'
    heading: null
    text: доходы от обычных видов деятельности;
  - path: 4.б
    parent_path: '4'
    heading: null
    text: прочие доходы; (в ред. приказа Минфина России от 18.09.2006 № 116н)
  - path: 4.в
    parent_path: '4'
    heading: null
    text: исключен. (приказ Минфина России от 18.09.2006 № 116н)
  - path: 4.заключение
    parent_path: '4'
    heading: null
    text: Для целей настоящего Положения доходы, отличные от доходов от обычных видов деятельности, считаются
      прочими поступлениями. (в ред. приказа Минфина России от 18.09.2006 № 116н) Для целей бухгалтерского
      учета организация самостоятельно признает поступления доходами от обычных видов деятельности или
      прочими поступлениями исходя из требований настоящего Положения, характера своей деятельности, вида
      доходов и условий их получения.
  - path: '5'
    parent_path: null
    heading: Доходы от обычных видов деятельности
    text: Доходами от обычных видов деятельности является выручка от продажи продукции и товаров, поступления,
      связанные с выполнением работ, оказанием услуг (далее - выручка). В организациях, предметом деятельности
      которых является предоставление за плату во временное пользование (временное владение и пользование)
      своих активов по договору аренды, выручкой считаются поступления, получение которых связанно с этой
      деятельностью (арендная плата). В организациях, предметом деятельности которых является предоставление
      за плату прав, возникающих из патентов на изобретения, промышленные образцы и других видов интеллектуальной
      собственности, выручкой считаются поступления, получение которых связано с этой деятельностью (лицензионные
      платежи (включая роялти) за пользование объектами интеллектуальной собственности). В организациях,
      предметом деятельности которых является участие в уставных капиталах других организаций, выручкой
      считаются поступления, получение которых связано с этой деятельностью. Доходы, получаемые организацией
      от предоставления за плату во временное пользование (временное владение и пользование) своих активов,
      прав, возникающих из патентов на изобретения, промышленные образцы и других видов интеллектуальной
      собственности, и от участия в уставных капиталах других организаций, когда это не является предметом
      деятельности организации, относятся к прочим доходам. (в ред. приказа Минфина России от 18.09.2006
      № 116н)
  - path: '6'
    parent_path: null
    heading: Доходы от обычных видов деятельности
    text: Выручка принимается к бухгалтерскому учету в сумме, исчисленной в денежном выражении, равной
      величине поступления денежных средств и иного имущества и (или) величине дебиторской задолженности
      (с учетом положений пункта 3 настоящего Положения). Если величина поступления покрывает лишь часть
      выручки, то выручка, принимаемая к бухгалтерскому учету, определяется как сумма поступления и дебиторской
      задолженности (в части, не покрытой поступлением).
  - path: '6.1'
    parent_path: null
    heading: Доходы от обычных видов деятельности
    text: Величина поступления и (или) дебиторской задолженности определяется исходя из цены, установленной
      договором между организацией и покупателем (заказчиком) или пользователем активов организации. Если
      цена не предусмотрена в договоре и не может быть установлена исходя из условий договора, то для
      определения величины поступления и (или) дебиторской задолженности принимается цена, по которой
      в сравнимых обстоятельствах обычно организация определяет выручку в отношении аналогичной продукции
      (товаров, работ, услуг) либо предоставления во временное пользование (временное владение и пользование)
      аналогичных активов.
  - path: '6.2'
    parent_path: null
    heading: Доходы от обычных видов деятельности
    text: При продаже продукции и товаров, выполнении работ, оказании услуг на условиях коммерческого
      кредита, предоставляемого в виде отсрочки и рассрочки оплаты, выручка принимается к бухгалтерскому
      учету в полной сумме дебиторской задолженности.
  - path: '6.3'
    parent_path: null
    heading: Доходы от обычных видов деятельности
    text: Величина поступления и (или) дебиторской задолженности по договорам, предусматривающим исполнение
      обязательств (оплату) не денежными средствами, принимается к бухгалтерскому учету по стоимости товаров
      (ценностей), полученных или подлежащих получению организацией. Стоимость товаров (ценностей), полученных
      или подлежащих получению организацией, устанавливают исходя из цены, по которой в сравнимых обстоятельствах
      обычно организация определяет стоимость аналогичных товаров (ценностей). При невозможности установить
      стоимость товаров (ценностей), полученных организацией, величина поступления и (или) дебиторской
      задолженности определяется стоимостью продукции (товаров), переданной или подлежащей передаче организацией.
      Стоимость продукции (товаров), переданной или подлежащей передаче организацией, устанавливается
      исходя из цены, по которой в сравнимых обстоятельствах обычно организация определяет выручку в отношении
      аналогичной продукции (товаров).
  - path: '6.4'
    parent_path: null
    heading: Доходы от обычных видов деятельности
    text: В случае изменения обязательства по договору первоначальная величина поступления и (или) дебиторской
      задолженности корректируется исходя из стоимости актива, подлежащего получению организацией. Стоимость
      актива, подлежащего получению организацией, устанавливают исходя из цены, по которой в сравнимых
      обстоятельствах обычно организация определяет стоимость аналогичных активов.
  - path: '6.5'
    parent_path: null
    heading: Доходы от обычных видов деятельности
    text: Величина поступления и (или) дебиторской задолженности определяется с учетом всех предоставленных
      организации согласно договору скидок (накидок).
  - path: '6.6'
    parent_path: null
    heading: Доходы от обычных видов деятельности
    text: Исключен. (приказ Минфина России от 27.11.2006 № 156н)
  - path: '6.7'
    parent_path: null
    heading: Доходы от обычных видов деятельности
    text: При образовании в соответствии с правилами бухгалтерского учета резервов сомнительных долгов
      величина выручки не изменяется.
  - path: '7'
    parent_path: null
    heading: Прочие поступления
    text: 'Прочими доходами являются: (в ред. приказа Минфина России от 18.09.2006 № 116н) поступления,
      связанные с предоставлением за плату во временное пользование (временное владение и пользование)
      активов организации (с учетом положений пункта 5 настоящего Положения); (в ред. приказа Минфина
      России от 30.03.2001 № 27н) поступления, связанные с предоставлением за плату прав, возникающих
      из патентов на изобретения, промышленные образцы и других видов интеллектуальной собственности (с
      учетом положений пункта 5 настоящего Положения); (в ред. приказа Минфина России от 30.03.2001 №
      27н) поступления, связанные с участием в уставных капиталах других организаций (включая проценты
      и иные доходы по ценным бумагам) (с учетом положений пункта 5 настоящего Положения); (в ред. приказа
      Минфина России от 30.03.2001 № 27н) прибыль, полученная организацией в результате совместной деятельности
      (по договору простого товарищества); поступления от продажи основных средств и иных активов, отличных
      от денежных средств (кроме иностранной валюты), продукции, товаров; проценты, полученные за предоставление
      в пользование денежных средств организации, а также проценты за использование банком денежных средств,
      находящихся на счете организации в этом банке; абзац исключен (приказ Минфина России от 18.09.2006
      № 116н) ; штрафы, пени, неустойки за нарушение условий договоров; активы, полученные безвозмездно,
      в том числе по договору дарения; поступления в возмещение причиненных организации убытков; прибыль
      прошлых лет, выявленная в отчетном году; суммы кредиторской и депонентской задолженности, по которым
      истек срок исковой давности; курсовые разницы; сумма дооценки активов; (в ред.приказа Минфина России
      от 30.03.2001 № 27н) прочие доходы. (в ред. приказа Минфина России от 18.09.2006 № 116н)'
  - path: '9'
    parent_path: null
    heading: Прочие поступления
    text: 'Прочими доходами также являются поступления, возникающие как последствия чрезвычайных обстоятельств
      хозяйственной деятельности (стихийного бедствия, пожара, аварии, национализации и т.п.): стоимость
      материальных ценностей, остающихся от списания непригодных к восстановлению и дальнейшему использованию
      активов, и т.п. (в ред. приказа Минфина России от 18.09.2006 № 116н)'
  - path: '10'
    parent_path: null
    heading: Прочие поступления
    text: 'Для целей бухгалтерского учета величина прочих поступлений определяется в следующем порядке:'
  - path: '10.1'
    parent_path: null
    heading: Прочие поступления
    text: Величину поступлений от продажи основных средств и иных активов, отличных от денежных средств
      (кроме иностранной валюты), продукции, товаров, а также суммы процентов, полученных за предоставление
      в пользование денежных средств организации, и доходы от участия в уставных капиталах других организаций
      (когда это не является предметом деятельности организации) определяют в порядке, аналогичном предусмотренному
      пунктом 6 настоящего Положения.
  - path: '10.2'
    parent_path: null
    heading: Прочие поступления
    text: Штрафы, пени, неустойки за нарушения условий договоров, а также возмещения причиненных организации
      убытков принимаются к бухгалтерскому учету в суммах, присужденных судом или признанных должником.
  - path: '10.3'
    parent_path: null
    heading: Прочие поступления
    text: Активы, полученные безвозмездно, принимаются к бухгалтерскому учету по рыночной стоимости. Рыночная
      стоимость полученных безвозмездно активов определяется организацией на основе действующих на дату
      их принятия к бухгалтерскому учету цен на данный или аналогичный вид активов. Данные о ценах, действующих
      на дату принятия к бухгалтерскому учету, должны быть подтверждены документально или путем проведения
      экспертизы.
  - path: '10.4'
    parent_path: null
    heading: Прочие поступления
    text: Кредиторская задолженность, по которой срок исковой давности истек, включается в доход организации
      в сумме, в которой эта задолженность была отражена в бухгалтерском учете организации.
  - path: '10.5'
    parent_path: null
    heading: Прочие поступления
    text: Суммы дооценки активов определяют в соответствии с правилами, установленными для проведения
      переоценки активов.
  - path: '10.6'
    parent_path: null
    heading: Прочие поступления
    text: Иные поступления принимаются к бухгалтерскому учету в фактических суммах.
  - path: '11'
    parent_path: null
    heading: Прочие поступления
    text: Прочие поступления подлежат зачислению на счет прибылей и убытков организации, кроме случаев,
      когда правилами бухгалтерского учета установлен другой порядок.
  - path: '12'
    parent_path: null
    heading: Признание доходов
    text: 'Выручка признается в бухгалтерском учете при наличии следующих условий:'
  - path: 12.а
    parent_path: '12'
    heading: null
    text: организация имеет право на получение этой выручки, вытекающее из конкретного договора или подтвержденное
      иным соответствующим образом;
  - path: 12.б
    parent_path: '12'
    heading: null
    text: сумма выручки может быть определена;
  - path: 12.в
    parent_path: '12'
    heading: null
    text: имеется уверенность в том, что в результате конкретной операции произойдет увеличение экономических
      выгод организации. Уверенность в том, что в результате конкретной операции произойдет увеличение
      экономических выгод организации, имеется в случае, когда организация получила в оплату актив либо
      отсутствует неопределенность в отношении получения актива;
  - path: 12.г
    parent_path: '12'
    heading: null
    text: право собственности (владения, пользования и распоряжения) на продукцию (товар) перешло от организации
      к покупателю или работа принята заказчиком (услуга оказана);
  - path: 12.д
    parent_path: '12'
    heading: null
    text: расходы, которые произведены или будут произведены в связи с этой операцией, могут быть определены.
  - path: 12.заключение
    parent_path: '12'
    heading: null
    text: Если в отношении денежных средств и иных активов, полученных организацией в оплату, не исполнено
      хотя бы одно из названных условий, то в бухгалтерском учете организации признается кредиторская
      задолженность, а не выручка. Для признания в бухгалтерском учете выручки от предоставления за плату
      во временное пользование (временное владение и пользование) своих активов, прав, возникающих из
      патентов на изобретения, промышленные образцы и других видов интеллектуальной собственности и от
      участия в уставных капиталах других организаций, должны быть одновременно соблюдены условия, определенные
      в подпунктах "а", "б" и "в" настоящего пункта. Организации, которые вправе применять упрощенные
      способы ведения бухгалтерского учета, включая упрощенную бухгалтерскую (финансовую) отчетность,
      могут признавать выручку по мере поступления денежных средств от покупателей (заказчиков) при соблюдении
      условий, определенных в подпунктах "а", "б", "в" и "д" настоящего пункта. (абзац введен приказом
      Минфина России от 08.11.2010 № 144н, в ред. приказов Минфина России от 27.04.2012 № 55н, от 06.04.2015
      № 57н)
  - path: '13'
    parent_path: null
    heading: Признание доходов
    text: Организация может признавать в бухгалтерском учете выручку от выполнения работ, оказания услуг,
      продажи продукции с длительным циклом изготовления по мере готовности работы, услуги, продукции
      или по завершении выполнения работы, оказания услуги, изготовления продукции в целом. Выручка от
      выполнения конкретной работы, оказания конкретной услуги, продажи конкретного изделия признается
      в бухгалтерском учете по мере готовности, если возможно определить готовность работы, услуги, изделия.
      В отношении разных по характеру и условиям выполнения работ, оказания услуг, изготовления изделий
      организация может применять в одном отчетном периоде одновременно разные способы признания выручки,
      предусмотренные настоящим пунктом.
  - path: '14'
    parent_path: null
    heading: Признание доходов
    text: Если сумма выручки от продажи продукции, выполнения работы, оказания услуги не может быть определена,
      то она принимается к бухгалтерскому учету в размере признанных в бухгалтерском учете расходов по
      изготовлению этой продукции, выполнению этой работы, оказанию этой услуги, которые будут впоследствии
      возмещены организации.
  - path: '15'
    parent_path: null
    heading: Признание доходов
    text: Арендная плата, лицензионные платежи за пользование объектами интеллектуальной собственности
      (когда это не является предметом деятельности организации) признаются в бухгалтерском учете исходя
      из допущения временной определенности фактов хозяйственной деятельности и условий соответствующего
      договора. Арендная плата, лицензионные платежи за пользование объектами интеллектуальной собственности
      (когда это не является предметом деятельности организации) признаются в бухгалтерском учете в порядке,
      аналогичном предусмотренному пунктом 12 настоящего Положения.
  - path: '16'
    parent_path: null
    heading: Признание доходов
    text: 'Прочие поступления признаются в бухгалтерском учете в следующем порядке: поступления от продажи
      основных средств и иных активов, отличных от денежных средств (кроме иностранной валюты), продукции,
      товаров, а также проценты, полученные за предоставление в пользование денежных средств организации,
      и доходы от участия в уставных капиталах других организаций (когда это не является предметом деятельности
      организации) - в порядке, аналогичном предусмотренному пунктом 12 настоящего Положения. При этом
      для целей бухгалтерского учета проценты начисляются за каждый истекший отчетный период в соответствии
      с условиями договора; штрафы, пени, неустойки за нарушение условий договоров, а также возмещения
      причиненных организации убытков - в отчетном периоде, в котором судом вынесено решение об их взыскании
      или они признаны должником; суммы кредиторской и депонентской задолженности, по которой срок исковой
      давности истек, - в отчетном периоде, в котором срок исковой давности истек; суммы дооценки активов
      - в отчетном периоде, к которому относится дата, по состоянию на которую произведена переоценка;
      иные поступления - по мере образования (выявления).'
  - path: '17'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'В составе информации об учетной политике организации в бухгалтерской отчетности подлежит раскрытию
      как минимум следующая информация:'
  - path: 17.а
    parent_path: '17'
    heading: null
    text: о порядке признания выручки организации;
  - path: 17.б
    parent_path: '17'
    heading: null
    text: о способе определения готовности работ, услуг, продукции, выручка от выполнения, оказания, продажи
      которых признается по мере готовности.
  - path: '18'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: В отчете о финансовых результатах доходы организации за отчетный период отражаются с подразделением
      на выручку и прочие доходы. (в ред. приказов Минфина России от 18.09.2006 № 116н, от 06.04.2015
      № 57н )
  - path: '18.1'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: Выручка, прочие доходы (выручка от продажи продукции (товаров), выручка от выполнения работ
      (оказания услуг) и т.п.), составляющие пять и более процентов от общей суммы доходов организации
      за отчетный период, показываются по каждому виду в отдельности. (в ред. приказа Минфина России от
      18.09.2006 № 116н)
  - path: '18.2'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'Прочие доходы могут показываться в отчете о финансовых результатах за минусом расходов, относящихся
      к этим доходам, когда: (в ред. приказов Минфина России от 18.09.2006 № 116н, от 06.04.2015 № 57н)'
  - path: 18.2.а
    parent_path: '18.2'
    heading: null
    text: соответствующие правила бухгалтерского учета предусматривают или не запрещают такое отражение
      доходов;
  - path: 18.2.б
    parent_path: '18.2'
    heading: null
    text: доходы и связанные с ними расходы, возникающие в результате одного и того же или аналогичного
      по характеру факта хозяйственной деятельности (например, предоставление во временное пользование
      (временное владение и пользование) своих активов), не являются существенными для характеристики
      финансового положения организации.
  - path: '19'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'В отношении выручки, полученной в результате выполнения договоров, предусматривающих исполнение
      обязательств (оплату) неденежными средствами, подлежит раскрытию как минимум следующая информация:'
  - path: 19.а
    parent_path: '19'
    heading: null
    text: общее количество организаций, с которыми осуществляются указанные договоры, с указанием организаций,
      на которые приходится основная часть такой выручки;
  - path: 19.б
    parent_path: '19'
    heading: null
    text: доля выручки, полученной по указанным договорам со связанными организациями;
  - path: 19.в
    parent_path: '19'
    heading: null
    text: способ определения стоимости продукции (товаров), переданной организацией.
  - path: '20'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: Прочие доходы организации за отчетный период, которые в соответствии с правилами бухгалтерского
      учета не зачисляются на счет прибылей и убытков, подлежат раскрытию в бухгалтерской отчетности обособленно.
  - path: '21'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: Построение бухгалтерского учета должно обеспечить возможность раскрытия информации о доходах
      организации в разрезе текущей, инвестиционной и финансовой деятельности.
  - path: '22'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: В случаях, когда раскрытие информации в пояснениях к бухгалтерскому балансу и отчету о финансовых
      результатах в объеме, предусмотренном настоящим Положением, приведет или может привести к потерям
      экономического характера и (или) урону деловой репутации организации и (или) ее контрагентов, и
      (или) связанных с ней сторон, организация может раскрывать информацию в пояснениях к бухгалтерскому
      балансу и отчету о финансовых результатах в ограниченном объеме, не раскрывая те сведения, которые
      обусловливают указанные потери и (или) урон. (п.22 введен приказом Минфина России от 27.11.2020
      № 287н)