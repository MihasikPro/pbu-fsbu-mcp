id: pbu-7-98
kind: ПБУ
number: 7/98
year: 1998
title: События после отчетной даты
order_date: 1998-11-25
order_no: 56н
effective_from: &id001 1999-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает порядок отражения в бухгалтерской отчетности коммерческих
      организаций (кроме кредитных организаций), являющихся юридическими лицами по законодательству Российской
      Федерации, событий после отчетной даты.
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Признан утратившим силу – приказ Минфина России от 06.04.2015 № 57н.
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: Событием после отчетной даты признается факт хозяйственной деятельности, который оказал или
      может оказать влияние на финансовое состояние, движение денежных средств или результаты деятельности
      организации и который имел место в период между отчетной датой и датой подписания бухгалтерской
      отчетности за отчетный год. Событием после отчетной даты признается также объявление годовых дивидендов
      по результатам деятельности акционерного общества за отчетный год.
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: Датой подписания бухгалтерской отчетности считается дата, указанная в представляемой в адреса,
      определенные законодательством Российской Федерации, бухгалтерской отчетности при подписании ее
      в установленном порядке.
  - path: '5'
    parent_path: null
    heading: Общие положения
    text: 'К событиям после отчетной даты относятся: события, подтверждающие существовавшие на отчетную
      дату хозяйственные условия, в которых организация вела свою деятельность; события, свидетельствующие
      о возникших после отчетной даты хозяйственных условиях, в которых организация ведет свою деятельность.
      Примерный перечень фактов хозяйственной деятельности, которые могут быть признаны событиями после
      отчетной даты, приведен в приложении к настоящему Положению.'
  - path: '6'
    parent_path: null
    heading: Общие положения
    text: Существенное событие после отчетной даты подлежит отражению в бухгалтерской отчетности за отчетный
      год независимо от положительного или отрицательного его характера для организации. Событие после
      отчетной даты признается существенным, если без знания о нем пользователями бухгалтерской отчетности
      невозможна достоверная оценка финансового состояния, движения денежных средств или результатов деятельности
      организации. Существенность события после отчетной даты организация определяет самостоятельно исходя
      из общих требований к бухгалтерской отчетности. (в ред. приказа Минфина России от 20.12.2007 № 143н)
  - path: '7'
    parent_path: null
    heading: Общие положения
    text: Последствия события после отчетной даты отражаются в бухгалтерской отчетности путем уточнения
      данных о соответствующих активах, обязательствах, капитале, доходах и расходах организации, либо
      путем раскрытия соответствующей информации.
  - path: '8'
    parent_path: null
    heading: Общие положения
    text: При составлении бухгалтерской отчетности организация оценивает последствия события после отчетной
      даты в денежном выражении. Для оценки в денежном выражении последствий события после отчетной даты
      организация делает соответствующий расчет. Организацией должно быть обеспечено подтверждение такого
      расчета.
  - path: '9'
    parent_path: null
    heading: Общие положения
    text: Данные об активах, обязательствах, капитале, доходах и расходах организации отражаются в бухгалтерской
      отчетности с учетом событий после отчетной даты, подтверждающих существовавшие на отчетную дату
      хозяйственные условия, в которых организация вела свою деятельность, или свидетельствующих о возникших
      после отчетной даты хозяйственных условий, в которых организация ведет свою деятельность, и тем
      самым невозможности применения допущения непрерывности деятельности к деятельности организации в
      целом или какой-либо существенной ее части. При этом события после отчетной даты отражаются в синтетическом
      и аналитическом учете заключительными оборотами отчетного периода до даты подписания годовой бухгалтерской
      отчетности в установленном порядке. (в ред. приказа Минфина России от 20.12.2007 № 143н) Пример.
      На основании данных синтетического и аналитического учета в бухгалтерской отчетности организации
      по состоянию на 31 декабря отчетного года подлежит отражению дебиторская задолженность на общую
      сумму 10 млн. руб. В марте года, следующего за отчетным, организация получила информацию о том,
      что один из дебиторов, задолженность которого по состоянию на 31 декабря отчетного года составляла
      4 млн. руб., признан в установленном порядке в конце февраля банкротом. В данной ситуации организация
      должна уменьшить сумму дебиторской задолженности на 4 млн. руб. и признать в бухгалтерской отчетности
      по состоянию на 31 декабря отчетного года убыток от списания дебиторской задолженности. Необходимые
      записи в бухгалтерском учете организации по списанию соответствующей дебиторской задолженности должны
      быть произведены заключительными оборотами отчетного периода. Порядок расчета и отражения в бухгалтерском
      учете и отчетности налоговых последствий событий после отчетной даты, предусмотренных настоящим
      пунктом, устанавливается отдельным положением по бухгалтерскому учету. При наступлении события после
      отчетной даты в бухгалтерском учете периода, следующего за отчетным, производится сторнировочная
      (или обратная) запись на сумму, отраженную в бухгалтерском учете отчетного периода в соответствии
      с настоящим пунктом. Одновременно в бухгалтерском учете периода, следующего за отчетным, в общем
      порядке делается запись, отражающая это событие.
  - path: '10'
    parent_path: null
    heading: Общие положения
    text: Событие после отчетной даты, свидетельствующее о возникших после отчетной даты хозяйственных
      условиях, в которых организация ведет свою деятельность, раскрывается в пояснениях к бухгалтерскому
      балансу и отчету о финансовых результатах. При этом в отчетном периоде никакие записи в бухгалтерском
      (синтетическом и аналитическом) учете не производятся. (в ред. приказа Минфина России от 06.04.2015
      № 57н) В таком же порядке отражаются в бухгалтерской отчетности годовые дивиденды, рекомендованные
      или объявленные в установленном порядке по результатам работы организации за отчетный год. Пример.
      В бухгалтерском балансе по состоянию на 31 декабря отчетного года отражены значительные вложения
      организации в акции другой организации. В марте года, следующего за отчетным, организация получила
      информацию о том, что рыночная цена этих акций в марте значительно уменьшилась. В данной ситуации
      организация должна раскрыть в пояснениях к бухгалтерскому балансу и отчету о финансовых результатах
      соответствующую информацию. (в ред. приказа Минфина России от 06.04.2015 № 57н) При наступлении
      события после отчетной даты в бухгалтерском учете периода, следующего за отчетным, в общем порядке
      делается запись, отражающая это событие.
  - path: '11'
    parent_path: null
    heading: Общие положения
    text: Информация, раскрываемая в пояснениях к бухгалтерскому балансу и отчету о финансовых результатах
      в соответствии с пунктом 10 настоящего Положения, должна включать краткое описание характера события
      после отчетной даты и оценку его последствий в денежном выражении. Если возможность оценить последствия
      события после отчетной даты в денежном выражении отсутствует, то организация должна указать на это.
      (в ред. приказа Минфина России от 06.04.2015 № 57н)
  - path: '12'
    parent_path: null
    heading: Общие положения
    text: В случае если в период между датой подписания бухгалтерской отчетности и датой ее утверждения
      в установленном порядке получена новая информация о событиях после отчетной даты, раскрытых в бухгалтерской
      отчетности, представленной пользователям, и (или) произошли (выявлены) события, которые могут оказать
      существенное влияние на финансовое состояние, движение денежных средств или результаты деятельности
      организации, то организация информирует об этом лиц, которым была представлена данная бухгалтерская
      отчетность. (п. 12 введен приказом Минфина России от 20.12.2007 № 143н)