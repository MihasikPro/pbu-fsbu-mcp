id: pbu-13-2000
kind: ПБУ
number: 13/2000
year: 2000
title: Учет государственной помощи
order_date: 2000-10-16
order_no: 92н
effective_from: &id001 2001-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает правила формирования в бухгалтерском учете информации о получении
      и использовании государственной помощи, предоставляемой коммерческим организациям (кроме кредитных
      организаций и организаций государственного сектора), являющимся юридическими лицами по законодательству
      Российской Федерации (далее организации), и признаваемой как увеличение экономической выгоды конкретной
      организации в результате поступления активов (денежных средств, иного имущества). (в ред. приказа
      Минфина России от 04.12.2018 № 248н)
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: При применении настоящего Положения не рассматриваются в качестве экономической выгоды создание
      инфраструктуры в развивающихся регионах, установление ограничений на деятельность конкурентов, занимающих
      доминирующее положение на рынке и осуществляющих монополистическую деятельность и т.п. действия,
      которые могут оказывать влияние на общие хозяйственные условия, в которых ведет деятельность организация.
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: 'Настоящее Положение не применяется в отношении экономической выгоды, связанной с: государственным
      регулированием цен и тарифов; применением соответствующих правил налогообложения прибыли (предоставление
      налоговых льгот, отсрочки или рассрочки по уплате налогов и сборов, инвестиционных налоговых кредитов
      и др.); участием Российской Федерации, субъектов Российской Федерации и муниципальных образований
      в уставных (складочных) капиталах юридических лиц, уставных фондах государственных и муниципальных
      унитарных предприятий, в том числе предоставлением бюджетных средств в связи с таким участием; (в
      ред. приказа Минфина России от 04.12.2018 № 248н) возмещением недополученных доходов и (или) финансовым
      обеспечением (возмещением) затрат в связи с производством (реализацией) товаров, выполнением работ,
      оказанием услуг на договорной основе. (абзац введен приказом Минфина России от 04.12.2018 №248н)'
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: 'Исходя из настоящего Положения в бухгалтерском учете формируется информация о государственной
      помощи, предоставленной из бюджетов бюджетной системы Российской Федерации и бюджетов государственных
      внебюджетных фондов в форме субсидий (далее – бюджетные средства), бюджетных кредитов (за исключением
      налоговых кредитов, отсрочек и рассрочек по уплате налогов и платежей и других обязательств), включая
      предоставление в виде ресурсов, отличных от денежных средств (земельные участки, природные ресурсы
      и другое имущество), и в прочих формах . Информация о государственной помощи формируется независимо
      от вида предоставленных ресурсов (в виде денежных средств или (и) в виде ресурсов, отличных от денежных
      средств). (в ред. приказа Минфина России от 04.12.2018 № 248н) Для целей бухгалтерского учета бюджетные
      средства подразделяются на: средства на финансирование капитальных затрат, связанных с покупкой,
      строительством или приобретением иным путем внеоборотных активов (основных средств и др.). Предоставление
      этих средств может сопровождаться дополнительными условиями, ограничивающими приобретение определенных
      видов активов, их местонахождение или сроки приобретения и владения; средства на финансирование
      текущих расходов. К ним относятся бюджетные средства, отличные от предназначенных на финансирование
      капитальных расходов.'
  - path: '5'
    parent_path: null
    heading: Учет бюджетных средств
    text: 'Организация принимает бюджетные средства, включая ресурсы, отличные от денежных средств, к
      бухгалтерскому учету по мере фактического получения средств либо при наличии следующих условий:
      (в ред. приказа Минфина России от 04.12.2018 № 248н) имеется уверенность, что условия предоставления
      этих средств организацией будут выполнены. Подтверждением могут быть заключенные организацией договоры,
      принятые и публично объявленные решения, технико-экономические обоснования, утвержденная проектно-сметная
      документация и т.п.; имеется уверенность, что указанные средства будут получены. Подтверждением
      могут быть утвержденная бюджетная роспись, уведомление о бюджетных ассигнованиях, лимитах бюджетных
      обязательств, акты приемки-передачи ресурсов и иные соответствующие документы.'
  - path: '6'
    parent_path: null
    heading: Учет бюджетных средств
    text: В случае предоставления организации государственной помощи в виде ресурсов, отличных от денежных
      средств (земельные участки, природные ресурсы и другое имущество), указанные ресурсы принимаются
      к бухгалтерскому учету в сумме, равной стоимости полученных или подлежащих получению активов. Стоимость
      активов, полученных или подлежащих получению, определяется организацией исходя из цены, по которой
      в сравнимых обстоятельствах обычно она устанавливает стоимость таких же или аналогичных активов.
  - path: '7'
    parent_path: null
    heading: Учет бюджетных средств
    text: Бюджетные средства, принятые к бухгалтерскому учету в соответствии с условиями, приведенными
      в пункте 5 настоящего Положения, отражаются в бухгалтерском учете как возникновение целевого финансирования
      и задолженности по этим средствам. По мере фактического получения средств соответствующие суммы
      уменьшают задолженность и увеличивают счета учета денежных средств, капитальных вложений и т.п.
      (в ред. приказа Минфина России от 04.12.2018 № 248н) Если бюджетные средства признаются в бухгалтерском
      учете по мере фактического получения ресурсов, то с возникновением целевого финансирования увеличиваются
      счета учета денежных средств, капитальных вложений и т.п.
  - path: '8'
    parent_path: null
    heading: Учет бюджетных средств
    text: Бюджетные средства списываются со счета учета целевого финансирования как увеличение финансовых
      результатов организации. Одновременно по внеоборотным активам, приобретенным за счет бюджетных средств
      и подлежащим согласно действующим правилам амортизации, в общем порядке начисляются амортизационные
      отчисления.
  - path: '9'
    parent_path: null
    heading: Учет бюджетных средств
    text: 'Списание бюджетных средств со счета учета целевого финансирования производится на систематической
      основе: суммы бюджетных средств на финансирование капитальных затрат - по мере начисления амортизации
      на протяжении срока полезного использования внеоборотных активов, подлежащих амортизации, или в
      течение периода признания расходов, связанных с выполнением условий предоставления бюджетных средств
      на приобретение внеоборотных активов, не подлежащих амортизации. При этом целевое финансирование
      учитывается при вводе объектов внеоборотных активов в эксплуатацию в качестве доходов будущих периодов
      с последующим отнесением в течение срока полезного использования объектов внеоборотных активов по
      мере начисления амортизации на финансовые результаты организации ; (в ред. приказов Минфина России
      от 18.09.2006 № 115н, от 04.12.2018 № 248н) суммы бюджетных средств на финансирование текущих расходов
      - в периоды признания расходов, на финансирование которых они предоставлены. При этом целевое финансирование
      признается в качестве доходов будущих периодов в момент принятия к бухгалтерскому учету запасов
      и других активов с последующим отнесением на доходы отчетного периода при отпуске запасов в производство
      продукции, на выполнение работ (оказание услуг), начисления оплаты труда и осуществления других
      расходов аналогичного характера. (в ред. приказа Минфина России от 04.12.2018 № 248н) Если выделение
      бюджетных средств связано с выполнением определенных условий, то период, в течение которого производится
      списание суммы со счета учета целевого финансирования, должен определяться исходя из времени признания
      отдельных видов расходов.'
  - path: '10'
    parent_path: null
    heading: Учет бюджетных средств
    text: Бюджетные средства, предоставленные в установленном порядке на финансирование расходов, понесенных
      организацией в предыдущие отчетные периоды, относятся на увеличение финансового результата организации.
      (в ред. приказов Минфина России от 18.09.2006 № 115н, от 04.12.2018 № 248н) Бюджетные средства,
      предоставленные на финансирование капитальных затрат, понесенных организацией в предыдущие отчетные
      периоды, отражаются в размере начисленной амортизации как увеличение финансового результата организации,
      в оставшейся части – в качестве доходов будущих периодов. (абзац введен приказом Минфина России
      от 04.12.2018 №248н)
  - path: '11'
    parent_path: null
    heading: Учет бюджетных средств
    text: Утратил силу – приказ Минфина России от 04.12.2018 №248н)
  - path: '12'
    parent_path: null
    heading: Учет бюджетных средств
    text: Если организация фактически получила бюджетные средства, но достаточная уверенность в том, что
      она выполнит условия предоставления этих средств, отсутствует, то в бухгалтерском учете отражаются
      возникновение целевого финансирования и поступление денежных средств, капитальных вложений и т.п.
      Эти суммы учитываются как целевое финансирование до получения достаточных подтверждений того, что
      организация выполнит условия их предоставления.
  - path: '13'
    parent_path: null
    heading: Учет бюджетных средств
    text: Если в отчетном году возникают обстоятельства, в связи с которыми организация должна возвратить
      ресурсы, признанные ранее в этом же году в качестве бюджетных средств согласно пункту 5 настоящего
      Положения, то в бухгалтерском учете производятся исправительные записи.
  - path: '14'
    parent_path: null
    heading: Учет бюджетных средств
    text: 'Если в отчетном году возникают обстоятельства, в связи с которыми организация должна возвратить
      средства, полученные в качестве государственной помощи в предыдущие годы, то на сумму, подлежащую
      возврату, производится запись: в части предоставленных бюджетных средств на финансирование капитальных
      затрат - в уменьшение целевого финансирования и возникновение задолженности по их возврату. Одновременно
      уменьшаются финансовые результаты организации и восстанавливается целевое финансирование на сумму
      амортизации основных средств и нематериальных активов, которая была начислена, и несписанной суммы
      доходов будущих периодов; (в ред. приказа Минфина России от 04.12.2018 № 248н) в части бюджетных
      средств на финансирование текущих расходов - в уменьшение целевого финансирования и возникновения
      задолженности по их возврату. Если сумма, подлежащая возврату, превышает соответствующий остаток
      целевого финансирования или такой остаток отсутствует вовсе, то в бухгалтерском учете производится
      запись в уменьшение финансовых результатов организации и возникновение задолженности по их возврату.'
  - path: '15'
    parent_path: null
    heading: Учет бюджетных средств
    text: Порядок бухгалтерского учета бюджетных средств не зависит от вида ресурсов, предоставляемых
      организации (денежные средства, активы, отличные от денежных средств), а также способа предоставления
      их (фактическая передача, уменьшение обязательств перед государством). III. Учет бюджетных кредитов
      и прочих форм государственной помощи
  - path: '16'
    parent_path: null
    heading: Учет бюджетных средств
    text: Бюджетные кредиты, предоставленные организации, отражаются в бухгалтерском учете в общем порядке,
      принятом для учета заемных средств.
  - path: '17'
    parent_path: null
    heading: Учет бюджетных средств
    text: Если при предоставлении бюджетных кредитов на возвратной основе предусматривается, что при выполнении
      определенных условий организация освобождается от возврата полученных ресурсов, и существует достаточная
      уверенность в том, что организация выполнит эти условия, то такие средства учитываются в порядке,
      установленном настоящим Положением для учета бюджетных средств.
  - path: '18'
    parent_path: null
    heading: Учет бюджетных средств
    text: Предоставленная организации выгода, которая не может быть обоснованно оценена (оказание консультационных
      услуг на безвозмездной основе, предоставление гарантий, беспроцентные займы или займы с пониженным
      процентом и др.), а также не может быть отделена от нормальной хозяйственной деятельности организации
      (например, государственные закупки), для целей раскрытия информации в бухгалтерской отчетности считается
      прочими формами государственной помощи.
  - path: '19'
    parent_path: null
    heading: Учет бюджетных средств
    text: Прочие формы государственной помощи в случае их существенности для характеристики финансового
      положения и финансовых результатов деятельности организации подлежат раскрытию в бухгалтерской отчетности.
      (в ред. приказа Минфина России от 04.12.2018 № 248н)
  - path: '20'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'В бухгалтерском балансе с учетом существенности отражаются по отдельным статьям:'
  - path: 20.а
    parent_path: '20'
    heading: null
    text: остаток средств целевого финансирования в части предоставленных организации бюджетных средств;
  - path: 20.б
    parent_path: '20'
    heading: null
    text: дебиторская задолженность в части бюджетных средств, принятых к бухгалтерскому учету в соответствии
      с пунктом 7 настоящего Положения;
  - path: 20.в
    parent_path: '20'
    heading: null
    text: кредиторская задолженность по возврату бюджетных средств, признанного в соответствии с пунктом
      14 настоящего Положения;
  - path: 20.г
    parent_path: '20'
    heading: null
    text: доходы будущих периодов, признанные в соответствии с абзацем третьим пункта 9 настоящего Положения
      в связи с государственной помощью на финансирование текущих расходов, в составе краткосрочных обязательств.
  - path: 20.заключение
    parent_path: '20'
    heading: null
    text: (п.20 в ред. приказа Минфина России от 04.12.2018 № 248н)
  - path: '21'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'Доходы будущих периодов, признанные в соответствии с абзацем вторым пункта 9 настоящего Положения
      в связи с полученными бюджетными средствами на финансирование капитальных затрат, представляются
      в бухгалтерском балансе одним из следующих способов:'
  - path: 21.а
    parent_path: '21'
    heading: null
    text: в качестве обособленной статьи в составе долгосрочных обязательств. При этом суммы, отнесенные
      в отчетном периоде на финансовые результаты, представляются в отчете о финансовых результатах в
      качестве отдельной статьи доходов;
  - path: 21.б
    parent_path: '21'
    heading: null
    text: в качестве регулирующей величины, уменьшающей балансовую стоимость внеоборотных активов. При
      этом суммы, отнесенные в отчетном периоде на финансовые результаты, уменьшают в отчете о финансовых
      результатах расходы по амортизации. Доходы, признанные в соответствии с абзацем третьим пункта 9
      настоящего Положения, представляются в отчете о финансовых результатах по выбору организации в качестве
      отдельной статьи доходов (с учетом существенности), либо в качестве суммы, уменьшающей расходы,
      на финансирование которых получены соответствующие бюджетные средства.».
  - path: 21.заключение
    parent_path: '21'
    heading: null
    text: (п.21 в ред. приказа Минфина России от 04.12.2018 № 248н)
  - path: '22'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'В бухгалтерской отчетности организации подлежит раскрытию, как минимум, следующая информация
      в отношении государственной помощи: характер и величина бюджетных средств, признанных в бухгалтерском
      учете в отчетном году; назначение и величина бюджетных кредитов; характер прочих форм государственной
      помощи, от которых организация прямо получает экономические выгоды; не выполненные по состоянию
      на отчетную дату условия предоставления бюджетных средств и связанные с ними условные обязательства
      и условные активы. способы представления информации в бухгалтерской отчетности, выбранные организацией
      в соответствии с пунктом 21 настоящего Положения.». (абзац введен приказом Минфина России от 04.12.2018
