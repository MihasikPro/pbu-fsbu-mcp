id: fsbu-28-2023
kind: ФСБУ
number: 28/2023
year: 2023
title: Инвентаризация
order_date: 2023-01-13
order_no: 4н
effective_from: &id001 2025-04-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящий федеральный стандарт бухгалтерского учета (далее – Стандарт) устанавливает требования
      к инвентаризации активов и обязательств (далее – инвентаризация) экономических субъектов, за исключением
      организаций бюджетной сферы, а также случаи, сроки, порядок обязательного проведения инвентаризации
      и перечень объектов бухгалтерского учета, подлежащих инвентаризации при ее обязательном проведении.
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Инвентаризация драгоценных металлов и драгоценных камней проводится в соответствии с Инструкцией
      о порядке учета и хранения драгоценных металлов, драгоценных камней, продукции из них и ведения
      отчетности при их производстве, использовании и обращении, утвержденной приказом Министерства финансов
      Российской Федерации от 9 декабря 2016 г. № 231н (зарегистрирован Министерством юстиции Российской
      Федерации 9 января 2017 г., регистрационный № 45111) [1] .
  - path: '3'
    parent_path: null
    heading: Требования к инвентаризации
    text: При проведении инвентаризации фактическое наличие должно выявляться по всем активам и обязательствам,
      являющимся объектами этой инвентаризации. Фактическое наличие активов и обязательств должно выявляться
      путем установления их действительного существования, оценки их состояния и обоснованности нахождения
      у экономического субъекта.
  - path: '4'
    parent_path: null
    heading: Требования к инвентаризации
    text: 'Фактическое наличие объектов инвентаризации должно определяться:'
  - path: 4.а
    parent_path: '4'
    heading: null
    text: путем подсчета, взвешивания, обмера, осмотра, если иное не установлено Стандартом в отношении
      активов, объектов бухгалтерского учета, которые согласно федеральным стандартам бухгалтерского учета
      не учитываются в составе активов, но подлежат отражению в бухгалтерском учете на забалансовых счетах
      и (или) информация о которых подлежит раскрытию в бухгалтерской (финансовой) отчетности, имущества,
      не учтенного экономическим субъектом. В случае, когда применение способов выявления фактического
      наличия отдельных видов активов, предусмотренных Стандартом, невозможно или излишне затратно, допускается
      применение альтернативных способов выявления фактического наличия объектов таких активов, обеспечивающих
      реализацию цели инвентаризации (в том числе, видео-, фотофиксация);
  - path: 4.б
    parent_path: '4'
    heading: null
    text: путем проверки документов, выполнения расчетов в отношении активов, относящихся к нематериальным
      активам и капитальным вложениям в них, денежным средствам на счетах в кредитных и иных организациях,
      финансовым вложениям, дебиторской задолженности, и иных аналогичных активов, обязательств, отложенных
      налоговых активов и обязательств, источников финансирования деятельности экономического субъекта,
      объектов бухгалтерского учета, которые согласно федеральным стандартам бухгалтерского учета не учитываются
      в составе обязательств, но подлежат отражению в бухгалтерском учете на забалансовых счетах и (или)
      информация о которых подлежит раскрытию в бухгалтерской (финансовой) отчетности, имущественных прав
      и обязательств, не учтенных экономическим субъектом.
  - path: '5'
    parent_path: null
    heading: Требования к инвентаризации
    text: Сведения о фактическом наличии объектов инвентаризации, сопоставление их с данными регистров
      бухгалтерского учета, результаты инвентаризации подлежат оформлению документами (в частности, инвентаризационные
      описи, акты инвентаризации, сличительные ведомости) (далее – документы инвентаризации). Допускается
      применение документов, в которых объединены показатели документов, содержащих сведения о фактическом
      наличии объектов инвентаризации, и документов, содержащих результаты инвентаризации.
  - path: '6'
    parent_path: null
    heading: Требования к инвентаризации
    text: Документы инвентаризации составляются, хранятся и исправляются в соответствии с требованиями,
      установленными для первичных учетных документов и регистров бухгалтерского учета Федеральным законом
      от 6 декабря 2011 г. № 402‑ФЗ «О бухгалтерском учете» (Собрание законодательства Российской Федерации,
      2011, № 50, ст. 7344; 2022, № 50, ст. 8792) (далее – Федеральный закон «О бухгалтерском учете»)
      и Федеральным стандартом бухгалтерского учета ФСБУ 27/2021 «Документы и документооборот в бухгалтерском
      учете», утвержденным приказом Министерства финансов Российской Федерации от 16 апреля 2021 г. №
      62н (зарегистрирован Министерством юстиции Российской Федерации 7 июня 2021 г., регистрационный
      № 63814) [2] с учетом положений Стандарта.
  - path: '7'
    parent_path: null
    heading: Требования к инвентаризации
    text: Для проведения инвентаризации должны быть созданы условия, обеспечивающие полное и точное выявление
      фактического наличия объектов инвентаризации (в частности, обеспечение работниками, исправными техническими
      и транспортными средствами, средствами связи и коммуникаций, весовым хозяйством, измерительными
      и контрольными приборами, мерной тарой).
  - path: '8'
    parent_path: null
    heading: Требования к инвентаризации
    text: Выявленные при инвентаризации расхождения между фактическим наличием объектов и данными регистров
      бухгалтерского учета (далее – результаты инвентаризации) подлежат отражению в бухгалтерском учете
      экономического субъекта.
  - path: '9'
    parent_path: null
    heading: Требования к инвентаризации
    text: 'Результаты инвентаризации подлежат отражению в бухгалтерском учете на основании их квалификации,
      утвержденной руководителем экономического субъекта по представлению лица (лиц), на которое (которые)
      возложено проведение инвентаризации. Для целей Стандарта под квалификацией результатов инвентаризации
      понимается определение:'
  - path: 9.а
    parent_path: '9'
    heading: null
    text: объектов инвентаризации, оказавшихся в излишке;
  - path: 9.б
    parent_path: '9'
    heading: null
    text: утраченных активов и активов, оказавшихся испорченными (поврежденными) (далее вместе – недостача
      активов) в пределах, сверх или в отсутствие норм естественной убыли;
  - path: 9.в
    parent_path: '9'
    heading: null
    text: возможности использования активов, оказавшихся испорченными (поврежденными), либо их продажи;
  - path: 9.г
    parent_path: '9'
    heading: null
    text: наличия пересортицы активов;
  - path: 9.д
    parent_path: '9'
    heading: null
    text: наличия оснований для возмещения недостачи активов экономическому субъекту, для признания дебиторской
      задолженности сомнительной или безнадежной, для списания обязательств, для доначисления или досписания
      иных объектов бухгалтерского учета.
  - path: '10'
    parent_path: null
    heading: Требования к инвентаризации
    text: 'В соответствии с частью 4 статьи 11 Федерального закона «О бухгалтерском учете» [3] результаты
      инвентаризации подлежат регистрации в бухгалтерском учете в том отчетном периоде, к которому относится
      дата, по состоянию на которую проводилась инвентаризация. В частности, при составлении годовой бухгалтерской
      (финансовой) отчетности:'
  - path: 10.а
    parent_path: '10'
    heading: null
    text: результаты инвентаризации относящихся к запасам активов, проведенной в районах Крайнего Севера
      и приравненных к ним местностях в период наименьших остатков таких активов, регистрируются в бухгалтерском
      учете того отчетного периода, в котором была закончена инвентаризация, но не позднее последнего
      календарного дня отчетного года;
  - path: 10.б
    parent_path: '10'
    heading: null
    text: результаты инвентаризации активов, проведенной не ранее 1 октября отчетного года, допускается
      регистрировать в бухгалтерском учете того отчетного периода, в котором была закончена инвентаризация,
      но не позднее последнего календарного дня отчетного года;
  - path: 10.в
    parent_path: '10'
    heading: null
    text: результаты инвентаризации иных объектов инвентаризации регистрируются в бухгалтерском учете
      последним календарным днем отчетного года.
  - path: '11'
    parent_path: null
    heading: Требования к инвентаризации
    text: 'Результаты инвентаризации подлежат принятию к бухгалтерскому учету в следующей оценке, определяемой
      на дату, по состоянию на которую проводилась инвентаризация:'
  - path: 11.а
    parent_path: '11'
    heading: null
    text: активы, оказавшиеся в излишке, – по их справедливой стоимости, либо по их балансовой стоимости,
      либо по балансовой стоимости аналогичных активов;
  - path: 11.б
    parent_path: '11'
    heading: null
    text: недостача активов – по балансовой стоимости активов;
  - path: 11.в
    parent_path: '11'
    heading: null
    text: расхождения в суммах дебиторской задолженности и обязательств, за исключением указанных в подпункте
      «г» настоящего пункта, – в суммах, вытекающих из документов, подтверждающих эти задолженность, обязательства
      и признаваемых правильными экономическим субъектом;
  - path: 11.г
    parent_path: '11'
    heading: null
    text: расхождения в суммах оценочных обязательств, отложенных налоговых активов и обязательств – в
      суммах, подтвержденных соответствующими расчетами.
  - path: 11.заключение
    parent_path: '11'
    heading: null
    text: Для целей Стандарта справедливая стоимость определяется в порядке, предусмотренном Международным
      стандартом финансовой отчетности (IFRS) 13 «Оценка справедливой стоимости», введенным в действие
      на территории Российской Федерации приказом Министерства финансов Российской Федерации от 28 декабря
      2015 г. № 217н (зарегистрирован Министерством юстиции Российской Федерации 2 февраля 2016 г., регистрационный
      № 40940) [4] . Балансовая стоимость активов определяется в соответствии с федеральными стандартами
      бухгалтерского учета соответствующих объектов бухгалтерского учета.
  - path: '12'
    parent_path: null
    heading: Требования к инвентаризации
    text: 'Результаты инвентаризации подлежат отражению на счетах бухгалтерского учета в следующем порядке:'
  - path: 12.а
    parent_path: '12'
    heading: null
    text: стоимость активов, оказавшихся в излишке, относится на доходы экономического субъекта;
  - path: 12.б
    parent_path: '12'
    heading: null
    text: стоимость утраченных активов, а также активов, оказавшихся испорченными (поврежденными) и не
      подлежащих использованию или продаже, относится на виновных и (или) иных лиц (при наличии оснований
      для ее возмещения, в том числе намерения экономического субъекта предъявить требование такого возмещения)
      или на расходы экономического субъекта (при отсутствии оснований для ее возмещения);
  - path: 12.в
    parent_path: '12'
    heading: null
    text: стоимость активов, оказавшихся испорченными (поврежденными), но подлежащих использованию либо
      продаже, корректируется на сумму обесценения в соответствии с федеральными стандартами бухгалтерского
      учета соответствующих объектов бухгалтерского учета;
  - path: 12.г
    parent_path: '12'
    heading: null
    text: выявленные при инвентаризации суммы дебиторской задолженности и обязательств, по которым срок
      исковой давности истек, а также иных долгов, нереальных для взыскания, списываются с бухгалтерского
      баланса в соответствии с федеральными стандартами бухгалтерского учета соответствующих объектов
      бухгалтерского учета;
  - path: 12.д
    parent_path: '12'
    heading: null
    text: выявленные при инвентаризации расхождения в суммах дебиторской задолженности и обязательств,
      отличных от указанных в подпункте «г» настоящего пункта, отложенных налоговых активов и обязательств
      доначисляются или досписываются в соответствии с федеральными стандартами бухгалтерского учета соответствующих
      объектов бухгалтерского учета.
  - path: '13'
    parent_path: null
    heading: Требования к инвентаризации
    text: Зачет излишков и недостач активов, относящихся к запасам, и иных аналогичных активов в результате
      пересортицы допускается в исключительных случаях за один и тот же период, у одного и того же материально
      ответственного лица, в отношении активов одного и того же наименования и в тождественных количествах.
      В случае, когда при зачете недостач излишками по пересортице стоимость недостающих активов выше
      стоимости активов, оказавшихся в излишке, образовавшаяся разница подлежит отражению в порядке, установленном
      подпунктом «б» пункта 12 Стандарта.
  - path: '14'
    parent_path: null
    heading: Требования к инвентаризации
    text: 'Недостача активов, для которых экономическим субъектом установлены нормы естественной убыли,
      подлежит отражению на счетах бухгалтерского учета в следующем порядке:'
  - path: 14.а
    parent_path: '14'
    heading: null
    text: 'убыль активов в пределах норм относится на затраты, относящиеся к производству продукции, выполнению
      работ, оказанию услуг или расходы на продажу при осуществлении торговой деятельности. При этом:
      нормы убыли применяются только в случае выявления фактической недостачи активов; убыль активов в
      пределах норм определяется после зачета недостач активов излишками по пересортице. При наличии недостачи
      активов после зачета по пересортице нормы естественной убыли применяются только по тому наименованию
      активов, по которому установлена недостача;'
  - path: 14.б
    parent_path: '14'
    heading: null
    text: убыль активов сверх норм отражается в порядке, установленном подпунктом «б» пункта 12 Стандарта.
  - path: '15'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: 'Проведение инвентаризации обязательно в случаях, установленных законодательством Российской
      Федерации [5] , а также в следующих случаях:'
  - path: 15.а
    parent_path: '15'
    heading: null
    text: при составлении годовой бухгалтерской (финансовой) отчетности. Экономический субъект вправе
      проводить инвентаризацию библиотечных фондов один раз в пять лет, иных основных средств – один раз
      в три года;
  - path: 15.б
    parent_path: '15'
    heading: null
    text: при передаче (возврате) активов экономического субъекта, имущественного комплекса (за исключением
      обычной деятельности экономического субъекта) в аренду, управление, безвозмездное пользование, а
      также при отчуждении активов экономического субъекта;
  - path: 15.в
    parent_path: '15'
    heading: null
    text: при смене работника, на которого возложена материальная ответственность;
  - path: 15.г
    parent_path: '15'
    heading: null
    text: при смене руководителя коллектива (бригадира), при выбытии из коллектива (бригады) более 50
      процентов его членов, а также по требованию одного или нескольких членов коллектива (бригады) (при
      коллективной (бригадной) материальной ответственности);
  - path: 15.д
    parent_path: '15'
    heading: null
    text: при установлении факта утраты или порчи (повреждения) активов;
  - path: 15.е
    parent_path: '15'
    heading: null
    text: в случае пожара, аварии, стихийного бедствия, а также иного бедствия, в результате которого
      сложилась чрезвычайная ситуация;
  - path: 15.ж
    parent_path: '15'
    heading: null
    text: при реорганизации организации, за исключением случаев реорганизации в форме преобразования;
  - path: 15.з
    parent_path: '15'
    heading: null
    text: при ликвидации организации.
  - path: 15.заключение
    parent_path: '15'
    heading: null
    text: Для целей Стандарта работники, на которых возложена материальная ответственность, а также руководители
      коллектива (бригадиры) и члены коллектива (бригады) при коллективной (бригадной) материальной ответственности
      именуются вместе материально ответственными лицами.
  - path: '16'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: 'В случаях, указанных в пункте 15 Стандарта, инвентаризация проводится:'
  - path: 16.а
    parent_path: '16'
    heading: null
    text: при составлении годовой бухгалтерской (финансовой) отчетности – по состоянию на отчетную дату,
      за исключением активов, относящихся к основным средствам, нематериальным активам, капитальным вложениям,
      запасам, инвентаризация которых проводилась не ранее 1 октября отчетного года. В районах Крайнего
      Севера и приравненных к ним местностях инвентаризация активов, относящихся к запасам, может проводиться
      в период их наименьших остатков;
  - path: 16.б
    parent_path: '16'
    heading: null
    text: при передаче (возврате) активов экономического субъекта, имущественного комплекса (за исключением
      обычной деятельности экономического субъекта) в аренду, управление, безвозмездное пользование, а
      также при отчуждении активов экономического субъекта – непосредственно перед передачей (возвратом)
      в аренду, управление, безвозмездное пользование, перед отчуждением;
  - path: 16.в
    parent_path: '16'
    heading: null
    text: при смене работника, на которого возложена материальная ответственность, руководителя коллектива
      (бригадира), при выбытии из коллектива (бригады) более 50 процентов его членов (при коллективной
      (бригадной) материальной ответственности) – по состоянию на день приемки-передачи дел;
  - path: 16.г
    parent_path: '16'
    heading: null
    text: по требованию одного или нескольких членов коллектива (бригады) (при коллективной (бригадной)
      материальной ответственности) – непосредственно по факту предъявления требования;
  - path: 16.д
    parent_path: '16'
    heading: null
    text: при установлении факта утраты или порчи (повреждения) активов – непосредственно по установлению
      такого факта;
  - path: 16.е
    parent_path: '16'
    heading: null
    text: в случае пожара, аварии, стихийного бедствия, а также иного бедствия, в результате которого
      сложилась чрезвычайная ситуация, – непосредственно по окончании соответствующего события (при наличии
      возможности проведения инвентаризации в данный срок);
  - path: 16.ж
    parent_path: '16'
    heading: null
    text: при реорганизации организации – перед составлением передаточного акта или разделительного баланса;
  - path: 16.з
    parent_path: '16'
    heading: null
    text: при ликвидации организации – перед составлением промежуточного ликвидационного баланса.
  - path: '17'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: Сроки (даты начала и окончания) проведения инвентаризации в случаях, указанных в пункте 15 Стандарта,
      устанавливаются руководителем экономического субъекта с учетом положений пунктов 16 и 18 Стандарта.
  - path: '18'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: 'В случаях, указанных в подпунктах «а», «ж», «з» пункта 15 Стандарта, инвентаризации подлежат
      следующие объекты бухгалтерского учета:'
  - path: 18.а
    parent_path: '18'
    heading: null
    text: активы;
  - path: 18.б
    parent_path: '18'
    heading: null
    text: обязательства;
  - path: 18.в
    parent_path: '18'
    heading: null
    text: источники финансирования деятельности экономического субъекта;
  - path: 18.г
    parent_path: '18'
    heading: null
    text: объекты бухгалтерского учета экономического субъекта (в частности, имущество, имущественные
      права, в том числе других лиц), которые согласно федеральным стандартам бухгалтерского учета не
      учитываются в составе активов или обязательств, но подлежат отражению в бухгалтерском учете на забалансовых
      счетах и (или) информация о которых подлежит раскрытию в бухгалтерской (финансовой) отчетности;
  - path: 18.д
    parent_path: '18'
    heading: null
    text: имущество, имущественные права, обязательства, не учтенные экономическим субъектом.
  - path: 18.заключение
    parent_path: '18'
    heading: null
    text: В случаях, указанных в подпунктах «б»–«е» пункта 15 Стандарта, инвентаризации подлежат объекты
      инвентаризации, которые непосредственно связаны с этими случаями.
  - path: '19'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: Для обязательного проведения инвентаризации создается инвентаризационная комиссия экономического
      субъекта, если иное не предусмотрено Стандартом. При большом объеме работ для одновременного обязательного
      проведения инвентаризации всех объектов могут создаваться несколько инвентаризационных комиссий.
      Распределение обязанностей между такими комиссиями и порядок их взаимодействия устанавливаются руководителем
      экономического субъекта.
  - path: '20'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: Не допускается включение в состав инвентаризационной комиссии лиц, на которых возложена материальная
      ответственность за объекты, проверяемые этой комиссией.
  - path: '21'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: Отсутствие одной пятой и более членов инвентаризационной комиссии при обязательном проведении
      инвентаризации является основанием для признания результатов инвентаризации недействительными.
  - path: '22'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: 'Допускается не создавать инвентаризационную комиссию для обязательного проведения инвентаризации
      в следующих случаях:'
  - path: 22.а
    parent_path: '22'
    heading: null
    text: если работниками экономического субъекта являются только руководитель и главный бухгалтер (бухгалтер),
      либо только руководитель;
  - path: 22.б
    parent_path: '22'
    heading: null
    text: если экономический субъект заключает договор об оказании услуг по проведению инвентаризации
      с аудиторской организацией или индивидуальным аудитором;
  - path: 22.в
    parent_path: '22'
    heading: null
    text: если инвентаризация проводится ревизионной комиссией экономического субъекта при условии, что
      его уставом предусмотрено создание такого органа, а также уставом либо иными документами экономического
      субъекта на этот орган возложены полномочия по проведению инвентаризации.
  - path: 22.заключение
    parent_path: '22'
    heading: null
    text: В случае, если для обязательного проведения инвентаризации инвентаризационная комиссия не создается,
      установленные Стандартом требования и полномочия инвентаризационной комиссии исполняет лицо (лица),
      на которое (которые) возложено обязательное проведение инвентаризации.
  - path: '23'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: Инвентаризация активов, относящихся к основным средствам и капитальным вложениям в них, запасам,
      наличным денежным средствам и денежным документам, и иных аналогичных активов проводится по местонахождению
      этих активов и каждому материально ответственному лицу. Выявление фактического наличия активов,
      указанных в абзаце первом настоящего пункта, производится при обязательном присутствии материально
      ответственных лиц. Не допускается определять фактическое наличие активов со слов материально ответственных
      лиц или по данным регистров бухгалтерского учета.
  - path: '24'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: Фактическое наличие (количество) активов, относящихся к запасам, хранящимся в неповрежденной
      упаковке поставщика, допускается определять на основании документов с обязательными пересчетом количества
      упаковок и проверкой части этих активов в натуре на выборочной основе.
  - path: '25'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: Фактическое наличие (вес или объем) активов, относящихся к навалочным запасам, допускается определять
      на основании обмеров и технических расчетов.
  - path: '26'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: До начала проверки фактического наличия активов инвентаризационная комиссия получает последние
      на момент инвентаризации первичные учетные документы, на основании которых отражается движение активов
      в регистрах бухгалтерского учета (в частности, приходные и расходные документы, отчеты о движении
      активов). Председатель инвентаризационной комиссии визирует такие документы с указанием «до инвентаризации
      на «__________» (дата)».
  - path: '27'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: Материально ответственные лица дают расписки о том, что к началу инвентаризации все первичные
      учетные документы, на основании которых отражается движение активов в регистрах бухгалтерского учета,
      сданы в бухгалтерскую службу экономического субъекта или переданы инвентаризационной комиссии, и
      все активы, вверенные им для хранения или использования, оприходованы, а выбывшие – списаны в расход.
      Аналогичные расписки дают лица, получившие денежные средства в подотчет или доверенности на получение
      активов.
  - path: '28'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: При инвентаризации большого количества активов, относящихся к весовым товарам, документ, оформляющий
      результаты перевеса таких товаров, ведется раздельно одним из членов инвентаризационной комиссии
      и материально ответственным лицом. В конце рабочего дня (или по окончании перевеса) данные этих
      документов сличают, и выверенный итог вносится в документы, содержащие сведения о фактическом наличии
      объектов инвентаризации.
  - path: '29'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: В случае если инвентаризация активов проводится в течение нескольких дней, то доступ в места,
      где находятся такие активы (в частности, помещения складов, кладовых секций, иных соответствующих
      структурных подразделений), в отсутствие инвентаризационной комиссии должен быть ограничен (в том
      числе, помещения опечатаны, установлена сигнализация или видеонаблюдение).
  - path: '30'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: В случае если после инвентаризации материально ответственное лицо обнаружило ошибку в документе,
      содержащем сведения о фактическом наличии объектов инвентаризации, такое лицо должно немедленно
      (в частности, до открытия помещения склада, кладовой, секции, иного соответствующего структурного
      подразделения) заявить об этом инвентаризационной комиссии. Инвентаризационная комиссия осуществляет
      проверку данного заявления и в случае подтверждения его производит исправление ошибки в документе,
      содержащем сведения о фактическом наличии объектов инвентаризации.
  - path: '31'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: 'Документ, содержащий сведения о фактическом наличии активов, относящихся к запасам, и иных
      аналогичных активов, должен содержать, в частности:'
  - path: 31.а
    parent_path: '31'
    heading: null
    text: наименования активов и сведения, идентифицирующие их, их количество по номенклатуре и в единицах
      измерения, принятых в учете;
  - path: 31.б
    parent_path: '31'
    heading: null
    text: количество (прописью) порядковых номеров активов и общее количество (прописью) таких активов
      в натуральных единицах измерения, записанных на каждой странице, вне зависимости от того, в каких
      единицах измерения (в том числе, штуках, килограммах, метрах) эти активы показаны (на каждой странице
      документа);
  - path: 31.в
    parent_path: '31'
    heading: null
    text: отметку о проверке цен, таксировки и подсчета итогов на последней странице документа с подписями
      лиц, производивших эту проверку;
  - path: 31.г
    parent_path: '31'
    heading: null
    text: расписку материально ответственного лица, подтверждающую проверку фактического наличия активов
      инвентаризационной комиссией в его присутствии, отсутствие претензий к инвентаризационной комиссии
      и принятие перечисленных в документе активов для хранения или использования (в конце документа);
  - path: 31.д
    parent_path: '31'
    heading: null
    text: в случае смены материально ответственных лиц подписи лица, принявшего актив, и лица, сдавшего
      этот актив;
  - path: 31.е
    parent_path: '31'
    heading: null
    text: подписи всех членов инвентаризационной комиссии и соответствующего материально ответственного
      лица.
  - path: 31.заключение
    parent_path: '31'
    heading: null
    text: В случае истребования документа, содержащего сведения о фактическом наличии активов, материально
      ответственным лицом инвентаризационная комиссия должна обеспечить предоставление такого документа.
  - path: '32'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: На объекты инвентаризации, указанные в подпунктах «г» и «д» пункта 18 Стандарта, составляются
      отдельные документы инвентаризации.
  - path: '33'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: Документ на бумажном носителе, содержащий сведения о фактическом наличии объектов инвентаризации,
      не должен содержать незаполненные строки. В случае если на последней странице такого документа остаются
      незаполненные строки, эти строки должны быть прочеркнуты.
  - path: '34'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: Исправление ошибок в документе инвентаризации, содержащем сведения о фактическом наличии объектов
      инвентаризации, должно быть удостоверено подписями всех членов инвентаризационной комиссии и соответствующего
      материально ответственного лица .
  - path: '35'
    parent_path: null
    heading: Обязательное проведение инвентаризации
    text: 'К документам инвентаризации приобщаются, в частности:'
  - path: 35.а
    parent_path: '35'
    heading: null
    text: акты обмеров, технические расчеты, документы, оформляющие результаты перевеса весовых товаров;
  - path: 35.б
    parent_path: '35'
    heading: null
    text: предоставленные материально ответственными лицами объяснения о допущенной пересортице;
  - path: 35.в
    parent_path: '35'
    heading: null
    text: предоставленные инвентаризационной комиссии объяснения причин, по которым разница в стоимости
      от пересортицы в сторону недостачи, образовавшейся не по вине материально ответственных лиц, не
      отнесена на виновных лиц.
