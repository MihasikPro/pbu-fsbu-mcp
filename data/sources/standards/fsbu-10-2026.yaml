id: fsbu-10-2026
kind: ФСБУ
number: 10/2026
year: 2026
title: Расходы
order_date: 2026-04-24
order_no: 53н
effective_from: &id001 2027-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящий Стандарт устанавливает требования к формированию информации о расходах экономических
      субъектов (за исключением организаций бюджетной сферы) в бухгалтерском учете.
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Некоммерческие организации, за исключением организаций бюджетной сферы, формируют информацию
      о расходах от предпринимательской и иной деятельности в бухгалтерском учете с учетом положений настоящего
      Стандарта.
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: Бухгалтерский учет расходов по страховым услугам, относящимся к сфере применения Международного
      стандарта финансовой отчетности МСФО (IFRS) 17 «Договоры страхования», введенного в действие на
      территории Российской Федерации приказом Министерства финансов Российской Федерации от 20 апреля
      2021 г. № 65н (зарегистрирован Министерством юстиции Российской Федерации 21 мая 2021 г., регистрационный
      № 63562), ведется в соответствии с этим Международным стандартом финансовой отчетности.
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: Расходами экономического субъекта признается уменьшение экономических выгод в результате выбытия
      (списания, уменьшения стоимости) активов и (или) возникновения (увеличения величины) обязательств,
      приводящее к уменьшению капитала этого экономического субъекта, не связанному с уменьшением вкладов
      (взносов) учредителей (участников, акционеров, собственников имущества) экономического субъекта,
      а также с распределением прибыли между учредителями (участниками, акционерами, собственниками имущества)
      экономического субъекта.
  - path: '5'
    parent_path: null
    heading: Общие положения
    text: 'Если иное не предусмотрено настоящим Стандартом или другими федеральными стандартами бухгалтерского
      учета, принятыми в соответствии с Федеральным законом от 6 декабря 2011 г. № 402‑ФЗ «О бухгалтерском
      учете» (далее – федеральные стандарты), расходами экономического субъекта не признается выбытие
      (списание, уменьшение стоимости) активов и (или) возникновение (увеличение величины) обязательств,
      в частности:'
  - path: 5.а
    parent_path: '5'
    heading: null
    text: в связи с осуществлением капитальных вложений;
  - path: 5.б
    parent_path: '5'
    heading: null
    text: в связи с осуществлением финансовых вложений;
  - path: 5.в
    parent_path: '5'
    heading: null
    text: в связи с приобретением (созданием) запасов;
  - path: 5.г
    parent_path: '5'
    heading: null
    text: по договорам комиссии, поручения, агентским договорам в пользу комитента, доверителя, принципала;
  - path: 5.д
    parent_path: '5'
    heading: null
    text: в порядке предварительной оплаты продукции, товаров, работ, услуг, иного имущества, прав на
      результаты интеллектуальной деятельности и средства индивидуализации;
  - path: 5.е
    parent_path: '5'
    heading: null
    text: в виде аванса;
  - path: 5.ж
    parent_path: '5'
    heading: null
    text: в виде задатка;
  - path: 5.з
    parent_path: '5'
    heading: null
    text: в залог, если договором предусмотрена передача залогодержателю заложенного имущества, прав на
      результаты интеллектуальной деятельности и средства индивидуализации;
  - path: 5.и
    parent_path: '5'
    heading: null
    text: в целях погашения кредита, займа, полученных экономическим субъектом.
  - path: '6'
    parent_path: null
    heading: Общие положения
    text: Расходы экономического субъекта подразделяются на включаемые и не включаемые в чистую прибыль
      (убыток) этого субъекта.
  - path: '7'
    parent_path: null
    heading: Общие положения
    text: 'Расходы, включаемые в чистую прибыль (убыток), подразделяются на:'
  - path: 7.а
    parent_path: '7'
    heading: null
    text: расходы по обычным видам деятельности;
  - path: 7.б
    parent_path: '7'
    heading: null
    text: расходы, отличные от расходов по обычным видам деятельности.
  - path: '8'
    parent_path: null
    heading: Общие положения
    text: Случаи, когда расходы экономического субъекта не включаются в чистую прибыль (убыток), определяются
      другими федеральными стандартами, в соответствии с которыми формируется информация о таких расходах
      в бухгалтерском учете.
  - path: '9'
    parent_path: null
    heading: Общие положения
    text: Расходы подлежат признанию в бухгалтерском учете независимо от формы осуществления расхода (денежной,
      натуральной, иной), а также независимо от порядка признания расходов в соответствии с законодательством
      Российской Федерации о налогах и сборах, иным законодательством Российской Федерации, в том числе
      для целей ведения раздельного учета расходов (затрат) и финансовых результатов в случаях, установленных
      законодательством Российской Федерации или в соответствии с ним.
  - path: '10'
    parent_path: null
    heading: Общие положения
    text: Расходы признаются в бухгалтерском учете в том отчетном периоде, в котором они имели место,
      независимо от фактического времени выбытия (списания, уменьшения стоимости) соответствующих активов
      и (или) возникновения (увеличения величины) соответствующих обязательств.
  - path: '11'
    parent_path: null
    heading: Общие положения
    text: Экономический субъект, который вправе применять упрощенные способы ведения бухгалтерского учета,
      включая упрощенную бухгалтерскую (финансовую) отчетность (далее – упрощенный учет), имеет право
      признавать в бухгалтерском учете расходы по мере выбытия (списания, уменьшения стоимости) активов
      в случае, когда в соответствии с Федеральным стандартом бухгалтерского учета ФСБУ 9/2025 «Доходы»,
      утвержденным приказом Министерства финансов Российской Федерации от 16 мая 2025 г. № 56н (зарегистрирован
      Министерством юстиции Российской Федерации 8 августа 2025 г., регистрационный № 83158) (далее –
      ФСБУ 9/2025), такой экономический субъект признает выручку по мере получения активов от поставщиков,
      подрядчиков, иных лиц (далее совместно – контрагент).
  - path: '12'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: 'Расходами по обычным видам деятельности признаются расходы, понесенные экономическим субъектом
      в целях получения выручки, в том числе погашение стоимости основных средств, нематериальных активов
      и иных амортизируемых активов посредством амортизации, коммерческие и управленческие расходы, а
      также иные расходы, определенные другими федеральными стандартами. В частности, в случае, когда
      выручка получена от деятельности:'
  - path: 12.а
    parent_path: '12'
    heading: null
    text: по производству и продаже продукции, продаже товаров, выполнению работ, оказанию услуг, расходами
      по обычным видам деятельности признаются расходы, понесенные экономическим субъектом в связи с данной
      деятельностью;
  - path: 12.б
    parent_path: '12'
    heading: null
    text: по предоставлению за плату прав на результаты интеллектуальной деятельности и средства индивидуализации,
      расходами по обычным видам деятельности признаются расходы, понесенные экономическим субъектом в
      связи с данной деятельностью;
  - path: 12.в
    parent_path: '12'
    heading: null
    text: по осуществлению финансовых вложений, включая участие в уставных капиталах других организаций,
      расходами по обычным видам деятельности признаются расходы, понесенные экономическим субъектом в
      связи с данной деятельностью;
  - path: 12.г
    parent_path: '12'
    heading: null
    text: по предоставлению во временное пользование имущества по договору аренды (субаренды), а также
      иным договорам, положения которых по отдельности или во взаимосвязи предусматривают предоставление
      арендодателем, лизингодателем, правообладателем, иным лицом за плату арендатору, лизингополучателю,
      пользователю, иному лицу имущества во временное пользование (далее совместно – договор аренды),
      расходами по обычным видам деятельности признаются расходы, понесенные экономическим субъектом в
      связи с данной деятельностью.
  - path: '13'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Для целей бухгалтерского учета расходов по производству и продаже продукции, продаже товаров,
      выполнению работ, оказанию услуг оценка балансовой стоимости запасов, предназначенных для продажи
      в ходе обычной деятельности экономического субъекта, признание их расходами, оценка и признание
      иных расходов от списания запасов при признании выручки от их продажи производятся в соответствии
      с требованиями, установленными Федеральным стандартом бухгалтерского учета ФСБУ 5/2019 «Запасы»,
      утвержденным приказом Министерства финансов Российской Федерации от 15 ноября 2019 г. № 180н (зарегистрирован
      Министерством юстиции Российской Федерации 25 марта 2020 г., регистрационный № 57837) (далее – ФСБУ
      5/2019).
  - path: '14'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Для целей бухгалтерского учета расходов по осуществлению финансовых вложений оценка финансовых
      вложений при их выбытии и признание их выбытия производятся в соответствии с правилами, установленными
      Положением по бухгалтерскому учету «Учет финансовых вложений» ПБУ 19/02, утвержденным приказом Министерства
      финансов Российской Федерации от 10 декабря 2002 г. № 126н (зарегистрирован Министерством юстиции
      Российской Федерации 27 декабря 2002 г., регистрационный № 4085) [1] .
  - path: '15'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Бухгалтерский учет расходов по договору аренды ведется в соответствии с требованиями, установленными
      Федеральным стандартом бухгалтерского учета ФСБУ 25/2018 «Бухгалтерский учет аренды», утвержденным
      приказом Министерства финансов Российской Федерации от 16 октября 2018 г. № 208н (зарегистрирован
      Министерством юстиции Российской Федерации 25 декабря 2018 г., регистрационный № 53162) [2] .
  - path: '16'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: 'Если иное не установлено другими федеральными стандартами, понесенные экономическим субъектом
      расходы по обычным видам деятельности, отличные от указанных в пунктах 13 - 15 настоящего Стандарта,
      признаются в бухгалтерском учете при одновременном выполнении следующих условий:'
  - path: 16.а
    parent_path: '16'
    heading: null
    text: экономический субъект осуществляет расходы в соответствии с договором (контрактом), заключенным
      с контрагентом в рамках обычной деятельности экономического субъекта, или подтвержденной иным образом
      обязанностью осуществить расход;
  - path: 16.б
    parent_path: '16'
    heading: null
    text: имеется уверенность в том, что в результате осуществления расходов произойдет уменьшение экономических
      выгод экономического субъекта. Такая уверенность имеется в случае выбытия (списания, уменьшения
      стоимости) активов, или отсутствия неопределенности в отношении выбытия (списания, уменьшения стоимости)
      активов, или возникновения (увеличения величины) обязательств, или отсутствия неопределенности в
      отношении возникновения (увеличения величины) обязательств в связи с осуществлением экономическим
      субъектом расходов;
  - path: 16.в
    parent_path: '16'
    heading: null
    text: сумма расходов может быть определена.
  - path: '17'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Если иное не установлено другими федеральными стандартами, понесенные экономическим субъектом
      расходы по обычным видам деятельности, отличные от указанных в пунктах 13 - 15 настоящего Стандарта,
      признаются в бухгалтерском учете в суммах, определяемых в соответствии с пунктами 18 - 23 настоящего
      Стандарта.
  - path: '18'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: При признании в бухгалтерском учете расходы по обычным видам деятельности оцениваются в денежном
      выражении в сумме, исчисленной исходя из цены договора, либо исходя из цены, устанавливаемой исходя
      из условий договора, в соответствии с которым экономический субъект осуществляет расходы. Если цена
      не предусмотрена в договоре и не может быть установлена исходя из условий договора, то для оценки
      расходов по обычным видам деятельности принимается цена, по которой в сравнимых обстоятельствах
      обычно экономический субъект определяет величину аналогичных расходов.
  - path: '19'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Величина расходов по обычным видам деятельности определяется с учетом всех скидок независимо
      от формы их предоставления при одновременном соблюдении условий, установленных пунктом 27 ФСБУ 9/2025
      для определения величины выручки с учетом всех скидок. Если сумма скидки не может быть определена
      исходя из условий договора, то экономический субъект определяет ее в соответствии с пунктом 28 ФСБУ
      9/2025.
  - path: '20'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Расходы по обычным видам деятельности, осуществляемые экономическим субъектом в соответствии
      с договором, предусматривающим оплату понесенных расходов полностью или частично неденежными средствами,
      оцениваются в бухгалтерском учете по справедливой стоимости актива (в части неденежных средств),
      выбывшего или подлежащего выбытию в оплату по договору. При невозможности определить справедливую
      стоимость актива (в части неденежных средств), выбывшего или подлежащего выбытию в оплату по договору,
      расходы по обычным видам деятельности оцениваются исходя из цены, по которой в сравнимых обстоятельствах
      обычно экономический субъект определяет величину аналогичных расходов. Для целей настоящего Стандарта
      справедливая стоимость определяется в порядке, предусмотренном Международным стандартом финансовой
      отчетности (IFRS) 13 «Оценка справедливой стоимости», введенным в действие на территории Российской
      Федерации приказом Министерства финансов Российской Федерации от 28 декабря 2015 г. № 217н (зарегистрирован
      Министерством юстиции Российской Федерации 2 февраля 2016 г., регистрационный № 40940) [3] .
  - path: '21'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: При осуществлении расходов по обычным видам деятельности на условиях отсрочки (рассрочки) платежа
      величина этих расходов определяется как сумма денежных средств, которая была бы уплачена экономическим
      субъектом по договору при отсутствии указанной отсрочки (рассрочки) платежа. После признания в бухгалтерском
      учете расходов по обычным видам деятельности и соответствующей кредиторской задолженности последняя
      увеличивается на величину начисляемых процентов и уменьшается на величину активов, выбывших в оплату
      по договору. Бухгалтерский учет начисленных процентов ведется в соответствии с Положением по бухгалтерскому
      учету «Учет расходов по займам и кредитам» (ПБУ 15/2008), утвержденным приказом Министерства финансов
      Российской Федерации от 6 октября 2008 г. № 107н (зарегистрирован Министерством юстиции Российской
      Федерации 27 октября 2008 г., регистрационный № 12523) [4] .
  - path: '22'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: 'В случае, предусмотренном абзацем первым пункта 21 настоящего Стандарта, экономический субъект
      может определять величину расходов по обычным видам деятельности в сумме номинальной величины актива,
      подлежащего выбытию в оплату по договору в будущем, при соблюдении как минимум одного из следующих
      условий:'
  - path: 22.а
    parent_path: '22'
    heading: null
    text: период отсрочки (рассрочки) платежа не превышает 12 месяцев с момента осуществления расхода
      в соответствии с условиями договора;
  - path: 22.б
    parent_path: '22'
    heading: null
    text: предоставление отсрочки (рассрочки) платежа экономическому субъекту не имеет коммерческого содержания,
      в частности, является способом обеспечения исполнения обязанностей контрагента по договору;
  - path: 22.в
    parent_path: '22'
    heading: null
    text: величина и сроки выбытия актива в оплату по договору зависят от наступления или ненаступления
      в будущем события, которое не контролируется сторонами договора.
  - path: '23'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: 'Экономический субъект, который вправе применять упрощенный учет, имеет право:'
  - path: 23.а
    parent_path: '23'
    heading: null
    text: определять величину расходов по обычным видам деятельности исходя из цены договора без учета
      скидок независимо от условий договора. При этом сумма скидки, которая должна была быть учтена при
      определении величины расходов по обычным видам деятельности в соответствии с настоящим Стандартом,
      признается доходом периода, в котором она была фактически предоставлена экономическому субъекту;
  - path: 23.б
    parent_path: '23'
    heading: null
    text: оценивать расходы по обычным видам деятельности по договору, предусматривающему оплату понесенных
      расходов полностью или частично неденежными средствами (в части оплаты неденежными средствами),
      исходя из цены, по которой в сравнимых обстоятельствах обычно экономический субъект определяет величину
      аналогичных расходов по обычным видам деятельности, независимо от возможности определить справедливую
      стоимость как выбывшего, так и подлежащего выбытию актива в оплату по договору;
  - path: 23.в
    parent_path: '23'
    heading: null
    text: определять величину расходов по обычным видам деятельности в сумме номинальной величины актива,
      подлежащего выбытию в оплату по договору в будущем (независимо от условий договора), при осуществлении
      расходов на условиях отсрочки (рассрочки) платежа.
  - path: '24'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Коммерческие и управленческие расходы признаются в отчете о финансовых результатах [5] полностью
      в том отчетном периоде, в котором они имели место, за исключением случаев, когда в соответствии
      с другими федеральными стандартами они включаются в стоимость активов (в частности, непосредственно
      связаны с производством продукции, выполнением работ, оказанием услуг, приобретением, созданием,
      улучшением объектов основных средств, объектов нематериальных активов, восстановлением объектов
      основных средств).
  - path: '25'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Экономический субъект, который в соответствии с ФСБУ 9/2025 формирует в бухгалтерском учете
      информацию о выручке в соответствии с Международным стандартом финансовой отчетности (IFRS) 15 «Выручка
      по договорам с покупателями», введенным в действие на территории Российской Федерации приказом Министерства
      финансов Российской Федерации от 27 июня 2016 г. № 98н (зарегистрирован Министерством юстиции Российской
      Федерации 15 июля 2016 г., регистрационный № 42869) (далее – МСФО (IFRS) 15), формирует информацию
      о предусмотренных МСФО (IFRS) 15 затратах на заключение и выполнение договора с покупателем и иных
      аналогичных затратах в соответствии с МСФО (IFRS) 15.
  - path: '26'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Экономический субъект, который в соответствии с ФСБУ 9/2025 признает в бухгалтерском учете выручку
      по мере передачи контроля над продукцией, работами, услугами контрагенту, признает в бухгалтерском
      учете расходы по обычным видам деятельности, понесенные экономическим субъектом в связи с исполнением
      обязанности передать эту продукцию, работы, услуги контрагенту, с применением способа определения
      степени исполнения обязанности передать продукцию, работы, услуги контрагенту (далее – степень готовности),
      установленного экономическим субъектом в соответствии с ФСБУ 9/2025 для признания такой выручки
      в бухгалтерском учете.
  - path: '27'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: 'При формировании информации о расходах по обычным видам деятельности должна быть обеспечена
      их группировка:'
  - path: 27.а
    parent_path: '27'
    heading: null
    text: по экономическим элементам, предусмотренным пунктом 30 ФСБУ 4/2023;
  - path: 27.б
    parent_path: '27'
    heading: null
    text: по статьям расходов, перечень которых устанавливается экономическим субъектом самостоятельно,
      если такой перечень не определен для целей ведения раздельного учета расходов (затрат) и финансовых
      результатов в случаях, установленных законодательством Российской Федерации или в соответствии с
      ним.
  - path: 27.заключение
    parent_path: '27'
    heading: null
    text: III. Расходы, отличные от расходов по обычным видам деятельности
  - path: '28'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: 'Расходами, отличными от расходов по обычным видам деятельности, являются:'
  - path: 28.а
    parent_path: '28'
    heading: null
    text: расходы, связанные с предоставлением за плату прав на результаты интеллектуальной деятельности
      и средства индивидуализации (с учетом положений пункта 12 настоящего Стандарта);
  - path: 28.б
    parent_path: '28'
    heading: null
    text: расходы, связанные с осуществлением финансовых вложений, включая участие в уставных капиталах
      других организаций (с учетом положений пункта 12 настоящего Стандарта);
  - path: 28.в
    parent_path: '28'
    heading: null
    text: расходы, связанные с предоставлением во временное пользование имущества по договору аренды (с
      учетом положений пункта 12 настоящего Стандарта);
  - path: 28.г
    parent_path: '28'
    heading: null
    text: расходы, связанные с куплей-продажей иностранной валюты;
  - path: 28.д
    parent_path: '28'
    heading: null
    text: неустойки за нарушение условий договоров;
  - path: 28.е
    parent_path: '28'
    heading: null
    text: расходы, связанные с возмещением убытков, причиненных экономическим субъектом;
  - path: 28.ж
    parent_path: '28'
    heading: null
    text: суммы дебиторской задолженности, по которой срок исковой давности истек, иных долгов, нереальных
      для взыскания;
  - path: 28.з
    parent_path: '28'
    heading: null
    text: расходы, связанные с осуществлением благотворительной, добровольческой (волонтерской), культурной,
      меценатской и просветительской деятельности, развлекательных, физкультурных и спортивных мероприятий;
  - path: 28.и
    parent_path: '28'
    heading: null
    text: расходы, связанные с последствиями пожара, стихийного бедствия, а также иного бедствия, в результате
      которого сложилась чрезвычайная ситуация;
  - path: 28.к
    parent_path: '28'
    heading: null
    text: убытки прошлых лет, признанные в отчетном году;
  - path: 28.л
    parent_path: '28'
    heading: null
    text: иные расходы, отличные от указанных в подпунктах «а» – «к» настоящего пункта, в том числе в
      случаях, установленных другими федеральными стандартами.
  - path: '29'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: 'Если иное не установлено другими федеральными стандартами, оценка и признание расходов, отличных
      от расходов по обычным видам деятельности, производятся:'
  - path: 29.а
    parent_path: '29'
    heading: null
    text: в сумме, определяемой в соответствии с пунктом 17 настоящего Стандарта, при одновременном выполнении
      условий, установленных пунктом 16 настоящего Стандарта, – для расходов, указанных в подпункте «а»
      пункта 28 настоящего Стандарта;
  - path: 29.б
    parent_path: '29'
    heading: null
    text: в соответствии с пунктом 14 настоящего Стандарта – для расходов, указанных в подпункте «б» пункта
      28 настоящего Стандарта;
  - path: 29.в
    parent_path: '29'
    heading: null
    text: в соответствии с пунктом 15 настоящего Стандарта – для расходов, указанных в подпункте «в» пункта
      28 настоящего Стандарта;
  - path: 29.г
    parent_path: '29'
    heading: null
    text: в сумме разницы между рублевой оценкой поступивших (списанных) денежных средств в иностранной
      валюте, определенной в соответствии с Положением по бухгалтерскому учету «Учет активов и обязательств,
      стоимость которых выражена в иностранной валюте» (ПБУ 3/2006), утвержденным приказом Министерства
      финансов Российской Федерации от 27 ноября 2006 г. № 154н (зарегистрирован Министерством юстиции
      Российской Федерации 17 января 2007 г., регистрационный № 8788) [6] , и суммой денежных средств
      в рублях, перечисленных на покупку (полученных от продажи) иностранной валюты, – для расходов, указанных
      в подпункте «г» пункта 28 настоящего Стандарта;
  - path: 29.д
    parent_path: '29'
    heading: null
    text: в суммах, присужденных судом или признанных должником, при одновременном выполнении условий,
      установленных пунктом 16 настоящего Стандарта, с учетом вида и условий осуществления расхода – для
      расходов, указанных в подпунктах «д» и «е» пункта 28 настоящего Стандарта;
  - path: 29.е
    parent_path: '29'
    heading: null
    text: в сумме дебиторской задолженности или иных долгов, отраженной в бухгалтерском учете экономического
      субъекта в отчетном периоде, в котором срок исковой давности такой дебиторской задолженности истек,
      иные долги признаны нереальными для взыскания, – для расходов, указанных в подпункте «ж» пункта
      28 настоящего Стандарта;
  - path: 29.ж
    parent_path: '29'
    heading: null
    text: в фактической сумме при одновременном выполнении условий, установленных пунктом 16 настоящего
      Стандарта, с учетом вида и условий осуществления расхода – для расходов, указанных в подпунктах
      «з» и «и» пункта 28 настоящего Стандарта;
  - path: 29.з
    parent_path: '29'
    heading: null
    text: в фактической сумме в отчетном периоде, в котором такие расходы были выявлены экономическим
      субъектом, – для расходов, указанных в подпункте «к» пункта 28 настоящего Стандарта.
  - path: '30'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Оценка и признание расходов, указанных в подпункте «л» пункта 28 настоящего Стандарта, производится
      в фактической сумме в отчетном периоде, в котором такие расходы были выявлены экономическим субъектом,
      а в случаях, установленных другими федеральными стандартами, – в сумме и порядке, установленных
      другими федеральными стандартами.
  - path: '31'
    parent_path: null
    heading: Раскрытие информации
    text: В бухгалтерской (финансовой) отчетности информация о расходах по обычным видам деятельности,
      расходах, отличных от расходов по обычным видам деятельности, расходах, не включаемых в чистую прибыль
      (убыток), приводится в соответствии с настоящим Стандартом и другими федеральными стандартами. В
      частности, в бухгалтерской (финансовой) отчетности раскрывается с учетом существенности [7] информация
      о величине расходов, признанных в отчетном периоде, способах и допущениях (в частности, способы
      определения степени готовности, способы определения суммы скидки, способы определения величины выручки
      в случаях, предусмотренных пунктом 29 ФСБУ 9/2025), примененных для признания их в бухгалтерском
      учете.
  - path: '32'
    parent_path: null
    heading: Раскрытие информации
    text: Экономические субъекты, указанные в пункте 25 настоящего Стандарта, раскрывают в бухгалтерской
      (финансовой) отчетности информацию о затратах, указанных в пункте 25 настоящего Стандарта, в соответствии
      с МСФО (IFRS) 15.
  - path: '33'
    parent_path: null
    heading: Раскрытие информации
    text: В случае, когда раскрытие информации о расходах в бухгалтерской (финансовой) отчетности в объеме,
      предусмотренном настоящим Стандартом и другими федеральными стандартами, приведет или может привести
      к потерям экономического характера и (или) урону деловой репутации экономического субъекта, и (или)
      его контрагентов, и (или) связанных с экономическим субъектом сторон, экономический субъект может
      раскрывать информацию о расходах в бухгалтерской (финансовой) отчетности в ограниченном объеме,
      не раскрывая те сведения, которые обусловливают указанные потери и (или) урон. [1] С изменениями,
      внесенными приказами Министерства финансов Российской Федерации от 18 сентября 2006 г. № 116н (зарегистрирован
      Министерством юстиции Российской Федерации 24 октября 2006 г., регистрационный № 8397), от 27 ноября
      2006 г. № 156н (зарегистрирован Министерством юстиции Российской Федерации 28 декабря 2006 г., регистрационный
      № 8698), от 25 октября 2010 г. № 132н (зарегистрирован Министерством юстиции Российской Федерации
      25 ноября 2010 г., регистрационный № 19048), от 8 ноября 2010 г. № 144н (зарегистрирован Министерством
      юстиции Российской Федерации 1 декабря 2010 г., регистрационный № 19088), от 27 апреля 2012 г. №
      55н (зарегистрирован Министерством юстиции Российской Федерации 20 июня 2012 г., регистрационный
      № 24643), от 6 апреля 2015 г. № 57н (зарегистрирован Министерством юстиции Российской Федерации
      30 апреля 2015 г., регистрационный № 37103). [2] С изменениями, внесенными приказом Министерства
      финансов Российской Федерации от 29 июня 2022 г. № 101н (зарегистрирован Министерством юстиции Российской
      Федерации 27 июля 2022 г., регистрационный № 69410). [3] С изменениями, внесенными приказами Министерства
      финансов Российской Федерации от 11 июля 2016 г. № 111н (зарегистрирован Министерством юстиции Российской
      Федерации 1 августа 2016 г., регистрационный № 43044), от 17 сентября 2024 г. № 127н (зарегистрирован
      Министерством юстиции Российской Федерации 2 декабря 2024 г., регистрационный № 80431). [4] С изменениями,
      внесенными приказами Министерства финансов Российской Федерации от 25 октября 2010 г. № 132н (зарегистрирован
      Министерством юстиции Российской Федерации 25 ноября 2010 г., регистрационный № 19048), от 8 ноября
      2010 г. № 144н (зарегистрирован Министерством юстиции Российской Федерации 1 декабря 2010 г., регистрационный
      № 19088), от 27 апреля 2012 г. № 55н (зарегистрирован Министерством юстиции Российской Федерации
      20 июня 2012 г., регистрационный № 24643), от 6 апреля 2015 г. № 57н (зарегистрирован Министерством
      юстиции Российской Федерации 30 апреля 2015 г., регистрационный № 37103). [5] Федеральный стандарт
      бухгалтерского учета ФСБУ 4/2023 «Бухгалтерская (финансовая) отчетность», утвержденный приказом
      Министерства финансов Российской Федерации от 4 октября 2023 г. № 157н (зарегистрирован Министерством
      юстиции Российской Федерации 21 марта 2024 г., регистрационный № 77591), с изменениями, внесенными
      приказом Министерства финансов Российской Федерации от 7 ноября 2025 г. № 159н (зарегистрирован
      Министерством юстиции Российской Федерации 4 декабря 2025 г., регистрационный № 84452) (далее –
      ФСБУ 4/2023). [6] С изменениями, внесенными приказами Министерства финансов Российской Федерации
      от 25 декабря 2007 г. № 147н (зарегистрирован Министерством юстиции Российской Федерации 28 января
      2008 г., регистрационный № 11007), от 25 октября 2010 г. № 132н (зарегистрирован Министерством юстиции
      Российской Федерации 25 ноября 2010 г., регистрационный № 19048), от 24 декабря 2010 г. № 186н (зарегистрирован
      Министерством юстиции Российской Федерации 22 февраля 2011 г., регистрационный № 19910), от 9 ноября
      2017 г. № 180н (зарегистрирован Министерством юстиции Российской Федерации 29 ноября 2017 г., регистрационный
      № 49036). [7] Пункт 10 ФСБУ 4/2023.