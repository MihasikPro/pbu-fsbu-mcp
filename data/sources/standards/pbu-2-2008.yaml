id: pbu-2-2008
kind: ПБУ
number: 2/2008
year: 2008
title: Учет договоров строительного подряда
order_date: 2008-10-24
order_no: 116н
effective_from: &id001 2009-01-01
effective_to: 2027-01-01
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает особенности порядка формирования в бухгалтерском учете и раскрытия
      в бухгалтерской отчетности информации о доходах, расходах и финансовых результатах организациями
      (за исключением кредитных организаций и государственных (муниципальных) учреждений), являющимися
      юридическими лицами по законодательству Российской Федерации и выступающими в качестве подрядчиков
      либо в качестве субподрядчиков (далее - организации) в договорах строительного подряда (далее -
      договор), длительность выполнения которых составляет более одного отчетного года (долгосрочный характер)
      или сроки начала и окончания которых приходятся на разные отчетные годы. (в ред. приказа Минфина
      России от 25.10.2010 № 132н)
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение распространяется также на договоры оказания услуг в области архитектуры,
      инженерно-технического проектирования в строительстве и иных услуг, неразрывно связанных со строящимся
      объектом, на выполнение работ по восстановлению зданий, сооружений, судов, по ликвидации (разборке)
      их, включая связанное с ней восстановление окружающей среды, длительность выполнения которых составляет
      более одного отчетного года (долгосрочный характер) или сроки начала и окончания которых приходятся
      на разные отчетные годы. (в ред. приказа Минфина России от 23.04.2009 № 35н)
  - path: '2.1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение может не применяться организациями, которые вправе применять упрощенные
      способы ведения бухгалтерского учета, включая упрощенную бухгалтерскую (финансовую) отчетность.
      (п. 2.1 введен приказом Минфина России от 08.11.2010 № 144н, в ред. приказов Минфина России от 27.04.2012
      № 55н, от 06.04.2015 № 57н)
  - path: '3'
    parent_path: null
    heading: Объекты бухгалтерского учета по договорам
    text: Бухгалтерский учет доходов, расходов и финансовых результатов ведется отдельно по каждому исполняемому
      договору.
  - path: '4'
    parent_path: null
    heading: Объекты бухгалтерского учета по договорам
    text: 'В случае, когда одним договором предусмотрено строительство комплекса объектов для одного или
      нескольких заказчиков по единому проекту, для целей бухгалтерского учета строительство каждого объекта
      должно рассматриваться как отдельный договор при соблюдении одновременно следующих условий:'
  - path: 4.а
    parent_path: '4'
    heading: null
    text: на строительство каждого объекта имеется техническая документация;
  - path: 4.б
    parent_path: '4'
    heading: null
    text: по каждому объекту могут быть достоверно определены доходы и расходы.
  - path: '5'
    parent_path: null
    heading: Объекты бухгалтерского учета по договорам
    text: 'Два и более договоров, заключенных организацией с одним или несколькими заказчиками, должны
      рассматриваться для целей бухгалтерского учета как один договор при соблюдении одновременно следующих
      условий:'
  - path: 5.а
    parent_path: '5'
    heading: null
    text: в силу взаимосвязи отдельные договоры фактически относятся к единому проекту с нормой прибыли,
      определенной в целом по договорам;
  - path: 5.б
    parent_path: '5'
    heading: null
    text: договоры исполняются одновременно или последовательно (непрерывно следуя один за другим).
  - path: '6'
    parent_path: null
    heading: Объекты бухгалтерского учета по договорам
    text: 'В случае, когда при исполнении договора в техническую документацию вносится дополнительный
      объект строительства (дополнительные работы), для целей бухгалтерского учета строительство дополнительного
      объекта (выполнение дополнительных работ) должно рассматриваться как отдельный договор при соблюдении
      хотя бы одного из следующих условий:'
  - path: 6.а
    parent_path: '6'
    heading: null
    text: дополнительный объект (дополнительные работы) по конструкционным, технологическим или функциональным
      характеристикам существенно отличается от объектов, предусмотренных договором;
  - path: 6.б
    parent_path: '6'
    heading: null
    text: цена строительства дополнительного объекта (дополнительных работ) определена на основе согласованной
      сторонами дополнительной сметы.
  - path: '7'
    parent_path: null
    heading: Признание доходов и расходов по договору
    text: 'Доходы по договору признаются организацией доходами от обычных видов деятельности (далее -
      выручка по договору) в соответствии с Положением по бухгалтерскому учету "Доходы организации" ПБУ
      9/99, утвержденным Приказом Министерства финансов Российской Федерации от 6 мая 1999 г. № 32н (зарегистрирован
      в Министерстве юстиции Российской Федерации 31 мая 1999 г., регистрационный № 1791) <*>. <*> С учетом
      изменений, внесенных приказами Министерства финансов Российской Федерации от 30 декабря 1999 г.
      № 107н, от 30 марта 2001 г. № 27н, от 18 сентября 2006 г. № 116н, от 27 ноября 2006 г. № 156н (зарегистрированы
      в Министерстве юстиции Российской Федерации: 28 января 2000 г., регистрационный № 2064; 4 мая 2001
      г., регистрационный № 2693; 24 октября 2006 г., регистрационный № 8397; 28 декабря 2006 г., регистрационный
      № 8698).'
  - path: '8'
    parent_path: null
    heading: Признание доходов и расходов по договору
    text: 'Величина выручки по договору определяется исходя из стоимости работ по определенной в договоре
      цене, корректируемой в случаях и на условиях, предусмотренных договором, в связи с: возникающими
      в ходе исполнения договора согласованными сторонами изменениями стоимости работ по договору (далее
      - отклонения), которые обуславливаются либо использованием более качественных и дорогостоящих строительных
      материалов и конструкций, а также выполнением работ более сложных по сравнению с предусмотренными
      в технической документации или работ, не предусмотренных в технической документации (увеличение
      выручки по договору), либо неисполнением каких-либо работ, предусмотренных в технической документации
      (уменьшение выручки по договору); предъявляемыми организацией к заказчикам и иным лицам, указанным
      в договоре, требованиями (далее - претензии): о возмещении затрат, не учтенных в смете, которые
      организация была вынуждена понести в связи с действиями (бездействием) указанных лиц; о возмещении
      разумных расходов, понесенных в связи с установлением и устранением дефектов в технической документации,
      предоставленной заказчиком или проектной организацией (например, в связи с обнаружением в ходе строительства
      подпочвенных вод), в связи с задержкой или остановкой работы из-за неоказания заказчиком организации
      содействия, предусмотренного условиями договора (например, по передаче организации в пользование
      необходимых для выполнения работ зданий и сооружений, обеспечению временной подводки сетей энергоснабжения,
      водопровода) и т.д. (увеличение выручки по договору); выплачиваемыми организации дополнительно сверх
      сметы по условиям договора суммами (далее - поощрительные платежи), например, за сокращение сроков
      строительства и др. (увеличение выручки по договору).'
  - path: '9'
    parent_path: null
    heading: Признание доходов и расходов по договору
    text: Выручка по договору корректируется на суммы отклонений, претензий и поощрительных платежей,
      если существует уверенность, что такие суммы будут признаны заказчиками или иными лицами, указанными
      в договоре, которым они предъявлены, и сумма их может быть достоверно определена.
  - path: '10'
    parent_path: null
    heading: Признание доходов и расходов по договору
    text: 'Расходы по договору признаются организацией расходами по обычным видам деятельности в соответствии
      с Положением по бухгалтерскому учету "Расходы организации" ПБУ 10/99, утвержденным Приказом Министерства
      финансов Российской Федерации от 6 мая 1999 г. № 33н (зарегистрирован в Министерстве юстиции Российской
      Федерации 31 мая 1999 г., регистрационный № 1790) <*>. <*> С учетом изменений, внесенных приказами
      Министерства финансов Российской Федерации от 30 декабря 1999 г. № 107н, от 30 марта 2001 г. № 27н,
      от 18 сентября 2006 г. № 116н, от 27 ноября 2006 г. № 156н (зарегистрированы в Министерстве юстиции
      Российской Федерации: 28 января 2000 г., регистрационный № 2064; 4 мая 2001 г., регистрационный
      № 2693; 24 октября 2006 г., регистрационный № 8397; 28 декабря 2006 г., регистрационный № 8698).'
  - path: '11'
    parent_path: null
    heading: Признание доходов и расходов по договору
    text: 'Расходами по договору являются понесенные организацией за период с начала исполнения договора
      до его завершения: расходы, связанные непосредственно с исполнением договора (прямые расходы по
      договору); часть общих расходов организации на исполнение договоров, приходящаяся на данный договор
      (косвенные расходы по договору); расходы, не относящиеся к строительной деятельности организации,
      но возмещаемые заказчиком по условиям договора (прочие расходы по договору).'
  - path: '12'
    parent_path: null
    heading: Признание доходов и расходов по договору
    text: 'В состав прямых расходов по договору, помимо фактически понесенных, включаются ожидаемые неизбежные
      расходы (далее - предвиденные расходы), возмещаемые заказчиком по условиям договора. Предвиденные
      расходы принимаются к учету либо по мере их возникновения в процессе выполнения работ по строительству
      (по устранению недоделок в проектах и строительно-монтажных работах, по разборке оборудования из-за
      дефектов антикоррозийной защиты и т.п.), либо путем образования резерва на покрытие предвиденных
      расходов (на гарантийное обслуживание и гарантийный ремонт созданного объекта и т.п.). Резерв на
      покрытие предвиденных расходов образуется при условии, что такие расходы могут быть достоверно определены.
      Не связанные непосредственно с исполнением договора доходы организации, полученные при исполнении
      других видов договоров, в выручку по договору не включаются и учитываются как прочие доходы либо
      относятся в уменьшение прямых расходов по договору. К таким доходам относятся, например: доходы
      по договору купли-продажи от продажи организацией излишних строительных материалов и конструкций,
      приобретенных для исполнения договора; доходы в виде арендной платы за сданные в аренду другим лицам
      строительные машины и оборудование, которые временно не используются для исполнения договора.'
  - path: '13'
    parent_path: null
    heading: Признание доходов и расходов по договору
    text: Косвенные расходы по договору включаются в расходы по каждому договору путем распределения общих
      расходов организации на исполнение договоров. Способы распределения между договорами косвенных расходов
      определяются организацией самостоятельно (например, путем расчетов с использованием сметных норм
      и расценок, отражающих современный уровень производственных, технологических и организационных нормативов
      в строительстве) и применяются систематически и последовательно.
  - path: '14'
    parent_path: null
    heading: Признание доходов и расходов по договору
    text: Прочие расходы по договору могут включать отдельные виды расходов на общее управление организацией,
      на проведение научно-исследовательских и опытно-конструкторских работ, другие расходы, возмещение
      которых заказчиком специально предусмотрено в договоре.
  - path: '15'
    parent_path: null
    heading: Признание доходов и расходов по договору
    text: Расходы, связанные непосредственно с подготовкой и подписанием договора (на разработку технико-экономического
      обоснования, подготовку договора страхования рисков строительных работ и т.п.), понесенные организацией
      до даты его подписания, включаются в расходы по договору, если они могут быть достоверно определены
      и если в отчетном периоде, в котором они возникли, существует вероятность, что договор будет подписан.
      При несоблюдении данных условий указанные расходы признаются прочими расходами того периода, в котором
      они понесены.
  - path: '16'
    parent_path: null
    heading: Признание доходов и расходов по договору
    text: Расходы по договору признаются в том отчетном периоде, в котором они понесены. При этом расходы,
      относящиеся к выполненным по договору работам, учитываются как затраты на производство, а расходы,
      понесенные в связи с предстоящими работами, - как расходы будущих периодов. По мере признания выручки
      по договору расходы по договору списываются для определения финансового результата отчетного периода
      в порядке, установленном настоящим Положением.
  - path: '17'
    parent_path: null
    heading: Признание финансового результата
    text: Выручка по договору и расходы по договору признаются способом "по мере готовности", если финансовый
      результат (прибыль или убыток) исполнения договора на отчетную дату может быть достоверно определен.
      Способ "по мере готовности" предусматривает, что выручка по договору и расходы по договору определяются
      исходя из подтвержденной организацией степени завершенности работ по договору на отчетную дату и
      признаются в отчете о финансовых результатах в тех же отчетных периодах, в которых выполнены соответствующие
      работы независимо от того, должны или не должны они предъявляться к оплате заказчику до полного
      завершения работ по договору (этапа работ, предусмотренного договором). (в ред. приказа Минфина
      России от 06.04.2015 № 57н) В случае, когда достоверное определение финансового результата исполнения
      договора в какой-то отчетный период невозможно, выручка по договору признается в соответствии с
      пунктом 23 настоящего Положения.
  - path: '18'
    parent_path: null
    heading: Признание финансового результата
    text: 'Независимо от предусмотренного договором порядка определения цены подлежащих выполнению работ
      необходимыми и достаточными условиями достоверного определения финансового результата исполнения
      договора являются: уверенность, что организация получит экономические выгоды, связанные с договором;
      возможность идентификации и достоверного определения понесенных расходов по договору.'
  - path: '19'
    parent_path: null
    heading: Признание финансового результата
    text: 'В случае, когда договор предусматривает уплату заказчиком твердой цены за выполнение всей обусловленной
      договором работы или цены, определяемой исходя из фиксированной в договоре расценки за каждую единицу
      выполняемой работы (конструкции, вида работ и др.), в дополнение к установленным пунктом 18 настоящего
      Положения необходимыми и достаточными условиями достоверного определения финансового результата
      исполнения договора являются: возможность достоверного определения общей суммы выручки по договору;
      возможность идентификации и достоверного определения расходов, необходимых для завершения работ
      по договору; возможность определения степени завершенности работ по договору на отчетную дату; соизмеримость
      фактической величины расходов по договору с ранее произведенными оценками этих расходов. Правила
      настоящего пункта применяются также в случае, когда договор предусматривает смешанный порядок определения
      цены подлежащих выполнению работ (например, как в договоре, предусматривающем возмещение заказчиком
      всех расходов, понесенных организацией в связи с выполнением предусмотренных договором работ, а
      также уплату процента от этих расходов одновременно с согласованной максимальной ценой подлежащей
      выполнению работы).'
  - path: '20'
    parent_path: null
    heading: Признание финансового результата
    text: 'Для признания выручки по договору и расходов по договору способом "по мере готовности" организация
      может использовать следующие способы определения степени завершенности работ по договору на отчетную
      дату: по доле выполненного на отчетную дату объема работ в общем объеме работ по договору (например,
      путем экспертной оценки объема выполненных работ или путем подсчета доли, которую составляет объем
      выполненных работ в натуральном выражении (в километрах дорожного полотна, кубометрах бетона и т.п.)
      в общем объеме работ по договору); по доле понесенных на отчетную дату расходов в расчетной величине
      общих расходов по договору (например, путем подсчета доли понесенных расходов в натуральном и стоимостном
      измерителе в расчетной величине общих расходов по договору в том же измерителе).'
  - path: '21'
    parent_path: null
    heading: Признание финансового результата
    text: 'При определении степени завершенности работ по договору на отчетную дату по доле понесенных
      на отчетную дату расходов в расчетной величине общих расходов по договору: понесенные на отчетную
      дату расходы подсчитываются только по выполненным работам. Расходы, понесенные в счет предстоящих
      работ по договору (например, стоимость материалов, переданных для выполнения работ, но еще не использованных
      для исполнения договора, арендная плата, перечисленная в отчетном периоде, но относящаяся к будущим
      отчетным периодам), и авансовые платежи организациям, выступающим в качестве субподрядчиков по договору,
      не включаются в сумму понесенных на отчетную дату расходов; расчетная величина общих расходов по
      договору исчисляется как сумма всех фактически понесенных на отчетную дату расходов и расчетной
      величины расходов, которые предстоит понести для завершения работ по договору.'
  - path: '22'
    parent_path: null
    heading: Признание финансового результата
    text: Если на отчетную дату у организации возникли сомнения в поступлении сумм, включенных в выручку
      по договору в соответствии с пунктами 8 и 9 настоящего Положения (отклонений, претензий, поощрительных
      платежей) и отраженных в отчете о финансовых результатах за предыдущие отчетные периоды, то суммы,
      в отношении поступления которых возникли сомнения, признаются расходами по обычным видам деятельности
      отчетного периода. Корректировка выручки по договору, признанной в предыдущие отчетные периоды,
      на эти суммы не производится. (в ред. приказа Минфина России от 06.04.2015 № 57н)
  - path: '23'
    parent_path: null
    heading: Признание финансового результата
    text: В случае, когда достоверное определение финансового результата исполнения договора в какой-то
      отчетный период (например, на начальном этапе исполнения договора, когда уточняются условия договора,
      касающиеся величины расходов, возмещаемых заказчиком) невозможно, но существует вероятность, что
      расходы, понесенные при исполнении договора, будут возмещены, выручка по договору признается в отчете
      о финансовых результатах в величине, равной сумме понесенных расходов, которые в этот отчетный период
      считаются возможными к возмещению. (в ред. приказа Минфина России от 06.04.2015 № 57н) Расходы,
      вероятность возмещения которых отсутствует (например, по договорам, которые могут быть признаны
      недействительными сделками или по которым стороны не могут выполнить свои договорные обязательства),
      признаются расходами по обычным видам деятельности отчетного периода. Если на отчетную дату существует
      неопределенность в возможности поступления всех предполагавшихся по договору отклонений, претензий,
      поощрительных платежей, то сумма, которая может быть не получена организацией (ожидаемый убыток),
      признается расходами по обычным видам деятельности отчетного периода (без уменьшения суммы ранее
      признанной выручки по договору). При этом величина ожидаемого убытка признается независимо от того,
      на какой стадии исполнения договора возник ожидаемый убыток. При устранении неопределенности в достоверном
      определении финансового результата выручка по договору и расходы по договору признаются в порядке,
      предусмотренном пунктами 17 - 21 настоящего Положения, независимо от того, на какой стадии исполнения
      договора устранена неопределенность.
  - path: '24'
    parent_path: null
    heading: Признание финансового результата
    text: В случае, если документально подтвержденные расходы по договору не возмещаются заказчиком, выявленная
      (ожидаемая) сумма превышения величины расходов по договору над величиной выручки по договору (ожидаемый
      убыток) признается в соответствующем отчетном периоде.
  - path: '25'
    parent_path: null
    heading: Признание финансового результата
    text: При применении способа "по мере готовности" в каждом отчетном периоде определение выручки по
      договору, расходов по договору и финансового результата по договору производится с учетом выручки
      по договору и расходов по договору, признанных в предыдущие отчетные периоды по указанному договору.
  - path: '26'
    parent_path: null
    heading: Признание финансового результата
    text: В бухгалтерском учете организации выручка по договору, признанная способом "по мере готовности",
      учитывается до полного завершения работ (этапа) как отдельный актив - "не предъявленная к оплате
      начисленная выручка". В случае, если в соответствии с договором организация может в ходе исполнения
      договора выставлять заказчику промежуточные счета на оплату выполненных работ, начисленная выручка
      по предъявленным к оплате работам списывается на дебиторскую задолженность по мере выставления промежуточных
      счетов заказчику. Если договором предусмотрено, что часть суммы за выполненные работы не подлежит
      оплате до выполнения определенных условий или до устранения выявленных недостатков работы, то такая
      сумма должна быть выделена в промежуточном счете. Не предъявленная к оплате начисленная выручка
      списывается на дебиторскую задолженность при выставлении заказчику счета на оплату завершенных работ
      по договору.
  - path: '27'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'В бухгалтерской отчетности организации раскрывается следующая информация по договорам, исполнявшимся
      в отчетном периоде: сумма признанной в отчетном периоде выручки по договору; способы определения
      признанной в отчетном периоде выручки по договору.'
  - path: '28'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'В бухгалтерской отчетности организации раскрывается следующая информация по каждому договору,
      не завершенному на отчетную дату: общая сумма понесенных расходов и признанных прибылей (за вычетом
      признанных убытков) на отчетную дату; сумма полученной предварительной оплаты, авансов, задатка
      на отчетную дату; сумма за выполненные работы, не предъявленная заказчику до выполнения определенных
      условий или до устранения выявленных недостатков работы на отчетную дату.'
  - path: '29'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'Разница между величиной не предъявленной к оплате начисленной выручки, которая признана в отчете
      о финансовых результатах за предыдущие и/или текущий отчетные периоды, и величиной начисленной выручки
      по предъявленным к оплате промежуточным счетам отражается развернуто в бухгалтерском балансе организации:
      (в ред. приказа Минфина России от 06.04.2015 № 57н) в качестве актива - не предъявленная к оплате
      начисленная выручка (если разница положительная); в качестве обязательства - задолженность перед
      заказчиками (если разница отрицательная).'
  - path: '30'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: В случаях, когда раскрытие информации в пояснениях к бухгалтерскому балансу и отчету о финансовых
      результатах (отчету о целевом использовании средств) в объеме, предусмотренном настоящим Положением,
      приведет или может привести к потерям экономического характера и (или) урону деловой репутации организации
      и (или) ее контрагентов, и (или) связанных с ней сторон, организация может раскрывать информацию
      в пояснениях к бухгалтерскому балансу и отчету о финансовых результатах (отчету о целевом использовании
      средств) в ограниченном объеме, не раскрывая те сведения, которые обусловливают указанные потери
      и (или) урон. (п.30 введен приказом Минфина России от 27.11.2020 № 287н)
