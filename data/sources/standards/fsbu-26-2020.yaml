id: fsbu-26-2020
kind: ФСБУ
number: 26/2020
year: 2020
title: Капитальные вложения
order_date: 2020-09-17
order_no: 204н
effective_from: &id001 2022-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящий Стандарт устанавливает требования к формированию в бухгалтерском учете информации
      о капитальных вложениях организаций.
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Настоящий Стандарт не применяется организациями бюджетной сферы.
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: 'Настоящий Стандарт не применяется:'
  - path: 3.а
    parent_path: '3'
    heading: null
    text: при выполнении организацией работ, оказании услуг по приобретению, созданию, улучшению средств
      производства, результатов интеллектуальной деятельности и средств индивидуализации, на которые у
      организации не возникают исключительные права, права в соответствии с лицензионными договорами либо
      иными документами, подтверждающими существование таких прав, восстановлению средств производства
      для других лиц;
  - path: 3.б
    parent_path: '3'
    heading: null
    text: при приобретении, создании организацией активов, предназначенных для продажи.
  - path: 3.заключение
    parent_path: '3'
    heading: null
    text: (п. 3 в ред. приказа Минфина России от 30.05.2022 № 87н)
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: 'Организация, которая вправе применять упрощенные способы ведения бухгалтерского учета, включая
      упрощенную бухгалтерскую (финансовую) отчетность, может:'
  - path: 4.а
    parent_path: '4'
    heading: null
    text: не применять подпункты «б» - «з» пункта 10, подпункт «б» пункта 11, пункт 12, абзацы первый
      - третий пункта 13, пункт 17, подпункты «в» - «д» пункта 23, пункт 24 настоящего Стандарта;
  - path: 4.б
    parent_path: '4'
    heading: null
    text: признавать затраты на приобретение, создание, улучшение объектов, которые подлежат принятию
      к бухгалтерскому учету в качестве нематериальных активов, в составе расходов по обычным видам деятельности
      в полной сумме по мере их осуществления.
  - path: 4.заключение
    parent_path: '4'
    heading: null
    text: (п. 4 в ред. приказа Минфина России от 30.05.2022 № 87н)
  - path: '5'
    parent_path: null
    heading: Общие положения
    text: 'Для целей бухгалтерского учета под капитальными вложениями понимаются определяемые в соответствии
      с настоящим Стандартом затраты организации на приобретение, создание, улучшение объектов основных
      средств, объектов нематериальных активов, а также восстановление объектов основных средств. К капитальным
      вложениям относятся, в частности, затраты на: (в ред. приказа Минфина России от 30.05.2022 № 87н)'
  - path: 5.а
    parent_path: '5'
    heading: null
    text: приобретение имущества, предназначенного для использования непосредственно в качестве объектов
      основных средств или их частей либо для использования в процессе приобретения, создания, улучшения
      объектов основных средств, объектов нематериальных активов, а также восстановления объектов основных
      средств; (в ред. приказа Минфина России от 30.05.2022 № 87н)
  - path: 5.б
    parent_path: '5'
    heading: null
    text: строительство, сооружение, изготовление объектов основных средств;
  - path: 5.в
    parent_path: '5'
    heading: null
    text: коренное улучшение земель;
  - path: 5.г
    parent_path: '5'
    heading: null
    text: подготовку проектной, рабочей и организационно-технологической документации (архитектурных проектов,
      разрешений на строительство, др.);
  - path: 5.д
    parent_path: '5'
    heading: null
    text: организацию строительной площадки;
  - path: 5.е
    parent_path: '5'
    heading: null
    text: осуществление авторского надзора;
  - path: 5.ж
    parent_path: '5'
    heading: null
    text: улучшение и (или) восстановление объекта основных средств (например, достройка, дооборудование,
      модернизация, реконструкция, замена частей, ремонт, технические осмотры, техническое обслуживание);
  - path: 5.з
    parent_path: '5'
    heading: null
    text: доставку и приведение объекта в состояние и местоположение, в которых он пригоден к использованию
      в запланированных целях, в том числе его монтаж, установку;
  - path: 5.и
    parent_path: '5'
    heading: null
    text: проведение пусконаладочных работ, испытаний;
  - path: 5.к
    parent_path: '5'
    heading: null
    text: приобретение исключительных прав, прав в соответствии с лицензионными договорами либо иными
      документами, подтверждающими существование таких прав, на результаты интеллектуальной деятельности
      и средства индивидуализации, предназначенные для использования непосредственно в качестве объектов
      нематериальных активов (далее - права на результаты интеллектуальной деятельности и средства индивидуализации);
      (пп. «к» введен приказом Минфина России от 30.05.2022 № 87н)
  - path: 5.л
    parent_path: '5'
    heading: null
    text: создание объектов нематериальных активов, в том числе в результате выполнения научно-исследовательских,
      опытно-конструкторских и технологических работ; (пп. «л» введен приказом Минфина России от 30.05.2022
      № 87н)
  - path: 5.м
    parent_path: '5'
    heading: null
    text: улучшение объектов нематериальных активов, связанное с улучшением (повышением) первоначально
      принятых нормативных показателей функционирования таких объектов; (пп. «м» введен приказом Минфина
      России от 30.05.2022 № 87н)
  - path: 5.н
    parent_path: '5'
    heading: null
    text: приобретение (в частности, получение, продление, переоформление, подтверждение) прав на осуществление
      отдельных видов деятельности согласно специальному разрешению (лицензии).
  - path: 5.заключение
    parent_path: '5'
    heading: null
    text: (пп. «н» введен приказом Минфина России от 30.05.2022 № 87н)
  - path: '6'
    parent_path: null
    heading: Общие положения
    text: 'Капитальные вложения признаются в бухгалтерском учете при одновременном соблюдении следующих
      условий:'
  - path: 6.а
    parent_path: '6'
    heading: null
    text: понесенные затраты обеспечат получение в будущем экономических выгод организацией (достижение
      некоммерческой организацией целей, ради которых она создана) в течение периода более 12 месяцев
      или обычного операционного цикла, превышающего 12 месяцев; (в ред. приказа Минфина России от 30.05.2022
      № 87н)
  - path: 6.б
    parent_path: '6'
    heading: null
    text: определена сумма понесенных затрат или приравненная к ней величина.
  - path: 6.заключение
    parent_path: '6'
    heading: null
    text: Капитальные вложения признаются в бухгалтерском учете при соблюдении условий, установленных
      настоящим пунктом, вне зависимости от того, осуществлены ли они при первоначальном приобретении,
      создании объектов основных средств, объектов нематериальных активов или при последующем улучшении
      объектов нематериальных активов, последующем улучшении и (или) восстановлении объектов основных
      средств. (в ред. приказа Минфина России от 30.05.2022 № 87н)
  - path: '7'
    parent_path: null
    heading: Общие положения
    text: Единицей учета капитальных вложений является приобретаемый, создаваемый, улучшаемый объект основных
      средств, объект нематериальных активов или восстанавливаемый объект основных средств. (в ред. приказа
      Минфина России от 30.05.2022 № 87н)
  - path: '8'
    parent_path: null
    heading: Общие положения
    text: Капитальные вложения классифицируются в бухгалтерском учете исходя из целей управления организацией,
      включая нужды анализа, контроля и отчетности.
  - path: '9'
    parent_path: null
    heading: Оценка
    text: Капитальные вложения признаются в бухгалтерском учете в сумме фактических затрат на приобретение,
      создание, улучшение объектов основных средств, объектов нематериальных активов, а также на восстановление
      объектов основных средств (далее - фактические затраты). Для целей настоящего Стандарта затратами
      считается выбытие (уменьшение) активов организации или возникновение (увеличение) ее обязательств,
      связанных с осуществлением капитальных вложений. Не считается затратами предварительная оплата поставщику
      (продавцу, подрядчику, правообладателю) до момента исполнения им своих договорных обязанностей предоставления
      имущества, прав на результаты интеллектуальной деятельности и средства индивидуализации, выполнения
      работ, оказания услуг. (в ред. приказа Минфина России от 30.05.2022 № 87н) В целях определения фактических
      затрат к возникновению (увеличению) обязательств организации приравнивается увеличение капитала
      организации вследствие выпуска собственных долевых инструментов (эмиссия акций, увеличения уставного
      (складочного) капитала, уставного (паевого) фонда), безвозмездного получения имущества, прав на
      результаты интеллектуальной деятельности и средства индивидуализации от акционеров, собственников,
      участников, учредителей организации (в том числе вследствие передачи государственного или муниципального
      имущества, прав на результаты интеллектуальной деятельности и средства индивидуализации унитарному
      предприятию), а также увеличение целевого финансирования некоммерческой организации вследствие получения
      ею имущества, прав на результаты интеллектуальной деятельности и средства индивидуализации в качестве
      целевого финансирования. (в ред. приказа Минфина России от 30.05.2022 № 87н) Капитальные вложения
      признаются по мере осуществления фактических затрат, в отношении которых соблюдаются условия, установленные
      пунктами 6, 17 3 настоящего Стандарта. (в ред. приказа Минфина России от 30.05.2022 № 87н)
  - path: '10'
    parent_path: null
    heading: Оценка
    text: 'В сумму фактических затрат при признании капитальных вложений включаются:'
  - path: 10.а
    parent_path: '10'
    heading: null
    text: уплаченные и (или) подлежащие уплате организацией поставщику (продавцу, подрядчику, правообладателю)
      при осуществлении капитальных вложений суммы, определяемые с учетом пунктов 11, 12 настоящего Стандарта;
      (в ред. приказа Минфина России от 30.05.2022 № 87н)
  - path: 10.б
    parent_path: '10'
    heading: null
    text: стоимость активов организации (в частности, материальных носителей (вещей), в которых выражены
      результаты интеллектуальной деятельности, средства индивидуализации), списываемая в связи с использованием
      этих активов при осуществлении капитальных вложений; (в ред. приказа Минфина России от 30.05.2022
      № 87н)
  - path: 10.в
    parent_path: '10'
    heading: null
    text: амортизация активов, используемых при осуществлении капитальных вложений;
  - path: 10.г
    parent_path: '10'
    heading: null
    text: затраты на поддержание работоспособности или исправности активов, используемых при осуществлении
      капитальных вложений, текущий ремонт этих активов;
  - path: 10.д
    parent_path: '10'
    heading: null
    text: заработная плата и любые другие формы вознаграждений работникам организации, труд которых используется
      для осуществления капитальных вложений, а также все связанные с указанными вознаграждениями социальные
      платежи (пенсионное, медицинское страхование и др.);
  - path: 10.е
    parent_path: '10'
    heading: null
    text: связанные с осуществлением капитальных вложений проценты, которые подлежат включению в стоимость
      инвестиционного актива;
  - path: 10.ж
    parent_path: '10'
    heading: null
    text: величина возникшего при осуществлении капитальных вложений оценочного обязательства, в том числе
      по будущему демонтажу, утилизации имущества и восстановлению окружающей среды, а также возникшего
      в связи с использованием труда работников организации; ж 1 ) государственные пошлины и другие аналогичные
      расходы, произведенные в связи с приобретением, созданием, улучшением объекта нематериальных активов;
      (пп. «ж 1 » введен приказом Минфина России от 30.05.2022 № 87н)
  - path: 10.з
    parent_path: '10'
    heading: null
    text: иные затраты, в отношении которых соблюдаются условия, установленные пунктами 6, 17 3 настоящего
      Стандарта.
  - path: 10.заключение
    parent_path: '10'
    heading: null
    text: (в ред. приказа Минфина России от 30.05.2022 № 87н)
  - path: '11'
    parent_path: null
    heading: Оценка
    text: 'Суммы, уплаченные и (или) подлежащие уплате организацией при осуществлении капитальных вложений,
      включаются в стоимость капитальных вложений:'
  - path: 11.а
    parent_path: '11'
    heading: null
    text: за вычетом возмещаемых сумм налогов и сборов;
  - path: 11.б
    parent_path: '11'
    heading: null
    text: с учетом всех скидок, уступок, вычетов, премий, льгот, предоставляемых организации, вне зависимости
      от формы их предоставления.
  - path: '12'
    parent_path: null
    heading: Оценка
    text: При осуществлении капитальных вложений на условиях отсрочки (рассрочки) платежа на период, превышающий
      12 месяцев или установленный организацией меньший срок, в капитальные вложения включается сумма
      денежных средств, которая была бы уплачена организацией при отсутствии указанной отсрочки (рассрочки).
      Разница между указанной суммой и номинальной величиной денежных средств, подлежащих уплате в будущем,
      учитывается в порядке, аналогичном порядку, установленному Положением по бухгалтерскому учету «Учет
      расходов по займам и кредитам» (ПБУ 15/2008), утвержденным приказом Министерства финансов Российской
      Федерации от 6 октября 2008 г. № 107н (зарегистрирован Министерством юстиции Российской Федерации
      27 октября 2008 г, регистрационный № 12523).
  - path: '13'
    parent_path: null
    heading: Оценка
    text: При осуществлении капитальных вложений по договорам, предусматривающим исполнение обязательств
      (оплату) полностью или частично неденежными средствами, фактическими затратами (в части оплаты неденежными
      средствами) считается справедливая стоимость передаваемых имущества, прав на результаты интеллектуальной
      деятельности и средства индивидуализации, работ, услуг. (в ред. приказа Минфина России от 30.05.2022
      № 87н) Для целей настоящего Стандарта справедливая стоимость определяется в порядке, предусмотренном
      Международным стандартом финансовой отчетности (IFRS) 13 «Оценка справедливой стоимости», введенным
      в действие на территории Российской Федерации приказом Министерства финансов Российской Федерации
      от 28 декабря 2015 г. № 217н (зарегистрирован Министерством юстиции Российской Федерации 2 февраля
      2016 г., регистрационный № 40940). При невозможности определения справедливой стоимости передаваемых
      имущества, прав на результаты интеллектуальной деятельности и средства индивидуализации, работ,
      услуг фактическими затратами считается справедливая стоимость приобретаемых имущества, прав на результаты
      интеллектуальной деятельности и средства индивидуализации, работ, услуг. (в ред. приказа Минфина
      России от 30.05.2022 № 87н) При невозможности определения справедливой стоимости как передаваемых,
      так и приобретаемых имущества, прав на результаты интеллектуальной деятельности и средства индивидуализации,
      работ, услуг фактическими затратами считается балансовая стоимость передаваемых активов, фактические
      затраты, понесенные на выполнение работ, оказание услуг. (в ред. приказа Минфина России от 30.05.2022
      № 87н) Организация, которая вправе применять упрощенные способы ведения бухгалтерского учета, включая
      упрощенную бухгалтерскую (финансовую) отчетность, вправе определять фактические затраты (в части
      оплаты неденежными средствами) в сумме балансовой стоимости передаваемых активов, фактических затрат,
      понесенных на выполнение работ, оказание услуг, вне зависимости от возможности определения справедливой
      стоимости как передаваемых, так и приобретаемых имущества, прав на результаты интеллектуальной деятельности
      и средства индивидуализации, работ, услуг. (абзац введен приказом Минфина России от 30.05.2022 №
      87н)
  - path: '14'
    parent_path: null
    heading: Оценка
    text: Фактическими затратами в имущество, права на результаты интеллектуальной деятельности и средства
      индивидуализации, которые организация получает безвозмездно, считается справедливая стоимость таких
      имущества, прав. (п. 14 в ред. приказа Минфина России от 30.05.2022 № 87н)
  - path: '14.1'
    parent_path: null
    heading: Оценка
    text: Фактические затраты, связанные с осуществлением капитальных вложений в несколько объектов основных
      средств, объектов нематериальных активов, распределяются между ними обоснованным способом, установленным
      организацией самостоятельно. (п. 14 1 введен приказом Минфина России от 30.05.2022 № 87н)
  - path: '15'
    parent_path: null
    heading: Оценка
    text: 'В случае если в ходе осуществления капитальных вложений (например, при проведении пусконаладочных
      работ, испытаний) организация получает продукцию, вторичное сырье, другие материальные ценности,
      которые намерена продать или иным образом использовать, расчетная стоимость таких ценностей вычитается
      из величины капитальных вложений. При этом расчетная стоимость полученных ценностей определяется
      исходя из фактических затрат на их приобретение, создание, а если их невозможно определить, то исходя
      из их справедливой стоимости, чистой стоимости продажи, стоимости аналогичных ценностей и не может
      быть выше суммы затрат, из которой вычитается эта стоимость. (в ред. приказа Минфина России от 30.05.2022
      № 87н) Установленный настоящим пунктом порядок учета применяется также к: (в ред. приказа Минфина
      России от 30.05.2022 № 87н) материальным ценностям, оставшимся неиспользованными при осуществлении
      капитальных вложений; (абзац введен приказом Минфина России от 30.05.2022 № 87н) материальным носителям
      (вещам), в которых выражены результаты интеллектуальной деятельности, средства индивидуализации,
      при признании таких объектов обособленно от объекта нематериальных активов. (абзац введен приказом
      Минфина России от 30.05.2022 № 87н)'
  - path: '15.1'
    parent_path: null
    heading: Оценка
    text: В случае если при выполнении работ, оказании услуг для заказчика организация создает объект
      интеллектуальной собственности, на который у организации возникают исключительные права (в том числе
      совместные с иными лицами) или права использования, и такой объект соответствует условиям признания
      нематериальных активов, расчетная стоимость капитальных вложений в такой объект вычитается из суммы
      фактических затрат на выполнение работ, оказание услуг для заказчика. При этом расчетная стоимость
      капитальных вложений в объект нематериальных активов определяется в порядке, установленном пунктом
      15 настоящего Стандарта. (п. 15 1 введен приказом Минфина России от 30.05.2022 № 87н)
  - path: '16'
    parent_path: null
    heading: Оценка
    text: 'В капитальные вложения не включаются:'
  - path: 16.а
    parent_path: '16'
    heading: null
    text: затраты, понесенные до принятия решения о приобретении, создании, улучшении объекта основных
      средств, объекта нематериальных активов, о восстановлении объекта основных средств; (в ред. приказа
      Минфина России от 30.05.2022 № 87н)
  - path: 16.б
    parent_path: '16'
    heading: null
    text: затраты на поддержание работоспособности или исправности основных средств, материальных носителей
      (вещей), в которых выражены результаты интеллектуальной деятельности, средства индивидуализации,
      их текущий ремонт (за исключением случая, указанного в подпункте «г» пункта 10 настоящего Стандарта);
      (в ред. приказа Минфина России от 30.05.2022 № 87н)
  - path: 16.в
    parent_path: '16'
    heading: null
    text: затраты на неплановые ремонты основных средств, обусловленные поломками, авариями, дефектами,
      ненадлежащей эксплуатацией, в той степени, в которой такие ремонты восстанавливают нормативные показатели
      функционирования объектов основных средств, в том числе сроки полезного использования, но не улучшают
      и не продлевают их;
  - path: 16.г
    parent_path: '16'
    heading: null
    text: затраты, возникшие в связи с ненадлежащей организацией процесса осуществления капитальных вложений
      (сверхнормативный расход сырья, материалов, энергии, труда, потери от простоев, брака, нарушений
      трудовой и технологической дисциплины);
  - path: 16.д
    parent_path: '16'
    heading: null
    text: затраты, возникшие в связи со стихийными бедствиями, пожарами, авариями и другими чрезвычайными
      ситуациями;
  - path: 16.е
    parent_path: '16'
    heading: null
    text: обесценение других активов, независимо от того, использовались ли эти активы при осуществлении
      капитальных вложений;
  - path: 16.ж
    parent_path: '16'
    heading: null
    text: управленческие расходы, за исключением случаев, когда они непосредственно связаны с приобретением,
      созданием, улучшением основных средств, нематериальных активов, восстановлением основных средств;
      (в ред. приказа Минфина России от 30.05.2022 № 87н)
  - path: 16.з
    parent_path: '16'
    heading: null
    text: расходы на рекламу и продвижение продукции, работ, услуг; (в ред. приказа Минфина России от
      30.05.2022 № 87н)
  - path: 16.и
    parent_path: '16'
    heading: null
    text: затраты, связанные с организацией хозяйственной деятельности в новом месте, с новыми покупателями
      или с новыми видами продукции, работ, услуг; (в ред. приказа Минфина России от 30.05.2022 № 87н)
  - path: 16.к
    parent_path: '16'
    heading: null
    text: затраты на перемещение, ликвидацию ранее использовавшихся основных средств организации, независимо
      от того, являются ли такие перемещение, ликвидация необходимыми для осуществления капитальных вложений;
  - path: 16.л
    parent_path: '16'
    heading: null
    text: затраты на предстоящую реструктуризацию деятельности организации;
  - path: 16.м
    parent_path: '16'
    heading: null
    text: затраты на обучение персонала;
  - path: 16.н
    parent_path: '16'
    heading: null
    text: затраты на поддержание, обновление, восстановление, сохранение нормативных показателей функционирования
      объектов нематериальных активов, в том числе сроков полезного использования, отличные от затрат
      на улучшение, в том числе продление сроков полезного использования объектов нематериальных активов;
      (пп. «н» в ред. приказа Минфина России от 30.05.2022 № 87н)
  - path: 16.о
    parent_path: '16'
    heading: null
    text: иные затраты, осуществление которых не является необходимым для приобретения, создания, улучшения
      основных средств, нематериальных активов, восстановления основных средств.
  - path: 16.заключение
    parent_path: '16'
    heading: null
    text: (пп. «о» введен приказом Минфина России от 30.05.2022 № 87н) Указанные в настоящем пункте затраты
      признаются расходами периода, в котором понесены.
  - path: '17'
    parent_path: null
    heading: Оценка
    text: Организация проверяет капитальные вложения на обесценение и учитывает изменение их балансовой
      стоимости вследствие обесценения в порядке, предусмотренном Международным стандартом финансовой
      отчетности (IAS) 36 «Обесценение активов», введенным в действие на территории Российской Федерации
      приказом Министерства финансов Российской Федерации от 28 декабря 2015 г. № 217н (зарегистрирован
      Министерством юстиции Российской Федерации 2 февраля 2016 г., регистрационный № 40940). Возмещение
      убытков, связанных с обесценением или утратой объекта капитальных вложений, предоставляемое организации
      другими лицами, признается доходом в составе прибыли (убытка) периода, в котором у организации возникает
      право на получение такого возмещения.
  - path: '17.1'
    parent_path: null
    heading: Оценка
    text: В бухгалтерском учете суммы накопленного обесценения по объекту капитальных вложений отражаются
      отдельно от суммы фактических затрат, связанных с осуществлением этих капитальных вложений, и не
      изменяют ее. (п. 17 1 введен приказом Минфина России от 30.05.2022 № 87н)
  - path: '17.2'
    parent_path: null
    heading: Оценка
    text: В бухгалтерском балансе капитальные вложения отражаются по балансовой стоимости, которая представляет
      собой фактические затраты, понесенные в связи с осуществлением их, уменьшенные на сумму накопленного
      обесценения. (п. 17 2 введен приказом Минфина России от 30.05.2022 № 87н)
  - path: '17.3'
    parent_path: null
    heading: Научно-исследовательские, опытно-конструкторские и технологические работы
    text: 'При создании объекта нематериальных активов в результате выполнения научно-исследовательских,
      опытно-конструкторских и технологических работ фактические затраты на создание такого объекта признаются
      капитальными вложениями при соблюдении одновременно следующих условий:'
  - path: 17.3.а
    parent_path: '17.3'
    heading: null
    text: осуществимо завершение создания объекта нематериальных активов и доведение его до состояния,
      пригодного к использованию в запланированных целях;
  - path: 17.3.б
    parent_path: '17.3'
    heading: null
    text: у организации имеется намерение завершить создание объекта нематериальных активов;
  - path: 17.3.в
    parent_path: '17.3'
    heading: null
    text: у организации имеются намерение и возможность использовать объект нематериальных активов;
  - path: 17.3.г
    parent_path: '17.3'
    heading: null
    text: понесенные затраты обеспечат получение в будущем экономических выгод организацией (в частности,
      имеется рынок сбыта продукции (работ, услуг), производимой (выполняемых, оказываемых) с использованием
      создаваемого объекта нематериальных активов, либо рынок сбыта создаваемого объекта нематериальных
      активов, либо известны способы использования создаваемого нематериального актива в организации);
  - path: 17.3.д
    parent_path: '17.3'
    heading: null
    text: у организации имеются необходимые и достаточные материальные, финансовые и другие ресурсы для
      завершения создания и использования объекта нематериальных активов (например, у организации имеются
      бизнес-планы, показывающие требуемые технические, финансовые и прочие ресурсы и способность организации
      обеспечить наличие таких ресурсов);
  - path: 17.3.е
    parent_path: '17.3'
    heading: null
    text: определена сумма затрат, необходимых для создания объекта нематериальных активов и доведения
      его до состояния, пригодного к использованию в запланированных целях.
  - path: '17.4'
    parent_path: null
    heading: Научно-исследовательские, опытно-конструкторские и технологические работы
    text: 'Затраты, связанные с выполнением научно-исследовательских, опытно-конструкторских и технологических
      работ, отражаются в бухгалтерском учете организации с подразделением на затраты, относящиеся:'
  - path: 17.4.а
    parent_path: '17.4'
    heading: null
    text: к стадии исследований, то есть стадии выполнения уникальных изысканий, целью которых является
      получение новых научных или технических знаний и достижений;
  - path: 17.4.б
    parent_path: '17.4'
    heading: null
    text: к стадии разработок, то есть стадии применения результатов стадии исследований или иных знаний
      для планирования и проектирования производства новых или значительно улучшенных материалов, устройств,
      продуктов, процессов, систем, услуг до начала их производства в коммерческих целях или использования.
  - path: 17.4.заключение
    parent_path: '17.4'
    heading: null
    text: Для целей бухгалтерского учета отнесение конкретных научно-исследовательских, опытно-конструкторских
      и технологических работ, выполняемых для создания объекта нематериальных активов, к стадии исследований
      или стадии разработок организация осуществляет самостоятельно.
  - path: '17.5'
    parent_path: null
    heading: Научно-исследовательские, опытно-конструкторские и технологические работы
    text: Фактические затраты, относящиеся к стадии разработок, признаются капитальными вложениями в объект
      нематериальных активов при соблюдении условий, установленных пунктами 6 и 17 3 настоящего Стандарта.
  - path: '17.6'
    parent_path: null
    heading: Научно-исследовательские, опытно-конструкторские и технологические работы
    text: 'Не признаются капитальными вложениями в объект нематериальных активов:'
  - path: 17.6.а
    parent_path: '17.6'
    heading: null
    text: относящиеся к стадии исследований фактические затраты;
  - path: 17.6.б
    parent_path: '17.6'
    heading: null
    text: относящиеся к стадии разработок фактические затраты, в отношении которых не соблюдаются условия,
      установленные пунктом 17 3 настоящего Стандарта;
  - path: 17.6.в
    parent_path: '17.6'
    heading: null
    text: связанные с выполнением научно-исследовательских, опытно-конструкторских и технологических работ
      фактические затраты, которые организация не может однозначно классифицировать как затраты, относящиеся
      к стадии исследований, или затраты, относящиеся к стадии разработок.
  - path: 17.6.заключение
    parent_path: '17.6'
    heading: null
    text: Фактические затраты, указанные в настоящем пункте, признаются расходами периода, в котором они
      были понесены. В последующие отчетные периоды такие затраты не могут быть восстановлены в качестве
      капитальных вложений в объекты нематериальных активов.
  - path: '18'
    parent_path: null
    heading: Прекращение признания
    text: Капитальные вложения по их завершении, то есть после приведения объекта капитальных вложений
      в состояние и местоположение, в которых он пригоден к использованию в запланированных целях, считаются
      основными средствами или нематериальными активами. В случае фактического начала эксплуатации части
      объекта капитальных вложений до завершения капитальных вложений в целом, организация признает такую
      часть капитальных вложений объектом основных средств или объектом нематериальных активов. (п. 18
      в ред. приказа Минфина России от 30.05.2022 № 87н)
  - path: '19'
    parent_path: null
    heading: Прекращение признания
    text: 'Капитальные вложения, которые выбывают или не способны приносить организации экономические
      выгоды в будущем, списываются с бухгалтерского учета. Списание капитальных вложений обусловливается,
      например:'
  - path: 19.а
    parent_path: '19'
    heading: null
    text: передачей имущества, отчуждением прав на результаты интеллектуальной деятельности и средства
      индивидуализации другому лицу в связи с их продажей, меной, передачей в виде вклада в капитал другой
      организации, передачей в некоммерческую организацию; (в ред. приказа Минфина России от 30.05.2022
      № 87н)
  - path: 19.б
    parent_path: '19'
    heading: null
    text: физическим выбытием имущества в связи с его утратой, стихийным бедствием, пожаром, аварией и
      другими чрезвычайными ситуациями;
  - path: 19.в
    parent_path: '19'
    heading: null
    text: прекращением осуществления капитальных вложений при отсутствии перспектив возобновления или
      продажи незавершенных объектов.
  - path: '20'
    parent_path: null
    heading: Прекращение признания
    text: Капитальные вложения подлежат списанию в том отчетном периоде, в котором они выбывают или прекращаются
      при отсутствии перспектив возобновления или продажи.
  - path: '21'
    parent_path: null
    heading: Прекращение признания
    text: Затраты на демонтаж, утилизацию объектов незавершенных капитальных вложений и восстановление
      окружающей среды признаются расходами периода, в котором были понесены, за исключением случаев,
      когда в отношении этих затрат ранее было признано оценочное обязательство.
  - path: '22'
    parent_path: null
    heading: Прекращение признания
    text: Разница между суммой балансовой стоимости списываемых капитальных вложений и затрат на их выбытие,
      с одной стороны, и поступлениями от их выбытия, с другой стороны, признается расходом или доходом
      периода, в котором списываются такие капитальные вложения.
  - path: '23'
    parent_path: null
    heading: Раскрытие информации в отчетности
    text: 'В бухгалтерской (финансовой) отчетности раскрывается с учетом существенности следующая информация:'
  - path: 23.а
    parent_path: '23'
    heading: null
    text: балансовая стоимость капитальных вложений в объекты основных средств, отличные от инвестиционной
      недвижимости, и в инвестиционную недвижимость на начало и конец отчетного периода; (в ред. приказа
      Минфина России от 30.05.2022 № 87н) а 1 ) балансовая стоимость капитальных вложений в объекты нематериальных
      активов на начало и конец отчетного периода; (пп. «а 1 » введен приказом Минфина России от 30.05.2022
      № 87н) а 2 ) затраты на выполнение научно-исследовательских, опытно-конструкторских и технологических
      работ, признанные расходами отчетного периода; (пп. «а 2 » введен приказом Минфина России от 30.05.2022
      № 87н)
  - path: 23.б
    parent_path: '23'
    heading: null
    text: результат от выбытия капитальных вложений за отчетный период;
  - path: 23.в
    parent_path: '23'
    heading: null
    text: результат обесценения капитальных вложений и восстановления обесценения, включенный в расходы
      или доходы отчетного периода;
  - path: 23.г
    parent_path: '23'
    heading: null
    text: авансы, предварительная оплата, задатки, уплаченные организацией в связи с осуществлением капитальных
      вложений;
  - path: 23.д
    parent_path: '23'
    heading: null
    text: признанная доходом в составе прибыли (убытка) сумма возмещения убытков, связанных с обесценением
      или утратой объектов капитальных вложений, предоставленного организации другими лицами.
  - path: 23.заключение
    parent_path: '23'
    heading: null
    text: В случае создания нематериальных активов организацией информация о капитальных вложениях в такие
      объекты нематериальных активов, предусмотренная подпунктами «а 1 » и «а 2 » настоящего пункта, раскрывается
      обособленно. (абзац введен приказом Минфина России от 30.05.2022 № 87н) Информация, предусмотренная
      подпунктами «б» - «д» настоящего пункта, раскрывается обособленно в отношении капитальных вложений
      в объекты основных средств и капитальных вложений в объекты нематериальных активов. (абзац введен
      приказом Минфина России от 30.05.2022 № 87н)
  - path: '24'
    parent_path: null
    heading: Раскрытие информации в отчетности
    text: Организация раскрывает предусмотренную Международным стандартом финансовой отчетности (IAS)
      36 «Обесценение активов», введенным в действие на территории Российской Федерации приказом Министерства
      финансов Российской Федерации от 28 декабря 2015 г. № 217н (зарегистрирован Министерством юстиции
      Российской Федерации 2 февраля 2016 г., регистрационный № 40940), информацию об обесценении капитальных
      вложений.
  - path: '25'
    parent_path: null
    heading: Изменение учетной политики
    text: Последствия изменений учетной политики в связи с началом применения настоящего Стандарта отражаются
      ретроспективно (как если бы настоящий Стандарт применялся с момента возникновения затрагиваемых
      им фактов хозяйственной жизни), если иное не установлено настоящим Стандартом.
  - path: '25.1'
    parent_path: null
    heading: Изменение учетной политики
    text: 'В бухгалтерской (финансовой) отчетности организации, начиная с которой применяется настоящий
      Стандарт в отношении капитальных вложений в объекты нематериальных активов, допускается не пересчитывать
      сравнительные показатели за периоды, предшествующие отчетному. В этом случае:'
  - path: 25.1.а
    parent_path: '25.1'
    heading: null
    text: в отношении объектов бухгалтерского учета, которые в соответствии с настоящим Стандартом должны
      быть признаны в бухгалтерском учете как капитальные вложения в объекты нематериальных активов и
      в соответствии с ранее применявшейся учетной политикой учитывались как капитальные вложения в объекты
      нематериальных активов, организация не корректирует их балансовую стоимость на начало отчетного
      периода (конец периода, предшествующего отчетному);
  - path: 25.1.б
    parent_path: '25.1'
    heading: null
    text: в отношении объектов бухгалтерского учета, которые в соответствии с настоящим Стандартом должны
      быть признаны в бухгалтерском учете как капитальные вложения в объекты нематериальных активов, но
      в соответствии с ранее применявшейся учетной политикой учитывались как активы других видов, организация
      должна на начало отчетного периода (конец периода, предшествующего отчетному) переклассифицировать
      их в капитальные вложения в объекты нематериальных активов, признать в качестве их балансовой стоимости
      балансовую стоимость соответствующего объекта бухгалтерского учета на момент его переклассификации;
  - path: 25.1.в
    parent_path: '25.1'
    heading: null
    text: в отношении объектов бухгалтерского учета, которые в соответствии с ранее применявшейся учетной
      политикой учитывались как капитальные вложения в объекты нематериальных активов, но в соответствии
      с настоящим Стандартом таковыми не являются, организация должна на начало отчетного периода (конец
      периода, предшествующего отчетному) списать балансовую стоимость таких объектов единовременно на
      нераспределенную прибыль организации, за исключением случаев переклассификации таких объектов в
      другой вид активов.
  - path: 25.1.заключение
    parent_path: '25.1'
    heading: null
    text: (п. 25 1 введен приказом Минфина России от 30.05.2022 № 87н)
  - path: '26'
    parent_path: null
    heading: Изменение учетной политики
    text: Настоящий Стандарт допускается применять перспективно (только в отношении фактов хозяйственной
      жизни, имевших место после начала применения настоящего Стандарта, без изменения сформированных
      ранее данных бухгалтерского учета).
  - path: '27'
    parent_path: null
    heading: Изменение учетной политики
    text: Организация раскрывает выбранный ею из установленных пунктами 25, 25 1 настоящего Стандарта
      способ отражения последствий изменения учетной политики в связи с началом применения настоящего
      Стандарта и последствия изменения учетной политики, соответствующие выбранному способу их отражения,
      в своей первой бухгалтерской (финансовой) отчетности, составленной с применением настоящего Стандарта.
      (п. 27 в ред. приказа Минфина России от 30.05.2022 № 87н)
