year: 2008
title: Учетная политика организации
order_date: 2008-10-06
order_no: 106н
effective_from: &id001 2009-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает правила формирования (выбора или разработки) и раскрытия учетной
      политики организаций, являющихся юридическими лицами по законодательству Российской Федерации (за
      исключением кредитных организаций и организаций государственного сектора) (далее - организации).
      (в ред. приказов Минфина России от 25.10.2010 № 132н, от 28.04.2017 № 69н) Филиалы и представительства
      иностранных организаций, находящиеся на территории Российской Федерации, могут формировать учетную
      политику в соответствии с настоящим Положением либо исходя из правил, установленных в стране нахождения
      иностранной организации, если последние не противоречат Международным стандартам финансовой отчетности.
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Для целей настоящего Положения под учетной политикой организации понимается принятая ею совокупность
      способов ведения бухгалтерского учета - первичного наблюдения, стоимостного измерения, текущей группировки
      и итогового обобщения фактов хозяйственной деятельности. К способам ведения бухгалтерского учета
      относятся способы группировки и оценки фактов хозяйственной деятельности, погашения стоимости активов,
      организации документооборота, инвентаризации, применения счетов бухгалтерского учета, организации
      регистров бухгалтерского учета, обработки информации.
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: 'Настоящее Положение распространяется: в части формирования учетной политики - на все организации;
      в части раскрытия учетной политики - на организации, публикующие свою бухгалтерскую отчетность полностью
      или частично согласно законодательству Российской Федерации, учредительным документам либо по собственной
      инициативе.'
  - path: '4'
    parent_path: null
    heading: Формирование учетной политики
    text: 'Учетная политика организации формируется главным бухгалтером или иным лицом, на которое в соответствии
      с законодательством Российской Федерации возложено ведение бухгалтерского учета организации, на
      основе настоящего Положения и утверждается руководителем организации. При этом утверждаются: рабочий
      план счетов бухгалтерского учета, содержащий синтетические и аналитические счета, необходимые для
      ведения бухгалтерского учета в соответствии с требованиями своевременности и полноты учета и отчетности;
      формы первичных учетных документов, регистров бухгалтерского учета, а также документов для внутренней
      бухгалтерской отчетности; порядок проведения инвентаризации активов и обязательств организации;
      способы оценки активов и обязательств; правила документооборота и технология обработки учетной информации;
      порядок контроля за хозяйственными операциями; другие решения, необходимые для организации бухгалтерского
      учета.'
  - path: '5'
    parent_path: null
    heading: Формирование учетной политики
    text: 'При формировании учетной политики предполагается, что: активы и обязательства организации существуют
      обособленно от активов и обязательств собственников этой организации и активов и обязательств других
      организаций (допущение имущественной обособленности); организация будет продолжать свою деятельность
      в обозримом будущем и у нее отсутствуют намерения и необходимость ликвидации или существенного сокращения
      деятельности и, следовательно, обязательства будут погашаться в установленном порядке (допущение
      непрерывности деятельности); принятая организацией учетная политика применяется последовательно
      от одного отчетного года к другому (допущение последовательности применения учетной политики); факты
      хозяйственной деятельности организации относятся к тому отчетному периоду, в котором они имели место,
      независимо от фактического времени поступления или выплаты денежных средств, связанных с этими фактами
      (допущение временной определенности фактов хозяйственной деятельности).'
  - path: '5.1'
    parent_path: null
    heading: Формирование учетной политики
    text: Организация выбирает способы ведения бухгалтерского учета независимо от выбора способов ведения
      бухгалтерского учета другими организациями. В случае если основное общество утверждает свои стандарты
      бухгалтерского учета, обязательные к применению его дочерним обществом, то такое дочернее общество
      выбирает способы ведения бухгалтерского учета исходя из указанных стандартов. (введен приказом Минфина
      России от 28.04.2017 № 69н)
  - path: '6'
    parent_path: null
    heading: Формирование учетной политики
    text: 'Учетная политика организации должна обеспечивать: полноту отражения в бухгалтерском учете всех
      фактов хозяйственной деятельности (требование полноты); своевременное отражение фактов хозяйственной
      деятельности в бухгалтерском учете и бухгалтерской отчетности (требование своевременности); большую
      готовность к признанию в бухгалтерском учете расходов и обязательств, чем возможных доходов и активов,
      не допуская создания скрытых резервов (требование осмотрительности); отражение в бухгалтерском учете
      фактов хозяйственной деятельности исходя не столько из их правовой формы, сколько из их экономического
      содержания и условий хозяйствования (требование приоритета содержания перед формой); тождество данных
      аналитического учета оборотам и остаткам по счетам синтетического учета на последний календарный
      день каждого месяца (требование непротиворечивости); рациональное ведение бухгалтерского учета,
      исходя из условий хозяйствования и величины организации, а также исходя из соотношения затрат на
      формирование информации о конкретном объекте бухгалтерского учета и полезности (ценности) этой информации
      (требование рациональности). (в ред. приказа Минфина России от 28.04.2017 № 69н)'
  - path: '6.1'
    parent_path: null
    heading: Формирование учетной политики
    text: При формировании учетной политики микропредприятия и некоммерческие организации, которые вправе
      применять упрощенные способы ведения бухгалтерского учета, включая упрощенную бухгалтерскую (финансовую)
      отчетность, могут предусмотреть в ней ведение бухгалтерского учета по простой системе (без применения
      двойной записи). (введен приказом Минфина России от 18.12.2012 № 164н, в ред. приказа Минфина России
      от 06.04.2015 № 57н)
  - path: '7'
    parent_path: null
    heading: Формирование учетной политики
    text: Учет конкретного объекта бухгалтерского учета ведется способом, установленным федеральным стандартом
      бухгалтерского учета. В случае если по конкретному вопросу ведения бухгалтерского учета федеральный
      стандарт бухгалтерского учета допускает несколько способов ведения бухгалтерского учета, организация
      осуществляет выбор одного из этих способов, руководствуясь пунктами 5, 5.1 и 6 настоящего Положения.
      Организация, которая раскрывает составленную в соответствии с Международными стандартами финансовой
      отчетности консолидированную финансовую отчетность или финансовую отчетность организации, не создающей
      группу, вправе при формировании учетной политики руководствоваться федеральными стандартами бухгалтерского
      учета с учетом требований Международных стандартов финансовой отчетности. В частности, такая организация
      вправе не применять способ ведения бухгалтерского учета, установленный федеральным стандартом бухгалтерского
      учета, когда такой способ приводит к несоответствию учетной политики организации требованиям Международных
      стандартов финансовой отчетности. (п. 7 в ред. приказа Минфина России от 28.04.2017 № 69н) Стандарты
      бухгалтерского учета, утвержденные организацией, указанной в абзаце втором настоящего пункта, в
      соответствии с частью 14 статьи 21 Федерального закона «О бухгалтерском учете» и обязательные к
      применению ее дочерними обществами, могут устанавливать способы ведения бухгалтерского учета, выбранные
      ею в соответствии с положениями абзаца второго настоящего пункта. (абзац введен приказом Минфина
      России от 07.02.2020 № 18н)
  - path: '7.1'
    parent_path: null
    heading: Формирование учетной политики
    text: 'В случае если по конкретному вопросу ведения бухгалтерского учета в федеральных стандартах
      бухгалтерского учета не установлены способы ведения бухгалтерского учета, то организация разрабатывает
      соответствующий способ исходя из требований, установленных законодательством Российской Федерации
      о бухгалтерском учете, федеральными и (или) отраслевыми стандартами. При этом организация, основываясь
      на допущениях и требованиях, приведенных в пунктах 5 и 6 настоящего Положения, использует последовательно
      следующие документы:'
  - path: 7.1.а
    parent_path: '7.1'
    heading: null
    text: международные стандарты финансовой отчетности;
  - path: 7.1.б
    parent_path: '7.1'
    heading: null
    text: положения федеральных и (или) отраслевых стандартов бухгалтерского учета по аналогичным и (или)
      связанным вопросам;
  - path: 7.1.в
    parent_path: '7.1'
    heading: null
    text: рекомендации в области бухгалтерского учета.
  - path: 7.1.заключение
    parent_path: '7.1'
    heading: null
    text: (введен приказом Минфина России от 28.04.2017 № 69н)
  - path: '7.2'
    parent_path: null
    heading: Формирование учетной политики
    text: Организация, которая вправе применять упрощенные способы бухгалтерского учета, включая упрощенную
      бухгалтерскую (финансовую) отчетность, в случае отсутствия в федеральных стандартах бухгалтерского
      учета соответствующих способов ведения бухгалтерского учета по конкретному вопросу вправе формировать
      учетную политику, руководствуясь исключительно требованием рациональности. (введен приказом Минфина
      России от 28.04.2017 № 69н)
  - path: '7.3'
    parent_path: null
    heading: Формирование учетной политики
    text: 'В исключительных случаях, когда формирование учетной политики в соответствии с пунктами 7 и
      7.1 настоящего Положения приводит к недостоверному представлению финансового положения организации,
      финансовых результатов ее деятельности и движения ее денежных средств в бухгалтерской (финансовой)
      отчетности, организация вправе отступить от правил, установленных данными пунктами, при соблюдении
      всех следующих условий:'
  - path: 7.3.а
    parent_path: '7.3'
    heading: null
    text: определены обстоятельства, препятствующие формированию достоверного представления о ее финансовом
      положении, финансовых результатах деятельности и движении денежных средств в бухгалтерской (финансовой)
      отчетности;
  - path: 7.3.б
    parent_path: '7.3'
    heading: null
    text: возможен альтернативный способ ведения бухгалтерского учета, применение которого позволяет устранить
      указанные обстоятельства;
  - path: 7.3.в
    parent_path: '7.3'
    heading: null
    text: альтернативный способ ведения бухгалтерского учета не приводит к возникновению других обстоятельств,
      при которых бухгалтерская (финансовая) отчетность организации будет давать недостоверное представление
      о ее финансовом положении, финансовых результатах деятельности и движении денежных средств;
  - path: 7.3.г
    parent_path: '7.3'
    heading: null
    text: информация об отступлении от правил, установленных пунктами 7 и 7.1 настоящего Положения, и
      применении альтернативного способа ведения бухгалтерского учета раскрывается организацией в соответствии
      с настоящим Положением.
  - path: 7.3.заключение
    parent_path: '7.3'
    heading: null
    text: (введен приказом Минфина России от 28.04.2017 № 69н)
  - path: '7.4'
    parent_path: null
    heading: Формирование учетной политики
    text: В той степени, в которой применение учетной политики, сформированной в соответствии с пунктами
      7 и 7.1 настоящего Положения, приводит к формированию информации, от наличия, отсутствия или способа
      отражения которой в бухгалтерской (финансовой) отчетности организации не зависят экономические решения
      пользователей этой отчетности (далее - несущественная информация), организация вправе выбирать способ
      ведения бухгалтерского учета, руководствуясь исключительно требованием рациональности (без применения
      пунктов 7, 7.1 настоящего Положения). Отнесение информации к несущественной организация осуществляет
      самостоятельно исходя как из величины, так и характера этой информации. (введен приказом Минфина
      России от 28.04.2017 № 69н)
  - path: '8'
    parent_path: null
    heading: Формирование учетной политики
    text: Принятая организацией учетная политика подлежит оформлению соответствующей организационно-распорядительной
      документацией (приказами, распоряжениями, стандартами и т.п.) организации. (в ред. приказа Минфина
      России от 28.04.2017 № 69н)
  - path: '9'
    parent_path: null
    heading: Формирование учетной политики
    text: Способы ведения бухгалтерского учета, избранные организацией при формировании учетной политики,
      применяются с первого января года, следующего за годом утверждения соответствующего организационно-распорядительного
      документа. При этом они применяются всеми филиалами, представительствами и иными подразделениями
      организации (включая выделенные на отдельный баланс), независимо от их места нахождения. Вновь созданная
      организация, организация, возникшая в результате реорганизации, оформляет избранную учетную политику
      в соответствии с настоящим Положением не позднее 90 дней со дня государственной регистрации юридического
      лица. Принятая вновь созданной организацией учетная политика считается применяемой со дня государственной
      регистрации юридического лица.
  - path: '10'
    parent_path: null
    heading: Изменение учетной политики
    text: 'Изменение учетной политики организации может производиться в случаях: изменения законодательства
      Российской Федерации и (или) нормативных правовых актов по бухгалтерскому учету; разработки организацией
      новых способов ведения бухгалтерского учета. Применение нового способа ведения бухгалтерского учета
      предполагает повышение качества информации об объекте бухгалтерского учета; (в ред. приказа Минфина
      России от 28.04.2017 № 69н) существенного изменения условий хозяйствования. Существенное изменение
      условий хозяйствования организации может быть связано с реорганизацией, изменением видов деятельности
      и т.п. Не считается изменением учетной политики утверждение способа ведения бухгалтерского учета
      фактов хозяйственной деятельности, которые отличны по существу от фактов, имевших место ранее, или
      возникли впервые в деятельности организации.'
  - path: '11'
    parent_path: null
    heading: Изменение учетной политики
    text: Изменение учетной политики должно быть обоснованным и оформляться в порядке, предусмотренном
      пунктом 8 настоящего Положения.
  - path: '12'
    parent_path: null
    heading: Изменение учетной политики
    text: Изменение учетной политики производится с начала отчетного года, если иное не обуславливается
      причиной такого изменения.
  - path: '13'
    parent_path: null
    heading: Изменение учетной политики
    text: Последствия изменения учетной политики, оказавшие или способные оказать существенное влияние
      на финансовое положение организации, финансовые результаты ее деятельности и (или) движение денежных
      средств, оцениваются в денежном выражении. Оценка в денежном выражении последствий изменений учетной
      политики производится на основании выверенных организацией данных на дату, с которой применяется
      измененный способ ведения бухгалтерского учета.
  - path: '14'
    parent_path: null
    heading: Изменение учетной политики
    text: Последствия изменения учетной политики, вызванного изменением законодательства Российской Федерации
      и (или) нормативных правовых актов по бухгалтерскому учету, отражаются в бухгалтерском учете и отчетности
      в порядке, установленном соответствующим законодательством Российской Федерации и (или) нормативным
      правовым актом по бухгалтерскому учету. Если соответствующее законодательство Российской Федерации
      и (или) нормативный правовой акт по бухгалтерскому учету не устанавливают порядок отражения последствий
      изменения учетной политики, то эти последствия отражаются в бухгалтерском учете и отчетности в порядке,
      установленном пунктом 15 настоящего Положения.
  - path: '15'
    parent_path: null
    heading: Изменение учетной политики
    text: Последствия изменения учетной политики, вызванного причинами, отличными от указанных в пункте
      14 настоящего Положения, и оказавшие или способные оказать существенное влияние на финансовое положение
      организации, финансовые результаты ее деятельности и (или) движение денежных средств, отражаются
      в бухгалтерской отчетности ретроспективно, за исключением случаев, когда оценка в денежном выражении
      таких последствий в отношении периодов, предшествовавших отчетному, не может быть произведена с
      достаточной надежностью. При ретроспективном отражении последствий изменения учетной политики исходят
      из предположения, что измененный способ ведения бухгалтерского учета применялся с момента возникновения
      фактов хозяйственной деятельности данного вида. Ретроспективное отражение последствий изменения
      учетной политики заключается в корректировке входящего остатка по статье «Нераспределенная прибыль
      (непокрытый убыток)» и (или) других статей бухгалтерского баланса на самую раннюю представленную
      в бухгалтерской (финансовой) отчетности дату, а также значений связанных статей бухгалтерской отчетности,
      раскрываемых за каждый представленный в бухгалтерской отчетности период, как если бы новая учетная
      политика применялась с момента возникновения фактов хозяйственной деятельности данного вида. (в
      ред. приказа Минфина России от 28.04.2017 № 69н) В случаях, когда оценка в денежном выражении последствий
      изменения учетной политики в отношении периодов, предшествовавших отчетному, не может быть произведена
      с достаточной надежностью, измененный способ ведения бухгалтерского учета применяется в отношении
      соответствующих фактов хозяйственной деятельности, свершившихся после введения измененного способа
      (перспективно).
  - path: '15.1'
    parent_path: null
    heading: Изменение учетной политики
    text: Организации, которые вправе применять упрощенные способы ведения бухгалтерского учета, включая
      упрощенную бухгалтерскую (финансовую) отчетность, могут отражать в бухгалтерской отчетности последствия
      изменения учетной политики, оказавшие или способные оказать существенное влияние на финансовое положение
      организации, финансовые результаты ее деятельности и (или) движение денежных средств, перспективно,
      за исключением случаев, когда иной порядок установлен законодательством Российской Федерации и (или)
      нормативным правовым актом по бухгалтерскому учету. (введен приказом Минфина России от 08.11.2010
      № 144н, в ред. приказов Минфина России от 27.04.2012 № 55н, от 06.04.2015 № 57н)
  - path: '16'
    parent_path: null
    heading: Изменение учетной политики
    text: Изменения учетной политики, оказавшие или способные оказать существенное влияние на финансовое
      положение организации, финансовые результаты ее деятельности и (или) движение денежных средств,
      подлежат обособленному раскрытию в бухгалтерской отчетности.
  - path: '17'
    parent_path: null
    heading: Раскрытие учетной политики
    text: Организация должна раскрывать принятые при формировании учетной политики способы ведения бухгалтерского
      учета, без знания о применении которых заинтересованными пользователями бухгалтерской (финансовой)
      отчетности невозможна достоверная оценка финансового положения организации, финансовых результатов
      ее деятельности и (или) движения денежных средств. (в ред. приказа Минфина России от 28.04.2017
      № 69н)
  - path: '18'
    parent_path: null
    heading: Раскрытие учетной политики
    text: Абзац исключен (приказ Минфина России от 11.03.2009 № 22н) Состав и содержание подлежащей обязательному
      раскрытию в бухгалтерской отчетности информации об учетной политике организации по конкретным вопросам
      бухгалтерского учета устанавливаются соответствующими федеральными стандартами бухгалтерского учета.
      (в ред. приказа Минфина России от 28.04.2017 № 69н) В случае публикации бухгалтерской отчетности
      не в полном объеме информация об учетной политике подлежит раскрытию, как минимум, в части, непосредственно
      относящейся к опубликованным данным.
  - path: '19'
    parent_path: null
    heading: Раскрытие учетной политики
    text: Если учетная политика организации сформирована исходя из допущений, предусмотренных пунктом
      5 настоящего Положения, то эти допущения могут не раскрываться в бухгалтерской отчетности. При формировании
      учетной политики организации, исходя из допущений, отличных от предусмотренных пунктом 5 настоящего
      Положения, такие допущения вместе с причинами их применения должны быть раскрыты в бухгалтерской
      отчетности.
  - path: '20'
    parent_path: null
    heading: Раскрытие учетной политики
    text: Если при подготовке бухгалтерской отчетности имеется значительная неопределенность в отношении
      событий и условий, которые могут породить существенные сомнения в применимости допущения непрерывности
      деятельности, то организация должна указать на такую неопределенность и однозначно описать, с чем
      она связана.
  - path: '20.1'
    parent_path: null
    heading: Раскрытие учетной политики
    text: Организация, формирующая учетную политику в соответствии с абзацем вторым пункта 7 настоящего
      Положения, должна в отношении каждого не примененного ею способа ведения бухгалтерского учета, установленного
      федеральным стандартом бухгалтерского учета, описать такой способ, а также раскрыть соответствующее
      требование Международного стандарта финансовой отчетности и описать, каким образом это требование
      будет нарушено в случае применения способа ведения бухгалтерского учета, установленного федеральным
      стандартом бухгалтерского учета. (введен приказом Минфина России от 28.04.2017 № 69н)
  - path: '20.2'
    parent_path: null
    heading: Раскрытие учетной политики
    text: 'Организация, применившая при формировании учетной политики пункт 7.3 настоящего Положения,
      должна раскрыть: наименование федерального стандарта бухгалтерского учета, устанавливающего способ
      ведения бухгалтерского учета, от применения которого организация отступила, с кратким описанием
      этого способа; обстоятельства, в результате которых применение правил, установленных пунктами 7
      и 7.1 настоящего Положения, приводит к тому, что бухгалтерская (финансовая) отчетность организации
      не позволяет получить достоверное представление о ее финансовом положении, финансовых результатах
      деятельности и движении денежных средств, и причины наступления этих обстоятельств; содержание альтернативного
      способа ведения бухгалтерского учета, примененного организацией, и объяснение, каким образом этот
      способ устраняет недостоверность представления финансового положения организации, финансовых результатов
      ее деятельности и движения денежных средств; значения всех показателей бухгалтерской (финансовой)
      отчетности организации, которые были изменены в результате отступления от правил, установленных
      пунктами 7 и 7.1 настоящего Положения, как если бы отступление не было сделано, и величину корректировки
      каждого показателя. (введен приказом Минфина России от 28.04.2017 № 69н)'
  - path: '21'
    parent_path: null
    heading: Раскрытие учетной политики
    text: 'В случае изменения учетной политики организация должна раскрывать следующую информацию: - причину
      изменения учетной политики; - содержание изменения учетной политики; - порядок отражения последствий
      изменения учетной политики в бухгалтерской отчетности; - суммы корректировок, связанных с изменением
      учетной политики, по каждой статье бухгалтерской отчетности за каждый из представленных отчетных
      периодов, а если организация обязана раскрывать информацию о прибыли, приходящейся на одну акцию,
      - также по данным о базовой и разводненной прибыли (убытку) на акцию; - сумму соответствующей корректировки,
      относящейся к отчетным периодам, предшествующим представленным в бухгалтерской отчетности, - до
      той степени, до которой это практически возможно. Если изменение учетной политики обусловлено применением
      нормативного правового акта впервые или изменением нормативного правового акта, раскрытию также
      подлежит факт отражения последствий изменения учетной политики в соответствии с порядком, предусмотренным
      этим актом.'
  - path: '22'
    parent_path: null
    heading: Раскрытие учетной политики
    text: В случае, если раскрытие информации, предусмотренной пунктом 21 настоящего Положения, по какому-то
      отдельному предшествующему отчетному периоду, представленному в бухгалтерской отчетности, или по
      отчетным периодам, более ранним в сравнении с представленными, является невозможным, факт невозможности
      такого раскрытия подлежит раскрытию вместе с указанием отчетного периода, в котором начнется применение
      соответствующего изменения учетной политики.
  - path: '23'
    parent_path: null
    heading: Раскрытие учетной политики
    text: В случае если нормативный правовой акт по бухгалтерскому учету предусматривает возможность добровольного
      применения утвержденных им правил до наступления срока их обязательного применения, организация
      при использовании такой возможности должна раскрыть в бухгалтерской (финансовой) отчетности данный
      факт. (в ред. приказа Минфина России от 28.04.2017 № 69н)
  - path: '24'
    parent_path: null
    heading: Раскрытие учетной политики
    text: Существенные способы ведения бухгалтерского учета, а также информация об изменении учетной политики
      подлежат раскрытию в бухгалтерской (финансовой) отчетности организации. В случае представления промежуточной
      бухгалтерской (финансовой) отчетности, она может не содержать информацию об учетной политике организации,
      если в последней не произошли изменения со времени составления годовой бухгалтерской (финансовой)
      отчетности за предшествующий год, в которой раскрыта учетная политика. (п. 24 в ред. приказа Минфина
      России от 28.04.2017 № 69н)
  - path: '25'
    parent_path: null
    heading: Раскрытие учетной политики
    text: Исключен (приказ Минфина России от 28.04.2017 № 69н)
