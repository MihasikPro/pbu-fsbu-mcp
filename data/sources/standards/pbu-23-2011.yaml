id: pbu-23-2011
kind: ПБУ
number: 23/2011
year: 2011
title: Отчет о движении денежных средств
order_date: 2011-02-02
order_no: 11н
effective_from: &id001 2011-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает правила составления отчета о движении денежных средств коммерческими
      организациями (за исключением кредитных организаций), являющихся юридическими лицами по законодательству
      Российской Федерации (далее – организации).
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение применяется для составления отчета о движении денежных средств в случаях,
      когда составление, и (или) представление, и (или) публикация данного отчета предусмотрены законодательством
      Российской Федерации или нормативными правовыми актами, а также когда организация добровольно приняла
      решение о представлении и (или) публикации такого отчета. Настоящее Положение не применяется при
      составлении отчетности организации для внутренних целей, отчетности, составляемой для государственного
      статистического наблюдения, отчетной информации, представляемой кредитной организации в соответствии
      с ее требованиями, и отчетной информации для иных специальных целей, если в правилах составления
      такой отчетности и информации не предусматривается применение настоящего Положения.
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: Отчет о движении денежных средств входит в состав бухгалтерской отчетности организации.
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: Отчет о движении денежных средств составляется на основании общих требований к бухгалтерской
      отчетности организации, установленных нормативными правовыми актами по бухгалтерскому учету, и требований,
      установленных настоящим Положением.
  - path: '5'
    parent_path: null
    heading: Общие положения
    text: Отчет о движении денежных средств представляет собой обобщение данных о денежных средствах,
      а также высоколиквидных финансовых вложениях, которые могут быть легко обращены в заранее известную
      сумму денежных средств и которые подвержены незначительному риску изменения стоимости (далее – денежные
      эквиваленты). К денежным эквивалентам могут быть отнесены, например, открытые в кредитных организациях
      депозиты до востребования.
  - path: '6'
    parent_path: null
    heading: Общие положения
    text: 'В отчете о движении денежных средств отражаются платежи организации и поступления в организацию
      денежных средств и денежных эквивалентов (далее – денежные потоки организации), а также остатки
      денежных средств и денежных эквивалентов на начало и конец отчетного периода. Денежными потоками
      организации не являются:'
  - path: 6.а
    parent_path: '6'
    heading: null
    text: платежи денежных средств, связанные с инвестированием их в денежные эквиваленты;
  - path: 6.б
    parent_path: '6'
    heading: null
    text: поступления денежных средств от погашения денежных эквивалентов (за исключением начисленных
      процентов);
  - path: 6.в
    parent_path: '6'
    heading: null
    text: валютно-обменные операции (за исключением потерь или выгод от операции);
  - path: 6.г
    parent_path: '6'
    heading: null
    text: обмен одних денежных эквивалентов на другие денежные эквиваленты (за исключением потерь или
      выгод от операции);
  - path: 6.д
    parent_path: '6'
    heading: null
    text: иные аналогичные платежи организации и поступления в организацию, изменяющие состав денежных
      средств или денежных эквивалентов, но не изменяющие их общую сумму, в том числе, получение наличных
      со счета в банке, перечисление денежных средств с одного счета организации на другой счет этой же
      организации.
  - path: '7'
    parent_path: null
    heading: Классификация денежных потоков
    text: Денежные потоки организации подразделяются на денежные потоки от текущих, инвестиционных и финансовых
      операций.
  - path: '8'
    parent_path: null
    heading: Классификация денежных потоков
    text: Денежные потоки организации классифицируются в зависимости от характера операций, с которыми
      они связаны, а также от того, каким образом информация о них используется для принятия решений пользователями
      бухгалтерской отчетности организации.
  - path: '9'
    parent_path: null
    heading: Классификация денежных потоков
    text: 'Денежные потоки организации от операций, связанных с осуществлением обычной деятельности организации,
      приносящей выручку, классифицируются как денежные потоки от текущих операций. Денежные потоки от
      текущих операций, как правило, связаны с формированием прибыли (убытка) организации от продаж. Информация
      о денежных потоках от текущих операций показывает пользователям бухгалтерской отчетности организации
      уровень обеспеченности организации денежными средствами, достаточными для погашения кредитов, поддержания
      деятельности организации на уровне существующих объемов производства, выплаты дивидендов и новых
      инвестиций без привлечения внешних источников финансирования. Информация о составе денежных потоков
      от текущих операций в предыдущих периодах в сочетании с другой информацией, представляемой в бухгалтерской
      отчетности организации, обеспечивает основу для прогнозирования будущих денежных потоков от текущих
      операций. Примерами денежных потоков от текущих операций являются:'
  - path: 9.а
    parent_path: '9'
    heading: null
    text: поступления от продажи покупателям (заказчикам) продукции и товаров, выполнения работ, оказания
      услуг;
  - path: 9.б
    parent_path: '9'
    heading: null
    text: поступления арендных платежей, роялти, комиссионных и иных аналогичных платежей;
  - path: 9.в
    parent_path: '9'
    heading: null
    text: платежи поставщикам (подрядчикам) за сырье, материалы, работы, услуги;
  - path: 9.г
    parent_path: '9'
    heading: null
    text: оплата труда работников организации, а также платежи в их пользу третьим лицам;
  - path: 9.д
    parent_path: '9'
    heading: null
    text: платежи налога на прибыль организаций (за исключением случаев, когда налог на прибыль организаций
      непосредственно связан с денежными потоками от инвестиционных или финансовых операций);
  - path: 9.е
    parent_path: '9'
    heading: null
    text: уплата процентов по долговым обязательствам, за исключением процентов, включаемых в стоимость
      инвестиционных активов в соответствии с Положением по бухгалтерскому учету «Учет расходов по займам
      и кредитам» (ПБУ 15/2008), утвержденным приказом Министерства финансов Российской Федерации от 6
      октября 2008 г. № 107н (зарегистрирован в Министерстве юстиции Российской Федерации 27 октября 2008
      г., регистрационный номер 12523) с изменениями, внесенными приказами Министерства финансов Российской
      Федерации от 25 октября 2010 г. № 132н (зарегистрирован в Министерстве юстиции Российской Федерации
      25 ноября 2010 г., регистрационный номер 19048), от 8 ноября 2010 г. № 144н (зарегистрирован в Министерстве
      юстиции Российской Федерации 1 декабря 2010 г., регистрационный номер 19088) (далее – ПБУ 15/2008);
  - path: 9.ж
    parent_path: '9'
    heading: null
    text: поступление процентов по дебиторской задолженности покупателей (заказчиков);
  - path: 9.з
    parent_path: '9'
    heading: null
    text: денежные потоки по финансовым вложениям, приобретаемым с целью их перепродажи в краткосрочной
      перспективе (как правило, в течение трех месяцев).
  - path: '10'
    parent_path: null
    heading: Классификация денежных потоков
    text: 'Денежные потоки организации от операций, связанных с приобретением, созданием или выбытием
      внеоборотных активов организации, классифицируются как денежные потоки от инвестиционных операций.
      Информация о денежных потоках от инвестиционных операций показывает пользователям бухгалтерской
      отчетности организации уровень затрат организации, осуществленных для приобретения или создания
      внеоборотных активов, обеспечивающих денежные поступления в будущем. Примерами денежных потоков
      от инвестиционных операций являются: а) платежи поставщикам (подрядчикам) и работникам организации
      в связи с приобретением, созданием, модернизацией, реконструкцией и подготовкой к использованию
      внеоборотных активов, в том числе затраты на научно-исследовательские, опытно-конструкторские и
      технологические работы;'
  - path: 10.б
    parent_path: '10'
    heading: null
    text: уплата процентов по долговым обязательствам, включаемым в стоимость инвестиционных активов в
      соответствии с ПБУ 15/2008;
  - path: 10.в
    parent_path: '10'
    heading: null
    text: поступления от продажи внеоборотных активов;
  - path: 10.г
    parent_path: '10'
    heading: null
    text: платежи в связи с приобретением акций (долей участия) в других организациях, за исключением
      финансовых вложений, приобретаемых с целью перепродажи в краткосрочной перспективе;
  - path: 10.д
    parent_path: '10'
    heading: null
    text: поступления от продажи акций (долей участия) в других организациях, за исключением финансовых
      вложений, приобретенных с целью перепродажи в краткосрочной перспективе;
  - path: 10.е
    parent_path: '10'
    heading: null
    text: предоставление займов другим лицам;
  - path: 10.ж
    parent_path: '10'
    heading: null
    text: возврат займов, предоставленных другим лицам;
  - path: 10.з
    parent_path: '10'
    heading: null
    text: платежи в связи с приобретением долговых ценных бумаг (прав требования денежных средств к другим
      лицам), за исключением финансовых вложений, приобретаемых с целью перепродажи в краткосрочной перспективе;
  - path: 10.и
    parent_path: '10'
    heading: null
    text: поступления от продажи долговых ценных бумаг (прав требования денежных средств к другим лицам),
      за исключением финансовых вложений, приобретенных с целью перепродажи в краткосрочной перспективе;
  - path: 10.к
    parent_path: '10'
    heading: null
    text: дивиденды и аналогичные поступления от долевого участия в других организациях;
  - path: 10.л
    parent_path: '10'
    heading: null
    text: поступления процентов по долговым финансовым вложениям, за исключением приобретенных с целью
      перепродажи в краткосрочной перспективе.
  - path: '11'
    parent_path: null
    heading: Классификация денежных потоков
    text: 'Денежные потоки организации от операций, связанных с привлечением организацией финансирования
      на долговой или долевой основе, приводящих к изменению величины и структуры капитала и заемных средств
      организации, классифицируются как денежные потоки от финансовых операций. Информация о денежных
      потоках от финансовых операций обеспечивает основу для прогнозирования требований кредиторов и акционеров
      (участников) в отношении будущих денежных потоков организации, а также будущих потребностей организации
      в привлечении долгового и долевого финансирования. Примерами денежных потоков от финансовых операций
      организации являются:'
  - path: 11.а
    parent_path: '11'
    heading: null
    text: денежные вклады собственников (участников), поступления от выпуска акций, увеличения долей участия;
  - path: 11.б
    parent_path: '11'
    heading: null
    text: платежи собственникам (участникам) в связи с выкупом у них акций (долей участия) организации
      или их выходом из состава участников;
  - path: 11.в
    parent_path: '11'
    heading: null
    text: уплата дивидендов и иных платежей по распределению прибыли в пользу собственников (участников);
  - path: 11.г
    parent_path: '11'
    heading: null
    text: поступления от выпуска облигаций, векселей, и других долговых ценных бумаг;
  - path: 11.д
    parent_path: '11'
    heading: null
    text: платежи в связи с погашением (выкупом) векселей и других долговых ценных бумаг;
  - path: 11.е
    parent_path: '11'
    heading: null
    text: получение кредитов и займов от других лиц;
  - path: 11.ж
    parent_path: '11'
    heading: null
    text: возврат кредитов и займов, полученных от других лиц.
  - path: '12'
    parent_path: null
    heading: Классификация денежных потоков
    text: Денежные потоки организации, которые не могут быть однозначно классифицированы в соответствии
      с пунктами 8–11 настоящего Положения, классифицируются как денежные потоки от текущих операций.
  - path: '13'
    parent_path: null
    heading: Классификация денежных потоков
    text: Платежи и поступления от одной операции могут относиться к разным видам денежных потоков. Например,
      уплата процентов является денежным потоком от текущих операций, а возврат основной суммы долга является
      денежным потоком от финансовых операций. При погашении кредита в денежной форме обе указанные части
      могут выплачиваться одной суммой. В этом случае организация делит единую сумму на соответствующие
      части с последующей раздельной классификацией денежных потоков и раздельным отражением их в отчете
      о движении денежных средств.
  - path: '14'
    parent_path: null
    heading: Отражение денежных потоков
    text: Денежные потоки организации отражаются в отчете о движении денежных средств с подразделением
      на денежные потоки от текущих, инвестиционных и финансовых операций.
  - path: '15'
    parent_path: null
    heading: Отражение денежных потоков
    text: Каждый существенный вид поступлений в организацию денежных средств и (или) денежных эквивалентов
      отражается в отчете о движении денежных средств отдельно от платежей организации, если иное не установлено
      настоящим Положением.
  - path: '16'
    parent_path: null
    heading: Отражение денежных потоков
    text: 'Денежные потоки отражаются в отчете о движении денежных средств свернуто в случаях, когда они
      характеризуют не столько деятельность организации, сколько деятельность ее контрагентов, и (или)
      когда поступления от одних лиц обусловливают соответствующие выплаты другим лицам. Примерами таких
      денежных потоков являются:'
  - path: 16.а
    parent_path: '16'
    heading: null
    text: денежные потоки комиссионера или агента в связи с осуществлением ими комиссионных или агентских
      услуг (за исключением платы за сами услуги);
  - path: 16.б
    parent_path: '16'
    heading: null
    text: косвенные налоги в составе поступлений от покупателей и заказчиков, платежей поставщикам и подрядчикам
      и платежей в бюджетную систему Российской Федерации или возмещение из нее.
  - path: 16.в
    parent_path: '16'
    heading: null
    text: поступления от контрагента в счет возмещения коммунальных платежей и осуществление этих платежей
      в арендных и иных аналогичных отношениях;
  - path: 16.г
    parent_path: '16'
    heading: null
    text: оплата транспортировки грузов с получением эквивалентной компенсации от контрагента.
  - path: '17'
    parent_path: null
    heading: Отражение денежных потоков
    text: 'Денежные потоки отражаются в отчете о движении денежных средств свернуто в случаях, когда они
      отличаются быстрым оборотом, большими суммами и короткими сроками возврата. Примерами таких денежных
      потоков являются:'
  - path: 17.а
    parent_path: '17'
    heading: null
    text: взаимно обусловленные платежи и поступления по расчетам с использованием банковских карт;
  - path: 17.б
    parent_path: '17'
    heading: null
    text: покупка и перепродажа финансовых вложений;
  - path: 17.в
    parent_path: '17'
    heading: null
    text: осуществление краткосрочных (как правило, до трех месяцев) финансовых вложений за счет заемных
      средств.
  - path: '18'
    parent_path: null
    heading: Отражение денежных потоков
    text: Показатели отчета о движении денежных средств организации отражаются в валюте Российской Федерации
      – рублях. Величина денежных потоков в иностранной валюте пересчитывается в рубли по официальному
      курсу этой иностранной валюты к рублю, устанавливаемому Центральным банком Российской Федерации
      на дату осуществления или поступления платежа. При несущественном изменении официального курса иностранной
      валюты к рублю, устанавливаемого Центральным банком Российской Федерации, пересчет в рубли, связанный
      с совершением большого числа однородных операций в такой иностранной валюте, может производиться
      по среднему курсу, исчисленному за месяц или более короткий период. В случае если незамедлительно
      после поступления в иностранной валюте организация в рамках своей обычной деятельности меняет полученную
      сумму иностранной валюты на рубли, то денежный поток отражается в отчете о движении денежных средств
      в сумме фактически полученных рублей без промежуточного пересчета иностранной валюты в рубли. В
      случае если незадолго до платежа в иностранной валюте организация в рамках своей обычной деятельности
      меняет рубли на необходимую сумму иностранной валюты, то денежный поток отражается в отчете о движении
      денежных средств в сумме фактически уплаченных рублей без промежуточного пересчета иностранной валюты
      в рубли.
  - path: '19'
    parent_path: null
    heading: Отражение денежных потоков
    text: Остатки денежных средств и денежных эквивалентов в иностранной валюте на начало и конец отчетного
      периода отражаются в отчете о движении денежных средств в рублях в сумме, которая определяется в
      соответствии с Положением по бухгалтерскому учету «Учет активов и обязательств, стоимость которых
      выражена в иностранной валюте» (ПБУ 3/2006), утвержденным приказом Министерства финансов Российской
      Федерации от 27 ноября 2006 г. № 154н (зарегистрирован в Министерстве юстиции Российской федерации
      17 января 2007 г., регистрационный номер 8788) с изменениями, внесенными приказами Министерства
      финансов Российской Федерации от 25 декабря 2007 г. № 147н (зарегистрирован в Министерстве юстиции
      Российской Федерации 28 января 2008 г., регистрационный номер 11007), от 25 октября 2010 г. № 132н
      (зарегистрирован в Министерстве юстиции Российской Федерации 25 ноября 2010 г., регистрационный
      номер 19048). Разница, возникающая в связи с пересчетом денежных потоков организации и остатков
      денежных средств и денежных эквивалентов в иностранной валюте по курсам на разные даты, отражается
      в отчете о движении денежных средств отдельно от текущих, инвестиционных и финансовых денежных потоков
      организации как влияние изменений курса иностранной валюты по отношению к рублю.
  - path: '20'
    parent_path: null
    heading: Отражение денежных потоков
    text: Существенные денежные потоки организации между ней и хозяйственными обществами или товариществами,
      являющимися по отношению к организации дочерними, зависимыми или основными, отражаются отдельно
      от аналогичных денежных потоков между организацией и другими лицами.
  - path: '21'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: В случае если к какому-либо показателю отчета о движении денежных средств организация представляет
      в своей бухгалтерской отчетности дополнительные пояснения, то соответствующая статья отчета о движении
      денежных средств должна содержать ссылку на эти пояснения.
  - path: '22'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: Организация раскрывает состав денежных средств и денежных эквивалентов и представляет увязку
      сумм, представленных в отчете о движении денежных средств, с соответствующими статьями бухгалтерского
      баланса.
  - path: '23'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: Организация раскрывает в составе информации о принятой ею учетной политике используемые подходы
      для отделения денежных эквивалентов от других финансовых вложений, для классификации денежных потоков,
      не указанных в пунктах 9–11 настоящего Положения, для пересчета в рубли величины денежных потоков
      в иностранной валюте, для свернутого представления денежных потоков, а также другие пояснения, необходимые
      для понимания информации, представленной в отчете о движении денежных средств.
  - path: '24'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'Организация раскрывает имеющиеся по состоянию на отчетную дату возможности привлечь дополнительные
      денежные средства, в том числе:'
  - path: 24.а
    parent_path: '24'
    heading: null
    text: суммы открытых организации, но не использованных ею кредитных линий с указанием всех установленных
      ограничений по использованию таких кредитных ресурсов (в том числе о суммах обязательных минимальных
      (неснижаемых) остатков);
  - path: 24.б
    parent_path: '24'
    heading: null
    text: величину денежных средств, которые могут быть получены организацией на условиях овердрафта;
  - path: 24.в
    parent_path: '24'
    heading: null
    text: полученные организацией поручительства третьих лиц, не использованные по состоянию на отчетную
      дату для получения кредита, с указанием суммы денежных средств, которые может привлечь организация;
  - path: 24.г
    parent_path: '24'
    heading: null
    text: суммы займов (кредитов), недополученных по состоянию на отчетную дату по заключенным договорам
      займа (кредитным договорам) с указанием причин такого недополучения.
  - path: '25'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'Организация раскрывает с учетом существенности следующую информацию:'
  - path: 25.а
    parent_path: '25'
    heading: null
    text: имеющиеся существенные суммы денежных средств (или их эквивалентов), которые по состоянию на
      отчетную дату недоступны для использования организацией (например, открытые в пользу других организаций
      аккредитивы по незавершенным на отчетную дату сделкам) с указанием причин данных ограничений;
  - path: 25.б
    parent_path: '25'
    heading: null
    text: сумму денежных потоков, связанных с поддержанием деятельности организации на уровне существующих
      объемов производства, отдельно от денежных потоков, связанных с расширением масштабов этой деятельности;
  - path: 25.в
    parent_path: '25'
    heading: null
    text: денежные потоки от текущих, инвестиционных и финансовых операций по каждому отчетному сегменту,
      определенному в соответствии с Положением по бухгалтерскому учету «Информация по сегментам» (ПБУ
      12/2010), утвержденным приказом Министерства финансов Российской Федерации от 8 ноября 2010 г. №
      143н (зарегистрирован в Министерстве юстиции Российской Федерации 14 декабря 2010 г., регистрационный
      номер 19171);
  - path: 25.г
    parent_path: '25'
    heading: null
    text: средства в аккредитивах, открытых в пользу организации, вместе с информацией о факте исполнения
      организацией по состоянию на отчетную дату обязательств по договору с использованием аккредитива.
      В случае если обязательства по договору с использованием аккредитива организацией исполнены, но
      средства аккредитива не зачислены на ее расчетный или иной счет, то раскрываются причины и суммы
      незачисленных средств.