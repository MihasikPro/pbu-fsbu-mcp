id: pbu-24-2011
kind: ПБУ
number: 24/2011
year: 2011
title: Учет затрат на освоение природных ресурсов
order_date: 2011-10-06
order_no: 125н
effective_from: &id001 2012-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает порядок формирования в бухгалтерском учете и раскрытия в бухгалтерской
      отчетности организаций, являющихся юридическими лицами по законодательству Российской Федерации
      (за исключением кредитных организаций и государственных (муниципальных) учреждений),– пользователей
      недр (далее - организации) информации о затратах на освоение природных ресурсов.
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение применяется организациями, осуществляющими затраты на поиск, оценку месторождений
      полезных ископаемых и разведку полезных ископаемых (далее – поисковые затраты) на определенном участке
      недр. Настоящее Положение применяется организациями в отношении поисковых затрат, осуществляемых
      до того момента, когда в отношении участка недр, на котором осуществляется поиск, оценка месторождений
      полезных ископаемых и разведка полезных ископаемых, установлена и документально подтверждена вероятность
      (более вероятно, чем нет) того, что экономические выгоды от добычи полезных ископаемых превысят
      понесенные затраты при условии технической осуществимости добычи полезных ископаемых и при наличии
      у организации ресурсов, необходимых для добычи полезных ископаемых (далее - коммерческая целесообразность
      добычи).
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: 'Настоящее Положение не применяется организациями в отношении затрат:'
  - path: 3.а
    parent_path: '3'
    heading: null
    text: на региональные геолого-геофизические работы, геологические съемки, инженерно-геологические
      изыскания, научно-исследовательские, палеонтологические и другие работы, направленные на общее изучение
      недр, геологические работы по прогнозированию землетрясений и исследованию вулканической деятельности,
      созданию и ведению мониторинга природной среды, контролю за режимом подземных вод, иные работы,
      проводимые без существенного нарушения целостности недр, осуществляемые до момента получения лицензии,
      дающей право на выполнение работ по поиску и оценке месторождений полезных ископаемых на данном
      участке недр (за исключением затрат, указанных в пункте 15 настоящего Положения);
  - path: 3.б
    parent_path: '3'
    heading: null
    text: на добычу полезных ископаемых в отношении участка недр, которые понесены после того, как установлена
      коммерческая целесообразность добычи;
  - path: 3.в
    parent_path: '3'
    heading: null
    text: на геологоразведочные работы, выполняемые на участке недр, в отношении которого установлена
      коммерческая целесообразность добычи.
  - path: '4'
    parent_path: null
    heading: Признание поисковых затрат
    text: Организация устанавливает виды поисковых затрат, признаваемые внеоборотными активами. Остальные
      поисковые затраты признаются расходами по обычным видам деятельности.
  - path: '5'
    parent_path: null
    heading: Признание поисковых затрат
    text: Поисковые затраты, признаваемые внеоборотными активами (далее – поисковые активы), как правило,
      относятся к отдельному участку недр, в отношении которого организация имеет лицензию, дающую право
      на выполнение работ по поиску, оценке месторождений полезных ископаемых и (или) разведке полезных
      ископаемых.
  - path: '6'
    parent_path: null
    heading: Признание поисковых затрат
    text: Поисковые затраты, относящиеся в основном к приобретению (созданию) объекта, имеющего материально-вещественную
      форму, признаются материальными поисковыми активами. Иные поисковые активы признаются нематериальными
      поисковыми активами.
  - path: '7'
    parent_path: null
    heading: Признание поисковых затрат
    text: 'К материальным поисковым активам, как правило, относятся используемые в процессе поиска, оценки
      месторождений полезных ископаемых и разведки полезных ископаемых:'
  - path: 7.а
    parent_path: '7'
    heading: null
    text: сооружения (система трубопроводов и т.д.);
  - path: 7.б
    parent_path: '7'
    heading: null
    text: оборудование (специализированные буровые установки, насосные агрегаты, резервуары и т.д.);
  - path: 7.в
    parent_path: '7'
    heading: null
    text: транспортные средства.
  - path: '8'
    parent_path: null
    heading: Признание поисковых затрат
    text: 'К нематериальным поисковым активам, как правило, относятся:'
  - path: 8.а
    parent_path: '8'
    heading: null
    text: право на выполнение работ по поиску, оценке месторождений полезных ископаемых и (или) разведке
      полезных ископаемых, подтвержденное наличием соответствующей лицензии;
  - path: 8.б
    parent_path: '8'
    heading: null
    text: информация, полученная в результате топографических, геологических и геофизических исследований;
  - path: 8.в
    parent_path: '8'
    heading: null
    text: результаты разведочного бурения; г) результаты отбора образцов;
  - path: 8.д
    parent_path: '8'
    heading: null
    text: иная геологическая информация о недрах;
  - path: 8.е
    parent_path: '8'
    heading: null
    text: оценка коммерческой целесообразности добычи.
  - path: '9'
    parent_path: null
    heading: Признание поисковых затрат
    text: Материальные и нематериальные поисковые активы учитываются на отдельных субсчетах к счету учета
      вложений во внеоборотные активы.
  - path: '10'
    parent_path: null
    heading: Признание поисковых затрат
    text: Единица бухгалтерского учета материальных и нематериальных поисковых активов определяется организацией
      применительно к правилам бухгалтерского учета основных средств и нематериальных активов соответственно.
  - path: '11'
    parent_path: null
    heading: Признание поисковых затрат
    text: Выбранная организацией учетная политика признания и классификации поисковых активов должна применяться
      последовательно в отношении сходных (аналогичных) затрат и видов деятельности.
  - path: '12'
    parent_path: null
    heading: Оценка поисковых активов при признании
    text: При признании в бухгалтерском учете поисковые активы оцениваются по сумме фактических затрат.
  - path: '13'
    parent_path: null
    heading: Оценка поисковых активов при признании
    text: 'В фактические затраты на приобретение (создание) поисковых активов включаются: суммы, уплачиваемые
      в соответствии с договором поставщику (продавцу); суммы, уплачиваемые организациям за выполнение
      работ по договору строительного подряда и иным договорам; вознаграждения, уплачиваемые посреднической
      организации и иным лицам, через которые приобретен поисковый актив; суммы, уплачиваемые за информационные
      и консультационные услуги; таможенные пошлины и таможенные сборы; невозмещаемые суммы налогов, государственные
      и патентные пошлины; амортизация иных внеоборотных активов (включая поисковые активы), использованных
      непосредственно при создании поискового актива; вознаграждения работникам, непосредственно занятым
      при создании поискового актива; обязательства организации в отношении охраны окружающей среды, рекультивации
      земель, ликвидации зданий, сооружений, оборудования, возникающие в связи с выполнением работ по
      поиску, оценке месторождений полезных ископаемых и разведке полезных ископаемых, связанные с признаваемыми
      поисковыми активами; иные затраты, непосредственно связанные с приобретением (созданием) поискового
      актива, обеспечением условий для его использования в запланированных целях.'
  - path: '14'
    parent_path: null
    heading: Оценка поисковых активов при признании
    text: 'В фактические затраты на приобретение (создание) поисковых активов не включаются: возмещаемые
      суммы налогов; общехозяйственные и иные аналогичные расходы, за исключением случаев, когда они непосредственно
      связаны с выполнением работ по поиску, оценке месторождений полезных ископаемых и разведке полезных
      ископаемых и относятся к отдельному участку недр, на котором организация выполняет такие работы.'
  - path: '15'
    parent_path: null
    heading: Оценка поисковых активов при признании
    text: Затраты, понесенные организацией до момента получения лицензии, дающей право на выполнение работ
      по поиску и оценке месторождений полезных ископаемых, включаются в фактические затраты по получению
      этой лицензии только в случае, если такие затраты непосредственно связаны с ее получением.
  - path: '16'
    parent_path: null
    heading: Последующая оценка поисковых активов
    text: Последующая оценка материальных и нематериальных поисковых активов, включая начисление амортизации,
      осуществляется применительно к правилам последующей оценки соответственно основных средств и нематериальных
      активов с учетом особенностей, установленных пунктами 17-20 настоящего Положения.
  - path: '17'
    parent_path: null
    heading: Последующая оценка поисковых активов
    text: Порядок начисления амортизации по поисковым активам определяется организацией. При использовании
      поискового актива для создания другого поискового актива соответствующие амортизационные отчисления
      включаются в состав затрат на его создание.
  - path: '18'
    parent_path: null
    heading: Последующая оценка поисковых активов
    text: Затраты на получение лицензии, дающей наряду с правом на выполнение работ по поиску, оценке
      месторождений полезных ископаемых и (или) разведке полезных ископаемых право на добычу полезных
      ископаемых, не подлежат амортизации до подтверждения коммерческой целесообразности добычи.
  - path: '19'
    parent_path: null
    heading: Последующая оценка поисковых активов
    text: 'Организация должна проводить на каждую отчетную дату анализ наличия обстоятельств, указывающих
      на возможное обесценение поисковых активов (далее – признаки обесценения). При этом подлежат рассмотрению,
      как минимум, следующие признаки обесценения:'
  - path: 19.а
    parent_path: '19'
    heading: null
    text: окончание в течение 12 месяцев после отчетной даты срока, на который организация получила лицензию,
      дающую право на выполнение работ по поиску, оценке месторождений полезных ископаемых и разведке
      полезных ископаемых на определенном участке, при отсутствии намерений и (или) возможности продления
      соответствующих прав;
  - path: 19.б
    parent_path: '19'
    heading: null
    text: существенные затраты, необходимые для выполнения работ по дальнейшему поиску, оценке месторождений
      полезных ископаемых и разведке полезных ископаемых на определенном участке, не учтены в планах организации;
  - path: 19.в
    parent_path: '19'
    heading: null
    text: принятие решения о прекращении деятельности, связанной с поиском, оценкой месторождений полезных
      ископаемых и разведкой полезных ископаемых на определенном участке, вследствие того, что поиск,
      оценка месторождений полезных ископаемых и разведка полезных ископаемых на данном участке не привели
      к обнаружению промышленно значимых полезных ископаемых;
  - path: 19.г
    parent_path: '19'
    heading: null
    text: наличие признаков того, что при продолжении поиска, оценки месторождений полезных ископаемых
      и разведки полезных ископаемых на определенном участке стоимость поисковых активов с учетом накопленных
      амортизации и обесценения, вероятно, не будет возмещена в полной мере
  - path: 19.заключение
    parent_path: '19'
    heading: null
    text: при добыче полезных ископаемых или переходе права пользования участком недр другим лицам.
  - path: '20'
    parent_path: null
    heading: Последующая оценка поисковых активов
    text: При наличии признаков обесценения организация должна проводить проверку поисковых активов на
      обесценение и учитывать изменение стоимости поисковых активов вследствие обесценения в соответствии
      с Международными стандартами финансовой отчетности (IAS) 36 «Обесценение активов», (IFRS) 6 «Разведка
      и оценка запасов полезных ископаемых»*.
  - path: '21'
    parent_path: null
    heading: Прекращение признания поисковых активов
    text: Организация прекращает признание поисковых активов в отношении определенного участка недр при
      подтверждении коммерческой целесообразности добычи или признании добычи полезных ископаемых бесперспективной
      на нем.
  - path: '22'
    parent_path: null
    heading: Прекращение признания поисковых активов
    text: Организация обеспечивает документальное подтверждение коммерческой целесообразности добычи или
      признания бесперспективности добычи полезных ископаемых на участке недр.
  - path: '23'
    parent_path: null
    heading: Прекращение признания поисковых активов
    text: 'При подтверждении коммерческой целесообразности добычи организация должна осуществить следующие
      последовательные действия:'
  - path: 23.а
    parent_path: '23'
    heading: null
    text: провести проверку признанных поисковых активов на обесценение и в случае его подтверждения признать
      их обесценение;
  - path: 23.б
    parent_path: '23'
    heading: null
    text: перевести поисковые активы в состав основных средств, нематериальных или иных активов по остаточной
      стоимости (фактическим затратам с учетом осуществленных переоценок за вычетом накопленных амортизации
      и обесценения);
  - path: 23.в
    parent_path: '23'
    heading: null
    text: прекратить признание последующих затрат на данном участке недр в качестве поисковых активов.
  - path: '24'
    parent_path: null
    heading: Прекращение признания поисковых активов
    text: Стоимость материального или нематериального поискового актива, который выбывает или не способен
      приносить организации экономические выгоды в будущем, списывается в порядке, установленном для списания
      соответственно основных средств или нематериальных активов.
  - path: '25'
    parent_path: null
    heading: Прекращение признания поисковых активов
    text: В случае если в течение отчетного периода добыча полезных ископаемых на участке недр признана
      организацией бесперспективной, поисковые активы, относящиеся к данному участку недр, списываются,
      за исключением случаев, когда они продолжают использоваться в деятельности организации. Доходы или
      расходы от списания поисковых активов относятся на финансовые результаты организации.
  - path: '26'
    parent_path: null
    heading: Прекращение признания поисковых активов
    text: В случаях, установленных пунктами 23 и 25 настоящего Положения, при условии дальнейшего использования
      в деятельности организации поисковые активы переводятся в состав основных средств, нематериальных
      и иных активов (включая поисковые активы, предназначенные для использования на других участках недр)
      исходя из их соответствия критериям (условиям) признания, установленным * Введены в действие для
      применения на территории Российской Федерации приказом Министерства финансов Российской Федерации
      от 25 ноября 2011 г. № 160н (зарегистрирован Министерством юстиции Российской Федерации 5 декабря
      2011 г., регистрационный № 22501; Российская газета, 2011, 9 декабря) нормативными правовыми актами
      по бухгалтерскому учету для данного вида активов. Материальные поисковые активы, как правило, переводятся
      в состав основных средств, нематериальные поисковые активы - в состав нематериальных активов организации.
      В отдельных случаях стоимость нематериального поискового актива может формировать фактическую стоимость
      основных средств организации. Например, затраты на геологоразведочные работы, относящиеся к конкретным
      скважинам, признанные в составе нематериальных поисковых активов, могут быть включены в фактическую
      стоимость скважин при их признании объектами основных средств организации.
  - path: '27'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: Существенная информация о поисковых активах, а также возникающих в результате выполнения работ
      по поиску, оценке месторождений полезных ископаемых и разведке полезных ископаемых обязательствах,
      доходах, расходах, денежных потоках от текущих и инвестиционных операций отражается по отдельным
      группам статей бухгалтерского баланса, а также отдельным показателям отчета о прибылях и убытках
      и отчета о движении денежных средств соответственно.
  - path: '28'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'Информация о материальных и нематериальных поисковых активах подлежит раскрытию применительно
      к требованиям, установленным для раскрытия информации соответственно об основных средствах и нематериальных
      активах организации. Кроме того, в отношении групп материальных поисковых активов организация должна
      раскрывать в бухгалтерской отчетности информацию о: фактических затратах с учетом осуществленных
      переоценок, суммах накопленной амортизации и накопленного обесценения на начало и конец отчетного
      периода; остаточной стоимости активов, обесценившихся в отчетном году, на начало и конец отчетного
      периода и признанного за отчетный период обесценения. Расходы от списания поисковых активов, относящихся
      к участку недр, на котором добыча полезных ископаемых признана организацией бесперспективной, раскрываются
      в отчете о прибылях и убытках обособленно от поисковых затрат, признаваемых расходами по обычным
      видам деятельности (с учетом существенности).'
  - path: '29'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'В составе информации об учетной политике организации подлежит раскрытию, как минимум, следующая
      информация: перечень видов поисковых затрат, признаваемых внеоборотными активами, либо указание
      на то, что все поисковые затраты признаются расходами по обычным видам деятельности; особенности
      классификации материальных и нематериальных поисковых активов; порядок начисления амортизации по
      поисковым активам; группировка поисковых активов в целях проверки их на обесценение; условия перевода
      поисковых активов в состав основных средств, нематериальных и иных активов организации. Пример раскрытия
      в бухгалтерской отчетности организации информации об учетной политике в отношении затрат на поиск,
      оценку месторождений полезных ископаемых и разведку полезных ископаемых приведен в приложении к
      настоящему Положению.'