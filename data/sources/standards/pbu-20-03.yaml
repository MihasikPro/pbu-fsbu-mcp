id: pbu-20-03
kind: ПБУ
number: 20/03
year: 2003
title: Информация об участии в совместной деятельности
order_date: 2003-11-24
order_no: 105н
effective_from: &id001 2004-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает правила и порядок раскрытия информации об участии в совместной
      деятельности в бухгалтерской отчетности коммерческих организаций (кроме кредитных организаций),
      являющихся юридическими лицами по законодательству Российской Федерации.
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: 'Настоящее Положение не применяется организацией в случаях:'
  - path: 2.а
    parent_path: '2'
    heading: null
    text: заключения учредительного договора или договора о создании финансово- промышленной группы, результатом
      которого является образование юридического лица или финансово-промышленной группы, а также внесение
      вкладов в уставный, складочный капитал, паевой фонд другой организации;
  - path: 2.б
    parent_path: '2'
    heading: null
    text: заключения договора об участии в совместной деятельности, которым не предусмотрено извлечение
      экономических выгод или дохода.
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: Для целей настоящего Положения под информацией об участии в совместной деятельности понимается
      информация, раскрывающая часть деятельности организации (отчетный сегмент), осуществляемой с целью
      извлечения экономических выгод или дохода совместно с другими организациями и (или) индивидуальными
      предпринимателями путем объединения вкладов и (или) совместных действий без образования юридического
      лица.
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: Информация об участии в совместной деятельности подлежит раскрытию в бухгалтерской отчетности
      организации при наличии договоров, условиями которых устанавливается распределение между участниками
      обязанностей по финансовой и иной совместно осуществляемой деятельности с целью получения экономических
      выгод или дохода.
  - path: '5'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение определяет правила отражения хозяйственных операций в бухгалтерском учете
      и бухгалтерской отчетности организации в случаях совместного осуществления операций, совместного
      использования активов и совместного осуществления деятельности.
  - path: '6'
    parent_path: null
    heading: Совместно осуществляемые операции
    text: Для целей настоящего Положения под совместно осуществляемыми операциями понимается выполнение
      каждым участником договора определенного этапа производства продукции (выполнение работы, оказание
      услуги) с использованием собственных активов. При этом каждый участник договора в бухгалтерском
      учете отражает свою часть расходов и обязательств, а также причитающуюся ему долю экономических
      выгод или дохода в соответствии с условиями договора. Пример. Участники договора объединяют ресурсы
      и усилия для выращивания сельскохозяйственной продукции. Одна организация проводит посевную, вторая
      организация обеспечивает технологию выращивания сельскохозяйственной продукции, а третья организация
      собирает урожай. Выращенная сельскохозяйственная продукция подлежит разделу между участниками согласно
      условиям договора.
  - path: '7'
    parent_path: null
    heading: Совместно осуществляемые операции
    text: При совместно осуществляемых операциях обособленно (на отдельном балансе) не учитываются, а
      отражаются в бухгалтерском балансе участника вклад участника договора, хозяйственные операции, связанные
      с выполнением совместно осуществляемых операций, а также финансовые результаты от таких операций.
      Вклад участника договора в бухгалтерском учете продолжает учитываться на соответствующих счетах
      и не переводится в состав финансовых вложений. Каждым участником бухгалтерский учет доходов, расходов,
      обязательств и активов, относящихся к совместно осуществляемой операции, ведется применительно к
      правилам, установленным Положением по бухгалтерскому учету "Информация по сегментам" ПБУ 12/2000,
      утвержденным Приказом Министерства финансов Российской Федерации 27 января 2000 г. N 11н (по заключению
      Министерства юстиции Российской Федерации от 16.03.2000 N 1838-ЭР указанный Приказ не нуждается
      в государственной регистрации). Доходы, расходы, обязательства и активы по совместно осуществляемым
      операциям каждым участником договора учитываются обособленно в доле, относящейся к участнику, в
      аналитическом учете по соответствующим синтетическим счетам учета доходов, расходов, обязательств
      и активов. Каждый участник договора отражение в бухгалтерском учете причитающейся ему доли продукции
      и (или) дохода от продажи продукции (выполнения работ, оказания услуг) осуществляет за отчетный
      период в соответствии с условиями договора. При этом участник, выполняющий заключительный этап совместного
      производственного процесса, доли продукции, причитающейся другим участникам договора, учитывает
      за балансом, а в случае если договором предусмотрена продажа продукции (работ, услуг), то доходы,
      подлежащие получению другими участниками договора, отражает в бухгалтерском учете в качестве обязательства
      перед ними.
  - path: '8'
    parent_path: null
    heading: Совместно осуществляемые операции
    text: 'При формировании показателей бухгалтерской отчетности каждого участника включение данных об
      участии в совместной деятельности в части активов, обязательств, доходов и расходов осуществляется
      путем построчного суммирования соответствующих показателей. При этом в рамках отчетного сегмента
      о совместной деятельности отражаются: активы, используемые для участия в договоре; обязательства,
      возникшие непосредственно у участника, в связи с участием в договоре; расходы, понесенные непосредственно
      участником в связи с участием в договоре; доходы, полученные непосредственно участником в результате
      участия в договоре.'
  - path: '9'
    parent_path: null
    heading: Совместно используемые активы
    text: Для целей настоящего Положения активы считаются совместно используемыми в случае, когда имущество
      находится в общей собственности участников договора с определением доли каждого из собственников
      в праве собственности (долевая собственность) и собственники заключают договор с целью совместного
      использования такого имущества для получения экономических выгод или дохода. При этом каждый из
      участников договора отражает в бухгалтерском учете долю расходов и обязательств, а также причитающуюся
      ему долю доходов от совместного использования активов согласно условиям договора. Пример. Двум или
      более организациям принадлежит здание на праве долевой собственности, которое в соответствии с заключенным
      между ними договором сдается в аренду. Согласно условиям договора каждый участник несет свою долю
      расходов (амортизация, оплата коммунальных услуг, текущий ремонт своей части здания и т.п.) и получает
      свою долю арендной платы.
  - path: '10'
    parent_path: null
    heading: Совместно используемые активы
    text: Доходы, расходы, обязательства, полученные в результате совместного использования активов, каждым
      участником договора учитываются обособленно в аналитическом учете по соответствующим синтетическим
      счетам учета доходов, расходов, обязательств. Активы, принадлежащие участнику договора на праве
      долевой собственности и внесенные им в качестве вклада, продолжают учитываться им на соответствующих
      счетах бухгалтерского учета и в состав финансовых вложений не переводятся. При этом вклад участника
      договора, хозяйственные операции, связанные с выполнением такого договора, а также полученные от
      совместного использования активов финансовые результаты не выделяются на отдельный баланс. Каждым
      участником договора в бухгалтерском учете за отчетный период отражаются его доля доходов, полученных
      от совместного использования активов, а также обязательства и расходы, понесенные им в связи с выполнением
      договора. В бухгалтерском учете участника подлежат отражению обязательства, возникшие непосредственно
      у участника в связи с участием в договоре, а также его доля в совместных обязательствах с другими
      участниками договора. В бухгалтерском учете участника учитываются расходы, произведенные непосредственно
      участником в связи с участием в договоре, и его доля в совместных расходах с другими участниками
      указанного договора. В случае если согласно договору расчеты с покупателями (заказчиками) осуществляются
      одним из участников, то доходы, подлежащие получению другими участниками договора, отражаются в
      его бухгалтерском учете в качестве обязательства перед ними. Ведение бухгалтерского учета хозяйственных
      операций, связанных с выполнением договора, осуществляется каждым участником в общеустановленном
      порядке с учетом правил, установленных Положением по бухгалтерскому учету "Информация по сегментам"
      ПБУ 12/2000.
  - path: '11'
    parent_path: null
    heading: Совместно используемые активы
    text: 'Данные об участии в совместной деятельности в части активов, обязательств, доходов и расходов
      у каждого участника формируют показатели бухгалтерской отчетности путем построчного суммирования
      аналогичных показателей. В рамках отчетного сегмента о совместной деятельности отражаются: доля
      участника в совместно используемых активах; обязательства, возникшие непосредственно у участника
      в связи с участием в договоре; доля участника в обязательствах, возникших у него совместно с другими
      участниками договора; расходы, понесенные непосредственно участником в связи с участием в договоре;
      доля в расходах, понесенных совместно с другими участниками договора; доля в доходах, полученных
      совместно с другими участниками договора.'
  - path: '12'
    parent_path: null
    heading: Совместная деятельность
    text: Согласно статье 1041 Гражданского кодекса Российской Федерации по договору о совместной деятельности
      (договору простого товарищества) двое или несколько лиц (товарищей) обязуются объединить свои вклады
      и совместно действовать без образования юридического лица для извлечения прибыли. В соответствии
      со статьей 1043 Гражданского кодекса Российской Федерации ведение бухгалтерского учета общего имущества
      может быть поручено одному из участвующих в договоре простого товарищества юридических лиц. При
      отражении в бухгалтерском учете и бухгалтерской отчетности операций, связанных с участием в совместной
      деятельности (договоре простого товарищества), организация-товарищ руководствуется пунктами 13 -
      16 настоящего Положения, а товарищ, ведущий общие дела в соответствии с договором простого товарищества,
      руководствуется пунктами 17- 21 настоящего Положения.
  - path: '13'
    parent_path: null
    heading: Совместная деятельность
    text: Активы, внесенные в счет вклада по договору о совместной деятельности, включаются организацией-товарищем
      в состав финансовых вложений по стоимости, по которой они отражены в бухгалтерском балансе на дату
      вступления договора в силу.
  - path: '14'
    parent_path: null
    heading: Совместная деятельность
    text: При формировании финансового результата каждая организация-товарищ включает в состав прочих
      доходов или расходов прибыль или убытки по совместной деятельности, подлежащие получению или распределенные
      между товарищами. (в ред. Приказа Минфина РФ от 18.09.2006 N 116н)
  - path: '15'
    parent_path: null
    heading: Совместная деятельность
    text: Имущество, подлежащее получению каждой организацией-товарищем по результатам раздела в соответствии
      со статьей 1050 Гражданского кодекса Российской Федерации при прекращении совместной деятельности,
      отражается как погашение вкладов, учтенных в составе финансовых вложений. В случае возникновения
      разницы между стоимостной оценкой вклада, учтенного в составе финансовых вложений, и стоимостью
      полученных активов после прекращения совместной деятельности она включается в состав прочих доходов
      или расходов при формировании финансового результата. Активы, полученные организацией-товарищем
      после прекращения совместной деятельности, принимаются к бухгалтерскому учету в оценке, числящейся
      в отдельном балансе на дату принятия решения о прекращении совместной деятельности. (в ред. Приказа
      Минфина РФ от 18.09.2006 N 116н) По принятому к бухгалтерскому учету после прекращения совместной
      деятельности амортизируемому имуществу начисление амортизации производится в течение вновь установленного
      срока полезного использования в соответствии с правилами, определенными Положением по бухгалтерскому
      учету "Учет основных средств" ПБУ 6/01, утвержденным Приказом Министерства финансов Российской Федерации
      от 30 марта 2001 года N 26н (зарегистрирован в Министерстве юстиции Российской Федерации 28 апреля
      2001 г., регистрационный N 2689).
  - path: '16'
    parent_path: null
    heading: Совместная деятельность
    text: 'Бухгалтерская отчетность организацией-товарищем представляется в установленном для юридических
      лиц порядке с учетом финансовых результатов, полученных по договору о совместной деятельности. В
      бухгалтерском балансе организации-товарища вклад в совместную деятельность отражается в составе
      финансовых вложений, а в случае существенности показывается отдельной статьей. В отчете о прибылях
      и убытках причитающиеся организации-товарищу по итогам раздела прибыль или убыток включаются в состав
      прочих доходов или расходов при формировании финансового результата. (в ред. Приказа Минфина РФ
      от 18.09.2006 N 116н) В пояснениях к бухгалтерскому балансу и отчету о прибылях и убытках в рамках
      раскрытия информации по отчетному сегменту о совместной деятельности организацией-товарищем показываются:
      доля участия (вклад) в совместную деятельность; доля в общих договорных обязательствах; доля в совместно
      понесенных расходах; доля в совместно полученных доходах.'
  - path: '17'
    parent_path: null
    heading: Совместная деятельность
    text: При организации бухгалтерского учета товарищ, ведущий общие дела в соответствии с договором
      о совместной деятельности, обеспечивает обособленный учет операций (на отдельном балансе) по совместно
      осуществляемой деятельности и операций, связанных с выполнением своей обычной деятельности. Показатели
      отдельного баланса в бухгалтерский баланс товарища, ведущего общие дела, не включаются. Отражение
      хозяйственных операций по договору о совместной деятельности, включая учет расходов и доходов, а
      также расчет и учет финансовых результатов по отдельному балансу, осуществляются в общеустановленном
      порядке.
  - path: '18'
    parent_path: null
    heading: Совместная деятельность
    text: Имущество, внесенное участниками договора о совместной деятельности в качестве вклада, учитывается
      товарищем, которому в соответствии с договором поручено ведение общих дел, обособленно (на отдельном
      балансе). Вклады, внесенные участниками совместной деятельности, учитываются товарищем, ведущим
      общие дела, на счете по учету вкладов товарищей в оценке, предусмотренной договором. В бухгалтерском
      учете приобретенное или созданное в ходе осуществления договора о совместной деятельности имущество
      отражается в сумме фактических затрат на его приобретение, изготовление и т.д. Учет приобретения
      или создания новых объектов основных средств, нематериальных активов и других вложений во внеоборотные
      активы ведется в общеустановленном порядке. Начисление амортизации по амортизируемому имуществу
      в рамках отдельного баланса осуществляется в общеустановленном порядке вне зависимости от фактического
      срока их использования и применяемых ранее способов начисления амортизации до заключения договора
      о совместной деятельности.
  - path: '19'
    parent_path: null
    heading: Совместная деятельность
    text: По окончании отчетного периода полученный финансовый результат - нераспределенная прибыль (непокрытый
      убыток) распределяется между участниками договора о совместной деятельности в порядке, установленном
      договором. При этом в рамках отдельного баланса на дату принятия решения о распределении нераспределенной
      прибыли (непокрытого убытка) отражается кредиторская задолженность перед товарищами в сумме причитающейся
      им доли нераспределенной прибыли, либо дебиторская задолженность за товарищами в сумме их доли непокрытого
      убытка, причитающегося к погашению.
  - path: '20'
    parent_path: null
    heading: Совместная деятельность
    text: Товарищ, ведущий общие дела, составляет и представляет участникам договора о совместной деятельности
      в порядке и сроки, установленные договором, информацию, необходимую им для формирования отчетной,
      налоговой и иной документации. При этом представление товарищем, ведущим общие дела, информации,
      включаемой в бухгалтерскую отчетность товарищей, осуществляется в сроки, определенные договором,
      но не позднее сроков, установленных Федеральным законом от 21 ноября 1996 г. N 129-ФЗ "О бухгалтерском
      учете" (Собрание законодательства Российской Федерации, 1996, N 48, ст. 5369; 1998, N 30, ст. 3619;
      2002, N 13, ст. 1179; 2003, N 1, ст. 2, 6; N 2, ст. 160; N 27 (ч. I), ст. 2700).
  - path: '21'
    parent_path: null
    heading: Совместная деятельность
    text: Ликвидационный баланс составляется товарищем, ведущим общие дела, на дату прекращения договора
      о совместной деятельности. При этом причитающееся каждому товарищу по итогам раздела имущество учитывается
      как погашение его доли участия (вклада) в совместную деятельность.
  - path: '22'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'Организацией, являющейся участником договора о совместной деятельности, в бухгалтерской отчетности
      подлежит раскрытию, как минимум, следующая информация об участии в совместной деятельности:'
  - path: 22.а
    parent_path: '22'
    heading: null
    text: цель совместной деятельности (производство продукции, выполнение работ, оказание услуг и т.д.)
      и вклад в нее;
  - path: 22.б
    parent_path: '22'
    heading: null
    text: способ извлечения экономической выгоды или дохода (совместно осуществляемые операции, совместно
      используемые активы, совместная деятельность);
  - path: 22.в
    parent_path: '22'
    heading: null
    text: классификация отчетного сегмента (операционный или географический);
  - path: 22.г
    parent_path: '22'
    heading: null
    text: стоимость активов и обязательств, относящихся к совместной деятельности;
  - path: 22.д
    parent_path: '22'
    heading: null
    text: суммы доходов, расходов, прибыли или убытка, относящихся к совместной деятельности.
  - path: '23'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: Раскрытие информации в бухгалтерской отчетности организации об участии в совместной деятельности
      осуществляется в пояснительной записке в соответствии с правилами, установленными Положением по
      бухгалтерскому учету "Информация по сегментам" ПБУ 12/2000. Для формирования достоверной информации
      об участии в совместной деятельности в бухгалтерской отчетности каждым участником обеспечивается
      достоверность представляемой другим участникам договора информации о выполнении договора о совместной
      деятельности.