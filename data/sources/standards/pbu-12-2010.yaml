id: pbu-12-2010
kind: ПБУ
number: 12/2010
year: 2010
title: Информация по сегментам
order_date: 2010-11-08
order_no: 143н
effective_from: &id001 2011-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает правила формирования и представления информации по сегментам
      в бухгалтерской отчетности коммерческих организаций (кроме кредитных организаций), являющихся юридическими
      лицами по законодательству Российской Федерации.
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Организации - эмитенты публично размещаемых ценных бумаг должны раскрывать в пояснениях к бухгалтерской
      отчетности информацию по сегментам в соответствии с настоящим Положением. Иные организации применяют
      настоящее Положение в случае принятия ими решения о раскрытии информации по сегментам в бухгалтерской
      отчетности. Информация, не соответствующая требованиям настоящего Положения, не может именоваться
      в бухгалтерской отчетности информацией по сегментам.
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение не применяется при формировании отчетности, составляемой для государственного
      статистического наблюдения, отчетной информации, представляемой кредитной организации в соответствии
      с ее требованиями, и составления отчетной информации для иных специальных целей, если в правилах
      составления такой отчетности и информации не предусматривается использование настоящего Положения.
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: При раскрытии информации по сегментам организация применяет общие требования к представлению
      информации в бухгалтерской отчетности организаций, установленные нормативными правовыми актами по
      бухгалтерскому учету, с учетом требований настоящего Положения. Раскрытие информации по сегментам
      должно обеспечивать заинтересованных пользователей бухгалтерской отчетности организации информацией,
      позволяющей оценить отраслевую специфику деятельности организации, ее хозяйственную структуру, распределение
      финансовых показателей по отдельным направлениям деятельности.
  - path: '5'
    parent_path: null
    heading: Выделение сегментов
    text: 'Выделение сегментов заключается в обособлении информации о части деятельности организации:'
  - path: 5.а
    parent_path: '5'
    heading: null
    text: которая способна приносить экономические выгоды и предполагающая соответствующие расходы (включая
      подразумеваемые выгоды и расходы от операций с другими сегментами);
  - path: 5.б
    parent_path: '5'
    heading: null
    text: результаты которой систематически анализируются лицами, наделенными в организации полномочиями
      по принятию решений в распределении ресурсов внутри организации и оценке этих результатов (далее
      - полномочные лица организации);
  - path: 5.в
    parent_path: '5'
    heading: null
    text: по которой могут быть сформированы финансовые показатели отдельно от показателей других частей
      деятельности организации.
  - path: '6'
    parent_path: null
    heading: Выделение сегментов
    text: 'В зависимости от организационной и управленческой структуры организации, а также ее системы
      внутренней отчетности основой выделения сегментов могут быть, в частности:'
  - path: 6.а
    parent_path: '6'
    heading: null
    text: производимая продукция, закупаемые товары, выполняемые работы, оказываемые услуги;
  - path: 6.б
    parent_path: '6'
    heading: null
    text: основные покупатели (заказчики) продукции, товаров, работ, услуг;
  - path: 6.в
    parent_path: '6'
    heading: null
    text: географические регионы, в которых осуществляется деятельность;
  - path: 6.г
    parent_path: '6'
    heading: null
    text: структурные подразделения организации.
  - path: '7'
    parent_path: null
    heading: Выделение сегментов
    text: При выделении сегментов учитывается информация, используемая полномочными лицами организации,
      сведения, размещаемые в средствах массовой информации, иная доступная информация, в частности, управленческие
      документы по планированию, отчеты высшего органа управления организации, сведения, опубликованные
      на Интернет-сайте организации, и тому подобное.
  - path: '8'
    parent_path: null
    heading: Выделение сегментов
    text: 'Несколько сегментов могут быть определены как единый сегмент, если такое объединение соответствует
      целям настоящего Положения, а также при условии сходства следующих характеристик объединяемых сегментов:'
  - path: 8.а
    parent_path: '8'
    heading: null
    text: характер (назначение) продукции, товаров, работ, услуг;
  - path: 8.б
    parent_path: '8'
    heading: null
    text: процесс производства продукции, закупки товаров, выполнения работ, оказания услуг;
  - path: 8.в
    parent_path: '8'
    heading: null
    text: покупатели (заказчики) продукции, товаров, работ, услуг;
  - path: 8.г
    parent_path: '8'
    heading: null
    text: способы продажи продукции, товаров, работ, услуг;
  - path: 8.д
    parent_path: '8'
    heading: null
    text: правовые условия деятельности (например, необходимость лицензии (разрешения), режим налогообложения);
  - path: 8.е
    parent_path: '8'
    heading: null
    text: другие характеристики.
  - path: '9'
    parent_path: null
    heading: Выделение сегментов
    text: 'Помимо условий выделения сегментов, предусмотренных пунктами 5 - 8 настоящего Положения, организация
      может использовать также следующие дополнительные условия:'
  - path: 9.а
    parent_path: '9'
    heading: null
    text: специфический характер отдельного направления деятельности;
  - path: 9.б
    parent_path: '9'
    heading: null
    text: ответственность конкретных лиц за результаты отдельного направления деятельности;
  - path: 9.в
    parent_path: '9'
    heading: null
    text: обособленность информации, представляемой совету директоров (наблюдательному совету) организации;
  - path: 9.г
    parent_path: '9'
    heading: null
    text: другие условия.
  - path: '10'
    parent_path: null
    heading: Отчетные сегменты
    text: 'Информация по сегменту, выделенному в качестве отчетного, обособленно раскрывается в бухгалтерской
      отчетности посредством включения в нее перечня показателей, установленного настоящим Положением.
      Сегмент считается отчетным, если выполняется хотя бы одно из следующих условий:'
  - path: 10.а
    parent_path: '10'
    heading: null
    text: выручка сегмента от продаж покупателям (заказчикам) организации и подразумеваемая выручка от
      операций с другими сегментами составляет не менее 10 процентов общей суммы выручки всех сегментов;
  - path: 10.б
    parent_path: '10'
    heading: null
    text: 'финансовый результат (прибыль или убыток) сегмента составляет не менее 10 процентов от наибольшей
      из двух величин: суммарной прибыли сегментов, финансовым результатом которых является прибыль, или
      суммарного убытка сегментов, финансовым результатом которых является убыток;'
  - path: 10.в
    parent_path: '10'
    heading: null
    text: активы сегмента составляют не менее 10 процентов суммарных активов всех сегментов.
  - path: '11'
    parent_path: null
    heading: Отчетные сегменты
    text: Сегмент, показатели которого ниже предусмотренных пунктом 10 настоящего Положения, может быть
      выделен в качестве отчетного, если информация по данному сегменту будет полезной заинтересованным
      пользователям или если существует необходимость выделения большего количества отчетных сегментов
      для выполнения условия, предусмотренного пунктом 14 настоящего Положения.
  - path: '12'
    parent_path: null
    heading: Отчетные сегменты
    text: Перечень отчетных сегментов определяется организацией исходя из ее организационной и управленческой
      структуры.
  - path: '13'
    parent_path: null
    heading: Отчетные сегменты
    text: При определении перечня отчетных сегментов организация может объединить информацию по двум и
      более сегментам, показатели которых ниже предусмотренных пунктом 10 настоящего Положения, в том
      случае, если такое объединение соответствует требованиям настоящего Положения, а также при условии
      сходства объединяемых сегментов по характеристикам, предусмотренным пунктом 8 настоящего Положения.
  - path: '14'
    parent_path: null
    heading: Отчетные сегменты
    text: На отчетные сегменты в бухгалтерской отчетности организации должно приходиться не менее 75 процентов
      выручки от продаж покупателям (заказчикам) организации. Если на отчетные сегменты приходится менее
      75 процентов выручки от продаж покупателям (заказчикам) организации, то должны быть выделены дополнительные
      отчетные сегменты независимо от того, удовлетворяет ли каждый из них в отдельности условиям, предусмотренным
      пунктом 10 настоящего Положения.
  - path: '15'
    parent_path: null
    heading: Отчетные сегменты
    text: В случае если количество отчетных сегментов составляет более десяти, организация должна проанализировать
      возможность объединения отчетных сегментов в соответствии с пунктом 13 настоящего Положения.
  - path: '16'
    parent_path: null
    heading: Отчетные сегменты
    text: Показатели, характеризующие деятельность, не включенную в отчетные сегменты, раскрываются в
      бухгалтерской отчетности как прочие сегменты.
  - path: '17'
    parent_path: null
    heading: Отчетные сегменты
    text: При подготовке бухгалтерской отчетности должна быть обеспечена последовательность в определении
      перечня отчетных сегментов. Если сегмент, выделенный в качестве отчетного в периоде, предшествующем
      отчетному, в отчетном периоде не соответствует условиям отчетного сегмента, но предполагается, что
      указанный сегмент будет выделяться как отчетный в будущем, такой сегмент выделяется в качестве отчетного
      сегмента в отчетном периоде. Если сегмент впервые стал удовлетворять условиям отчетного сегмента
      в отчетном периоде, то по нему должна быть представлена также сравнительная информация за предшествующие
      отчетному периоды, за исключением случаев, когда необходимая информация отсутствует и ее подготовка
      противоречит требованию рациональности.
  - path: '18'
    parent_path: null
    heading: Оценка показателей отчетных сегментов
    text: Показатели отчетного сегмента, подлежащие раскрытию в соответствии с пунктами 24 - 27 настоящего
      Положения, приводятся в оценке, в которой они представляются полномочным лицам организации для принятия
      решений (по данным управленческого учета).
  - path: '19'
    parent_path: null
    heading: Оценка показателей отчетных сегментов
    text: Выручка, расходы, активы и обязательства, относящиеся к двум и более отчетным сегментам, подлежат
      обоснованному распределению между данными сегментами. Способ распределения определяется организацией
      в зависимости от характера объектов учета, видов деятельности организации, степени обособленности
      отчетных сегментов. Организация должна последовательно применять основу распределения показателей
      между отчетными сегментами. Распределенные выручка и расходы включаются в раскрываемый в бухгалтерской
      отчетности финансовый результат (прибыль, убыток) отчетного сегмента в том случае, если такие данные
      включаются в расчет финансового результата (прибыли, убытка) этого сегмента, используемого полномочными
      лицами организации для принятия решений.
  - path: '20'
    parent_path: null
    heading: Оценка показателей отчетных сегментов
    text: В случае если полномочные лица организации для принятия решений используют несколько показателей
      финансового результата (прибыли, убытка), активов или обязательств отчетного сегмента, исчисленных
      по различным правилам, то в составе информации по отчетному сегменту в бухгалтерской отчетности
      организации указанные показатели приводятся в той оценке, которая наиболее соответствует правилам
      оценки аналогичных показателей по организации в целом, представляемых в ее бухгалтерской отчетности.
  - path: '21'
    parent_path: null
    heading: Оценка показателей отчетных сегментов
    text: Показатели отчетного сегмента, подлежащие раскрытию в соответствии с пунктами 29 - 31 настоящего
      Положения, приводятся в оценке, применяемой для отражения в бухгалтерской отчетности аналогичных
      показателей организации в целом. Указанные показатели отчетного сегмента могут не раскрываться,
      когда их подготовка противоречит требованию рациональности.
  - path: '22'
    parent_path: null
    heading: Раскрытие информации по отчетным сегментам
    text: 'Организация раскрывает в пояснениях к бухгалтерской отчетности следующую информацию по отчетным
      сегментам:'
  - path: 22.а
    parent_path: '22'
    heading: null
    text: общую информацию;
  - path: 22.б
    parent_path: '22'
    heading: null
    text: показатели отчетных сегментов;
  - path: 22.в
    parent_path: '22'
    heading: null
    text: способы оценки показателей отчетных сегментов;
  - path: 22.г
    parent_path: '22'
    heading: null
    text: сопоставление совокупных показателей отчетных сегментов с величиной соответствующих статей бухгалтерского
      баланса или отчета о прибылях и убытках организации;
  - path: 22.д
    parent_path: '22'
    heading: null
    text: иную информацию, предусмотренную настоящим Положением.
  - path: '23'
    parent_path: null
    heading: Раскрытие информации по отчетным сегментам
    text: 'В составе общей информации по отчетным сегментам организацией приводится:'
  - path: 23.а
    parent_path: '23'
    heading: null
    text: описание основы выделения сегментов, признанных отчетными;
  - path: 23.б
    parent_path: '23'
    heading: null
    text: случаи объединения сегментов;
  - path: 23.в
    parent_path: '23'
    heading: null
    text: наименование вида (группы) продукции, товаров, работ, услуг, от продажи которых организация
      получает выручку в каждом из отчетных сегментов, а также в прочих сегментах.
  - path: '24'
    parent_path: null
    heading: Раскрытие информации по отчетным сегментам
    text: 'По каждому отчетному сегменту раскрываются следующие показатели:'
  - path: 24.а
    parent_path: '24'
    heading: null
    text: финансовый результат (прибыль или убыток) за отчетный период;
  - path: 24.б
    parent_path: '24'
    heading: null
    text: общая величина активов на отчетную дату;
  - path: 24.в
    parent_path: '24'
    heading: null
    text: общая величина обязательств на отчетную дату (если такие данные представляются полномочным лицам
      организации).
  - path: '25'
    parent_path: null
    heading: Раскрытие информации по отчетным сегментам
    text: 'Организация раскрывает следующие показатели по каждому отчетному сегменту в случае их представления
      полномочным лицам организации на систематической основе, независимо от включения таких показателей
      в расчет финансового результата (прибыли, убытка) отчетного сегмента:'
  - path: 25.а
    parent_path: '25'
    heading: null
    text: выручка от продаж покупателям (заказчикам) организации;
  - path: 25.б
    parent_path: '25'
    heading: null
    text: подразумеваемая выручка от операций с другими сегментами;
  - path: 25.в
    parent_path: '25'
    heading: null
    text: проценты (дивиденды) к получению;
  - path: 25.г
    parent_path: '25'
    heading: null
    text: проценты к уплате;
  - path: 25.д
    parent_path: '25'
    heading: null
    text: величина амортизационных отчислений по основным средствам и нематериальным активам;
  - path: 25.е
    parent_path: '25'
    heading: null
    text: иные существенные доходы и расходы;
  - path: 25.ж
    parent_path: '25'
    heading: null
    text: налог на прибыль организаций.
  - path: 25.заключение
    parent_path: '25'
    heading: null
    text: Допускается зачет между показателями "Проценты (дивиденды) к получению" и "Проценты к уплате"
      в случае, если проценты (дивиденды) к получению составляют большую часть доходов отчетного сегмента,
      и полномочным лицам организации представляется показатель, исчисляемый как проценты (дивиденды)
      к получению за вычетом процентов к уплате.
  - path: '26'
    parent_path: null
    heading: Раскрытие информации по отчетным сегментам
    text: Организация раскрывает по каждому отчетному сегменту величину внеоборотных активов в случае
      представления такого показателя полномочным лицам организации на систематической основе, независимо
      от включения этого показателя в расчет общей величины активов отчетного сегмента.
  - path: '27'
    parent_path: null
    heading: Раскрытие информации по отчетным сегментам
    text: 'Организация раскрывает следующую информацию об оценке показателей, раскрываемых в пояснениях
      к бухгалтерской отчетности по каждому отчетному сегменту:'
  - path: 27.а
    parent_path: '27'
    heading: null
    text: порядок учета операций между отчетными сегментами;
  - path: 27.б
    parent_path: '27'
    heading: null
    text: 'характер различий (если они не очевидны из результатов сопоставлений, раскрываемых в соответствии
      с пунктом 28 настоящего Положения) между: показателем прибыли (убытка) организации до налогообложения
      и совокупным показателем прибыли (убытка) отчетных сегментов; показателями активов и обязательств
      организации и совокупными показателями активов и обязательств отчетных сегментов;'
  - path: 27.в
    parent_path: '27'
    heading: null
    text: характер изменений способов оценки показателей, используемых для определения финансового результата
      (прибыли, убытка) отчетного сегмента, по сравнению с предшествующими периодами и влияние таких изменений
      на финансовый результат (прибыль, убыток) отчетного сегмента в отчетном периоде;
  - path: 27.г
    parent_path: '27'
    heading: null
    text: описание различий в распределении данных между отчетными сегментами и их влияние на показатели
      этих сегментов в случаях, когда способ распределения выручки и расходов отличается от способа распределения
      активов и обязательств, с которыми эти выручка и расходы связаны.
  - path: '28'
    parent_path: null
    heading: Раскрытие информации по отчетным сегментам
    text: 'Организация раскрывает результаты сопоставления суммарной величины следующих существенных показателей
      отчетных сегментов, включая показатели прочих сегментов, с величиной соответствующей статьи бухгалтерской
      отчетности организации:'
  - path: 28.а
    parent_path: '28'
    heading: null
    text: суммарной величины выручки всех отчетных сегментов с показателем выручки организации;
  - path: 28.б
    parent_path: '28'
    heading: null
    text: суммарной величины показателей прибыли (убытка) отчетных сегментов с показателем прибыли (убытка)
      до налогообложения либо показателем чистой прибыли (убытка) за отчетный период, если организация
      распределяет на отчетные сегменты налог на прибыль организаций;
  - path: 28.в
    parent_path: '28'
    heading: null
    text: суммарной величины активов отчетных сегментов с величиной активов организации;
  - path: 28.г
    parent_path: '28'
    heading: null
    text: суммарной величины обязательств отчетных сегментов с величиной обязательств организации;
  - path: 28.д
    parent_path: '28'
    heading: null
    text: суммарной величины каждого существенного показателя, раскрываемого в отношении отчетных сегментов,
      с величиной соответствующей статьи бухгалтерской отчетности организации.
  - path: '29'
    parent_path: null
    heading: Раскрытие информации по отчетным сегментам
    text: Организация раскрывает выручку от продаж покупателям (заказчикам) организации по каждому виду
      продукции, товаров, работ, услуг или однородных групп продукции, товаров, работ, услуг.
  - path: '30'
    parent_path: null
    heading: Раскрытие информации по отчетным сегментам
    text: 'Организация раскрывает по каждому географическому региону деятельности следующую информацию:'
  - path: 30.а
    parent_path: '30'
    heading: null
    text: величину выручки от продаж покупателям (заказчикам) организации, в том числе отдельно от продаж
      в Российской Федерации и от продаж за рубежом;
  - path: 30.б
    parent_path: '30'
    heading: null
    text: стоимость внеоборотных активов по данным бухгалтерского баланса организации, в том числе размещенных
      на территории Российской Федерации, размещенных за рубежом.
  - path: 30.заключение
    parent_path: '30'
    heading: null
    text: Если величина выручки от продаж, полученной в отдельной стране, или стоимость внеоборотных активов
      по данным бухгалтерского баланса организации, размещенных на территории отдельной страны, является
      существенной, такой показатель раскрывается обособленно. При этом организация должна раскрыть правила
      отнесения выручки от продаж к отдельным странам.
  - path: '31'
    parent_path: null
    heading: Раскрытие информации по отчетным сегментам
    text: 'Организация раскрывает следующую информацию о покупателях (заказчиках), выручка от продаж которым
      составляет не менее 10 процентов общей выручки от продаж покупателям (заказчикам) организации:'
  - path: 31.а
    parent_path: '31'
    heading: null
    text: наименование покупателя (заказчика);
  - path: 31.б
    parent_path: '31'
    heading: null
    text: общая величина выручки от продаж такому покупателю (заказчику);
  - path: 31.в
    parent_path: '31'
    heading: null
    text: наименование отчетного сегмента (отчетных сегментов), к которому относится данная выручка.
  - path: '32'
    parent_path: null
    heading: Раскрытие информации по отчетным сегментам
    text: При изменении в отчетном периоде структуры отчетных сегментов сравнительная информация за периоды,
      предшествующие отчетному, должна быть пересчитана в соответствии с новой структурой отчетных сегментов,
      за исключением случаев, когда такая информация отсутствует и такой пересчет противоречит требованию
      рациональности. При этом пересчету подлежит сравнительная информация по каждому показателю отчетного
      сегмента. Случаи пересчета (невозможности такого пересчета) подлежат раскрытию в составе информации
      по отчетным сегментам. Если сравнительная информация не пересчитана в соответствии с новой структурой
      отчетных сегментов, информация по сегментам за отчетный период должна быть представлена в разрезе
      как прежней, так и новой структуры сегментов.
  - path: '33'
    parent_path: null
    heading: Раскрытие информации по отчетным сегментам
    text: В случаях, когда раскрытие информации в объеме, предусмотренном настоящим Положением, приведет
      или может привести к потерям экономического характера и (или) урону деловой репутации организации
      и (или) ее контрагентов, и (или) связанных с ней сторон, организация может раскрывать информацию
      в ограниченном объеме, не раскрывая те сведения, которые обусловливают указанные потери и (или)
      урон. (п. 33 введен приказом Минфина России от 27.11.2020 № 287н)