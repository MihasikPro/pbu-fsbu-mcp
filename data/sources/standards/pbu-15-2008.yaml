editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает особенности формирования в бухгалтерском учете и бухгалтерской
      отчетности информации о расходах, связанных с выполнением обязательств по полученным займам (включая
      привлечение заемных средств путем выдачи векселей, выпуска и продажи облигаций) и кредитам (в том
      числе товарным и коммерческим), организаций, являющихся юридическими лицами по законодательству
      Российской Федерации (за исключением кредитных организаций и государственных (муниципальных) учреждений).
      (в ред. приказа Минфина России от 25.10.2010 № 132н)
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Основная сумма обязательства по полученному займу (кредиту) отражается в бухгалтерском учете
      организацией-заемщиком как кредиторская задолженность в соответствии с условиями договора займа
      (кредитного договора) в сумме, указанной в договоре.
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: 'Расходами, связанными с выполнением обязательств по полученным займам и кредитам (далее - расходы
      по займам), являются: проценты, причитающиеся к оплате заимодавцу (кредитору); дополнительные расходы
      по займам. Дополнительными расходами по займам являются: суммы, уплачиваемые за информационные и
      консультационные услуги; суммы, уплачиваемые за экспертизу договора займа (кредитного договора);
      иные расходы, непосредственно связанные с получением займов (кредитов).'
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: Расходы по займам отражаются в бухгалтерском учете обособленно от основной суммы обязательства
      по полученному займу (кредиту).
  - path: '5'
    parent_path: null
    heading: Общие положения
    text: Погашение основной суммы обязательства по полученному займу (кредиту) отражается в бухгалтерском
      учете организацией-заемщиком как уменьшение (погашение) кредиторской задолженности.
  - path: '6'
    parent_path: null
    heading: Порядок учета расходов по займам
    text: Расходы по займам отражаются в бухгалтерском учете и отчетности в том отчетном периоде, к которому
      они относятся.
  - path: '7'
    parent_path: null
    heading: Порядок учета расходов по займам
    text: Расходы по займам признаются прочими расходами, за исключением той их части, которая подлежит
      включению в стоимость инвестиционного актива, если иное не установлено настоящим пунктом. (в ред.
      приказа Минфина России от 08.11.2010 № 144н) В стоимость инвестиционного актива включаются проценты,
      причитающиеся к оплате заимодавцу (кредитору), непосредственно связанные с приобретением, сооружением
      и (или) изготовлением инвестиционного актива. Для целей настоящего Положения под инвестиционным
      активом понимается объект имущества, подготовка которого к предполагаемому использованию требует
      длительного времени и существенных расходов на приобретение, сооружение и (или) изготовление. К
      инвестиционным активам относятся объекты незавершенного производства и незавершенного строительства,
      которые впоследствии будут приняты к бухгалтерскому учету заемщиком и (или) заказчиком (инвестором,
      покупателем) в качестве основных средств (включая земельные участки), нематериальных активов или
      иных внеоборотных активов. Организации, которые вправе применять упрощенные способы ведения бухгалтерского
      учета, включая упрощенную бухгалтерскую (финансовую) отчетность, могут признавать все расходы по
      займам прочими расходами. (абзац введен приказом Минфина России от 08.11.2010 № 144н, в ред. приказов
      Минфина России от 27.04.2012 № 55н, от 06.04.2015 № 57н)
  - path: '8'
    parent_path: null
    heading: Порядок учета расходов по займам
    text: Проценты, причитающиеся к оплате заимодавцу (кредитору), включаются в стоимость инвестиционного
      актива или в состав прочих расходов равномерно, как правило, независимо от условий предоставления
      займа (кредита). Проценты, причитающиеся к оплате заимодавцу (кредитору), могут включаться в стоимость
      инвестиционного актива или в состав прочих расходов исходя из условий предоставления займа (кредита)
      в том случае, когда такое включение существенно не отличается от равномерного включения. Дополнительные
      расходы по займам могут включаться равномерно в состав прочих расходов в течение срока займа (кредитного
      договора).
  - path: '9'
    parent_path: null
    heading: Порядок учета расходов по займам
    text: 'Проценты, причитающиеся к оплате заимодавцу (кредитору), включаются в стоимость инвестиционного
      актива при наличии следующих условий:'
  - path: 9.а
    parent_path: '9'
    heading: null
    text: расходы по приобретению, сооружению и (или) изготовлению инвестиционного актива подлежат признанию
      в бухгалтерском учете;
  - path: 9.б
    parent_path: '9'
    heading: null
    text: расходы по займам, связанные с приобретением, сооружением и (или) изготовлением инвестиционного
      актива, подлежат признанию в бухгалтерском учете;
  - path: 9.в
    parent_path: '9'
    heading: null
    text: начаты работы по приобретению, сооружению и (или) изготовлению инвестиционного актива.
  - path: '10'
    parent_path: null
    heading: Порядок учета расходов по займам
    text: Проценты, причитающиеся к оплате заимодавцу (кредитору), связанные с приобретением, сооружением
      и (или) изготовлением инвестиционного актива, уменьшаются на величину дохода от временного использования
      средств полученных займов (кредитов) в качестве долгосрочных и (или) краткосрочных финансовых вложений.
  - path: '11'
    parent_path: null
    heading: Порядок учета расходов по займам
    text: При приостановке приобретения, сооружения и (или) изготовления инвестиционного актива на длительный
      период (более трех месяцев) проценты, причитающиеся к оплате заимодавцу (кредитору), прекращают
      включаться в стоимость инвестиционного актива с первого числа месяца, следующего за месяцем приостановления
      приобретения, сооружения и (или) изготовления такого актива. В указанный период проценты, причитающиеся
      к оплате заимодавцу (кредитору), включаются в состав прочих расходов организации. При возобновлении
      приобретения, сооружения и (или) изготовления инвестиционного актива проценты, причитающиеся к оплате
      заимодавцу (кредитору), включаются в стоимость инвестиционного актива с первого числа месяца, следующего
      за месяцем возобновления приобретения, сооружения и (или) изготовления такого актива. Не считается
      периодом приостановки приобретения, сооружения и (или) изготовления инвестиционного актива срок,
      в течение которого производится дополнительное согласование технических и (или) организационных
      вопросов, возникших в процессе приобретения, сооружения и (или) изготовления инвестиционного актива.
  - path: '12'
    parent_path: null
    heading: Порядок учета расходов по займам
    text: Проценты, причитающиеся к оплате заимодавцу (кредитору), прекращают включаться в стоимость инвестиционного
      актива с первого числа месяца за месяцем прекращения приобретения, сооружения и (или) изготовления
      инвестиционного актива.
  - path: '13'
    parent_path: null
    heading: Порядок учета расходов по займам
    text: В случае, если организация начала использовать инвестиционный актив для изготовления продукции,
      выполнения работ, оказания услуг несмотря на незавершенность работ по приобретению, сооружению и
      (или) изготовлению инвестиционного актива, то проценты, причитающиеся к оплате заимодавцу (кредитору),
      прекращают включаться в стоимость такого актива с первого числа месяца, следующего за месяцем начала
      использования инвестиционного актива.
  - path: '14'
    parent_path: null
    heading: Порядок учета расходов по займам
    text: 'В случае, если на приобретение, сооружение и (или) изготовление инвестиционного актива израсходованы
      средства займов (кредитов), полученных на цели, не связанные с таким приобретением, сооружением
      и (или) изготовлением, то проценты, причитающиеся к оплате заимодавцу (кредитору), включаются в
      стоимость инвестиционного актива пропорционально доле указанных средств в общей сумме займов (кредитов),
      причитающихся к оплате заимодавцу (кредитору), полученных на цели, не связанные с приобретением,
      сооружением и (или) изготовлением такого актива. Пример расчета доли процентов, причитающихся к
      оплатезаимодавцу (кредитору), подлежащих включению в стоимость инвестиционного актива Потрачено
      займов (кредитов) в отчетном периоде на приобретение, сооружение и (или) изготовление инвестиционного
      актива из займов (кредитов), полученных на общие цели: 8000 = (44000 - 36000). Сумма процентов,
      причитающихся к оплате заимодавцу (кредитору) за полученные займы (кредиты) на общие цели, подлежащих
      включению в стоимость инвестиционного актива: 971 = (1700 x 8000) / 14000. Итого сумма процентов,
      причитающихся к оплате заимодавцу (кредитору), подлежащих включению в стоимость инвестиционного
      актива: 10071 = (9100 + 971). Примечание к примеру:'
  - path: '15'
    parent_path: null
    heading: Порядок учета расходов по займам
    text: Проценты по причитающемуся к оплате векселю организацией-векселедателем отражаются обособленно
      от вексельной суммы как кредиторская задолженность. Начисленные проценты на вексельную сумму отражаются
      организацией-векселедателем в составе прочих расходов в тех отчетных периодах, к которым относятся
      данные начисления, или равномерно в течение предусмотренного векселем срока выплаты полученных взаймы
      денежных средств.
  - path: '16'
    parent_path: null
    heading: Порядок учета расходов по займам
    text: Проценты и (или) дисконт по причитающейся к оплате облигации организацией-эмитентом отражаются
      обособленно от номинальной стоимости облигации как кредиторская задолженность. Начисленные проценты
      и (или) дисконт по облигации отражаются организацией-эмитентом в составе прочих расходов в тех отчетных
      периодах, к которым относятся данные начисления, или равномерно в течение срока действия договора
      займа.
  - path: '17'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'В бухгалтерской отчетности организации подлежит раскрытию, как минимум, следующая информация:
      о наличии и изменении величины обязательств по займам (кредитам); о суммах процентов, причитающихся
      к оплате заимодавцу (кредитору), подлежащих включению в стоимость инвестиционных активов; о суммах
      расходов по займам, включенных в прочие расходы; о величине, видах, сроках погашения выданных векселей,
      выпущенных и проданных облигаций; о сроках погашения займов (кредитов); о суммах дохода от временного
      использования средств полученного займа (кредита) в качестве долгосрочных и (или) краткосрочных
      финансовых вложений, в том числе учтенных при уменьшении расходов по займам, связанных с приобретением,
      сооружением и (или) изготовлением инвестиционного актива; о суммах включенных в стоимость инвестиционного
      актива процентов, причитающихся к оплате заимодавцу (кредитору), по займам, взятым на цели, не связанные
      с приобретением, сооружением и (или) изготовлением инвестиционного актива.'
  - path: '18'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: В случае неисполнения или неполного исполнения заимодавцем договора займа (кредитного договора)
      организация-заемщик раскрывает в пояснительной записке к годовой бухгалтерской отчетности информацию
      о суммах займов (кредитов), недополученных по сравнению с условиями договора займа (кредитного договора).
