id: fsbu-6-2020
kind: ФСБУ
number: "6/2020"
year: 2020
title: Основные средства
order_date: 2020-09-17
order_no: 204н
effective_from: 2022-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
  - edition_no: 1
    amending_order: null
    effective_from: 2022-01-01
    clauses:
      - path: "1"
        parent_path: null
        heading: Общие положения
        text: >-
          Настоящий Стандарт устанавливает требования к формированию в
          бухгалтерском учете информации об основных средствах организаций.
      - path: "2"
        parent_path: null
        heading: Общие положения
        text: >-
          Настоящий Стандарт не применяется организациями бюджетной сферы.
      - path: "3"
        parent_path: null
        heading: Общие положения
        text: >-
          Организация, которая вправе применять упрощенные способы ведения
          бухгалтерского учета, включая упрощенную бухгалтерскую
          (финансовую) отчетность, может не применять пункты 23, 38,
          подпункты «б», «в», «ж» - «о» пункта 45, пункты 46, 47 настоящего
          Стандарта.
      - path: "4"
        parent_path: null
        heading: Общие положения
        text: >-
          Для целей бухгалтерского учета объектом основных средств
          считается актив, характеризующийся одновременно следующими
          признаками:
      - path: "4.а"
        parent_path: "4"
        heading: null
        text: >-
          имеет материально-вещественную форму;
      - path: "4.б"
        parent_path: "4"
        heading: null
        text: >-
          предназначен для использования организацией в ходе обычной
          деятельности при производстве и (или) продаже ею продукции
          (товаров), при выполнении работ или оказании услуг, для охраны
          окружающей среды, для предоставления за плату во временное
          пользование, для управленческих нужд, либо для использования в
          деятельности некоммерческой организации, направленной на
          достижение целей, ради которых она создана;
      - path: "4.в"
        parent_path: "4"
        heading: null
        text: >-
          предназначен для использования организацией в течение периода
          более 12 месяцев или обычного операционного цикла, превышающего
          12 месяцев;
      - path: "4.г"
        parent_path: "4"
        heading: null
        text: >-
          способен приносить организации экономические выгоды (доход) в
          будущем (обеспечить достижение некоммерческой организацией
          целей, ради которых она создана).
      - path: "5"
        parent_path: null
        heading: Общие положения
        text: >-
          Организация может принять решение не применять настоящий
          Стандарт в отношении активов, характеризующихся одновременно
          признаками, установленными пунктом 4 настоящего Стандарта, но
          имеющих стоимость ниже лимита, установленного организацией с
          учетом существенности информации о таких активах. При этом
          затраты на приобретение, создание таких активов признаются
          расходами периода, в котором они понесены. Указанное решение
          раскрывается в бухгалтерской (финансовой) отчетности с
          указанием лимита стоимости, установленного организацией.

          Организация должна обеспечить надлежащий контроль наличия и
          движения таких активов.
      - path: "6"
        parent_path: null
        heading: Общие положения
        text: >-
          Настоящий Стандарт не распространяется на:
      - path: "6.а"
        parent_path: "6"
        heading: null
        text: >-
          капитальные вложения;
      - path: "6.б"
        parent_path: "6"
        heading: null
        text: >-
          долгосрочные активы к продаже.
      - path: "7"
        parent_path: null
        heading: Общие положения
        text: >-
          Особенности бухгалтерского учета предметов договоров аренды
          (субаренды), а также иных договоров, положения которых по
          отдельности или во взаимосвязи предусматривают предоставление
          за плату имущества во временное пользование, устанавливаются
          Федеральным стандартом бухгалтерского учета ФСБУ 25/2018
          «Бухгалтерский учет аренды», утвержденным приказом
          Министерства финансов Российской Федерации от 16 октября
          2018 г. № 208н (зарегистрирован Министерством юстиции
          Российской Федерации 25 декабря 2018 г., регистрационный
          № 53162).
      - path: "8"
        parent_path: null
        heading: Общие положения
        text: >-
          Для каждого объекта основных средств организация определяет
          срок полезного использования. Для целей настоящего Стандарта
          сроком полезного использования считается период, в течение
          которого использование объекта основных средств будет
          приносить экономические выгоды организации. Для отдельных
          объектов основных средств срок полезного использования
          определяется исходя из количества продукции (объема работ в
          натуральном выражении), которое организация ожидает получить
          от использования объекта основных средств.
      - path: "9"
        parent_path: null
        heading: Общие положения
        text: >-
          Срок полезного использования объекта основных средств
          определяется исходя из:
      - path: "9.а"
        parent_path: "9"
        heading: null
        text: >-
          ожидаемого периода эксплуатации с учетом производительности
          или мощности, нормативных, договорных и других ограничений
          эксплуатации, намерений руководства организации в отношении
          использования объекта;
      - path: "9.б"
        parent_path: "9"
        heading: null
        text: >-
          ожидаемого физического износа с учетом режима эксплуатации
          (количества смен), системы проведения ремонтов, естественных
          условий, влияния агрессивной среды и иных аналогичных
          факторов;
      - path: "9.в"
        parent_path: "9"
        heading: null
        text: >-
          ожидаемого морального устаревания, в частности, в результате
          изменения или усовершенствования производственного процесса
          или в результате изменения рыночного спроса на продукцию или
          услуги, производимые при помощи основных средств;
      - path: "9.г"
        parent_path: "9"
        heading: null
        text: >-
          планов по замене основных средств, модернизации,
          реконструкции, технического перевооружения.
      - path: "10"
        parent_path: null
        heading: Общие положения
        text: >-
          Единицей учета основных средств является инвентарный объект.
          Инвентарным объектом основных средств признается объект
          основных средств со всеми приспособлениями и принадлежностями
          или отдельный конструктивно обособленный предмет,
          предназначенный для выполнения определенных самостоятельных
          функций, или обособленный комплекс конструктивно сочлененных
          предметов, представляющих собой единое целое и предназначенный
          для выполнения определенной работы.
      - path: "11"
        parent_path: null
        heading: Общие положения
        text: >-
          Комплексом конструктивно сочлененных предметов считается один
          или несколько предметов одного или разного назначения, имеющие
          общие приспособления и принадлежности, общее управление,
          смонтированные на одном фундаменте, в результате чего каждый
          входящий в комплекс предмет может выполнять свои функции
          только в составе комплекса, а не самостоятельно. При наличии у
          одного объекта основных средств нескольких частей, стоимость
          и сроки полезного использования которых существенно
          отличаются от стоимости и срока полезного использования
          объекта в целом, каждая такая часть признается самостоятельным
          инвентарным объектом. Самостоятельными инвентарными объектами
          признаются также существенные по величине затраты организации
          на проведение ремонта, технического осмотра, технического
          обслуживания объектов основных средств с частотой более
          12 месяцев или более обычного операционного цикла,
          превышающего 12 месяцев.

          Для целей бухгалтерского учета основные средства подлежат
          классификации по видам (например, недвижимость, машины и
          оборудование, транспортные средства, производственный и
          хозяйственный инвентарь) и группам.

          Для целей настоящего Стандарта группой основных средств
          считается совокупность объектов основных средств одного вида,
          объединенных исходя из сходного характера их использования.

          Основные средства, представляющие собой недвижимость,
          предназначенную для предоставления за плату во временное
          пользование и (или) получения дохода от прироста её
          стоимости, образуют отдельную группу основных средств (далее
          — инвестиционная недвижимость).
      - path: "12"
        parent_path: null
        heading: Оценка
        text: >-
          При признании в бухгалтерском учете объект основных средств
          оценивается по первоначальной стоимости. Первоначальной
          стоимостью объекта основных средств считается общая сумма
          связанных с этим объектом капитальных вложений, осуществленных
          до признания объекта основных средств в бухгалтерском учете.
      - path: "13"
        parent_path: null
        heading: Оценка
        text: >-
          После признания объект основных средств оценивается в
          бухгалтерском учете одним из следующих способов:
      - path: "13.а"
        parent_path: "13"
        heading: null
        text: >-
          по первоначальной стоимости;
      - path: "13.б"
        parent_path: "13"
        heading: null
        text: >-
          по переоцененной стоимости.
      - path: "13.заключение"
        parent_path: "13"
        heading: null
        text: >-
          Выбранный способ последующей оценки основных средств
          применяется ко всей группе основных средств.
      - path: "14"
        parent_path: null
        heading: Оценка
        text: >-
          При оценке основных средств по первоначальной стоимости такая
          стоимость и сумма накопленной амортизации не подлежат
          изменению, за исключением случаев, установленных настоящим
          Стандартом.
      - path: "15"
        parent_path: null
        heading: Оценка
        text: >-
          При оценке основных средств по переоцененной стоимости
          стоимость основного средства регулярно переоценивается таким
          образом, чтобы она была равна или не отличалась существенно
          от их справедливой стоимости. Для целей настоящего Стандарта
          справедливая стоимость определяется в порядке, предусмотренном
          Международным стандартом финансовой отчетности (IFRS) 13
          «Оценка справедливой стоимости», введенным в действие на
          территории Российской Федерации приказом Министерства финансов
          Российской Федерации от 28 декабря 2015 г. № 217н
          (зарегистрирован Министерством юстиции Российской Федерации
          2 февраля 2016 г., регистрационный № 40940).
      - path: "16"
        parent_path: null
        heading: Оценка
        text: >-
          Периодичность переоценки отличных от инвестиционной
          недвижимости основных средств определяется организацией для
          каждой группы переоцениваемых основных средств исходя из
          того, в какой степени справедливая стоимость таких основных
          средств подвержена изменениям. Если организация решает
          проводить переоценку основных средств не чаще одного раза в
          год, то переоценка проводится по состоянию на конец
          соответствующего отчетного года.
      - path: "17"
        parent_path: null
        heading: Оценка
        text: >-
          Переоценка отличных от инвестиционной недвижимости основных
          средств проводится путем пересчета их первоначальной стоимости
          и накопленной амортизации таким образом, чтобы балансовая
          стоимость объекта основных средств после переоценки равнялась
          его справедливой стоимости. Допустимым является также способ
          проведения переоценки основных средств, при котором сначала
          первоначальная стоимость объекта основных средств уменьшается
          на сумму амортизации, накопленной по нему на дату переоценки,
          а затем полученная сумма пересчитывается таким образом, чтобы
          она стала равной справедливой стоимости этого объекта основных
          средств.

          Для переоценки основных средств, входящих в одну группу,
          должен применяться один способ проведения переоценки.
      - path: "18"
        parent_path: null
        heading: Оценка
        text: >-
          Сумма дооценки отличных от инвестиционной недвижимости
          основных средств:
      - path: "18.а"
        parent_path: "18"
        heading: null
        text: >-
          отражается в составе совокупного финансового результата
          периода, в котором проведена переоценка основных средств,
          обособленно без включения в прибыль (убыток) этого периода,
          за исключением той части, в которой эта дооценка
          восстанавливает суммы уценки и (или) обесценения таких
          основных средств, признанные в прошлые периоды расходом в
          составе прибыли (убытка);
      - path: "18.б"
        parent_path: "18"
        heading: null
        text: >-
          в той части, в которой эта дооценка восстанавливает суммы
          уценки и (или) обесценения таких основных средств, признанные
          в прошлые периоды расходом в составе прибыли (убытка),
          признается доходом в составе прибыли (убытка) периода, в
          котором проведена переоценка основных средств.
      - path: "19"
        parent_path: null
        heading: Оценка
        text: >-
          Сумма уценки отличных от инвестиционной недвижимости основных
          средств:
      - path: "19.а"
        parent_path: "19"
        heading: null
        text: >-
          признается расходом в составе прибыли (убытка) периода, в
          котором проведена переоценка основных средств, за исключением
          той части, в которой эта уценка уменьшает сумму дооценки таких
          основных средств, отраженную в составе совокупного финансового
          результата в прошлые периоды без включения в прибыль (убыток)
          периода, в котором проведена уценка основных средств;
      - path: "19.б"
        parent_path: "19"
        heading: null
        text: >-
          в той части, в которой эта уценка уменьшает признанные в таком
          же порядке в прошлые периоды суммы дооценки таких основных
          средств, отражается в составе совокупного финансового
          результата периода, в котором проведена уценка основных
          средств, обособленно без включения в прибыль (убыток) этого
          периода.
      - path: "20"
        parent_path: null
        heading: Оценка
        text: >-
          Суммы переоценки отличных от инвестиционной недвижимости
          основных средств, отраженные в составе совокупного финансового
          результата без включения в прибыль (убыток), формируют
          показатель накопленной дооценки таких основных средств.
          Первоначально накопленная дооценка отражается обособленно в
          составе капитала в бухгалтерском балансе организации.

          Впоследствии накопленная дооценка списывается на
          нераспределенную прибыль организации одним из следующих
          способов:
      - path: "20.а"
        parent_path: "20"
        heading: null
        text: >-
          единовременно при списании объекта основных средств, по
          которому была накоплена дооценка;
      - path: "20.б"
        parent_path: "20"
        heading: null
        text: >-
          по мере начисления амортизации по объекту основных средств. В
          этом случае подлежащая списанию часть накопленной дооценки
          представляет собой положительную разницу между величиной
          амортизации за период, рассчитанной исходя из первоначальной
          стоимости объекта основных средств с учетом последней
          переоценки, и суммой амортизации за этот же период,
          рассчитанной исходя из первоначальной стоимости объекта
          основных средств без учета переоценок.
      - path: "20.заключение"
        parent_path: "20"
        heading: null
        text: >-
          Принятый организацией способ списания накопленной дооценки на
          нераспределенную прибыль организации применяется в отношении
          всех отличных от инвестиционной недвижимости основных
          средств.
      - path: "21"
        parent_path: null
        heading: Оценка
        text: >-
          Организация, принявшая решение оценивать инвестиционную
          недвижимость по переоцененной стоимости, должна применять
          этот способ оценки для всех объектов инвестиционной
          недвижимости.

          Переоценка инвестиционной недвижимости проводится на каждую
          отчетную дату.

          Первоначальная стоимость объекта инвестиционной недвижимости
          (в том числе ранее переоцененная) пересчитывается таким
          образом, чтобы она стала равной его справедливой стоимости.

          Дооценка или уценка объекта инвестиционной недвижимости
          включается в финансовый результат деятельности организации в
          качестве дохода или расхода периода, в котором проведена
          переоценка этого объекта.
      - path: "22"
        parent_path: null
        heading: Оценка
        text: >-
          Последствия изменения способа оценки основных средств
          отражаются перспективно (без пересчета данных за предыдущие
          периоды).
      - path: "23"
        parent_path: null
        heading: Оценка
        text: >-
          В случае если в первоначальной стоимости объекта основных
          средств учтена величина оценочного обязательства по будущему
          демонтажу, утилизации этого объекта и восстановлению
          окружающей среды, то изменение этой величины (без учета
          процентов) увеличивает или уменьшает первоначальную стоимость
          объекта основных средств. При этом если объект основных
          средств учитывается по переоцененной стоимости, то накопленная
          по нему дооценка (при наличии) корректируется на сумму
          изменения его первоначальной стоимости; причем величина такой
          корректировки включается в состав совокупного финансового
          результата без включения в прибыль (убыток). Если уменьшение
          первоначальной стоимости объекта основных средств в
          соответствии с настоящим пунктом приводит к тому, что
          балансовая стоимость данного объекта становится равной нулю,
          то дальнейшее уменьшение величины оценочного обязательства
          включается в финансовый результат деятельности организации в
          качестве дохода.
      - path: "24"
        parent_path: null
        heading: Оценка
        text: >-
          Первоначальная стоимость объекта основных средств
          увеличивается на сумму капитальных вложений, связанных с
          улучшением и (или) восстановлением этого объекта в момент,
          завершения таких капитальных вложений.
      - path: "25"
        parent_path: null
        heading: Оценка
        text: >-
          В бухгалтерском балансе основные средства отражаются по
          балансовой стоимости, которая представляет собой их
          первоначальную стоимость, уменьшенную на суммы накопленной
          амортизации и обесценения.
      - path: "26"
        parent_path: null
        heading: Оценка
        text: >-
          В случае изменения назначения оцениваемого по переоцененной
          стоимости объекта недвижимости таким образом, что этот объект
          перестает или начинает относиться к инвестиционной
          недвижимости, балансовая стоимость такого объекта на дату
          изменения его назначения считается его первоначальной
          стоимостью.
      - path: "27"
        parent_path: null
        heading: Амортизация
        text: >-
          Стоимость основных средств погашается посредством амортизации,
          если иное не установлено настоящим Стандартом.
      - path: "28"
        parent_path: null
        heading: Амортизация
        text: >-
          Не подлежат амортизации:

          инвестиционная недвижимость, оцениваемая по переоцененной
          стоимости;

          основные средства, потребительские свойства которых с
          течением времени не изменяются (в частности, земельные
          участки, объекты природопользования, музейные предметы и
          музейные коллекции);

          используемые для реализации законодательства Российской
          Федерации о мобилизационной подготовке и мобилизации объекты
          основных средств, которые законсервированы и не используются
          при производстве и (или) продаже продукции (товаров), при
          выполнении работ или оказании услуг, для предоставления за
          плату во временное пользование, для управленческих нужд.
      - path: "29"
        parent_path: null
        heading: Амортизация
        text: >-
          Начисление амортизации по основным средствам производится
          независимо от результатов деятельности организации в
          отчетном периоде.
      - path: "30"
        parent_path: null
        heading: Амортизация
        text: >-
          Начисление амортизации по основным средствам не
          приостанавливается (в том числе в случаях простоя или
          временного прекращения использования основных средств), за
          исключением случая, когда ликвидационная стоимость объекта
          основных средств становится равной или превышает его
          балансовую стоимость. Если впоследствии ликвидационная
          стоимость такого объекта основных средств становится меньше
          его балансовой стоимости, начисление амортизации по нему
          возобновляется.

          Для целей настоящего Стандарта ликвидационной стоимостью
          объекта основных средств считается величина, которую
          организация получила бы в случае выбытия данного объекта
          (включая стоимость материальных ценностей, остающихся от
          выбытия) после вычета предполагаемых затрат на выбытие; причем
          объект основных средств рассматривается таким образом, как
          если бы он уже достиг окончания срока полезного использования
          и находился в состоянии, характерном для конца срока полезного
          использования.
      - path: "31"
        parent_path: null
        heading: Амортизация
        text: >-
          Ликвидационная стоимость объекта основных средств считается
          равной нулю, если:
      - path: "31.а"
        parent_path: "31"
        heading: null
        text: >-
          не ожидаются поступления от выбытия объекта основных средств
          (в том числе от продажи материальных ценностей, остающихся
          от его выбытия) в конце срока полезного использования;
      - path: "31.б"
        parent_path: "31"
        heading: null
        text: >-
          ожидаемая к поступлению сумма от выбытия объекта основных
          средств не является существенной;
      - path: "31.в"
        parent_path: "31"
        heading: null
        text: >-
          ожидаемая к поступлению сумма от выбытия объекта основных
          средств не может быть определена.
      - path: "32"
        parent_path: null
        heading: Амортизация
        text: >-
          Сумма амортизации объекта основных средств за отчетный период
          определяется таким образом, чтобы к концу срока амортизации
          балансовая стоимость этого объекта стала равной его
          ликвидационной стоимости.
      - path: "33"
        parent_path: null
        heading: Амортизация
        text: >-
          Начисление амортизации объекта основных средств:
      - path: "33.а"
        parent_path: "33"
        heading: null
        text: >-
          начинается с даты его признания в бухгалтерском учете. По
          решению организации допускается начинать начисление
          амортизации с первого числа месяца, следующего за месяцем
          признания объекта основных средств в бухгалтерском учете;
      - path: "33.б"
        parent_path: "33"
        heading: null
        text: >-
          прекращается с момента его списания с бухгалтерского учета.
          По решению организации допускается прекращать начисление
          амортизации с первого числа месяца, следующего за месяцем
          списания объекта основных средств с бухгалтерского учета.
      - path: "34"
        parent_path: null
        heading: Амортизация
        text: >-
          Способ начисления амортизации выбирается организацией для
          каждой группы основных средств из установленных настоящим
          Стандартом. При этом выбранный способ начисления амортизации
          должен:
      - path: "34.а"
        parent_path: "34"
        heading: null
        text: >-
          наиболее точно отражать распределение во времени ожидаемых к
          получению будущих экономических выгод от использования
          группы основных средств;
      - path: "34.б"
        parent_path: "34"
        heading: null
        text: >-
          применяться последовательно от одного отчетного периода к
          другому, кроме случаев, когда меняется распределение во
          времени ожидаемых к получению будущих экономических выгод от
          использования группы основных средств.
      - path: "35"
        parent_path: null
        heading: Амортизация
        text: >-
          Амортизация по основным средствам, срок полезного
          использования которых определяется периодом, в течение
          которого их использование будет приносить экономические
          выгоды организации, начисляется линейным способом или
          способом уменьшаемого остатка.

          Начисление амортизации линейным способом производится таким
          образом, чтобы подлежащая амортизации стоимость объекта
          основных средств погашалась равномерно в течение всего срока
          полезного использования этого объекта. При этом сумма
          амортизации за отчетный период определяется как отношение
          разности между балансовой и ликвидационной стоимостью объекта
          основных средств к величине оставшегося срока полезного
          использования данного объекта.

          Начисление амортизации способом уменьшаемого остатка
          производится таким образом, чтобы суммы амортизации объекта
          основных средств за одинаковые периоды уменьшались по мере
          истечения срока полезного использования этого объекта. При
          этом организация самостоятельно определяет формулу расчета
          суммы амортизации за отчетный период, обеспечивающую
          систематическое уменьшение этой суммы в следующих периодах.
      - path: "36"
        parent_path: null
        heading: Амортизация
        text: >-
          Амортизация по основным средствам, срок полезного
          использования которых определяется исходя из количества
          продукции (объема работ в натуральном выражении), которое
          организация ожидает получить от использования объекта
          основных средств, начисляется способом пропорционально
          количеству продукции (объему работ в натуральном выражении).

          Начисление амортизации способом пропорционально количеству
          продукции (объему работ в натуральном выражении) производится
          таким образом, чтобы распределить подлежащую амортизации
          стоимость объекта основных средств на весь срок полезного
          использования этого объекта. При этом сумма амортизации за
          отчетный период определяется как произведение разности между
          балансовой и ликвидационной стоимостью объекта основных
          средств на отношение показателя количества продукции (объема
          работ в натуральном выражении) в отчетном периоде к
          оставшемуся сроку полезного использования объекта основных
          средств.

          При применении способа пропорционально количеству продукции
          (объему работ в натуральном выражении) не допускается
          определять сумму амортизации за отчетный период на основе
          величины поступлений (выручки или иного аналогичного
          показателя) от продажи продукции (работ, услуг) производимой
          (выполняемых, оказываемых) с использованием данного основного
          средства.
      - path: "37"
        parent_path: null
        heading: Амортизация
        text: >-
          Срок полезного использования, ликвидационная стоимость и
          способ начисления амортизации (далее — элементы амортизации)
          объекта основных средств определяются при признании этого
          объекта в бухгалтерском учете.

          Элементы амортизации объекта основных средств подлежат
          проверке на соответствие условиям использования объекта
          основных средств. Такая проверка проводится в конце каждого
          отчетного года, а также при наступлении обстоятельств,
          свидетельствующих о возможном изменении элементов амортизации.
          По результатам такой проверки при необходимости организация
          принимает решение об изменении соответствующих элементов
          амортизации. Возникшие в связи с этим корректировки
          отражаются в бухгалтерском учете как изменения оценочных
          значений.
      - path: "38"
        parent_path: null
        heading: Амортизация
        text: >-
          Организация проверяет основные средства на обесценение и
          учитывает изменение их балансовой стоимости вследствие
          обесценения в порядке, предусмотренном Международным
          стандартом финансовой отчетности (IAS) 36 «Обесценение
          активов», введенным в действие на территории Российской
          Федерации приказом Министерства финансов Российской Федерации
          от 28 декабря 2015 г. № 217н (зарегистрирован Министерством
          юстиции Российской Федерации 2 февраля 2016 г.,
          регистрационный № 40940).

          Возмещение убытков, связанных с обесценением или утратой
          объекта основных средств, предоставляемое организации
          другими лицами, признается доходом в составе прибыли
          (убытка) периода, в котором у организации возникает право на
          получение такого возмещения.
      - path: "39"
        parent_path: null
        heading: Амортизация
        text: >-
          В бухгалтерском учете суммы накопленной амортизации и
          обесценения по объекту основных средств отражаются отдельно
          от первоначальной стоимости этого объекта и не изменяют ее.
      - path: "40"
        parent_path: null
        heading: Списание
        text: >-
          Объект основных средств, который выбывает или не способен
          приносить организации экономические выгоды в будущем,
          списывается с бухгалтерского учета. Списание объекта основных
          средств обусловливается, например:
      - path: "40.а"
        parent_path: "40"
        heading: null
        text: >-
          прекращением использования этого объекта вследствие его
          физического или морального износа при отсутствии перспектив
          продажи или возобновления использования;
      - path: "40.б"
        parent_path: "40"
        heading: null
        text: >-
          передачей этого объекта другому лицу в связи с его продажей,
          меной, передачей в виде вклада в капитал другой организации,
          передачей в неоперационную (финансовую) аренду, передачей в
          некоммерческую организацию;
      - path: "40.в"
        parent_path: "40"
        heading: null
        text: >-
          физическим выбытием этого объекта в связи с его утратой,
          стихийным бедствием, пожаром, аварией и другими чрезвычайными
          ситуациями;
      - path: "40.г"
        parent_path: "40"
        heading: null
        text: >-
          истечением нормативно допустимых сроков или других предельных
          параметров эксплуатации этого объекта, в результате чего его
          использование организацией становится невозможным;
      - path: "40.д"
        parent_path: "40"
        heading: null
        text: >-
          прекращением организацией деятельности, в которой
          использовался этот объект, при отсутствии возможности его
          использования в продолжающейся деятельности.
      - path: "41"
        parent_path: null
        heading: Списание
        text: >-
          Объект основных средств подлежит списанию в том отчетном
          периоде, в котором он выбывает или становится неспособным
          приносить организации экономические выгоды в будущем.
      - path: "42"
        parent_path: null
        heading: Списание
        text: >-
          При списании объекта основных средств суммы накопленной
          амортизации и накопленного обесценения по данному объекту
          относятся в уменьшение его первоначальной стоимости
          (переоцененной стоимости).
      - path: "43"
        parent_path: null
        heading: Списание
        text: >-
          Затраты на демонтаж, утилизацию объекта основных средств и
          восстановление окружающей среды признаются расходами периода,
          в котором были понесены, за исключением случаев, когда в
          отношении этих затрат ранее было признано оценочное
          обязательство.
      - path: "44"
        parent_path: null
        heading: Списание
        text: >-
          Разница между суммой балансовой стоимости списываемого
          объекта основных средств и затрат на его выбытие, с одной
          стороны, и поступлениями от выбытия этого объекта, с другой
          стороны, признается доходом или расходом в составе прибыли
          (убытка) периода, в котором списывается объект основных
          средств.
      - path: "45"
        parent_path: null
        heading: Раскрытие информации в отчетности
        text: >-
          В бухгалтерской (финансовой) отчетности раскрывается с учетом
          существенности следующая информация:
      - path: "45.а"
        parent_path: "45"
        heading: null
        text: >-
          балансовая стоимость отличных от инвестиционной недвижимости
          основных средств и инвестиционной недвижимости на начало и
          конец отчетного периода;
      - path: "45.б"
        parent_path: "45"
        heading: null
        text: >-
          сверка остатков основных средств по группам в разрезе
          первоначальной (переоцененной) стоимости, накопленной
          амортизации и накопленного обесценения на начало и конец
          отчетного периода, и движения основных средств за отчетный
          период (поступление, выбытие, переклассификация в
          долгосрочные активы к продаже, изменение стоимости в
          результате переоценки, амортизация, обесценение, другие
          изменения);
      - path: "45.в"
        parent_path: "45"
        heading: null
        text: >-
          балансовая стоимость амортизируемых и не амортизируемых
          основных средств;
      - path: "45.г"
        parent_path: "45"
        heading: null
        text: >-
          результат от выбытия основных средств за отчетный период;
      - path: "45.д"
        parent_path: "45"
        heading: null
        text: >-
          результат переоценки основных средств, включенный в доходы
          или расходы отчетного периода;
      - path: "45.е"
        parent_path: "45"
        heading: null
        text: >-
          результат переоценки основных средств, включенный в капитал
          в отчетном периоде;
      - path: "45.ж"
        parent_path: "45"
        heading: null
        text: >-
          результат обесценения основных средств и восстановления
          обесценения, включенный в расходы или доходы отчетного
          периода,
      - path: "45.з"
        parent_path: "45"
        heading: null
        text: >-
          сумма обесценения основных средств, отнесенная в отчетном
          периоде на уменьшение накопленного результата переоценки;
      - path: "45.и"
        parent_path: "45"
        heading: null
        text: >-
          балансовая стоимость пригодных для использования, но не
          используемых объектов основных средств, когда это не связано
          с сезонными особенностями деятельности организации, на
          отчетную дату;
      - path: "45.к"
        parent_path: "45"
        heading: null
        text: >-
          балансовая стоимость основных средств, предоставленных за
          плату во временное пользование, на отчетную дату;
      - path: "45.л"
        parent_path: "45"
        heading: null
        text: >-
          балансовая стоимость основных средств, в отношении которых
          имеются ограничения имущественных прав организации, в том
          числе основных средств, находящихся в залоге, на отчетную
          дату;
      - path: "45.м"
        parent_path: "45"
        heading: null
        text: >-
          способы оценки основных средств (по группам);
      - path: "45.н"
        parent_path: "45"
        heading: null
        text: >-
          элементы амортизации основных средств и их изменения;
      - path: "45.о"
        parent_path: "45"
        heading: null
        text: >-
          признанная доходом в составе прибыли (убытка) сумма
          возмещения убытков, связанных с обесценением или утратой
          объектов основных средств, предоставленного организации
          другими лицами.
      - path: "46"
        parent_path: null
        heading: Раскрытие информации в отчетности
        text: >-
          В отношении основных средств, оцениваемых на основе
          переоцененной стоимости, в дополнение к указанному в пункте 45
          настоящего Стандарта раскрывается следующая информация:
      - path: "46.а"
        parent_path: "46"
        heading: null
        text: >-
          дата проведения последней переоценки основных средств;
      - path: "46.б"
        parent_path: "46"
        heading: null
        text: >-
          привлекался ли независимый оценщик к проведению переоценки;
      - path: "46.в"
        parent_path: "46"
        heading: null
        text: >-
          методы и допущения, принятые при определении справедливой
          стоимости основных средств, включая информацию об
          использовании наблюдаемых рыночных цен;
      - path: "46.г"
        parent_path: "46"
        heading: null
        text: >-
          балансовая стоимость переоцениваемых групп основных средств,
          которая была бы отражена в бухгалтерской (финансовой)
          отчетности при оценке их по первоначальной стоимости, на
          отчетную дату;
      - path: "46.д"
        parent_path: "46"
        heading: null
        text: >-
          способы пересчета первоначальной стоимости переоцениваемых
          групп основных средств,
      - path: "46.е"
        parent_path: "46"
        heading: null
        text: >-
          сумма накопленной дооценки основных средств, не списанная на
          нераспределенную прибыль, с указанием способа списания
          накопленной дооценки на нераспределенную прибыль.
      - path: "47"
        parent_path: null
        heading: Раскрытие информации в отчетности
        text: >-
          Организация раскрывает предусмотренную Международным
          стандартом финансовой отчетности (IAS) 36 «Обесценение
          активов», введенным в действие на территории Российской
          Федерации приказом Министерства финансов Российской Федерации
          от 28 декабря 2015 г. № 217н (зарегистрирован Министерством
          юстиции Российской Федерации 2 февраля 2016 г.,
          регистрационный № 40940), информацию об обесценении основных
          средств.
      - path: "48"
        parent_path: null
        heading: Изменение учетной политики
        text: >-
          Последствия изменений учетной политики в связи с началом
          применения настоящего Стандарта отражаются ретроспективно
          (как если бы настоящий Стандарт применялся с момента
          возникновения затрагиваемых им фактов хозяйственной жизни),
          если иное не установлено настоящим Стандартом.
      - path: "49"
        parent_path: null
        heading: Изменение учетной политики
        text: >-
          В бухгалтерской (финансовой) отчетности организации, начиная
          с которой применяется настоящий Стандарт, допускается не
          пересчитывать сравнительные показатели за периоды,
          предшествующие отчетному, произведя единовременную
          корректировку балансовой стоимости основных средств на начало
          отчетного периода (конец периода, предшествующего отчетному)
          в соответствии с настоящим пунктом. Для целей указанной
          корректировки балансовой стоимостью основных средств
          считается их первоначальная стоимость (с учетом переоценок),
          признанная до начала применения настоящего Стандарта в
          соответствии с ранее применявшейся учетной политикой, за
          вычетом накопленной амортизации. При этом накопленная
          амортизация рассчитывается в соответствии с настоящим
          Стандартом исходя из указанной первоначальной стоимости,
          ликвидационной стоимости и соотношения истекшего и
          оставшегося срока полезного использования, определенного в
          соответствии с настоящим Стандартом.

          Настоящий пункт применяется также в отношении объектов
          бухгалтерского учета, которые в соответствии с настоящим
          Стандартом должны классифицироваться как основные средства,
          но в соответствии с ранее применявшейся учетной политикой
          учитывались в составе активов других видов.

          В случае применения организацией способа оценки на основе
          переоцененной стоимости организация, применяющая настоящий
          пункт, должна провести на дату единовременной корректировки
          переоценку основных средств, к которым применяется данный
          способ оценки, и признать соответствующий накопленный
          результат дооценки основных средств (при наличии) в составе
          капитала, скорректировав (при необходимости) аналогичный
          показатель, сформированный до начала применения настоящего
          Стандарта в соответствии с ранее применявшейся учетной
          политикой.

          Балансовая стоимость объектов, которые в соответствии с ранее
          применявшейся учетной политикой учитывались в составе
          основных средств, но в соответствии с настоящим Стандартом
          таковыми не являются, списывается в порядке единовременной
          корректировки на нераспределенную прибыль, за исключением
          случаев переклассификации таких объектов в другой вид
          активов.
      - path: "50"
        parent_path: null
        heading: Изменение учетной политики
        text: >-
          Изменения балансовой стоимости основных средств в связи с
          началом применения настоящего Стандарта, которые не связаны с
          изменениями других статей бухгалтерского баланса, списываются
          на нераспределенную прибыль.
      - path: "51"
        parent_path: null
        heading: Изменение учетной политики
        text: >-
          Организация, которая вправе применять упрощенные способы
          ведения бухгалтерского учета, включая упрощенную бухгалтерскую
          (финансовую) отчетность, может начать применять настоящий
          Стандарт перспективно (только в отношении фактов хозяйственной
          жизни, имевших место после начала применения настоящего
          Стандарта, без изменения сформированных ранее данных
          бухгалтерского учета).
      - path: "52"
        parent_path: null
        heading: Изменение учетной политики
        text: >-
          Организация раскрывает выбранный ею способ отражения
          последствий изменения учетной политики в связи с началом
          применения настоящего Стандарта в своей первой бухгалтерской
          (финансовой) отчетности, составленной с применением
          настоящего Стандарта.
