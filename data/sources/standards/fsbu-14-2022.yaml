id: fsbu-14-2022
kind: ФСБУ
number: 14/2022
year: 2022
title: Нематериальные активы
order_date: 2022-05-30
order_no: 86н
effective_from: &id001 2024-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящий Стандарт устанавливает требования к формированию в бухгалтерском учете информации
      о нематериальных активах организаций.
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Настоящий Стандарт не применяется организациями бюджетной сферы.
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: Организация, которая вправе применять упрощенные способы ведения бухгалтерского учета, включая
      упрощенную бухгалтерскую (финансовую) отчетность, может не применять пункт 43, подпункты «б», «в»,
      «д», «з» ? «л» пункта 49, пункты 50, 51 настоящего Стандарта.
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: 'Для целей бухгалтерского учета объектом нематериальных активов считается актив, характеризующийся
      одновременно следующими признаками:'
  - path: 4.а
    parent_path: '4'
    heading: null
    text: не имеет материально-вещественной формы;
  - path: 4.б
    parent_path: '4'
    heading: null
    text: предназначен для использования организацией в ходе обычной деятельности при производстве и (или)
      продаже ею продукции (товаров), при выполнении работ или оказании услуг, для предоставления за плату
      во временное пользование, для управленческих нужд либо для использования в деятельности некоммерческой
      организации, направленной на достижение целей, ради которых она создана;
  - path: 4.в
    parent_path: '4'
    heading: null
    text: предназначен для использования организацией в течение периода более 12 месяцев или обычного
      операционного цикла, превышающего 12 месяцев;
  - path: 4.г
    parent_path: '4'
    heading: null
    text: способен приносить организации экономические выгоды (доход) в будущем (обеспечить достижение
      некоммерческой организацией целей, ради которых она создана), на получение которых организация имеет
      право (в частности, в отношении такого актива у организации при его приобретении (создании) возникли
      исключительные права, права в соответствии с лицензионными договорами либо иными документами, подтверждающими
      существование права на такой актив) и доступ иных лиц к которым организация способна ограничить;
  - path: 4.д
    parent_path: '4'
    heading: null
    text: может быть выделен (идентифицирован) из других активов или отделен от них.
  - path: '5'
    parent_path: null
    heading: Общие положения
    text: Характеризующийся признаками, установленными пунктом 4 настоящего Стандарта, актив, исключительное
      право на который принадлежит нескольким организациям совместно, признается объектом нематериальных
      активов каждой из этих организаций. Характеризующийся признаками, установленными пунктом 4 настоящего
      Стандарта, актив, исключительно право на который принадлежит организации (нескольким организациям)
      и иным лицам (например, физическому лицу (физическим лицам) Российской Федерации) совместно, признается
      объектом нематериальных активов этой организацией (каждой из этих организаций).
  - path: '6'
    parent_path: null
    heading: Общие положения
    text: 'При соответствии признакам, установленным пунктом 4 настоящего Стандарта, нематериальными активами
      являются, например:'
  - path: 6.а
    parent_path: '6'
    heading: null
    text: результаты интеллектуальной деятельности;
  - path: 6.б
    parent_path: '6'
    heading: null
    text: средства индивидуализации юридического лица, товаров, работ, услуг и предприятий (далее – средства
      индивидуализации);
  - path: 6.в
    parent_path: '6'
    heading: null
    text: разрешения (лицензии) на осуществление отдельных видов деятельности.
  - path: '7'
    parent_path: null
    heading: Общие положения
    text: Организация может принять решение не применять настоящий Стандарт в отношении активов, характеризующихся
      признаками, установленными пунктом 4 настоящего Стандарта, но имеющих стоимость за единицу ниже
      лимита, установленного организацией. Указанный лимит устанавливается с учетом существенности информации
      о таких активах. При этом затраты на приобретение, создание таких активов признаются расходами периода,
      в котором завершены капитальные вложения, связанные с приобретением, созданием этих активов. Указанное
      решение раскрывается в бухгалтерской (финансовой) отчетности с указанием лимита стоимости, установленного
      организацией. Организация должна обеспечить надлежащий контроль (в том числе с использованием забалансового
      учета) наличия и движения активов, указанных в абзаце первом настоящего пункта.
  - path: '8'
    parent_path: null
    heading: Общие положения
    text: 'Настоящий Стандарт не распространяется на:'
  - path: 8.а
    parent_path: '8'
    heading: null
    text: финансовые вложения;
  - path: 8.б
    parent_path: '8'
    heading: null
    text: результаты интеллектуальной деятельности и средства индивидуализации, приобретенные или созданные
      (находящиеся в процессе создания) для продажи в ходе обычной деятельности организации;
  - path: 8.в
    parent_path: '8'
    heading: null
    text: права пользования активом, возникающие из договора аренды;
  - path: 8.г
    parent_path: '8'
    heading: null
    text: долгосрочные активы к продаже;
  - path: 8.д
    parent_path: '8'
    heading: null
    text: поисковые активы;
  - path: 8.е
    parent_path: '8'
    heading: null
    text: средства индивидуализации (например, фирменные наименования, товарные знаки, знаки обслуживания),
      созданные собственными силами организации;
  - path: 8.ж
    parent_path: '8'
    heading: null
    text: интеллектуальные и деловые качества персонала организации, его квалификацию и способность к
      труду;
  - path: 8.з
    parent_path: '8'
    heading: null
    text: информацию о покупателях (заказчиках) и иных контрагентах организации, созданную собственными
      силами организации;
  - path: 8.и
    parent_path: '8'
    heading: null
    text: материальные носители (вещи), в которых выражены результаты интеллектуальной деятельности и
      средства индивидуализации, в случае когда организацией принято решение об учете этих материальных
      носителей (вещей) отдельно от объекта нематериальных активов.
  - path: 8.заключение
    parent_path: '8'
    heading: null
    text: Затраты организации, связанные с созданием объектов, указанных в подпунктах «е», «з» настоящего
      пункта, признаются расходами периода, в котором они понесены, в порядке, установленном Положением
      по бухгалтерскому учету «Расходы организации» ПБУ 10/99, утвержденным приказом Министерства финансов
      Российской Федерации от 6 мая 1999 г. № 33н (зарегистрирован Министерством юстиции Российской Федерации
      31 мая 1999 г., регистрационный № 1790) .
  - path: '9'
    parent_path: null
    heading: Общие положения
    text: Организация должна обеспечить надлежащий контроль (в том числе с использованием забалансового
      учета) наличия и движения не характеризующихся признаками, установленными пунктом 4 настоящего Стандарта,
      результатов интеллектуальной деятельности, средств индивидуализации, в отношении которых у организации
      имеются исключительные права, права в соответствии с лицензионными договорами либо иными документами,
      подтверждающими существование права на них.
  - path: '10'
    parent_path: null
    heading: Общие положения
    text: Информация о гудвиле, то есть активе, определение и признаки которого установлены Международным
      стандартом финансовой отчетности (IFRS) 3 «Объединения бизнесов», введенным в действие на территории
      Российской Федерации приказом Министерства финансов Российской Федерации от 28 декабря 2015 г. №
      217н (зарегистрирован Министерством юстиции Российской Федерации 2 февраля 2016 г., регистрационный
      № 40940) (далее соответственно – МСФО (IFRS) 3, приказ № 217н), формируется в порядке, предусмотренном
      МСФО (IFRS) 3. Гудвил, созданный собственными силами организации, не признается активом в бухгалтерском
      учете организации.
  - path: '11'
    parent_path: null
    heading: Общие положения
    text: Единицей учета нематериальных активов является инвентарный объект. Инвентарным объектом нематериальных
      активов признается совокупность прав на него, возникающих в соответствии с договорами либо иными
      документами, подтверждающими существование у организации прав на такой актив. В качестве инвентарного
      объекта нематериальных активов может признаваться также сложный объект, включающий несколько охраняемых
      результатов интеллектуальной деятельности (например, кинофильм, иное аудиовизуальное произведение,
      театрально-зрелищное представление, мультимедийный продукт, единая технология).
  - path: '12'
    parent_path: null
    heading: Общие положения
    text: Для целей бухгалтерского учета нематериальные активы подлежат классификации по видам (например,
      произведения науки, литературы и искусства; программы для электронных вычислительных машин (программы
      ЭВМ); базы данных; изобретения; полезные модели; промышленные образцы; секреты производства (ноу-хау);
      селекционные достижения; лицензии и разрешения) и группам. Для целей настоящего Стандарта группой
      нематериальных активов считается совокупность объектов нематериальных активов одного вида, объединенных
      исходя из сходного характера их использования.
  - path: '13'
    parent_path: null
    heading: Оценка
    text: При признании в бухгалтерском учете объект нематериальных активов оценивается по первоначальной
      стоимости. Первоначальной стоимостью объекта нематериальных активов считается общая сумма связанных
      с этим объектом капитальных вложений, осуществленных до признания объекта нематериальных активов
      в бухгалтерском учете.
  - path: '14'
    parent_path: null
    heading: Оценка
    text: В случае если при признании результатов интеллектуальной деятельности, средств индивидуализации
      в качестве объекта нематериальных активов, в фактические затраты на приобретение, создание которого
      включены фактические затраты на приобретение, создание материального носителя (вещи), в котором
      выражены такие результаты интеллектуальной деятельности, средства индивидуализации, организация
      принимает решение учитывать такой материальный носитель (вещь) отдельно от объекта нематериальных
      активов в составе основных средств или запасов (в зависимости от соответствия определению и признакам
      таких активов), первоначальная стоимость объекта нематериальных активов уменьшается на величину
      расчетной стоимости этого материального носителя (вещи). Расчетная стоимость материального носителя
      (вещи) определяется, исходя из фактических затрат на приобретение, создание такого материального
      носителя (вещи), а если их невозможно определить, то исходя из его справедливой стоимости, чистой
      стоимости продажи, стоимости аналогичных ценностей, и не может быть выше первоначальной стоимости
      объекта нематериальных активов. Порядок определения расчетной стоимости материального носителя (вещи),
      аналогичный указанному в настоящем пункте, применяется в случае, когда после признания результатов
      интеллектуальной деятельности, средств индивидуализации в качестве объекта нематериальных активов,
      в фактические затраты на приобретение, создание которого включены фактические затраты на приобретение,
      создание материального носителя (вещи), в котором выражены такие результаты интеллектуальной деятельности,
      средства индивидуализации, организация принимает решение использовать указанный материальный носитель
      (вещь) отдельно от объекта нематериальных активов. При этом расчетная стоимость материального носителя
      (вещи), определенная на момент его признания отдельным объектом бухгалтерского учета, не может быть
      выше балансовой стоимости объекта нематериальных активов.
  - path: '15'
    parent_path: null
    heading: Оценка
    text: 'После признания объект нематериальных активов оценивается в бухгалтерском учете одним из следующих
      способов:'
  - path: 15.а
    parent_path: '15'
    heading: null
    text: по первоначальной стоимости;
  - path: 15.б
    parent_path: '15'
    heading: null
    text: по переоцененной стоимости.
  - path: 15.заключение
    parent_path: '15'
    heading: null
    text: Выбранный способ оценки нематериальных активов применяется ко всей группе нематериальных активов.
  - path: '16'
    parent_path: null
    heading: Оценка
    text: При оценке нематериальных активов по первоначальной стоимости такая стоимость и сумма накопленной
      амортизации не подлежат изменению, за исключением случаев, установленных настоящим Стандартом.
  - path: '17'
    parent_path: null
    heading: Оценка
    text: Способ оценки по переоцененной стоимости может применяться для оценки нематериальных активов,
      для которых существует активный рынок. Для целей настоящего Стандарта активный рынок определяется
      в соответствии с Международным стандартом финансовой отчетности (IAS) 38 «Нематериальные активы»,
      введенным в действие на территории Российской Федерации приказом № 217н .
  - path: '18'
    parent_path: null
    heading: Оценка
    text: Способ оценки по переоцененной стоимости не применяется для оценки средств индивидуализации,
      разрешений (лицензий) на осуществление отдельных видов деятельности.
  - path: '19'
    parent_path: null
    heading: Оценка
    text: При оценке нематериальных активов по переоцененной стоимости стоимость объекта нематериальных
      активов регулярно переоценивается таким образом, чтобы она была равна или не отличалась существенно
      от его справедливой стоимости, определяемой с использованием данных активного рынка. Для целей настоящего
      Стандарта справедливая стоимость определяется в порядке, предусмотренном Международным стандартом
      финансовой отчетности (IFRS) 13 «Оценка справедливой стоимости», введенным в действие на территории
      Российской Федерации приказом № 217н .
  - path: '20'
    parent_path: null
    heading: Оценка
    text: Относящийся к группе переоцениваемых нематериальных активов объект, для которого справедливая
      стоимость не может быть определена из-за отсутствия активного рынка, оценивается по первоначальной
      стоимости.
  - path: '21'
    parent_path: null
    heading: Оценка
    text: Периодичность переоценки нематериальных активов определяется организацией для каждой группы
      переоцениваемых нематериальных активов исходя из того, в какой степени справедливая стоимость таких
      нематериальных активов подвержена изменениям. Если организация решает проводить переоценку нематериальных
      активов не чаще одного раза в год, то переоценка проводится по состоянию на конец соответствующего
      отчетного года.
  - path: '22'
    parent_path: null
    heading: Оценка
    text: Переоценка объектов нематериальных активов проводится путем пересчета их первоначальной стоимости
      и накопленной амортизации таким образом, чтобы балансовая стоимость объекта нематериальных активов
      после переоценки равнялась его справедливой стоимости. Допустимым является также способ проведения
      переоценки объектов нематериальных активов, при котором сначала первоначальная стоимость объекта
      нематериальных активов уменьшается на сумму амортизации, накопленной по нему до даты переоценки,
      а затем полученная сумма пересчитывается таким образом, чтобы она стала равной справедливой стоимости
      этого объекта нематериальных активов.
  - path: '23'
    parent_path: null
    heading: Оценка
    text: В случае утраты возможности определять справедливую стоимость учитываемого по переоцененной
      стоимости в соответствии с пунктом 17 настоящего Стандарта объекта нематериальных активов его балансовой
      стоимостью признается переоцененная стоимость на дату последней переоценки за вычетом последующей
      накопленной амортизации и последующего накопленного обесценения. При восстановлении впоследствии
      такой возможности организация возобновляет применение способа оценки по переоцененной стоимости,
      начиная с периода, в котором такая возможность была восстановлена.
  - path: '24'
    parent_path: null
    heading: Оценка
    text: 'Сумма дооценки нематериальных активов:'
  - path: 24.а
    parent_path: '24'
    heading: null
    text: отражается в составе совокупного финансового результата периода, в котором проведена переоценка
      нематериальных активов, обособленно без включения в прибыль (убыток) этого периода, за исключением
      той части, в которой эта дооценка восстанавливает суммы уценки и (или) обесценения таких нематериальных
      активов, признанные в прошлые периоды расходом в составе прибыли (убытка);
  - path: 24.б
    parent_path: '24'
    heading: null
    text: в той части, в которой эта дооценка восстанавливает суммы уценки и (или) обесценения таких нематериальных
      активов, признанные в прошлые периоды расходом в составе прибыли (убытка), признается доходом в
      составе прибыли (убытка) периода, в котором проведена переоценка нематериальных активов.
  - path: '25'
    parent_path: null
    heading: Оценка
    text: 'Сумма уценки нематериальных активов:'
  - path: 25.а
    parent_path: '25'
    heading: null
    text: признается расходом в составе прибыли (убытка) периода, в котором проведена переоценка нематериальных
      активов, за исключением той части, в которой эта уценка уменьшает суммы дооценки таких нематериальных
      активов, отраженные в составе совокупного финансового результата в прошлые периоды без включения
      в прибыль (убыток) периода, в котором проведена уценка нематериальных активов.
  - path: 25.б
    parent_path: '25'
    heading: null
    text: в той части, в которой эта уценка уменьшает признанные в таком же порядке в прошлые периоды
      суммы дооценки таких нематериальных активов отражается в составе совокупного финансового результата
      периода, в котором проведена уценка нематериальных активов, обособленно без включения в прибыль
      (убыток) этого периода.
  - path: '26'
    parent_path: null
    heading: Оценка
    text: 'Суммы переоценки нематериальных активов, отраженные в составе совокупного финансового результата
      без включения в прибыль (убыток), формируют показатель накопленной дооценки таких нематериальных
      активов. Первоначально накопленная дооценка отражается обособленно в составе капитала в бухгалтерском
      балансе организации. Впоследствии накопленная дооценка списывается на нераспределенную прибыль организации
      одним из следующих способов:'
  - path: 26.а
    parent_path: '26'
    heading: null
    text: единовременно при списании объекта нематериальных активов, по которому была накоплена дооценка;
  - path: 26.б
    parent_path: '26'
    heading: null
    text: по мере начисления амортизации по объекту нематериальных активов. В этом случае подлежащая списанию
      часть накопленной дооценки представляет собой положительную разницу между суммой амортизации за
      период, рассчитанной исходя из первоначальной стоимости объекта нематериальных активов с учетом
      последней переоценки, и суммой амортизации за этот же период, рассчитанной исходя из первоначальной
      стоимости объекта нематериальных активов без учета переоценок.
  - path: 26.заключение
    parent_path: '26'
    heading: null
    text: Принятый организацией способ списания накопленной дооценки применяется в отношении всех нематериальных
      активов.
  - path: '27'
    parent_path: null
    heading: Оценка
    text: Последствия изменения способа последующей оценки нематериальных активов отражаются перспективно
      (без пересчета данных за предыдущие периоды).
  - path: '28'
    parent_path: null
    heading: Оценка
    text: Первоначальная стоимость объекта нематериальных активов увеличивается на сумму капитальных вложений,
      связанных с улучшением (повышением) первоначально принятых нормативных показателей функционирования
      этого объекта, в момент завершения таких капитальных вложений.
  - path: '29'
    parent_path: null
    heading: Оценка
    text: В бухгалтерском балансе нематериальные активы отражаются по балансовой стоимости, которая представляет
      собой их первоначальную (переоцененную) стоимость, уменьшенную на суммы накопленной амортизации
      и накопленного обесценения.
  - path: '30'
    parent_path: null
    heading: Амортизация
    text: Для каждого объекта нематериальных активов организация определяет срок полезного использования.
      Для целей настоящего Стандарта сроком полезного использования считается период, в течение которого
      использование объекта нематериальных активов будет приносить экономические выгоды (доход) организации.
      Для отдельных объектов нематериальных активов срок полезного использования определяется исходя из
      количества продукции (объема работ (услуг) в натуральном выражении), которое организация ожидает
      получить от использования такого объекта нематериальных активов.
  - path: '31'
    parent_path: null
    heading: Амортизация
    text: 'Срок полезного использования объекта нематериальных активов определяется исходя из:'
  - path: 31.а
    parent_path: '31'
    heading: null
    text: срока действия прав организации на результаты интеллектуальной деятельности, средства индивидуализации;
  - path: 31.б
    parent_path: '31'
    heading: null
    text: срока действия специального разрешения (лицензии) на осуществление отдельных видов деятельности;
  - path: 31.в
    parent_path: '31'
    heading: null
    text: ожидаемого периода использования объекта нематериальных активов с учетом нормативных, договорных
      и других ограничений использования, намерений руководства организации в отношении использования
      такого объекта;
  - path: 31.г
    parent_path: '31'
    heading: null
    text: ожидаемого морального устаревания, например, в результате изменения или усовершенствования производственного
      процесса или в результате изменения рыночного спроса на продукцию, работы, услуги, производимые
      с использованием нематериального актива;
  - path: 31.д
    parent_path: '31'
    heading: null
    text: срока полезного использования иного актива, с которым объект нематериальных активов непосредственно
      связан (например, срока полезного использования материального носителя (вещи), в которой выражены
      результаты интеллектуальной деятельности, средства индивидуализации);
  - path: 31.е
    parent_path: '31'
    heading: null
    text: других факторов, влияющих на использование объекта нематериальных активов организацией.
  - path: '32'
    parent_path: null
    heading: Амортизация
    text: Стоимость нематериальных активов погашается посредством амортизации, если иное не установлено
      настоящим Стандартом.
  - path: '33'
    parent_path: null
    heading: Амортизация
    text: Не подлежат амортизации объекты нематериальных активов с неопределенным сроком полезного использования,
      то есть объекты, по которым невозможно надежно определить срок полезного использования. Организация
      проверяет такие нематериальные активы на возможность определения срока полезного использования ежегодно
      в конце отчетного периода, а также при наступлении фактов, свидетельствующих о появлении такой возможности.
      Амортизация таких нематериальных активов начинает начисляться с периода, в котором стало возможным
      надежно определить срок полезного использования.
  - path: '34'
    parent_path: null
    heading: Амортизация
    text: Начисление амортизации нематериальных активов производится независимо от результатов деятельности
      организации в отчетном периоде.
  - path: '35'
    parent_path: null
    heading: Амортизация
    text: Начисление амортизации нематериальных активов не приостанавливается (в том числе в случаях временного
      прекращения использования объекта нематериальных активов), за исключением случая, когда ликвидационная
      стоимость объекта нематериальных активов становится равной или превышает его балансовую стоимость.
      Если впоследствии ликвидационная стоимость такого объекта нематериальных активов становится меньше
      его балансовой стоимости, начисление амортизации по нему возобновляется. Для целей настоящего Стандарта
      ликвидационной стоимостью объекта нематериальных активов считается величина, которую организация
      получила бы в случае выбытия данного объекта после вычета предполагаемых затрат на выбытие; причем
      объект нематериальных активов рассматривается таким образом, как если бы он уже достиг окончания
      срока полезного использования и находился в состоянии, характерном для конца срока полезного использования.
  - path: '36'
    parent_path: null
    heading: Амортизация
    text: 'Ликвидационная стоимость объекта нематериальных активов считается равной нулю, за исключением
      случаев, когда:'
  - path: 36.а
    parent_path: '36'
    heading: null
    text: договором предусмотрена обязанность другого лица купить у организации объект нематериальных
      активов в конце срока его полезного использования;
  - path: 36.б
    parent_path: '36'
    heading: null
    text: существует активный рынок для такого объекта, с использованием данных которого можно определить
      его ликвидационную стоимость;
  - path: 36.в
    parent_path: '36'
    heading: null
    text: существует высокая вероятность того, что активный рынок для такого объекта будет существовать
      в конце срока его полезного использования.
  - path: '37'
    parent_path: null
    heading: Амортизация
    text: Сумма амортизации объекта нематериальных активов за отчетный период определяется таким образом,
      чтобы к концу срока амортизации балансовая стоимость этого объекта стала равной его ликвидационной
      стоимости.
  - path: '38'
    parent_path: null
    heading: Амортизация
    text: 'Начисление амортизации объекта нематериальных активов:'
  - path: 38.а
    parent_path: '38'
    heading: null
    text: начинается с даты его признания в бухгалтерском учете. По решению организации допускается начинать
      начисление амортизации с первого числа месяца, следующего за месяцем признания объекта нематериальных
      активов в бухгалтерском учете;
  - path: 38.б
    parent_path: '38'
    heading: null
    text: прекращается с момента его списания с бухгалтерского учета. По решению организации допускается
      прекращать начисление амортизации с первого числа месяца, следующего за месяцем списания объекта
      нематериальных активов с бухгалтерского учета.
  - path: '39'
    parent_path: null
    heading: Амортизация
    text: 'Способ начисления амортизации выбирается организацией для каждой группы нематериальных активов
      в соответствии с пунктами 40 и 41 настоящего Стандарта. При этом выбранный способ начисления амортизации
      должен:'
  - path: 39.а
    parent_path: '39'
    heading: null
    text: наиболее точно отражать распределение во времени ожидаемых к получению будущих экономических
      выгод от использования группы нематериальных активов;
  - path: 39.б
    parent_path: '39'
    heading: null
    text: применяться последовательно от одного отчетного периода к другому, за исключением случаев, когда
      меняется распределение во времени ожидаемых к получению будущих экономических выгод от использования
      группы нематериальных активов.
  - path: '40'
    parent_path: null
    heading: Амортизация
    text: Амортизация нематериальных активов, срок полезного использования которых определяется периодом,
      в течение которого их использование будет приносить экономические выгоды организации, начисляется
      линейным способом или способом уменьшаемого остатка. Начисление амортизации линейным способом производится
      таким образом, чтобы подлежащая амортизации стоимость объекта нематериальных активов погашалась
      равномерно в течение всего срока полезного использования этого объекта. При этом сумма амортизации
      за отчетный период определяется как отношение разности между балансовой и ликвидационной стоимостью
      объекта нематериальных активов к величине оставшегося срока полезного использования данного объекта.
      Начисление амортизации способом уменьшаемого остатка производится таким образом, чтобы суммы амортизации
      объекта нематериальных активов за одинаковые периоды уменьшались по мере истечения срока полезного
      использования этого объекта. При этом организация самостоятельно определяет формулу расчета суммы
      амортизации за отчетный период, обеспечивающую систематическое уменьшение этой суммы в следующих
      периодах.
  - path: '41'
    parent_path: null
    heading: Амортизация
    text: Амортизация нематериальных активов, срок полезного использования которых определяется исходя
      из количества продукции (объема работ (услуг) в натуральном выражении), которое организация ожидает
      получить от использования объекта нематериальных активов, начисляется способом пропорционально количеству
      продукции (объему работ (услуг) в натуральном выражении). Начисление амортизации способом пропорционально
      количеству продукции (объему работ (услуг) в натуральном выражении) производится таким образом,
      чтобы распределить подлежащую амортизации стоимость объекта нематериальных активов на весь срок
      полезного использования этого объекта. При этом сумма амортизации за отчетный период определяется
      как произведение разности между балансовой и ликвидационной стоимостью объекта нематериальных активов
      на отношение показателя количества продукции (объема работ (услуг) в натуральном выражении) в отчетном
      периоде к оставшемуся сроку полезного использования объекта нематериальных активов. При применении
      способа пропорционально количеству продукции (объему работ (услуг) в натуральном выражении) не допускается
      определять сумму амортизации за отчетный период на основе величины поступлений (выручки или иного
      аналогичного показателя) от продажи продукции (работ, услуг), производимой (выполняемых, оказываемых)
      с использованием данного объекта нематериальных активов, за исключением случая, когда возможность
      получения экономических выгод от использования объекта нематериальных активов юридически обусловлена
      таким показателем.
  - path: '42'
    parent_path: null
    heading: Амортизация
    text: Срок полезного использования, ликвидационная стоимость и способ начисления амортизации (далее
      – элементы амортизации) объекта нематериальных активов определяются при признании этого объекта
      в бухгалтерском учете. Элементы амортизации объекта нематериальных активов подлежат проверке на
      соответствие условиям использования объекта нематериальных активов. Такая проверка проводится в
      конце каждого отчетного года, а также при наступлении обстоятельств, свидетельствующих о возможном
      изменении элементов амортизации. По результатам такой проверки при необходимости организация принимает
      решение об изменении соответствующих элементов амортизации. Возникшие в связи с этим корректировки
      отражаются в бухгалтерском учете как изменения оценочных значений.
  - path: '43'
    parent_path: null
    heading: Амортизация
    text: Организация проверяет нематериальные активы на обесценение и учитывает изменение их балансовой
      стоимости вследствие обесценения в порядке, предусмотренном Международным стандартом финансовой
      отчетности (IAS) 36 «Обесценение активов», введенным в действие на территории Российской Федерации
      приказом № 217н (далее - МСФО (IAS) 36) .
  - path: '44'
    parent_path: null
    heading: Амортизация
    text: В бухгалтерском учете суммы накопленной амортизации и накопленного обесценения отражаются отдельно
      от первоначальной стоимости (переоцененной стоимости) объекта нематериальных активов и не изменяют
      ее.
  - path: '45'
    parent_path: null
    heading: Списание
    text: 'Объект нематериальных активов, который выбывает или не способен приносить экономические выгоды
      в будущем, списывается с бухгалтерского учета. Списание объекта нематериальных активов обусловливается,
      например:'
  - path: 45.а
    parent_path: '45'
    heading: null
    text: истечением срока действия прав на результаты интеллектуальной деятельности, средства индивидуализации;
  - path: 45.б
    parent_path: '45'
    heading: null
    text: прекращением использования объекта нематериальных активов вследствие его морального устаревания
      при отсутствии перспектив продажи или возобновления использования;
  - path: 45.в
    parent_path: '45'
    heading: null
    text: отчуждением исключительных прав на объект нематериальных активов другому лицу в связи с продажей,
      меной, передачей в виде вклада в капитал другой организации, передачей в некоммерческую организацию;
  - path: 45.г
    parent_path: '45'
    heading: null
    text: выбытием материального носителя (вещи), в котором выражены результаты интеллектуальной деятельности,
      средства индивидуализации, признанные объектом нематериальных активов, в связи с утратой, стихийным
      бедствием, пожаром, аварией и другими чрезвычайными ситуациями, приводящими к невозможности дальнейшего
      использования объекта нематериальных активов;
  - path: 45.д
    parent_path: '45'
    heading: null
    text: прекращением организацией деятельности, в которой использовался объект нематериальных активов,
      при отсутствии возможности его использования в продолжающейся деятельности, в том числе в связи
      с истечением срока действия специального разрешения (лицензии) на осуществление отдельных видов
      деятельности.
  - path: 45.заключение
    parent_path: '45'
    heading: null
    text: Объект нематериальных активов, предоставленный организацией, являющейся правообладателем (лицензиаром),
      в пользование при сохранении у организации прав на него, с бухгалтерского учета не списывается при
      условии соответствия такого объекта признакам, установленным пунктом 4 настоящего Стандарта.
  - path: '46'
    parent_path: null
    heading: Списание
    text: Объект нематериальных активов подлежит списанию в том отчетном периоде, в котором он выбывает,
      или становится неспособным приносить организации экономические выгоды в будущем.
  - path: '47'
    parent_path: null
    heading: Списание
    text: При списании объекта нематериальных активов суммы накопленной амортизации и накопленного обесценения
      относятся в уменьшение его первоначальной (переоцененной) стоимости.
  - path: '48'
    parent_path: null
    heading: Списание
    text: Разница между суммой балансовой стоимости списываемого объекта нематериальных активов и затрат
      на его выбытие, с одной стороны, и поступлениями от выбытия этого объекта, с другой стороны, признается
      доходом или расходом в составе прибыли (убытка) периода, в котором списывается объект нематериальных
      активов.
  - path: '49'
    parent_path: null
    heading: Раскрытие информации в отчетности
    text: 'В бухгалтерской (финансовой) отчетности раскрывается с учетом существенности следующая информация:'
  - path: 49.а
    parent_path: '49'
    heading: null
    text: балансовая стоимость нематериальных активов на начало и конец отчетного периода;
  - path: 49.б
    parent_path: '49'
    heading: null
    text: сверка остатков нематериальных активов по группам в разрезе первоначальной (переоцененной) стоимости,
      накопленной амортизации и накопленного обесценения на начало и конец отчетного периода, и движения
      нематериальных активов за отчетный период (поступление, выбытие, переклассификация в долгосрочные
      активы к продаже, изменение стоимости в результате переоценки, амортизация, обесценение, другие
      изменения);
  - path: 49.в
    parent_path: '49'
    heading: null
    text: балансовая стоимость амортизируемых и неамортизируемых нематериальных активов с указанием причин
      невозможности надежного определения срока полезного использования неамортизируемых активов;
  - path: 49.г
    parent_path: '49'
    heading: null
    text: результат от списания нематериальных активов за отчетный период;
  - path: 49.д
    parent_path: '49'
    heading: null
    text: результат обесценения нематериальных активов и восстановления обесценения, включенный в расходы
      или доходы отчетного периода;
  - path: 49.е
    parent_path: '49'
    heading: null
    text: результат переоценки нематериальных активов, включенный в доходы или расходы отчетного периода;
  - path: 49.ж
    parent_path: '49'
    heading: null
    text: результат переоценки нематериальных активов, включенный в капитал в отчетном периоде;
  - path: 49.з
    parent_path: '49'
    heading: null
    text: сумма обесценения нематериальных активов, отнесенного в отчетном периоде на уменьшение накопленного
      результата переоценки;
  - path: 49.и
    parent_path: '49'
    heading: null
    text: балансовая стоимость нематериальных активов, в отношении которых имеются ограничения имущественных
      прав организации, в том числе нематериальных активов, находящихся в залоге, на отчетную дату;
  - path: 49.к
    parent_path: '49'
    heading: null
    text: способы оценки нематериальных активов (по группам);
  - path: 49.л
    parent_path: '49'
    heading: null
    text: элементы амортизации нематериальных активов и их изменения;
  - path: 49.м
    parent_path: '49'
    heading: null
    text: наименование, балансовая стоимость, оставшийся срок полезного использования и иная информация
      в отношении объектов нематериальных активов, без знания которой заинтересованными пользователями
      невозможна оценка финансового положения организации или финансовых результатов ее деятельности;
  - path: 49.н
    parent_path: '49'
    heading: null
    text: величина затрат на создание собственными силами организации средств индивидуализации и иная
      информация (например, рыночная стоимость) о таких средствах индивидуализации, без знания которой
      заинтересованными пользователями невозможна оценка финансового положения организации или финансовых
      результатов ее деятельности.
  - path: 49.заключение
    parent_path: '49'
    heading: null
    text: Информация о нематериальных активах, предусмотренная подпунктами «а» - «в» и «к» настоящего
      пункта, раскрывается в отношении нематериальных активов, созданных организацией, обособленно.
  - path: '50'
    parent_path: null
    heading: Раскрытие информации в отчетности
    text: 'В отношении нематериальных активов, оцениваемых по переоцененной стоимости, в дополнение к
      информации, раскрываемой в бухгалтерской (финансовой) отчетности, указанной в пункте 49 настоящего
      Стандарта, раскрывается следующая информация по группам таких нематериальных активов:'
  - path: 50.а
    parent_path: '50'
    heading: null
    text: дата проведения последней переоценки нематериальных активов;
  - path: 50.б
    parent_path: '50'
    heading: null
    text: балансовая стоимость нематериальных активов, оцененных по переоцененной стоимости;
  - path: 50.в
    parent_path: '50'
    heading: null
    text: балансовая стоимость нематериальных активов, оцененных по переоцененной стоимости, которая была
      бы отражена в бухгалтерской (финансовой) отчетности при оценке их по первоначальной стоимости, на
      отчетную дату;
  - path: 50.г
    parent_path: '50'
    heading: null
    text: сумма накопленной дооценки нематериальных активов, не списанная на нераспределенную прибыль
      организации, с указанием способа списания накопленной дооценки на нераспределенную прибыль организации.
  - path: '51'
    parent_path: null
    heading: Раскрытие информации в отчетности
    text: Организация раскрывает предусмотренную МСФО (IAS) 36 информацию об обесценении нематериальных
      активов.
  - path: '52'
    parent_path: null
    heading: Изменение учетной политики
    text: Последствия изменений учетной политики в связи с началом применения настоящего Стандарта отражаются
      ретроспективно (как если бы настоящий Стандарт применялся с момента возникновения затрагиваемых
      им фактов хозяйственной жизни), если иное не установлено настоящим Стандартом.
  - path: '53'
    parent_path: null
    heading: Изменение учетной политики
    text: 'В бухгалтерской (финансовой) отчетности организации, начиная с которой применяется настоящий
      Стандарт, допускается не пересчитывать сравнительные показатели за периоды, предшествующие отчетному.
      В этом случае:'
  - path: 53.а
    parent_path: '53'
    heading: null
    text: в отношении объектов бухгалтерского учета, которые в соответствии с настоящим Стандартом должны
      быть признаны в бухгалтерском учете как нематериальные активы и в соответствии с ранее применявшейся
      учетной политикой учитывались в составе нематериальных активов, организация должна на начало отчетного
      периода (конец периода, предшествующего отчетному) определить оставшийся срок полезного использования
      и ликвидационную стоимость объектов нематериальных активов в соответствии с настоящим Стандартом.
      Возникшие в связи с этим корректировки величин, отражающих погашение стоимости объектов нематериальных
      активов, отражаются в бухгалтерском учете как изменения оценочных значений. При этом балансовая
      стоимость таких объектов нематериальных активов на начало отчетного периода (конец периода, предшествующего
      отчетному) не корректируется;
  - path: 53.б
    parent_path: '53'
    heading: null
    text: в отношении объектов бухгалтерского учета, которые в соответствии с настоящим Стандартом должны
      быть признаны в бухгалтерском учете как нематериальные активы, но в соответствии с ранее применявшейся
      учетной политикой учитывались в составе активов других видов, организация должна на начало отчетного
      периода (конец периода, предшествующего отчетному) переклассифицировать их в нематериальные активы,
      признать в качестве их первоначальной стоимости балансовую стоимость соответствующего объекта бухгалтерского
      учета на момент его переклассификации и определить оставшийся срок полезного использования, способ
      начисления амортизации и ликвидационную стоимость объектов нематериальных активов в соответствии
      с настоящим Стандартом. Определенные в связи с этим величины погашения стоимости объектов нематериальных
      активов отражаются в бухгалтерском учете как изменения оценочных значений;
  - path: 53.в
    parent_path: '53'
    heading: null
    text: в отношении объектов бухгалтерского учета, которые в соответствии с ранее применявшейся учетной
      политикой учитывались в составе нематериальных активов, но в соответствии с настоящим Стандартом
      таковыми не являются, организация должна на начало отчетного периода (конец периода, предшествующего
      отчетному) списать балансовую стоимость таких объектов в порядке единовременной корректировки на
      нераспределенную прибыль организации, за исключением случаев переклассификации таких объектов в
      другой вид активов.
  - path: '54'
    parent_path: null
    heading: Изменение учетной политики
    text: Изменения балансовой стоимости нематериальных активов в связи с началом применения настоящего
      Стандарта, которые не связаны с изменениями других статей бухгалтерского баланса, списываются на
      нераспределенную прибыль организации.
  - path: '55'
    parent_path: null
    heading: Изменение учетной политики
    text: Организация, которая вправе применять упрощенные способы ведения бухгалтерского учета, включая
      упрощенную бухгалтерскую (финансовую) отчетность, может начать применять настоящий Стандарт перспективно
      (только в отношении фактов хозяйственной жизни, имевших место после начала применения настоящего
      Стандарта, без изменения сформированных ранее данных бухгалтерского учета).
  - path: '56'
    parent_path: null
    heading: Изменение учетной политики
    text: Организация раскрывает выбранный ею способ отражения последствий изменения учетной политики
      в связи с началом применения настоящего Стандарта и последствия изменения учетной политики, соответствующие
      выбранному способу отражения их, в своей первой бухгалтерской (финансовой) отчетности, составленной
      с применением настоящего Стандарта.
