id: pbu-8-2010
kind: ПБУ
number: 8/2010
year: 2010
title: Оценочные обязательства, условные обязательства и условные активы
order_date: 2010-12-13
order_no: 167н
effective_from: &id001 2011-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает порядок отражения оценочных обязательств, условных обязательств
      и условных активов в бухгалтерском учете и отчетности организаций (за исключением кредитных организаций,
      государственных (муниципальных) учреждений), являющихся юридическими лицами по законодательству
      Российской Федерации (далее - организации). (в ред. приказа Минфина России от 14.02.2012 № 23н)
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: 'Настоящее Положение не применяется в отношении:'
  - path: 2.а
    parent_path: '2'
    heading: null
    text: договоров, по которым по состоянию на отчетную дату хотя бы одна сторона договора не выполнила
      полностью своих обязательств, за исключением трудовых договоров, а также договоров, неизбежные расходы
      на исполнение которых превосходят поступления, ожидаемые от их исполнения (далее - заведомо убыточные
      договоры). Не является заведомо убыточным договор, исполнение которого может быть прекращено организацией
      в одностороннем порядке без существенных санкций; (в ред. приказа Минфина России от 14.02.2012 №
      23н)
  - path: 2.б
    parent_path: '2'
    heading: null
    text: резервного капитала, резервов, формируемых из нераспределенной прибыли организации;
  - path: 2.в
    parent_path: '2'
    heading: null
    text: оценочных резервов;
  - path: 2.г
    parent_path: '2'
    heading: null
    text: учитываемых в соответствии с Положением по бухгалтерскому учету «Учет расчетов по налогу на
      прибыль организаций» ПБУ 18/02, утвержденным приказом Министерства финансов Российской Федерации
      от 19 ноября 2002 г. № 114н (зарегистрирован в Министерстве юстиции Российской Федерации 31 декабря
      2002 г., регистрационный № 4090) с изменениями, внесенными приказами Министерства финансов Российской
      Федерации от 11 февраля 2008 г. № 23н «О внесении изменений в приказ Министерства финансов Российской
      Федерации от 19 ноября 2002 г. № 114н» (зарегистрирован в Министерстве юстиции Российской Федерации
      3 марта 2008 г., регистрационный № 11274), от 25 октября 2010 г. № 132н «О внесении изменений в
      нормативные правовые акты по бухгалтерскому учету» (зарегистрирован в Министерстве юстиции Российской
      Федерации 25 ноября 2010 г., регистрационный № 19048) (далее - Положение по бухгалтерскому учету
      «Учет расчетов по налогу на прибыль организаций» ПБУ 18/02), сумм, которые оказывают влияние на
      величину налога на прибыль организаций, подлежащего уплате в следующем за отчетным или в последующих
      отчетных периодах.
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение может не применяться организациями, которые вправе применять упрощенные
      способы ведения бухгалтерского учета, включая упрощенную бухгалтерскую (финансовую) отчетность.
      (в ред. приказов Минфина России от 27.04.2012 № 55н, от 06.04.2015 № 57н)
  - path: '4'
    parent_path: null
    heading: Признание оценочного обязательства, отражение информации об условном обязательстве и условном
      активе
    text: 'Обязательство организации с неопределенной величиной и (или) сроком исполнения (далее - оценочное
      обязательство) может возникнуть:'
  - path: 4.а
    parent_path: '4'
    heading: null
    text: из норм законодательных и иных нормативных правовых актов, судебных решений, договоров;
  - path: 4.б
    parent_path: '4'
    heading: null
    text: в результате действий организации, которые вследствие установившейся прошлой практики или заявлений
      организации указывают другим лицам, что организация принимает на себя определенные обязанности,
      и, как следствие, у таких лиц возникают обоснованные ожидания, что организация выполнит такие обязанности.
  - path: '5'
    parent_path: null
    heading: Признание оценочного обязательства, отражение информации об условном обязательстве и условном
      активе
    text: 'Оценочное обязательство признается в бухгалтерском учете при одновременном соблюдении следующих
      условий:'
  - path: 5.а
    parent_path: '5'
    heading: null
    text: у организации существует обязанность, явившаяся следствием прошлых событий ее хозяйственной
      жизни, исполнения которой организация не может избежать. В случае, когда у организации возникают
      сомнения в наличии такой обязанности, организация признает оценочное обязательство, если в результате
      анализа всех обстоятельств и условий, включая мнения экспертов, более вероятно, чем нет, что обязанность
      существует;
  - path: 5.б
    parent_path: '5'
    heading: null
    text: уменьшение экономических выгод организации, необходимое для исполнения оценочного обязательства,
      вероятно;
  - path: 5.в
    parent_path: '5'
    heading: null
    text: величина оценочного обязательства может быть обоснованно оценена.
  - path: '6'
    parent_path: null
    heading: Признание оценочного обязательства, отражение информации об условном обязательстве и условном
      активе
    text: Условия признания оценочного обязательства в отношении прошлого события хозяйственной жизни
      организации, не выполнявшиеся на одну отчетную дату, могут выполняться по состоянию на последующие
      отчетные даты, если вследствие изменений в законодательных и иных нормативных правовых актах и (или)
      действий организации и (или) других лиц у организации нет возможности избежать связанных с таким
      событием расчетов.
  - path: '7'
    parent_path: null
    heading: Признание оценочного обязательства, отражение информации об условном обязательстве и условном
      активе
    text: Уменьшение экономических выгод организации, необходимое для исполнения обязательства, признается
      вероятным, если более вероятно, чем нет, что такое уменьшение произойдет. Вероятность уменьшения
      экономических выгод оценивается по каждому обязательству в отдельности, за исключением случаев,
      когда по состоянию на отчетную дату существует несколько обязательств, однородных по характеру и
      порождаемой ими неопределенности, которые организация оценивает в совокупности. При этом, несмотря
      на то, что уменьшение экономических выгод организации по каждому отдельному обязательству может
      быть маловероятным, уменьшение экономических выгод в результате исполнения всей совокупности обязательств
      может быть достаточно вероятным. Примеры анализа обстоятельств с целью признания в бухгалтерском
      учете оценочного обязательства приведены в приложении N 1 к настоящему Положению.
  - path: '8'
    parent_path: null
    heading: Признание оценочного обязательства, отражение информации об условном обязательстве и условном
      активе
    text: Оценочные обязательства отражаются на счете учета резервов предстоящих расходов. При признании
      оценочного обязательства в зависимости от его характера величина оценочного обязательства относится
      на расходы по обычным видам деятельности или на прочие расходы либо включается в стоимость актива.
  - path: '9'
    parent_path: null
    heading: Признание оценочного обязательства, отражение информации об условном обязательстве и условном
      активе
    text: Условное обязательство возникает у организации вследствие прошлых событий ее хозяйственной жизни,
      когда существование у организации обязательства на отчетную дату зависит от наступления (ненаступления)
      одного или нескольких будущих неопределенных событий, не контролируемых организацией. К условным
      обязательствам относится также существующее на отчетную дату оценочное обязательство, не признанное
      в бухгалтерском учете вследствие невыполнения условий, предусмотренных подпунктами «б» и (или) «в»
      пункта 5 настоящего Положения.
  - path: '10'
    parent_path: null
    heading: Признание оценочного обязательства, отражение информации об условном обязательстве и условном
      активе
    text: В случае если организация имеет солидарное с другими лицами обязательство, оценочное обязательство
      признается в той части, в которой существует вероятность уменьшения экономических выгод организации,
      при соблюдении условий, предусмотренных пунктом 5 настоящего Положения. Часть солидарного с другими
      лицами обязательства, в отношении которого уменьшение экономических выгод организации не является
      вероятным, относится к условным обязательствам.
  - path: '11'
    parent_path: null
    heading: Признание оценочного обязательства, отражение информации об условном обязательстве и условном
      активе
    text: 'Оценочные обязательства признаются в связи с предстоящим осуществлением программы действий,
      запланированной и контролируемой руководством организации, существенно изменяющей направления деятельности
      организации, объемы хозяйственных операций или способы их осуществления (далее - предстоящая реструктуризация
      деятельности организации) при выполнении всех условий, установленных пунктом 5 настоящего Положения,
      с учетом особенностей, установленных настоящим пунктом. Обязанности по предстоящей реструктуризации
      деятельности организации являются существующими на отчетную дату, при одновременном соблюдении следующих
      условий:'
  - path: 11.а
    parent_path: '11'
    heading: null
    text: 'организация имеет детальный утвержденный в надлежащем порядке план предстоящей реструктуризации
      своей деятельности, определяющий, как минимум: затрагиваемую предстоящей реструктуризацией деятельность
      (или часть деятельности) организации и места ее осуществления; структурные подразделения, функции
      и примерное количество работников организации, которым будет выплачена компенсация в связи с прекращением
      трудовых отношений с ними; расходы, необходимые для проведения предстоящей реструктуризации деятельности
      организации; время начала исполнения плана предстоящей реструктуризации деятельности организации;'
  - path: 11.б
    parent_path: '11'
    heading: null
    text: организация своими действиями и (или) заявлениями создала у лиц, права которых затрагиваются
      предстоящей реструктуризацией деятельности организации, обоснованные ожидания, что план реструктуризации
      будет реализован в ближайшем будущем.
  - path: '12'
    parent_path: null
    heading: Признание оценочного обязательства, отражение информации об условном обязательстве и условном
      активе
    text: Оценочные обязательства в отношении ожидаемых убытков от деятельности организации в целом, либо
      от отдельных видов или регионов ее деятельности, подразделений, видов продукции (работ, услуг) и
      от иных факторов не признаются в бухгалтерском учете. Оценочные обязательства в отношении предстоящих
      расходов признаются только при выполнении всех условий, установленных пунктом 5 настоящего Положения.
  - path: '13'
    parent_path: null
    heading: Признание оценочного обязательства, отражение информации об условном обязательстве и условном
      активе
    text: Условный актив возникает у организации вследствие прошлых событий ее хозяйственной жизни, когда
      существование у организации актива на отчетную дату зависит от наступления (ненаступления) одного
      или нескольких будущих неопределенных событий, не контролируемых организацией.
  - path: '14'
    parent_path: null
    heading: Признание оценочного обязательства, отражение информации об условном обязательстве и условном
      активе
    text: Условные обязательства и условные активы не признаются в бухгалтерском учете. Информация об
      условных обязательствах и условных активах раскрывается в бухгалтерской отчетности в соответствии
      с настоящим Положением.
  - path: '15'
    parent_path: null
    heading: Определение величины оценочного обязательства
    text: Оценочное обязательство признается в бухгалтерском учете организации в величине, отражающей
      наиболее достоверную денежную оценку расходов, необходимых для расчетов по этому обязательству.
      Наиболее достоверная оценка расходов представляет собой величину, необходимую непосредственно для
      исполнения (погашения) обязательства по состоянию на отчетную дату или для перевода обязательства
      на другое лицо по состоянию на отчетную дату.
  - path: '16'
    parent_path: null
    heading: Определение величины оценочного обязательства
    text: Величина оценочного обязательства определяется организацией на основе имеющихся фактов хозяйственной
      жизни организации, опыта в отношении исполнения аналогичных обязательств, а также, при необходимости,
      мнений экспертов. Организация обеспечивает документальное подтверждение обоснованности такой оценки.
  - path: '17'
    parent_path: null
    heading: Определение величины оценочного обязательства
    text: 'При определении величины оценочного обязательства организация исходит из следующего:'
  - path: 17.а
    parent_path: '17'
    heading: null
    text: если величина оценочного обязательства определяется путем выбора из набора значений, то в качестве
      такой величины принимается средневзвешенная величина, которая рассчитывается как среднее из произведений
      каждого значения на его вероятность;
  - path: 17.б
    parent_path: '17'
    heading: null
    text: если величина оценочного обязательства определяется путем выбора из интервала значений и вероятность
      каждого значения в интервале равновелика, то в качестве такой величины принимается среднее арифметическое
      из наибольшего и наименьшего значений интервала.
  - path: 17.заключение
    parent_path: '17'
    heading: null
    text: Примеры определения величины оценочного обязательства приведены в приложении № 2 к настоящему
      Положению.
  - path: '18'
    parent_path: null
    heading: Определение величины оценочного обязательства
    text: 'При определении величины оценочного обязательства принимаются в расчет:'
  - path: 18.а
    parent_path: '18'
    heading: null
    text: последствия событий после отчетной даты в соответствии с Положением по бухгалтерскому учету
      «События после отчетной даты» (ПБУ 7/98), утвержденным приказом Министерства финансов Российской
      Федерации от 25 ноября 1998 г. № 56н (зарегистрирован в Министерстве юстиции Российской Федерации
      31 декабря 1998 г., регистрационный № 1674) с изменениями, внесенными приказом Министерства финансов
      Российской Федерации от 20 декабря 2007 г. № 143н (зарегистрирован в Министерстве юстиции Российской
      Федерации 21 января 2008 г., регистрационный № 10934);
  - path: 18.б
    parent_path: '18'
    heading: null
    text: риски и неопределенности, присущие этому оценочному обязательству;
  - path: 18.в
    parent_path: '18'
    heading: null
    text: будущие события, которые могут повлиять на величину оценочного обязательства (если существует
      достаточная вероятность того, что эти события произойдут).
  - path: '19'
    parent_path: null
    heading: Определение величины оценочного обязательства
    text: 'При определении величины оценочного обязательства не принимаются в расчет:'
  - path: 19.а
    parent_path: '19'
    heading: null
    text: суммы уменьшения или увеличения налога на прибыль организаций, которые отражаются в бухгалтерском
      учете и отчетности в соответствии с Положением по бухгалтерскому учету «Учет расчетов по налогу
      на прибыль организаций» ПБУ 18/02;
  - path: 19.б
    parent_path: '19'
    heading: null
    text: ожидаемые поступления от продажи основных средств, нематериальных активов, продукции, товаров
      и иных активов, связанные с признаваемым оценочным обязательством. Такие поступления отражаются
      в бухгалтерском учете организации в соответствии с Положением по бухгалтерскому учету «Доходы организации»
      ПБУ 9/99, утвержденным приказом Министерства финансов Российской Федерации от 6 мая 1999 г. № 32н
      (зарегистрирован в Министерстве юстиции Российской Федерации 31 мая 1999 г., регистрационный № 1791)
      с изменениями, внесенными приказами Министерства финансов Российской Федерации от 30 марта 2001
      г. № 27н «О внесении изменений и дополнений в нормативные правовые акты по бухгалтерскому учету»
      (зарегистрирован в Министерстве юстиции Российской Федерации 4 мая 2001 г., регистрационный № 2693),
      от 18 сентября 2006 г. № 116н «О внесении изменений в нормативные правовые акты по бухгалтерскому
      учету» (зарегистрирован в Министерстве юстиции Российской Федерации 24 октября 2006 г., регистрационный
      № 8397), от 27 ноября 2006 г. № 156н «О внесении изменений в нормативные правовые акты по бухгалтерскому
      учету» (зарегистрирован в Министерстве юстиции Российской Федерации 28 декабря 2006 г., регистрационный
      № 8698), от 25 октября 2010 г. № 132н «О внесении изменений в нормативные правовые акты по бухгалтерскому
      учету» (зарегистрирован в Министерстве юстиции Российской Федерации 25 ноября 2010 г., регистрационный
      № 19048); от 8 ноября 2010 г. № 144н "О внесении изменений в нормативные правовые акты по бухгалтерскому
      учету (зарегистрирован в Министерстве юстиции Российской Федерации 1 декабря 2010 г., регистрационный
      № 19088);
  - path: 19.в
    parent_path: '19'
    heading: null
    text: ожидаемые суммы встречных требований или суммы требований к другим лицам в возмещение расходов,
      которые организация, как ожидается, понесет при исполнении данного оценочного обязательства.
  - path: 19.заключение
    parent_path: '19'
    heading: null
    text: В случае если у организации имеется уверенность в поступлении экономических выгод по встречным
      требованиям или требованиям к другим лицам при исполнении организацией соответствующего принятого
      к бухгалтерскому учету оценочного обязательства, такие требования признаются в бухгалтерском учете
      в качестве самостоятельного актива. Величина такого актива не должна превышать величину соответствующего
      оценочного обязательства. В бухгалтерском балансе организации величина признанного оценочного обязательства
      не уменьшается на величину такого актива. В отчете о финансовых результатах организации расходы,
      отражаемые при признании оценочных обязательств, представляются за вычетом доходов, признаваемых
      при принятии к бухгалтерскому учету в качестве актива ожидаемых поступлений от встречных требований
      и требований к другим лицам. (в ред. приказа Минфина России от 06.04.2015 № 57н)
  - path: '20'
    parent_path: null
    heading: Определение величины оценочного обязательства
    text: 'В случае если предполагаемый срок исполнения оценочного обязательства превышает 12 месяцев
      после отчетной даты или меньший срок, установленный организацией в учетной политике, такое оценочное
      обязательство оценивается по стоимости, определяемой путем дисконтирования его величины, рассчитанной
      в соответствии с пунктами 16 - 19 настоящего Положения (далее - приведенная стоимость). Применяемая
      организацией ставка дисконтирования:'
  - path: 20.а
    parent_path: '20'
    heading: null
    text: должна отражать существующие на финансовом рынке условия, а также риски, специфичные для обязательства,
      лежащего в основе признаваемого оценочного обязательства;
  - path: 20.б
    parent_path: '20'
    heading: null
    text: не должна отражать суммы уменьшения или увеличения налога на прибыль организации, которые отражаются
      в бухгалтерском учете и отчетности в соответствии с Положением по бухгалтерскому учету «Учет расчетов
      по налогу на прибыль организаций» ПБУ 18/02, а также риски и неопределенности, которые были учтены
      при расчете будущих денежных выплат, вызванных оценочным обязательством, в соответствии с пунктами
      16 - 19 настоящего Положения.
  - path: 20.заключение
    parent_path: '20'
    heading: null
    text: Увеличение величины оценочного обязательства в связи с ростом его приведенной стоимости на последующие
      отчетные даты по мере приближения срока исполнения (проценты) признается прочим расходом организации.
      Пример определения приведенной стоимости оценочного обязательства приведен в приложении № 2 к настоящему
      Положению.
  - path: '21'
    parent_path: null
    heading: Списание, изменение величины оценочного обязательства
    text: В течение отчетного года при фактических расчетах по признанным оценочным обязательствам в бухгалтерском
      учете организации отражается сумма затрат организации, связанных с выполнением организацией этих
      обязательств, или соответствующая кредиторская задолженность в корреспонденции со счетом учета резерва
      предстоящих расходов. Признанное оценочное обязательство может списываться в счет отражения затрат
      или признания кредиторской задолженности по выполнению только того обязательства, по которому оно
      было создано, если иное не установлено настоящим Положением. В случае недостаточности суммы признанного
      оценочного обязательства затраты организации по погашению обязательства отражаются в бухгалтерском
      учете организации в общем порядке.
  - path: '22'
    parent_path: null
    heading: Списание, изменение величины оценочного обязательства
    text: В случае избыточности суммы признанного оценочного обязательства или в случае прекращения выполнения
      условий признания оценочного обязательства, установленных пунктом 5 настоящего Положения, неиспользованная
      сумма оценочного обязательства списывается с отнесением на прочие доходы организации, если иное
      не установлено настоящим пунктом. При погашении однородных оценочных обязательств, возникающих от
      повторяющихся хозяйственных операций обычной деятельности организации, ранее признанные избыточные
      суммы относятся на следующие по времени оценочные обязательства того же рода непосредственно при
      их признании (без списания ранее признанных избыточных сумм на прочие доходы организации).
  - path: '23'
    parent_path: null
    heading: Списание, изменение величины оценочного обязательства
    text: 'Обоснованность признания и величина оценочного обязательства подлежат проверке организацией
      в конце отчетного года, а также при наступлении новых событий, связанных с этим обязательством.
      По результатам такой проверки сумма оценочного обязательства может быть:'
  - path: 23.а
    parent_path: '23'
    heading: null
    text: увеличена в порядке, установленном для признания оценочного обязательства пунктом 8 настоящего
      Положения (без включения в стоимость актива), при получении дополнительной информации, позволяющей
      сделать уточнение величины оценочного обязательства;
  - path: 23.б
    parent_path: '23'
    heading: null
    text: уменьшена в порядке, установленном для списания оценочного обязательства пунктом 22 настоящего
      Положения, при получении дополнительной информации, позволяющей сделать уточнение величины оценочного
      обязательства;
  - path: 23.в
    parent_path: '23'
    heading: null
    text: остаться без изменения;
  - path: 23.г
    parent_path: '23'
    heading: null
    text: списана полностью в порядке, установленном пунктом 22 настоящего Положения, при получении дополнительной
      информации, позволяющей сделать вывод о прекращении выполнения условий признания оценочного обязательства,
      установленных пунктом 5 настоящего Положения.
  - path: '24'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'По каждому признанному в бухгалтерском учете оценочному обязательству в бухгалтерской отчетности
      организацией раскрывается в случае существенности, как минимум, следующая информация:'
  - path: 24.а
    parent_path: '24'
    heading: null
    text: величина, по которой оценочное обязательство отражено в бухгалтерском балансе организации, на
      начало и конец отчетного периода;
  - path: 24.б
    parent_path: '24'
    heading: null
    text: сумма оценочного обязательства, признанная в отчетном периоде;
  - path: 24.в
    parent_path: '24'
    heading: null
    text: сумма оценочного обязательства, списанная в счет отражения затрат или признания кредиторской
      задолженности в отчетном периоде;
  - path: 24.г
    parent_path: '24'
    heading: null
    text: списанная в отчетном периоде сумма оценочного обязательства в связи с ее избыточностью или прекращением
      выполнения условий признания оценочного обязательства;
  - path: 24.д
    parent_path: '24'
    heading: null
    text: увеличение величины оценочного обязательства в связи с ростом его приведенной стоимости за отчетный
      период (проценты);
  - path: 24.е
    parent_path: '24'
    heading: null
    text: характер обязательства и ожидаемый срок его исполнения;
  - path: 24.ж
    parent_path: '24'
    heading: null
    text: неопределенности, существующие в отношении срока исполнения и (или) величины оценочного обязательства;
  - path: 24.з
    parent_path: '24'
    heading: null
    text: ожидаемые суммы встречных требований или суммы требований к третьим лицам в возмещение расходов,
      которые организация понесет при исполнении обязательства, а также активы, признанные по таким требованиям
      в соответствии с пунктом 19 настоящего Положения.
  - path: '25'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'По каждому условному обязательству в бухгалтерской отчетности раскрывается, как минимум, следующая
      информация:'
  - path: 25.а
    parent_path: '25'
    heading: null
    text: характер условного обязательства;
  - path: 25.б
    parent_path: '25'
    heading: null
    text: оценочное значение или диапазон оценочных значений условного обязательства, если они поддаются
      определению;
  - path: 25.в
    parent_path: '25'
    heading: null
    text: неопределенности, существующие в отношении срока исполнения и (или) величины обязательства;
  - path: 25.г
    parent_path: '25'
    heading: null
    text: возможность поступлений в результате встречных требований или требований к третьим лицам в возмещение
      расходов, которые организация понесет при исполнении обязательства.
  - path: 25.заключение
    parent_path: '25'
    heading: null
    text: В случае если по состоянию на отчетную дату уменьшение экономических выгод организации вследствие
      условного обязательства является маловероятным, организация может не раскрывать указанную информацию.
  - path: '26'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: Информация об оценочных обязательствах и условных обязательствах может раскрываться по их однородным
      группам (например, оценочные обязательства в связи с выданными организацией гарантиями, судебными
      разбирательствами). Если оценочное обязательство и условное обязательство возникло в результате
      одних и тех же фактов хозяйственной жизни, взаимосвязь между соответствующими оценочным обязательством
      и условным обязательством должна быть раскрыта.
  - path: '27'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: В случае если поступление экономических выгод по условному активу является вероятным, организация
      должна раскрыть по состоянию на конец отчетного периода характер условного актива, а также его оценочное
      значение или диапазон оценочных значений, если они поддаются определению.
  - path: '28'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: В исключительных случаях, когда раскрытие информации об оценочных обязательствах, условных обязательствах
      и условных активах в объеме, предусмотренном настоящим Положением, наносит или может нанести ущерб
      организации в ходе урегулирования последствий лежащих в их основе обязательств и фактов, организация
      может не раскрывать такую информацию. В этом случае организация должна указать общий характер соответствующего
      оценочного обязательства, условного обязательства или условного актива и причины, по которым более
      подробная информация не раскрывается.
