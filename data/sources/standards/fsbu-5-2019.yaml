id: fsbu-5-2019
kind: ФСБУ
number: 5/2019
year: 2019
title: Запасы
order_date: 2019-11-15
order_no: 180н
effective_from: &id001 2021-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящий Стандарт устанавливает требования к формированию в бухгалтерском учете информации
      о запасах организаций.
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Настоящий Стандарт не применяется организациями бюджетной сферы. Настоящий Стандарт может не
      применяться микропредприятием за исключением микропредприятия, которое не вправе применять упрощенные
      способы ведения бухгалтерского учета, включая упрощенную бухгалтерскую (финансовую) отчетность.
      При этом затраты, которые в соответствии с настоящим Стандартом должны были бы включаться в стоимость
      запасов, признаются расходом периода, в котором были понесены. Организация может принять решение
      не применять настоящий Стандарт в отношении запасов, предназначенных для управленческих нужд. При
      этом затраты, которые в соответствии с настоящим Стандартом должны были бы включаться в стоимость
      запасов, признаются расходами периода, в котором были понесены. Указанное решение раскрывается в
      бухгалтерской (финансовой) отчетности организации.
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: 'Для целей бухгалтерского учета запасами считаются активы, потребляемые или продаваемые в рамках
      обычного операционного цикла организации, либо используемые в течение периода не более 12 месяцев.
      Запасами, в частности, являются:'
  - path: 3.а
    parent_path: '3'
    heading: null
    text: сырье, материалы, топливо, запасные части, комплектующие изделия, покупные полуфабрикаты, предназначенные
      для использования при производстве продукции, выполнении работ, оказании услуг;
  - path: 3.б
    parent_path: '3'
    heading: null
    text: инструменты, инвентарь, специальная одежда, специальная оснастка (специальные приспособления,
      специальные инструменты, специальное оборудование), тара и другие аналогичные объекты, используемые
      при производстве продукции, продаже товаров, выполнении работ, оказании услуг, за исключением случаев,
      когда указанные объекты считаются для целей бухгалтерского учета основными средствами;
  - path: 3.в
    parent_path: '3'
    heading: null
    text: готовая продукция (конечный результат производственного цикла, активы, законченные обработкой
      (комплектацией), технические и качественные характеристики которых соответствуют условиям договора
      или требованиям иных документов, в случаях, установленных законодательством), предназначенная для
      продажи в ходе обычной деятельности организации;
  - path: 3.г
    parent_path: '3'
    heading: null
    text: товары, приобретенные у других лиц и предназначенные для продажи в ходе обычной деятельности
      организации;
  - path: 3.д
    parent_path: '3'
    heading: null
    text: готовая продукция, товары, переданные другим лицам в связи с продажей до момента признания выручки
      от их продажи;
  - path: 3.е
    parent_path: '3'
    heading: null
    text: затраты, понесенные на производство продукции, не прошедшей всех стадий (фаз, переделов), предусмотренных
      технологическим процессом, изделия неукомплектованные, не прошедшие испытания и техническую приемку,
      а также затраты, понесенные на выполнение работ, оказание услуг другим лицам до момента признания
      выручки от их продажи (далее вместе - незавершенное производство). Организация может вести обособленный
      учет полуфабрикатов собственного производства в порядке, установленном для учета готовой продукции;
  - path: 3.ж
    parent_path: '3'
    heading: null
    text: объекты недвижимого имущества, приобретенные или созданные (находящиеся в процессе создания)
      для продажи в ходе обычной деятельности организации;
  - path: 3.з
    parent_path: '3'
    heading: null
    text: объекты интеллектуальной собственности, приобретенные или созданные (находящиеся в процессе
      создания) для продажи в ходе обычной деятельности организации.
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: 'Настоящий стандарт не распространяется на:'
  - path: 4.а
    parent_path: '4'
    heading: null
    text: финансовые активы, включая предназначенные для продажи;
  - path: 4.б
    parent_path: '4'
    heading: null
    text: материальные ценности других лиц, находящиеся у организации в связи с оказанием ею этим лицам
      услуг по закупке, хранению, транспортировке, доработке, переработке, сервисному обслуживанию, продаже
      по агентским договорам, договорам комиссии, складского хранения, транспортной экспедиции, подряда,
      поставки;
  - path: 4.в
    parent_path: '4'
    heading: null
    text: материальные ценности, полученные некоммерческой организацией для безвозмездной передачи гражданам
      или юридическим лицам.
  - path: '5'
    parent_path: null
    heading: Общие положения
    text: 'Запасы признаются в бухгалтерском учете при одновременном соблюдении следующих условий:'
  - path: 5.а
    parent_path: '5'
    heading: null
    text: затраты, понесенные в связи с приобретением или созданием запасов, обеспечат получение в будущем
      экономических выгод организацией (достижение некоммерческой организацией целей, ради которых она
      создана);
  - path: 5.б
    parent_path: '5'
    heading: null
    text: определена сумма затрат, понесенных в связи с приобретением или созданием запасов, или приравненная
      к ней величина.
  - path: '6'
    parent_path: null
    heading: Общие положения
    text: Единица учета запасов устанавливается организацией самостоятельно таким образом, чтобы обеспечить
      формирование полной и достоверной информации о запасах в бухгалтерском учете, а также надлежащий
      контроль наличия и движения их. В зависимости от вида запасов, характера и порядка приобретения
      (создания) и (или) потребления (продажи, использования) организация устанавливает единицей учета
      запасов номенклатурный номер, инвентарный номер, партию, однородную группу, отдельный объект или
      иную единицу. После признания запасов в бухгалтерском учете допускаются последующие изменения единиц
      их учета.
  - path: '7'
    parent_path: null
    heading: Общие положения
    text: Для целей бухгалтерского учета запасы подлежат классификации по видам исходя из их предназначения
      на каждом этапе операционного цикла организации.
  - path: '8'
    parent_path: null
    heading: Общие положения
    text: Организация должна обеспечить надлежащий контроль (в том числе с использованием забалансового
      учета) наличия и движения материальных ценностей, указанных в подпункте «б» пункта 4 настоящего
      Стандарта, а также переданных в производство (эксплуатацию) объектов, указанных в подпункте «б»
      пункта 3 настоящего Стандарта.
  - path: '9'
    parent_path: null
    heading: Оценка при признании
    text: Запасы признаются в бухгалтерском учете по фактической себестоимости, если иное не установлено
      настоящим Стандартом.
  - path: '10'
    parent_path: null
    heading: Оценка при признании
    text: В фактическую себестоимость запасов, кроме незавершенного производства и готовой продукции,
      включаются фактические затраты на приобретение (создание) запасов, приведение их в состояние и местоположение,
      необходимые для потребления, продажи или использования. Для целей настоящего Стандарта затратами
      считается выбытие (уменьшение) активов организации или возникновение (увеличение) ее обязательств,
      связанных с приобретением (созданием) запасов. Не считается затратами предварительная оплата поставщику
      (подрядчику) до момента исполнения им своих договорных обязанностей предоставления запасов, выполнения
      работ, оказания услуг. В целях определения фактической себестоимости запасов к возникновению (увеличению)
      обязательств организации приравнивается увеличение капитала организации вследствие выпуска собственных
      долевых инструментов (эмиссия акций, увеличения уставного (складочного) капитала, уставного (паевого)
      фонда), безвозмездного получения имущества от акционеров, собственников, участников, учредителей
      организации (в том числе вследствие передачи государственного или муниципального имущества унитарному
      предприятию), а также увеличение целевого финансирования некоммерческой организации вследствие получения
      ею имущества в качестве целевого финансирования.
  - path: '11'
    parent_path: null
    heading: Оценка при признании
    text: 'В фактическую себестоимость запасов, в частности, включаются:'
  - path: 11.а
    parent_path: '11'
    heading: null
    text: уплаченные и (или) подлежащие уплате организацией поставщику (продавцу, подрядчику) при приобретении
      (создании) запасов суммы, определяемые с учетом пунктов 12, 13 настоящего Стандарта;
  - path: 11.б
    parent_path: '11'
    heading: null
    text: затраты на заготовку и доставку запасов до места их потребления (продажи, использования);
  - path: 11.в
    parent_path: '11'
    heading: null
    text: затраты по доведению запасов до состояния, в котором они пригодны к использованию в запланированных
      целях. Данные затраты включают затраты организации по доработке, сортировке, фасовке и улучшению
      технических характеристик запасов;
  - path: 11.г
    parent_path: '11'
    heading: null
    text: величина возникшего в связи с приобретением (созданием) запасов оценочного обязательства по
      демонтажу, утилизации запасов и восстановлению окружающей среды;
  - path: 11.д
    parent_path: '11'
    heading: null
    text: связанные с приобретением (созданием) запасов проценты, которые подлежат включению в стоимость
      инвестиционного актива;
  - path: 11.е
    parent_path: '11'
    heading: null
    text: иные затраты, связанные с приобретением (созданием) запасов.
  - path: '12'
    parent_path: null
    heading: Оценка при признании
    text: 'Суммы, уплаченные и (или) подлежащие уплате организацией при приобретении (создании) запасов,
      включаются в фактическую себестоимость запасов:'
  - path: 12.а
    parent_path: '12'
    heading: null
    text: за вычетом возмещаемых сумм налогов и сборов;
  - path: 12.б
    parent_path: '12'
    heading: null
    text: с учетом всех скидок, уступок, вычетов, премий, льгот, предоставляемых организации, вне зависимости
      от формы их предоставления.
  - path: '13'
    parent_path: null
    heading: Оценка при признании
    text: При приобретении запасов на условиях отсрочки (рассрочки) платежа на период, превышающий 12
      месяцев или установленный организацией меньший срок, в фактическую себестоимость запасов включается
      сумма денежных средств, которая была бы уплачена организацией при отсутствии указанной отсрочки
      (рассрочки). Разница между указанной суммой и номинальной величиной денежных средств, подлежащих
      уплате в будущем, учитывается в порядке аналогичном порядку, установленному Положением по бухгалтерскому
      учету «Учет расходов по займам и кредитам» (ПБУ 15/2008), утвержденным приказом Министерства финансов
      Российской Федерации от 6 октября 2008 г. № 107н (зарегистрирован Министерством юстиции Российской
      Федерации 27 октября 2008 г, регистрационный № 12523).
  - path: '14'
    parent_path: null
    heading: Оценка при признании
    text: При приобретении запасов по договорам, предусматривающим исполнение обязательств (оплату) полностью
      или частично неденежными средствами, затратами, включаемыми в фактическую себестоимость запасов
      (в части оплаты неденежными средствами), считается справедливая стоимость передаваемого имущества,
      имущественных прав, работ, услуг. Для целей настоящего Стандарта справедливая стоимость определяется
      в порядке, предусмотренном Международным стандартом финансовой отчетности (IFRS) 13 «Оценка справедливой
      стоимости», введенным в действие на территории Российской Федерации приказом Министерства финансов
      Российской Федерации от 28 декабря 2015 г. № 217н (зарегистрирован Министерством юстиции Российской
      Федерации 2 февраля 2016 г., регистрационный № 40940). При невозможности определения справедливой
      стоимости передаваемого имущества, имущественных прав, работ, услуг затратами, включаемыми в фактическую
      себестоимость запасов, считается справедливая стоимость запасов. При невозможности определения справедливой
      стоимости передаваемого имущества, имущественных прав, работ, услуг, приобретаемых запасов затратами,
      включаемыми в фактическую себестоимость запасов, считается балансовая стоимость передаваемых активов,
      фактические затраты, понесенные на выполнение работ, оказание услуг. Организация, которая вправе
      применять упрощенные способы ведения бухгалтерского учета, включая упрощенную бухгалтерскую (финансовую)
      отчетность (далее – организация с упрощенным учетом) вправе определять затраты, включаемые в фактическую
      себестоимость запасов (в части оплаты неденежными средствами), в сумме балансовой стоимости передаваемых
      активов, фактических затрат, понесенных на выполнение работ, оказание услуг, вне зависимости от
      возможности определения справедливой стоимости передаваемого имущества, имущественных прав, работ,
      услуг, приобретаемых запасов.
  - path: '15'
    parent_path: null
    heading: Оценка при признании
    text: Затратами, включаемыми в фактическую себестоимость запасов, которые организация получает безвозмездно,
      считается справедливая стоимость этих запасов.
  - path: '16'
    parent_path: null
    heading: Оценка при признании
    text: 'В случае если в качестве запасов признаются материальные ценности, остающиеся от выбытия (в
      том числе частичного) внеоборотных активов или извлекаемые в процессе текущего содержания, ремонта,
      модернизации, реконструкции внеоборотных активов, затратами, включаемыми в фактическую себестоимость
      запасов, считается наименьшая из следующих величин:'
  - path: 16.а
    parent_path: '16'
    heading: null
    text: стоимость, по которой учитываются аналогичные запасы, приобретенные (созданные) организацией
      в рамках обычного операционного цикла;
  - path: 16.б
    parent_path: '16'
    heading: null
    text: сумма балансовой стоимости списываемых активов и затрат, понесенных в связи с демонтажем и разборкой
      объектов, извлечением материальных ценностей и приведением их в состояние, необходимое для потребления
      (продажи, использования) в качестве запасов.
  - path: '17'
    parent_path: null
    heading: Оценка при признании
    text: Организация с упрощенным учетом вправе считать себестоимостью приобретенных запасов уплаченные
      и (или) подлежащие уплате при приобретении запасов суммы без применения положений подпункта «б»
      пункта 12 и пункта 13 настоящего Стандарта. В случае определения себестоимости запасов указанным
      способом затраты, указанные в подпунктах «б» - «е» пункта 11 настоящего Стандарта, признаются расходом
      периода, в котором были понесены.
  - path: '18'
    parent_path: null
    heading: Оценка при признании
    text: 'В себестоимость приобретаемых (создаваемых) запасов не включаются:'
  - path: 18.а
    parent_path: '18'
    heading: null
    text: затраты, возникшие в связи со стихийными бедствиями, пожарами, авариями и другими чрезвычайными
      ситуациями;
  - path: 18.б
    parent_path: '18'
    heading: null
    text: управленческие расходы, кроме случаев, когда они непосредственно связаны с приобретением (созданием)
      запасов;
  - path: 18.в
    parent_path: '18'
    heading: null
    text: расходы на хранение запасов, за исключением случаев, когда хранение является частью технологии
      подготовки запасов к потреблению (продаже, использованию) или обусловлено условиями приобретения
      (создания) запасов;
  - path: 18.г
    parent_path: '18'
    heading: null
    text: иные затраты, осуществление которых не является необходимым для приобретения (создания) запасов.
  - path: '19'
    parent_path: null
    heading: Оценка при признании
    text: Продукцию сельского, лесного и рыбного хозяйства собственного производства, а также товары,
      торгуемые на организованных торгах, допускается оценивать при признании по справедливой стоимости.
  - path: '20'
    parent_path: null
    heading: Оценка при признании
    text: При осуществлении розничной торговли приобретенные товары допускается оценивать по продажной
      стоимости с отдельным учетом наценок. Величина наценок подлежит регулярному пересмотру в соответствии
      с текущими условиями закупки и продажи товаров.
  - path: '21'
    parent_path: null
    heading: Оценка при признании
    text: При осуществлении торговой деятельности допускается включать в состав расходов на продажу затраты
      по заготовке и доставке товаров до центральных складов (баз), производимые до момента их передачи
      в продажу.
  - path: '22'
    parent_path: null
    heading: Оценка при признании
    text: Запасы, принадлежащие организации, но находящиеся в пути, либо переданные покупателю под залог,
      оцениваются в бухгалтерском учете в сумме, предусмотренной в договоре, с последующим определением
      их фактической себестоимости.
  - path: '23'
    parent_path: null
    heading: Оценка при признании
    text: 'В фактическую себестоимость незавершенного производства и готовой продукции включаются затраты,
      связанные с производством продукции, выполнением работ, оказанием услуг. К таким затратам относятся:'
  - path: 23.а
    parent_path: '23'
    heading: null
    text: материальные затраты;
  - path: 23.б
    parent_path: '23'
    heading: null
    text: затраты на оплату труда;
  - path: 23.в
    parent_path: '23'
    heading: null
    text: отчисления на социальные нужды;
  - path: 23.г
    parent_path: '23'
    heading: null
    text: амортизация;
  - path: 23.д
    parent_path: '23'
    heading: null
    text: прочие затраты.
  - path: '24'
    parent_path: null
    heading: Оценка при признании
    text: В фактическую себестоимость незавершенного производства и готовой продукции включаются затраты,
      прямо относящиеся к производству конкретного вида продукции, работ, услуг (прямые затраты), и затраты,
      которые не могут быть прямо отнесены к производству конкретного вида продукции, работ, услуг (косвенные
      затраты). Классификация затрат на прямые и косвенные определяется организацией самостоятельно.
  - path: '25'
    parent_path: null
    heading: Оценка при признании
    text: Косвенные затраты распределяются между конкретными видами продукции, работ, услуг обоснованным
      способом, установленным организацией самостоятельно.
  - path: '26'
    parent_path: null
    heading: Оценка при признании
    text: 'В фактическую себестоимость незавершенного производства и готовой продукции не включаются:'
  - path: 26.а
    parent_path: '26'
    heading: null
    text: затраты, возникшие в связи с ненадлежащей организацией производственного процесса (сверхнормативный
      расход сырья, материалов, энергии, труда, потери от простоев, брака, нарушений трудовой и технологической
      дисциплины);
  - path: 26.б
    parent_path: '26'
    heading: null
    text: затраты, возникшие в связи со стихийными бедствиями, пожарами, авариями и другими чрезвычайными
      ситуациями;
  - path: 26.в
    parent_path: '26'
    heading: null
    text: обесценение других активов независимо от того, использовались ли эти активы в производстве продукции,
      выполнении работ, оказании услуг;
  - path: 26.г
    parent_path: '26'
    heading: null
    text: управленческие расходы, кроме случаев, когда они непосредственно связаны с производством продукции,
      выполнением работ, оказанием услуг;
  - path: 26.д
    parent_path: '26'
    heading: null
    text: расходы на хранение, за исключением случаев, когда хранение является частью технологии производства
      продукции (выполнения работ, оказания услуг);
  - path: 26.е
    parent_path: '26'
    heading: null
    text: расходы на рекламу и продвижение продукции;
  - path: 26.ж
    parent_path: '26'
    heading: null
    text: иные затраты, осуществление которых не является необходимым для осуществления производства продукции,
      выполнения работ, оказания услуг.
  - path: '27'
    parent_path: null
    heading: Оценка при признании
    text: 'Незавершенное производство и готовую продукцию в массовом и серийном производстве допускается
      оценивать:'
  - path: 27.а
    parent_path: '27'
    heading: null
    text: в сумме прямых затрат без включения косвенных затрат;
  - path: 27.б
    parent_path: '27'
    heading: null
    text: в сумме плановых (нормативных) затрат. Плановые (нормативные) затраты устанавливаются организацией
      исходя из нормальных (обычно необходимых) объемов использования сырья, материалов, топлива, энергии,
      трудовых и других ресурсов в условиях нормальной загрузки производственных мощностей; подлежат регулярному
      пересмотру в соответствии с текущими условиями производства.
  - path: 27.заключение
    parent_path: '27'
    heading: null
    text: Разница между фактической себестоимостью незавершенного производства и готовой продукции и их
      стоимостью, определенной в соответствии с подпунктом «б» настоящего пункта, относится на уменьшение
      (увеличение) суммы расходов, признаваемых в соответствии с подпунктом «а» пункта 43 настоящего Стандарта,
      в отчетном периоде, в котором указанная разница была выявлена. При единичном производстве продукции
      незавершенное производство отражается в бухгалтерском балансе по фактически произведенным затратам.
  - path: '28'
    parent_path: null
    heading: Оценка после признания
    text: 'Запасы коммерческой организации, а также используемые в приносящей доход деятельности запасы
      некоммерческой организации оцениваются на отчетную дату по наименьшей из следующих величин (если
      иное не установлено пунктами 32 – 35 настоящего Стандарта):'
  - path: 28.а
    parent_path: '28'
    heading: null
    text: фактическая себестоимость запасов;
  - path: 28.б
    parent_path: '28'
    heading: null
    text: чистая стоимость продажи запасов, определяемая в соответствии с пунктом 29 настоящего Стандарта.
  - path: '29'
    parent_path: null
    heading: Оценка после признания
    text: Чистая стоимость продажи запасов определяется организацией как предполагаемая цена, по которой
      организация может продать запасы в том виде, в котором обычно продает их в ходе обычной деятельности,
      за вычетом предполагаемых затрат, необходимых для их производства, подготовки к продаже и осуществления
      продажи. При этом за чистую стоимость продажи запасов, отличных от готовой продукции, товаров, принимается
      величина, равная приходящейся на данные запасы доле предполагаемой цены, по которой организация
      может продать готовую продукцию, работы, услуги, в производстве которых используются указанные запасы.
      В случае если определение указанной величины является затруднительным, за чистую стоимость продажи
      запасов, отличных от готовой продукции, товаров, может быть принята цена, по которой возможно приобрести
      аналогичные запасы по состоянию на отчетную дату.
  - path: '30'
    parent_path: null
    heading: Оценка после признания
    text: Для целей бухгалтерского учета превышение фактической себестоимости запасов над их чистой стоимостью
      продажи считается обесценением запасов. Признаками обесценения запасов могут быть, в частности,
      моральное устаревание запасов, потеря ими своих первоначальных качеств, снижение их рыночной стоимости,
      сужение рынков сбыта запасов. В случае обесценения запасов организация создает резерв под обесценение
      в размере превышения фактической себестоимости запасов над их чистой стоимостью продажи. При этом
      балансовой стоимостью запасов считается их фактическая себестоимость за вычетом данного резерва.
      В случае если чистая стоимость продажи запасов, по которым признано обесценение, продолжает снижаться,
      балансовая стоимость таких запасов уменьшается до их чистой стоимости продажи путем увеличения резерва
      под обесценение. В случае если чистая стоимость продажи запасов, по которым признано обесценение,
      повышается, балансовая стоимость таких запасов увеличивается до их чистой стоимости продажи путем
      восстановления ранее созданного резерва (но не выше их фактической себестоимости).
  - path: '31'
    parent_path: null
    heading: Оценка после признания
    text: Величина обесценения запасов признается расходом периода, в котором создан (увеличен) резерв
      под их обесценение. Величина восстановления резерва под обесценение запасов относится на уменьшение
      суммы расходов, признанных в этом же периоде в соответствии с подпунктом «а» пункта 43 настоящего
      Стандарта.
  - path: '32'
    parent_path: null
    heading: Оценка после признания
    text: Организация с упрощенным учетом вправе оценивать запасы на отчетную дату по фактической себестоимости.
  - path: '33'
    parent_path: null
    heading: Оценка после признания
    text: Запасы некоммерческой организации, используемые в целях, ради которых она создана, оцениваются
      на отчетную дату по фактической себестоимости.
  - path: '34'
    parent_path: null
    heading: Оценка после признания
    text: 'Организация, принявшая решение оценивать запасы, указанные в пункте 19 настоящего Стандарта,
      по справедливой стоимости, на отчетную дату оценивает эти запасы также по справедливой стоимости.
      Такая организация признает в качестве дохода или расхода отчетного периода разницу между следующими
      величинами:'
  - path: 34.а
    parent_path: '34'
    heading: null
    text: справедливая стоимость учитываемых в соответствии с настоящим пунктом запасов в момент их признания,
      а также последующие изменения этой стоимости;
  - path: 34.б
    parent_path: '34'
    heading: null
    text: сумма затрат, подлежащих включению в фактическую себестоимость запасов в соответствии с настоящим
      Стандартом.
  - path: '35'
    parent_path: null
    heading: Оценка после признания
    text: В организации, осуществляющей розничную торговлю и оценивающей приобретенные товары по продажной
      стоимости с отдельным учетом наценок, товары представляются в бухгалтерском балансе за вычетом наценок.
      Разница между стоимостью товаров, определяемой в соответствии с настоящим пунктом, и фактической
      себестоимостью этих товаров относится на уменьшение (увеличение) суммы расходов, признаваемых в
      соответствии с подпунктом «а» пункта 43 настоящего Стандарта, в отчетном периоде, в котором указанная
      разница выявлена.
  - path: '36'
    parent_path: null
    heading: Отпуск и списание запасов
    text: 'При отпуске запасов в производство, отгрузке готовой продукции, товаров покупателю, списании
      запасов, себестоимость запасов рассчитывается одним из следующих способов:'
  - path: 36.а
    parent_path: '36'
    heading: null
    text: по себестоимости каждой единицы;
  - path: 36.б
    parent_path: '36'
    heading: null
    text: по средней себестоимости;
  - path: 36.в
    parent_path: '36'
    heading: null
    text: по себестоимости первых по времени поступления единиц (способ ФИФО).
  - path: '37'
    parent_path: null
    heading: Отпуск и списание запасов
    text: Для расчета себестоимости запасов, имеющих сходные свойства и характер использования, должен
      последовательно применяться один и тот же способ расчета себестоимости.
  - path: '38'
    parent_path: null
    heading: Отпуск и списание запасов
    text: Себестоимость запасов, которые не могут обычным образом заменять друг друга, а также запасов,
      учитываемых в специальном порядке (драгоценные металлы, драгоценные камни), рассчитывается в отношении
      каждой единицы учета запасов.
  - path: '39'
    parent_path: null
    heading: Отпуск и списание запасов
    text: Способ по средней себестоимости предполагает расчет себестоимости единицы учета запасов путем
      деления общей себестоимости вида запасов на их количество, складывающихся соответственно из себестоимости
      и количества остатка на начало периода (месяц или другой, определенный организацией период) и поступивших
      запасов в течение данного периода. Средняя себестоимость может рассчитываться периодически через
      равные интервалы времени либо по мере поступления каждой новой партии запасов.
  - path: '40'
    parent_path: null
    heading: Отпуск и списание запасов
    text: Способ ФИФО основан на допущении, что запасы используются в последовательности их поступления,
      то есть запасы, первыми поступающие в производство (продажу), должны быть оценены по себестоимости
      первых по времени приобретений. При применении этого способа оценка имеющихся в наличии на отчетную
      дату запасов соответствует оценке последних по времени поступивших запасов.
  - path: '41'
    parent_path: null
    heading: Отпуск и списание запасов
    text: 'Запасы списываются:'
  - path: 41.а
    parent_path: '41'
    heading: null
    text: одновременно с признанием выручки от их продажи;
  - path: 41.б
    parent_path: '41'
    heading: null
    text: при выбытии в случаях, отличных от продажи;
  - path: 41.в
    parent_path: '41'
    heading: null
    text: при возникновении обстоятельств, в связи с которыми организация не ожидает поступление экономических
      выгод в будущем от потребления (продажи, использования) запасов (некоммерческая организация не может
      использовать запасы в целях своей деятельности).
  - path: '42'
    parent_path: null
    heading: Отпуск и списание запасов
    text: Операции, приводящие к изменению вида запасов (отпуск запасов в производство, выпуск продукции,
      отгрузка готовой продукции, товаров покупателю до признания выручки), не являются основанием прекращения
      признания запасов активами.
  - path: '43'
    parent_path: null
    heading: Отпуск и списание запасов
    text: 'Балансовая стоимость списываемых запасов признается расходом периода:'
  - path: 43.а
    parent_path: '43'
    heading: null
    text: в котором признана выручка от продажи этих запасов;
  - path: 43.б
    parent_path: '43'
    heading: null
    text: в котором данное выбытие (списание) произошло, в случаях, отличных от продажи запасов.
  - path: '44'
    parent_path: null
    heading: Отпуск и списание запасов
    text: Расходы от списания запасов в соответствии с подпунктом «а» пункта 41 настоящего Стандарта,
      учитываются обособленно от расходов от списания запасов в соответствии с подпунктами «б» и «в» пункта
      41 настоящего Стандарта.
  - path: '45'
    parent_path: null
    heading: Раскрытие информации в отчетности
    text: 'В бухгалтерской (финансовой) отчетности раскрывается с учетом существенности следующая информация:'
  - path: 45.а
    parent_path: '45'
    heading: null
    text: балансовая стоимость запасов на начало и конец отчетного периода;
  - path: 45.б
    parent_path: '45'
    heading: null
    text: сверка остатков запасов в разрезе фактической себестоимости и обесценения на начало и конец
      отчетного периода и движения запасов за отчетный период;
  - path: 45.в
    parent_path: '45'
    heading: null
    text: в случае восстановления ранее созданного резерва под обесценение причины, которые привели к
      увеличению чистой стоимости продажи запасов;
  - path: 45.г
    parent_path: '45'
    heading: null
    text: балансовая стоимость запасов, в отношении которых имеются ограничения имущественных прав организации,
      в том числе запасов, находящихся в залоге;
  - path: 45.д
    parent_path: '45'
    heading: null
    text: способы расчета себестоимости запасов;
  - path: 45.е
    parent_path: '45'
    heading: null
    text: последствия изменения способов расчета себестоимости запасов (по сравнению с предыдущим отчетным
      периодом);
  - path: 45.ж
    parent_path: '45'
    heading: null
    text: авансы, предварительная оплата, задатки, уплаченные организацией в связи с приобретением, созданием,
      переработкой запасов.
  - path: '46'
    parent_path: null
    heading: Раскрытие информации в отчетности
    text: Информация о запасах (сырье и материалы, незавершенное производство, полуфабрикаты на промежуточных
      стадиях производства, готовая продукция и товары отгруженные, др.), указанная в пункте 45 настоящего
      Стандарта, отражается в бухгалтерской (финансовой) отчетности в разрезе видов запасов.
  - path: '47'
    parent_path: null
    heading: Изменение учетной политики
    text: Последствия изменения учетной политики в связи с началом применения настоящего Стандарта отражаются
      по выбору организации ретроспективно (как если бы настоящий Стандарт применялся с момента возникновения
      затрагиваемых им фактов хозяйственной жизни) либо перспективно (только в отношении фактов хозяйственной
      жизни, имевших место после начала применения настоящего Стандарта, без изменения сформированных
      ранее данных бухгалтерского учета).
  - path: '48'
    parent_path: null
    heading: Изменение учетной политики
    text: Организация раскрывает выбранный ею способ отражения последствий изменения учетной политики
      в связи с началом применения настоящего Стандарта в своей первой бухгалтерской (финансовой) отчетности,
      составленной с применением настоящего Стандарта.