editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: null
    text: Утвердить прилагаемый Федеральный стандарт бухгалтерского учета ФСБУ 27/2021 «Документы и документооборот
      в бухгалтерском учете» (далее — Стандарт).
  - path: '2'
    parent_path: null
    heading: null
    text: Установить, что Стандарт применяется с 1 января 2022 года. Организация может принять решение
      о применении настоящего Стандарта до указанного срока. Министр А.Г. Силуанов Утвержден приказом
      Министерства финансов Российской Федерации от 16.04.2021 № 62н ФЕДЕРАЛЬНЫЙ СТАНДАРТ БУХГАЛТЕРСКОГО
      УЧЕТА ФСБУ 27/2021 «Документы и документооборот в бухгалтерском учете» 1. Общие положения
  - path: '3'
    parent_path: null
    heading: null
    text: В случаях, установленных нормативными актами Центрального банка Российской Федерации, принимаемыми
      в соответствии с Федеральным законом от 6 декабря 2011 г. № 402-ФЗ «О бухгалтерском учете» (Собрание
      законодательства Российской Федерации, 2011, № 50, ст. 7344; 2019, № 30, ст. 4149) (далее — Федеральный
      закон «О бухгалтерском учете»), кредитные и некредитные финансовые организации, регулирование деятельности
      которых осуществляет Центральный банк Российской Федерации, не применяют пункты 5-7, 22 настоящего
      Стандарта.
  - path: '4'
    parent_path: null
    heading: Требования к документам бухгалтерского учета
    text: Документы бухгалтерского учета должны соответствовать требованиям, установленным Федеральным
      законом «О бухгалтерском учете», а также настоящим Стандартом.
  - path: '5'
    parent_path: null
    heading: Требования к документам бухгалтерского учета
    text: Документы бухгалтерского учета должны быть составлены на русском языке, за исключением случаев,
      установленных абзацем вторым настоящего пункта и в абзацем первым пункта 6 настоящего Стандарта.
      Первичный учетный документ, составленный на иностранном языке, должен содержать построчный перевод
      на русский язык, за исключением случая, установленного абзацем первым пункта 6 настоящего Стандарта.
  - path: '6'
    parent_path: null
    heading: Требования к документам бухгалтерского учета
    text: В случае если законодательство или правила страны - места ведения деятельности за пределами
      Российской Федерации требуют составления документов бухгалтерского учета на языке данной страны,
      то такие документы составляются на соответствующем иностранном языке. При этом регистр бухгалтерского
      учета, составленный на иностранном языке, должен содержать построчный перевод на русский язык.
  - path: '7'
    parent_path: null
    heading: Требования к документам бухгалтерского учета
    text: Величина денежного измерения объектов бухгалтерского учета записывается в регистрах бухгалтерского
      учета в рублях независимо от валюты факта хозяйственной жизни и (или) места ведения деятельности
      экономическим субъектом, за исключением случая, указанного в абзаце втором настоящего пункта. Величина
      денежного измерения объектов бухгалтерского учета, стоимость которых выражена в иностранной валюте,
      записывается в регистрах бухгалтерского учета одновременно в такой валюте и в рублях, если иное
      не установлено федеральными стандартами бухгалтерского учета, принимаемыми в соответствии с Федеральным
      законом «О бухгалтерском учете».
  - path: '8'
    parent_path: null
    heading: Требования к документам бухгалтерского учета
    text: 'При указании реквизитов, предусмотренных частью 2 статьи 9 Федерального закона «О бухгалтерском
      учете» (далее - обязательные реквизиты), в первичном учетном документе:'
  - path: 8.а
    parent_path: '8'
    heading: null
    text: в качестве даты составления первичного учетного документа указывается дата его подписания лицом
      — (лицами), — совершившим (совершившими) сделку, операцию и ответственным (ответственными) за ее
      оформление, либо лицом (лицами), ответственным (ответственными) за оформление совершившегося события;
  - path: 8.б
    parent_path: '8'
    heading: null
    text: в случае отличия даты составления первичного учетного документа от даты совершения факта хозяйственной
      жизни, оформляемого этим первичным учетным документом, указывается также информация о дате совершения
      факта хозяйственной жизни;
  - path: 8.в
    parent_path: '8'
    heading: null
    text: в случае включения обязательных реквизитов в первичный учетный документ на основании другого
      документа, содержащего информацию о факте хозяйственной жизни (далее - оправдательный документ),
      указывается информация, позволяющая идентифицировать соответствующий оправдательный документ.
  - path: '9'
    parent_path: null
    heading: Требования к документам бухгалтерского учета
    text: 'При составлении экономическим субъектом первичных учетных документов допускается:'
  - path: 9.а
    parent_path: '9'
    heading: null
    text: оформлять несколько связанных фактов хозяйственной жизни одним первичным учетным документом;
  - path: 9.б
    parent_path: '9'
    heading: null
    text: оформлять длящиеся факты хозяйственной Жизни (в частности, начисление процентов, амортизация
      активов, изменение стоимости активов и обязательств), а также повторяющиеся факты хозяйственной
      жизни (в частности, поставка товара, продукции партиями в разные даты по одному долгосрочному договору)
      первичными учетными документами, составляемыми с периодичностью, определяемой экономическим субъектом
      исходя из существа факта хозяйственной жизни и требования рациональности, предусмотренного Положением
      по бухгалтерскому учету «Учетная политика организации» (ПБУ 1/2008), утвержденным приказом Министерства
      финансов Российской Федерации от 6 октября 2008 г. № 106н (зарегистрирован Министерством юстиции
      Российской Федерации 27 октября 2008 г., регистрационный № 12522)' (в частности, сутки, неделя,
      месяц, квартал), при условии их составления на отчетную дату;
  - path: 9.в
    parent_path: '9'
    heading: null
    text: оформлять ряд сделок, заключенных участником биржевых торгов, по договорам с разными контрагентами
      одним первичным учетным документом;
  - path: 9.г
    parent_path: '9'
    heading: null
    text: использовать в качестве первичных учетных документов документы, составленные или полученные
      в процессе деятельности экономического субъекта, в частности, для оформления его гражданско-правовых
      отношений с контрагентами, работниками, государственными органами, для управления экономическим
      субъектом (в частности, договор, кассовый чек, квитанция об оплате, авансовый отчет, судебный акт,
      торговый товарный счет) при условии, что указанные документы содержат все установленные частью 2
      статьи 9 Федерального закона «О бухгалтерском учете» обязательные реквизиты первичного учетного
      документа.
  - path: '10'
    parent_path: null
    heading: Требования к документам бухгалтерского учета
    text: 'Система регистров бухгалтерского учета, принятая экономическим субъектом, должна обеспечивать:'
  - path: 10.а
    parent_path: '10'
    heading: null
    text: полноту информации (получение информации, необходимой всем заинтересованным пользователям);
  - path: 10.б
    parent_path: '10'
    heading: null
    text: отражение объектов бухгалтерского учета в хронологической последовательности (далее - хронологическая
      запись) и систематическое накапливание информации о них на счетах бухгалтерского учета (далее систематическая
      запись);
  - path: 10.в
    parent_path: '10'
    heading: null
    text: ведение бухгалтерского учета на синтетических счетах (далее синтетический учет) и аналитических
      счетах (далее - аналитический учет);
  - path: 10.г
    parent_path: '10'
    heading: null
    text: системность — информации — (взаимосвязь — хронологической систематической записей, синтетического
      и аналитического учета, учетной отчетной информации);
  - path: 10.д
    parent_path: '10'
    heading: null
    text: обоснованность учетных записей (соответствие данным первичных учетных документов);
  - path: 10.е
    parent_path: '10'
    heading: null
    text: достоверность информации (полнота и точность представления объектов бухгалтерского учета);
  - path: 10.ж
    parent_path: '10'
    heading: null
    text: своевременность информации (формирование информации об объектах бухгалтерского учета в период,
      когда эта информация необходима ее пользователям); мы * с изменениями, внесенными приказами Министерства
      финансов Российской Федерации от 11 марта 2009 г. № 22н (зарегистрирован Министерством юстиции Российской
      Федерации 6 апреля 2009 г., регистрационный № 13688), от 25 октября 2010 г. № 132н (зарегистрирован
      Министерством юстиции Российской Федерации 25 ноября 2010 г., регистрационный № 1904$), от 8 ноября
      2010 г. № 144н (зарегистрирован Министерством юстиции Российской Федерации 1 декабря 2010 г., регистрационный
      № 19088), от 27 апреля 2012 г. № 55н (зарегистрирован Министерством юстиции Российской Федерации
      20 июня 2012 г., регистрационный № 24643), от 18 декабря 2012 г. № 164н (зарегистрирован Министерством
      юстиции Российской Федерации 15 февраля 2013 г., регистрационный № 27109), от 6 апреля 2015 г. №
      57н (зарегистрирован Министерством юстиции Российской Федерации 30 апреля 2015 г., регистрационный
      № 37103), от 28 апреля 2017 г. № 69н (зарегистрирован Министерством юстиции Российской Федерации
      25 июля 2017 г., регистрационный № 47517), от 7 февраля 2020 г. № 18н (зарегистрирован Министерством
      юстиции Российской Федерации 6 марта 2020 г., регистрационный № 57686)
  - path: 10.з
    parent_path: '10'
    heading: null
    text: юридическую значимость учетных записей (свойство учетных записей выступать в качестве подтверждения
      объектов бухгалтерского учета, включая свершившиеся факты хозяйственной жизни).
  - path: '11'
    parent_path: null
    heading: Требования к документам бухгалтерского учета
    text: Правильность отражения объектов бухгалтерского учета в регистрах бухгалтерского учета обеспечивают
      лица, составившие и подписавшие регистры бухгалтерского учета.
  - path: '12'
    parent_path: null
    heading: Требования к документам бухгалтерского учета
    text: Экономический субъект вправе включать в документ бухгалтерского учета реквизиты, являющиеся
      дополнительными к обязательным реквизитам, установленным частью 2 статьи 9 Федерального закона «О
      бухгалтерском учете».
  - path: '13'
    parent_path: null
    heading: Требования к документам бухгалтерского учета
    text: Записи в документах бухгалтерского учета, составляемых на бумажном носителе, должны производиться
      средствами, обеспечивающими сохранность этих записей в течение срока хранения документов бухгалтерского
      учета не меньшего, чем — установленный — статьей 29 — Федерального — закона «О бухгалтерском учете»
      (в частности, краской, чернилами, шариковой ручкой). При создании документов бухгалтерского учета
      на бумажном носителе запрещается производить записи средствами, не обеспечивающими сохранность этих
      записей (в частности, простым карандашом).
  - path: '14'
    parent_path: null
    heading: Требования к документам бухгалтерского учета
    text: При составлении документов бухгалтерского учета в виде электронных документов должна быть обеспечена
      возможность изготовления копий таких документов на бумажном носителе.
  - path: '15'
    parent_path: null
    heading: Требования к документам бухгалтерского учета
    text: Экономический субъект должен обеспечить однократность принятия к бухгалтерскому учету первичного
      учетного документа.
  - path: '16'
    parent_path: null
    heading: Требования к документам бухгалтерского учета
    text: Перечень лиц, имеющих право подписания документов бухгалтерского учета, устанавливается руководителем
      экономического субъекта.
  - path: '17'
    parent_path: null
    heading: Требования к документам бухгалтерского учета
    text: Виды электронной подписи документов бухгалтерского учета, составляемых в виде электронного документа,
      устанавливаются экономическим субъектом из числа предусмотренных Федеральным законом от 6 апреля
      2011 г. № 63-ФЗ «Об электронной подписи» (Собрание законодательства Российской Федерации, 2011,
      № 15, ст. 2036; 2021, № 9, ст. 1467), если требование об использовании конкретного вида электронной
      подписи в соответствии с целями ее использования не предусмотрено федеральными — законами — или
      принимаемыми в соответствии с ними нормативными правовыми актами. Виды — электронной подписи — первичных
      — учетных — документов, составляемых в виде электронного документа экономическим субъектом совместно
      с другими участниками электронного взаимодействия, определяются соглашением экономического субъекта
      с данными участниками электронного взаимодействия.
  - path: '18'
    parent_path: null
    heading: Исправление документов бухгалтерского учета
    text: Допустимые способы исправления документов бухгалтерского учета устанавливаются экономическим
      субъектом с учетом требований настоящего Стандарта, за исключением случаев, когда в соответствии
      с законодательством Российской Федерации или принятыми в соответствии с ним правилами внесение исправлений
      в документы бухгалтерского учета запрещено.
  - path: '19'
    parent_path: null
    heading: Исправление документов бухгалтерского учета
    text: Исправление в документе бухгалтерского учета производится таким образом, чтобы были ясны ошибочные
      и исправленные данные. Оно должно содержать дату исправления, а также подписи лиц, составивших первичный
      учетный документ (при исправлении первичного учетного документа) или ответственных за ведение регистра
      бухгалтерского учета (при исправлении регистра бухгалтерского учета), внесших это исправление, с
      указанием их должностей, фамилий и инициалов, либо иных реквизитов, необходимых для идентификации
      этих лиц.
  - path: '20'
    parent_path: null
    heading: Исправление документов бухгалтерского учета
    text: Допускается — исправление документа — бухгалтерского — учета, составленного в виде электронного
      документа, путем составления нового (исправленного) электронного документа. При этом новый (исправленный)
      документ должен содержать указание на то, что он составлен взамен первоначального электронного документа,
      дату исправления, а также электронные подписи лиц, составивших первичный учетный документ (при исправлении
      первичного учетного документа) или ответственных за ведение регистра бухгалтерского учета (при исправлении
      регистра бухгалтерского учета), с указанием их должностей, фамилий и инициалов либо иных реквизитов,
      необходимых для идентификации этих лиц. Средства воспроизведения нового (исправленного) электронного
      документа должны обеспечить невозможность использования его отдельно от первоначального электронного
      документа.
  - path: '21'
    parent_path: null
    heading: Исправление документов бухгалтерского учета
    text: Исправление в документе бухгалтерского учета, составленном на бумажном носителе, производится
      путем зачеркивания ошибочного текста или суммы и указания исправленного текста или суммы над зачеркнутым.
      Зачеркивание производится чертой таким образом, чтобы можно было прочитать ошибочный текст или сумму.
      Исправление в документе бухгалтерского учета, составленном на бумажном носителе, должно сопровождаться
      надписью «Исправлено» и содержать дату исправления, а также подписи лиц, составивших первичный учетный
      документ (при исправлении первичного учетного документа) или ответственных за ведение регистра бухгалтерского
      учета (при исправлении регистра бухгалтерского учета), в котором произведено исправление, с указанием
      их должностей, фамилий и инициалов либо иных реквизитов, необходимых для идентификации этих лиц.
      Исправления в виде подчисток (в частности, замазывания, стирания) в документе бухгалтерского учета,
      составленном на бумажном носителе, не допускаются.
  - path: '22'
    parent_path: null
    heading: Исправление документов бухгалтерского учета
    text: Исправление в регистре бухгалтерского учета может также производиться путем внесения в него
      исправительной записи по счетам бухгалтерского учета. Исправительная запись производится в форме
      записи на ту же сумму, что и ошибочная запись (часть суммы ошибочной записи), но со знаком минус
      (сторнировочная запись), либо в форме записи на сумму, дополняющую сумму ошибочной записи до правильной
      — величины (дополнительная запись).
  - path: '23'
    parent_path: null
    heading: Хранение документов бухгалтерского учета
    text: Экономический субъект должен хранить подлинники документов бухгалтерского учета, составленных
      на бумажном носителе и (или) в виде электронного — документа, за — исключением — случаев, — установленных
      законодательством Российской Федерации.
  - path: '24'
    parent_path: null
    heading: Хранение документов бухгалтерского учета
    text: Документы бухгалтерского учета должны храниться в том виде, в котором они были составлены. Перевод
      документов бухгалтерского учета, составленных на бумажном носителе, в электронный вид с целью последующего
      хранения не допускается.
  - path: '25'
    parent_path: null
    heading: Хранение документов бухгалтерского учета
    text: Экономический субъект должен хранить документы бухгалтерского учета, а также данные, содержащиеся
      в таких документах, и размещать базы указанных данных на территории Российской Федерации. В случае
      если законодательство или правила страны - места ведения деятельности за пределами Российской Федерации
      требуют хранения документов бухгалтерского учета на территории данной страны, то такое хранение
      должно быть обеспечено.
  - path: '26'
    parent_path: null
    heading: Хранение документов бухгалтерского учета
    text: Доступ к первичным — учетным — документам, — принятым к бухгалтерскому учету, а также к регистрам
      бухгалтерского учета предоставляется в порядке, установленном экономическим субъектом, с обязательным
      информированием главного бухгалтера или иного должностного лица экономического субъекта, на которое
      возложено ведение бухгалтерского учета, либо лица, с которым заключен договор оказания услуг по
      ведению бухгалтерского учета.
  - path: '27'
    parent_path: null
    heading: Хранение документов бухгалтерского учета
    text: В случае утраты документов бухгалтерского учета (в частности, гибели, пропажи), а также их порчи,
      приводящей к невозможности использования, экономический субъект должен принять все возможные меры
      по их восстановлению.
  - path: '28'
    parent_path: null
    heading: Документооборот в бухгалтерском учете
    text: Документооборот в бухгалтерском учете организуется руководителем экономического субъекта.
  - path: '29'
    parent_path: null
    heading: Документооборот в бухгалтерском учете
    text: 'Организация документооборота в бухгалтерском учете должна обеспечивать:'
  - path: 29.а
    parent_path: '29'
    heading: null
    text: своевременное отражение объектов бухгалтерского учета в бухгалтерском учете, в том числе передачу
      первичных учетных документов для регистрации содержащихся в них данных в регистрах бухгалтерского
      учета и составление на их основе бухгалтерской (финансовой) отчетности;
  - path: 29.б
    parent_path: '29'
    heading: null
    text: предотвращение несанкционированного доступа к документам бухгалтерского учета.
  - path: '30'
    parent_path: null
    heading: Документооборот в бухгалтерском учете
    text: Своевременное оформление первичных учетных документов, передачу их в установленные сроки для
      отражения в бухгалтерском учете, а также достоверность содержащихся в них данных обеспечивают лица,
      составившие и подписавшие указанные документы.