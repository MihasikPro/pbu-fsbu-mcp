year: 1999
title: Расходы организации
order_date: 1999-05-06
order_no: 33н
effective_from: &id001 2000-01-01
effective_to: 2027-01-01
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: Общие положения
    text: Настоящее Положение устанавливает правила формирования в бухгалтерском учете информации о расходах
      коммерческих организаций (кроме кредитных и страховых организаций), являющихся юридическими лицами
      по законодательству Российской Федерации. Применительно к настоящему Положению некоммерческие организации
      (кроме государственных (муниципальных) учреждений) признают расходы по предпринимательской и иной
      деятельности. (в ред. приказов Минфина России от 30.12.1999 № 107н, от 25.10.2010 № 132)
  - path: '2'
    parent_path: null
    heading: Общие положения
    text: Расходами организации признается уменьшение экономических выгод в результате выбытия активов
      (денежных средств, иного имущества) и (или) возникновения обязательств, приводящее к уменьшению
      капитала этой организации, за исключением уменьшения вкладов по решению участников (собственников
      имущества).
  - path: '3'
    parent_path: null
    heading: Общие положения
    text: 'Для целей настоящего Положения не признается расходами организации выбытие активов: в связи
      с приобретением (созданием) внеоборотных активов (основных средств, незавершенного строительства,
      нематериальных активов и т.п.); вклады в уставные (складочные) капиталы других организаций, приобретение
      акций акционерных обществ и иных ценных бумаг не с целью перепродажи (продажи); абзац исключен -
      приказ Минфина России от 30.03.2001 № 27н; по договорам комиссии, агентским и иным аналогичным договорам
      в пользу комитента, принципала и т.п.; в порядке предварительной оплаты материально-производственных
      запасов и иных ценностей, работ, услуг; в виде авансов, задатка в счет оплаты материально-производственных
      запасов и иных ценностей, работ, услуг; в погашение кредита, займа, полученных организацией. Для
      целей настоящего Положения выбытие активов именуется оплатой.'
  - path: '4'
    parent_path: null
    heading: Общие положения
    text: 'Расходы организации в зависимости от их характера, условий осуществления и направлений деятельности
      организации подразделяются на: расходы по обычным видам деятельности; прочие расходы; (в ред. приказа
      Минфина России от 18.09.2006 № 116н) абзац исключен - приказ Минфина России от 18.09.2006 № 116н.
      Для целей настоящего Положения расходы, отличные от расходов по обычным видам деятельности, считаются
      прочими расходами. (в ред. приказа Минфина России от 18.09.2006 № 116н)'
  - path: '5'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Расходами по обычным видам деятельности являются расходы, связанные с изготовлением продукции
      и продажей продукции, приобретением и продажей товаров. Такими расходами также считаются расходы,
      осуществление которых связано с выполнением работ, оказанием услуг. В организациях, предметом деятельности
      которых является предоставление за плату во временное пользование (временное владение и пользование)
      своих активов по договору аренды, расходами по обычным видам деятельности считаются расходы, осуществление
      которых связано с этой деятельностью. В организациях, предметом деятельности которых является предоставление
      за плату прав, возникающих из патентов на изобретения, промышленные образцы и других видов интеллектуальной
      собственности, расходами по обычным видам деятельности считаются расходы, осуществление которых
      связано с этой деятельностью. В организациях, предметом деятельности которых является участие в
      уставных капиталах других организаций, расходами по обычным видам деятельности считаются расходы,
      осуществление которых связано с этой деятельностью. Расходы, осуществление которых связано с предоставлением
      за плату во временное пользование (временное владение и пользование) своих активов, прав, возникающих
      из патентов на изобретения, промышленные образцы и других видов интеллектуальной собственности,
      и от участия в уставных капиталах других организаций, когда это не является предметом деятельности
      организации, относятся к прочим расходам. (в ред. приказа Минфина России от 18.09.2006 № 116н) Расходами
      по обычным видам деятельности считается также возмещение стоимости основных средств, нематериальных
      активов и иных амортизируемых активов, осуществляемых в виде амортизационных отчислений.
  - path: '6'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Расходы по обычным видам деятельности принимаются к бухгалтерскому учету в сумме, исчисленной
      в денежном выражении, равной величине оплаты в денежной и иной форме или величине кредиторской задолженности
      (с учетом положений пункта 3 настоящего Положения). Если оплата покрывает лишь часть признаваемых
      расходов, то расходы, принимаемые к бухгалтерскому учету, определяются как сумма оплаты и кредиторской
      задолженности (в части, не покрытой оплатой).
  - path: '6.1'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Величина оплаты и (или) кредиторской задолженности определяется исходя из цены и условий, установленных
      договором между организацией и поставщиком (подрядчиком) или иным контрагентом. Если цена не предусмотрена
      в договоре и не может быть установлена исходя из условий договора, то для определения величины оплаты
      или кредиторской задолженности принимается цена, по которой в сравнимых обстоятельствах обычно организация
      определяет расходы в отношении аналогичных материально-производственных запасов и иных ценностей,
      работ, услуг либо предоставления во временное пользование (временное владение и пользование) аналогичных
      активов.
  - path: '6.2'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: При оплате приобретаемых материально-производственных запасов и иных ценностей, работ, услуг
      на условиях коммерческого кредита, предоставляемого в виде отсрочки и рассрочки платежа, расходы
      принимаются к бухгалтерскому учету в полной сумме кредиторской задолженности.
  - path: '6.3'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Величина оплаты и (или) кредиторской задолженности по договорам, предусматривающим исполнение
      обязательств (оплату) не денежными средствами, определяется стоимостью товаров (ценностей), переданных
      или подлежащих передаче организацией. Стоимость товаров (ценностей), переданных или подлежащих передаче
      организацией, устанавливают исходя из цены, по которой в сравнимых обстоятельствах обычно организация
      определяет стоимость аналогичных товаров (ценностей). При невозможности установить стоимость товаров
      (ценностей), переданных или подлежащих передаче организацией, величина оплаты и (или) кредиторской
      задолженности по договорам, предусматривающим исполнение обязательств (оплату) не денежными средствами,
      определяется стоимостью продукции (товаров), полученной организацией. Стоимость продукции (товаров),
      полученной организацией, устанавливается исходя из цены, по которой в сравнимых обстоятельствах
      приобретается аналогичная продукция (товары).
  - path: '6.4'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: В случае изменения обязательства по договору первоначальная величина оплаты и (или) кредиторской
      задолженности корректируется исходя из стоимости актива, подлежащего выбытию. Стоимость актива,
      подлежащего выбытию, устанавливают исходя из цены, по которой в сравнимых обстоятельствах обычно
      организация определяет стоимость аналогичных активов.
  - path: '6.5'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Величина оплаты и (или) кредиторской задолженности определяется с учетом всех предоставленных
      организации согласно договору скидок (накидок).
  - path: '6.6'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Исключен - приказ Минфина России от 27.11.2006 № 156н.
  - path: '7'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: 'Расходы по обычным видам деятельности формируют: расходы, связанные с приобретением сырья,
      материалов, товаров и иных материально-производственных запасов; расходы, возникающие непосредственно
      в процессе переработки (доработки) материально-производственных запасов для целей производства продукции,
      выполнения работ и оказания услуг и их продажи, а также продажи (перепродажи) товаров (расходы по
      содержанию и эксплуатации основных средств и иных внеоборотных активов, а также по поддержанию их
      в исправном состоянии, коммерческие расходы, управленческие расходы и др.).'
  - path: '8'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: 'При формировании расходов по обычным видам деятельности должна быть обеспечена их группировка
      по следующим элементам: материальные затраты; затраты на оплату труда; отчисления на социальные
      нужды; амортизация; прочие затраты. Для целей управления в бухгалтерском учете организуется учет
      расходов по статьям затрат. Перечень статей затрат устанавливается организацией самостоятельно.'
  - path: '9'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Для целей формирования организацией финансового результата деятельности от обычных видов деятельности
      определяется себестоимость проданных товаров, продукции, работ, услуг, которая формируется на базе
      расходов по обычным видам деятельности, признанных как в отчетном году, так и в предыдущие отчетные
      периоды, и переходящих расходов, имеющих отношение к получению доходов в последующие отчетные периоды,
      с учетом корректировок, зависящих от особенностей производства продукции, выполнения работ и оказания
      услуг и их продажи, а также продажи (перепродажи) товаров. При этом коммерческие и управленческие
      расходы могут признаваться в себестоимости проданных продукции, товаров, работ, услуг полностью
      в отчетном году их признания в качестве расходов по обычным видам деятельности.
  - path: '10'
    parent_path: null
    heading: Расходы по обычным видам деятельности
    text: Правила учета затрат на производство продукции, продажу товаров, выполнение работ и оказание
      услуг в разрезе элементов и статей, исчисления себестоимости продукции (работ, услуг) устанавливаются
      отдельными нормативными актами и Методическими указаниями по бухгалтерскому учету.
  - path: '11'
    parent_path: null
    heading: Прочие расходы
    text: 'Прочими расходами являются: (в ред. приказа Минфина России от 18.09.2006 № 116н) расходы, связанные
      с предоставлением за плату во временное пользование (временное владение и пользование) активов организации
      (с учетом положений пункта 5 настоящего Положения); расходы, связанные с предоставлением за плату
      прав, возникающих из патентов на изобретения, промышленные образцы и других видов интеллектуальной
      собственности (с учетом положений пункта 5 настоящего Положения); (в ред. приказа Минфина России
      от 30.03.2001 № 27н) расходы, связанные с участием в уставных капиталах других организаций (с учетом
      положений пункта 5 настоящего Положения); расходы, связанные с продажей, выбытием и прочим списанием
      основных средств и иных активов, отличных от денежных средств (кроме иностранной валюты), товаров,
      продукции; проценты, уплачиваемые организацией за предоставление ей в пользование денежных средств
      (кредитов, займов); расходы, связанные с оплатой услуг, оказываемых кредитными организациями; отчисления
      в оценочные резервы, создаваемые в соответствии с правилами бухгалтерского учета (резервы по сомнительным
      долгам, под обесценение вложений в ценные бумаги и др.), а также резервы, создаваемые в связи с
      признанием условных фактов хозяйственной деятельности; (абзац введен приказом Минфина России от
      30.03.2001 № 27н) абзац исключен – приказ Минфина России от 18.09.2006 № 116н; абзац исключен -
      приказ Минфина России от 18.09.2006 № 116н; штрафы, пени, неустойки за нарушение условий договоров;
      возмещение причиненных организацией убытков; убытки прошлых лет, признанные в отчетном году; суммы
      дебиторской задолженности, по которой истек срок исковой давности, других долгов, нереальных для
      взыскания; курсовые разницы; сумма уценки активов; (в ред. приказа Минфина России от 30.03.2001
      № 27н) перечисление средств (взносов, выплат и т.д.), связанных с благотворительной деятельностью,
      расходы на осуществление спортивных мероприятий, отдыха, развлечений, мероприятий культурно-просветительского
      характера и иных аналогичных мероприятий; (абзац введен приказом Минфина России от 30.03.2001 №
      27н) прочие расходы. (в ред. приказа Минфина России от 18.09.2006 № 116н)'
  - path: '13'
    parent_path: null
    heading: Прочие расходы
    text: Прочими расходами также являются расходы, возникающие как последствия чрезвычайных обстоятельств
      хозяйственной деятельности (стихийного бедствия, пожара, аварии, национализации имущества и т.п.).
      (в ред. приказа Минфина России от 18.09.2006 № 116н)
  - path: '14'
    parent_path: null
    heading: Прочие расходы
    text: Для целей бухгалтерского учета величина прочих расходов определяется в следующем порядке.
  - path: '14.1'
    parent_path: null
    heading: Прочие расходы
    text: Величина расходов, связанных с продажей, выбытием и прочим списанием основных средств и иных
      активов, отличных от денежных средств (кроме иностранной валюты), товаров, продукции, а также с
      участием в уставных капиталах других организаций, с предоставлением за плату во временное пользование
      (временное владение и пользование) активов организации, прав, возникающих из патентов на изобретения,
      промышленные образцы и других видов интеллектуальной собственности (когда это не является предметом
      деятельности организации), процентов, уплачиваемых организацией за предоставление ей в пользование
      денежных средств, а также расходы, связанные с оплатой услуг, оказываемых кредитными организациями,
      определяются в порядке, аналогичном предусмотренному пунктом 6 настоящего Положения.
  - path: '14.2'
    parent_path: null
    heading: Прочие расходы
    text: Штрафы, пени, неустойки за нарушение условий договоров, а также возмещение причиненных организацией
      убытков принимаются к бухгалтерскому учету в суммах, присужденных судом или признанных организацией.
  - path: '14.3'
    parent_path: null
    heading: Прочие расходы
    text: Дебиторская задолженность, по которой срок исковой давности истек, другие долги, нереальные
      для взыскания, включаются в расходы организации в сумме, в которой задолженность была отражена в
      бухгалтерском учете организации.
  - path: '14.4'
    parent_path: null
    heading: Прочие расходы
    text: Суммы уценки активов определяются в соответствии с правилами, установленными для проведения
      переоценки активов. (в ред. приказа Минфина России от 30.03.2001 № 27н)
  - path: '15'
    parent_path: null
    heading: Прочие расходы
    text: Прочие расходы подлежат зачислению на счет прибылей и убытков организации, кроме случаев, когда
      законодательством или правилами бухгалтерского учета установлен иной порядок.
  - path: '16'
    parent_path: null
    heading: Признание расходов
    text: 'Расходы признаются в бухгалтерском учете при наличии следующих условий: расход производится
      в соответствии с конкретным договором, требованием законодательных и нормативных актов, обычаями
      делового оборота; сумма расхода может быть определена; имеется уверенность в том, что в результате
      конкретной операции произойдет уменьшение экономических выгод организации. Уверенность в том, что
      в результате конкретной операции произойдет уменьшение экономических выгод организации, имеется
      в случае, когда организация передала актив либо отсутствует неопределенность в отношении передачи
      актива. Если в отношении любых расходов, осуществленных организацией, не исполнено хотя бы одно
      из названных условий, то в бухгалтерском учете организации признается дебиторская задолженность.
      Амортизация признается в качестве расхода исходя из величины амортизационных отчислений, определяемой
      на основе стоимости амортизируемых активов, срока полезного использования и принятых организацией
      способов начисления амортизации.'
  - path: '17'
    parent_path: null
    heading: Признание расходов
    text: Расходы подлежат признанию в бухгалтерском учете независимо от намерения получить выручку, прочие
      или иные доходы и от формы осуществления расхода (денежной, натуральной и иной). (в ред. приказа
      Минфина России от 18.09.2006 № 116н)
  - path: '18'
    parent_path: null
    heading: Признание расходов
    text: Расходы признаются в том отчетном периоде, в котором они имели место, независимо от времени
      фактической выплаты денежных средств и иной формы осуществления (допущение временной определенности
      фактов хозяйственной деятельности). Если организацией, которая вправе применять упрощенные способы
      ведения бухгалтерского учета, включая упрощенную бухгалтерскую (финансовую) отчетность, принят порядок
      признания выручки от продажи продукции и товаров не по мере передачи прав владения, пользования
      и распоряжения на поставленную продукцию, отпущенный товар, выполненную работу, оказанную услугу,
      а после поступления денежных средств и иной формы оплаты, то и расходы признаются после осуществления
      погашения задолженности. (в ред. приказов Минфина России от 08.11.2010 № 144н, от 27.04.2012 № 55н,
      от 06.04.2015 № 57н)
  - path: '19'
    parent_path: null
    heading: Признание расходов
    text: 'Расходы признаются в отчете о финансовых результатах: (в ред. приказа Минфина России от 06.04.2015
      № 57н) с учетом связи между произведенными расходами и поступлениями (соответствие доходов и расходов);
      путем их обоснованного распределения между отчетными периодами, когда расходы обуславливают получение
      доходов в течение нескольких отчетных периодов и когда связь между доходами и расходами не может
      быть определена четко или определяется косвенным путем; по расходам, признанным в отчетном периоде,
      когда по ним становится определенным неполучение экономических выгод (доходов) или поступление активов;
      независимо от того, как они принимаются для целей расчета налогооблагаемой базы; когда возникают
      обязательства, не обусловленные признанием соответствующих активов.'
  - path: '20'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: В составе информации об учетной политике организации в бухгалтерской отчетности подлежит раскрытию
      порядок признания коммерческих и управленческих расходов.
  - path: '21'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: В отчете о финансовых результатах расходы организации отражаются с подразделением на себестоимость
      проданных товаров, продукции, работ, услуг, коммерческие расходы, управленческие расходы и прочие
      расходы. (в ред. приказов Минфина России от 18.09.2006 № 116н, от 06.04.2015 № 57н)
  - path: '21.1'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: В случае выделения в отчете о финансовых результатах видов доходов, каждый из которых в отдельности
      составляет пять и более процентов от общей суммы доходов организации за отчетный год, в нем показывается
      соответствующая каждому виду часть расходов. (в ред. приказа Минфина России 06.04.2015 № 57н)
  - path: '21.2'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'Прочие расходы могут не показываться в отчете о финансовых результатах развернуто по отношению
      к соответствующим доходам, когда: (в ред. приказов Минфина России от 18.09.2006 № 116н, 06.04.2015
      № 57н) соответствующие правила бухгалтерского учета предусматривают или не запрещают такое отражение
      расходов; расходы и связанные с ними доходы, возникшие в результате одного и того же или аналогичного
      по характеру факта хозяйственной деятельности, не являются существенными для характеристики финансового
      положения организации.'
  - path: '22'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: 'В бухгалтерской отчетности также подлежит раскрытию как минимум следующая информация: расходы
      по обычным видам деятельности в разрезе элементов затрат; изменение величины расходов, не имеющих
      отношения к исчислению себестоимости проданных продукции, товаров, работ, услуг в отчетном году;
      расходы, равные величине отчислений в связи с образованием в соответствии с правилами бухгалтерского
      учета резервов (предстоящих расходов, оценочных резервов и др.).'
  - path: '23'
    parent_path: null
    heading: Раскрытие информации в бухгалтерской отчетности
    text: Прочие расходы организации за отчетный год, которые в соответствии с правилами бухгалтерского
      учета не зачисляются в отчетном году на счет прибылей и убытков, подлежат раскрытию в бухгалтерской
      отчетности обособленно. ПОЛОЖЕНИЕ ПО БУХГАЛТЕРСКОМУ УЧЕТУ «РАСХОДЫ ОРГАНИЗАЦИИ» ПБУ 10/99