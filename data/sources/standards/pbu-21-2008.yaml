id: pbu-21-2008
kind: ПБУ
number: 21/2008
year: 2008
title: Изменения оценочных значений
order_date: 2008-10-06
order_no: 106н
effective_from: &id001 2009-01-01
effective_to: null
superseded_by: null
source_url: https://minfin.gov.ru/ru/perfomance/accounting/accounting/standart/positions/
editions:
- edition_no: 1
  amending_order: null
  effective_from: *id001
  clauses:
  - path: '1'
    parent_path: null
    heading: null
    text: Настоящее Положение устанавливает правила признания и раскрытия в бухгалтерской отчетности организаций,
      являющихся юридическими лицами по законодательству Российской Федерации (за исключением кредитных
      организаций и государственных (муниципальных) учреждений) (далее - организации), информации об изменениях
      оценочных значений. (в ред. приказа Минфина России от 25.10.2010 № 132н)
  - path: '2'
    parent_path: null
    heading: null
    text: Для целей настоящего Положения изменением оценочного значения признается корректировка стоимости
      актива (обязательства) или величины, отражающей погашение стоимости актива, обусловленная появлением
      новой информации, которая производится исходя из оценки существующего положения дел в организации,
      ожидаемых будущих выгод и обязательств и не является исправлением ошибки в бухгалтерской отчетности.
  - path: '3'
    parent_path: null
    heading: null
    text: Оценочным значением является величина резерва по сомнительным долгам, резерва под снижение стоимости
      материально-производственных запасов, других оценочных резервов, сроки полезного использования основных
      средств, нематериальных активов и иных амортизируемых активов, оценка ожидаемого поступления будущих
      экономических выгод от использования амортизируемых активов и др. Изменение способа оценки активов
      и обязательств не является изменением оценочного значения. Если какое-то изменение в данных бухгалтерского
      учета не поддается однозначной классификации в качестве изменения учетной политики или изменения
      оценочного значения, то для целей бухгалтерской отчетности оно признается изменением оценочного
      значения.
  - path: '4'
    parent_path: null
    heading: null
    text: 'Изменение оценочного значения, за исключением изменения, указанного в пункте 5 настоящего Положения,
      подлежит признанию в бухгалтерском учете путем включения в доходы или расходы организации (перспективно):
      периода, в котором произошло изменение, если такое изменение влияет на показатели бухгалтерской
      отчетности только данного отчетного периода; периода, в котором произошло изменение, и будущих периодов,
      если такое изменение влияет на бухгалтерскую отчетность данного отчетного периода и бухгалтерскую
      отчетность будущих периодов.'
  - path: '5'
    parent_path: null
    heading: null
    text: Изменение оценочного значения, непосредственно влияющее на величину капитала организации, подлежит
      признанию путем корректировки соответствующих статей капитала в бухгалтерской отчетности за период,
      в котором произошло изменение.
  - path: '6'
    parent_path: null
    heading: null
    text: 'В пояснительной записке к бухгалтерской отчетности организация должна раскрывать следующую
      информацию об изменении оценочного значения: - содержание изменения, повлиявшего на бухгалтерскую
      отчетность за данный отчетный период; - содержание изменения, которое повлияет на бухгалтерскую
      отчетность за будущие периоды, за исключением случаев, когда оценить влияние изменения на бухгалтерскую
      отчетность за будущие периоды невозможно. Факт невозможности такой оценки также подлежит раскрытию.'
