# Допустимые объекты конфигурации «1С:Бухгалтерия предприятия 3.0».
# ref пишется ровно так, как объект называется в конфигурации - то есть
# полным квалифицированным именем метаданных (Справочник.X, Документ.X,
# РегистрСведений.X, номер счета). Настройки учетной политики в БП 3.0 не
# являются отдельным типом метаданных: они хранятся ресурсами периодического
# регистра сведений РегистрСведений.УчетнаяПолитикаОрганизаций, поэтому
# такая настройка каталогизируется под его реальным kind (регистр), а не
# под условным «настройкаУП», для которого нет адресуемого объекта.
# kind: счёт | регистр | документ | отчёт | обработка | справочник
- ref: "01.01"
  kind: счёт
  presentation: Основные средства в организации
- ref: "01.09"
  kind: счёт
  presentation: Выбытие основных средств
- ref: "02.01"
  kind: счёт
  presentation: Амортизация ОС, учитываемых на счете 01
- ref: "08.04.1"
  kind: счёт
  presentation: Приобретение компонентов основных средств
- ref: "08.04.2"
  kind: счёт
  presentation: Приобретение основных средств
- ref: РегистрСведений.ПараметрыАмортизацииОС
  kind: регистр
  presentation: Параметры амортизации ОС (бухгалтерский учет)
- ref: РегистрСведений.СобытияОС
  kind: регистр
  presentation: События ОС организаций
- ref: РегистрСведений.МестонахождениеОСБухгалтерскийУчет
  kind: регистр
  presentation: Местонахождение ОС (бухгалтерский учет)
- ref: Документ.ПринятиеКУчетуОС
  kind: документ
  presentation: Принятие к учету ОС
- ref: Документ.ПоступлениеТоваровУслуг
  kind: документ
  presentation: Поступление (акты, накладные, УПД)
- ref: Документ.СписаниеОС
  kind: документ
  presentation: Списание ОС
- ref: Документ.ПередачаОС
  kind: документ
  presentation: Передача ОС
- ref: Документ.МодернизацияОС
  kind: документ
  presentation: Модернизация ОС
- ref: Документ.РегламентнаяОперация
  kind: документ
  presentation: Регламентная операция (в т. ч. амортизация ОС)
- ref: РегистрСведений.УчетнаяПолитикаОрганизаций
  kind: регистр
  presentation: Учетная политика организаций (в т.ч. лимит стоимости ОС)
- ref: Отчет.ВедомостьАмортизацииОС
  kind: отчёт
  presentation: Ведомость амортизации ОС
- ref: Справочник.ОсновныеСредства
  kind: справочник
  presentation: Основные средства
- ref: РегистрСведений.ПервоначальныеСведенияОСБухгалтерскийУчет
  kind: регистр
  presentation: Первоначальные сведения ОС (бухгалтерский учет)
- ref: РегистрСведений.НачислениеАмортизацииОСБухгалтерскийУчет
  kind: регистр
  presentation: Начисление амортизации ОС (бухгалтерский учет)
- ref: РегистрСведений.СостояниеОСОрганизаций
  kind: регистр
  presentation: Состояние ОС организаций
- ref: РегистрСведений.СчетаБухгалтерскогоУчетаОС
  kind: регистр
  presentation: Счета бухгалтерского учета ОС
- ref: Документ.ИзменениеСостоянияОС
  kind: документ
  presentation: Изменение состояния ОС
- ref: Документ.ВыработкаОС
  kind: документ
  presentation: Выработка ОС
- ref: Документ.ИзменениеЭлементовАмортизацииОС
  kind: документ
  presentation: Изменение элементов амортизации ОС
- ref: Документ.ОбесценениеВнеоборотныхАктивов
  kind: документ
  presentation: Обесценение внеоборотных активов (редакция КОРП)
