# Пилотные проекции ФСБУ 6/2020 на объекты «1С:Бухгалтерии предприятия 3.0».
# note описывает МЕХАНИЗМ реализации нормы в конфигурации, а не пересказывает
# саму норму - её текст уже доступен через get_clause.
standard_id: fsbu-6-2020
config: bp30
version_from: "3.0.100"
mappings:
  - clause_path: "4"
    kind: счёт
    object_ref: "01.01"
    note: >-
      Актив, признанный объектом ОС по критериям п.4, приходуется на счет 01.01
      документом «Принятие к учету ОС» при вводе в эксплуатацию.
    confidence: 90
  - clause_path: "5"
    kind: настройкаУП
    object_ref: УчетнаяПолитика.ЛимитСтоимостиОС
    note: >-
      Право п.5 не применять Стандарт к малоценным активам реализовано полем
      «Лимит стоимости основных средств» настройки учетной политики: активы
      дешевле лимита сразу списываются в расходы, минуя счет 01.
    confidence: 90
  - clause_path: "8"
    kind: регистр
    object_ref: РегистрСведений.ПараметрыАмортизацииОС
    note: >-
      Срок полезного использования, который организация определяет по п.8 для
      каждого объекта ОС, хранится как параметр объекта в этом регистре и
      используется при расчете амортизации.
    confidence: 85
