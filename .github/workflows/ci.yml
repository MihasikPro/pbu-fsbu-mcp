name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy
      - name: Build corpus
        run: uv run python -m etl.build_db
      - name: Validate corpus integrity
        run: uv run python -m etl.validate
      - name: Tests
        run: uv run pytest -q
