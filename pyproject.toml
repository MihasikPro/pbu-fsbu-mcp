[project]
name = "pbu-fsbu-mcp"
version = "0.1.0"
description = "MCP server for Russian accounting standards (PBU/FSBU)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "pydantic>=2.7",
    "pymorphy3>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
pbu-fsbu-mcp = "pbu_fsbu_mcp.server:cli"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbu_fsbu_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
