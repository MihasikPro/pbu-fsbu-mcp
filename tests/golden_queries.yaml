# Golden queries for search relevance regression testing (see test_search_golden.py).
#
# Each pair: a natural-language question an accountant/1C consultant would actually
# ask, plus the standard and clause that genuinely answers it (established by reading
# the standard, never by running search and recording whatever it returned).
#
# `on_date` (optional, ISO date) overrides the default TODAY (2026-08-14) used to
# resolve which edition/standard is "in force". Needed for fsbu-9-2025 and
# fsbu-10-2026: both take effect only from 2027-01-01, so on the fixed reference date
# used everywhere else in this suite they are correctly excluded from search as
# not-yet-effective - querying them requires a later on_date.
#
# fsbu-6-2020 pairs below predate this expansion.
- query: требования к формированию информации об основных средствах
  expect_standard: fsbu-6-2020
  expect_path: "1"
- query: применяется ли стандарт бюджетными организациями
  expect_standard: fsbu-6-2020
  expect_path: "2"
- query: признаки объекта основных средств
  expect_standard: fsbu-6-2020
  expect_path: "4"
- query: материально-вещественная форма как признак основного средства
  expect_standard: fsbu-6-2020
  expect_path: "4.а"
- query: применяется ли стандарт про основные средства к организациям бюджетной сферы
  expect_standard: fsbu-6-2020
  expect_path: "2"
- query: что считается объектом основных средств
  expect_standard: fsbu-6-2020
  expect_path: "4"
- query: сфера действия стандарта
  expect_standard: fsbu-6-2020
  expect_path: "1"
  lexical_limitation: true
- query: бухгалтерский учет основных средств организаций
  expect_standard: fsbu-6-2020
  expect_path: "1"

# --- New: non-key standards, one pair each ---
- query: что признается расходом экономического субъекта в результате выбытия активов
  expect_standard: fsbu-10-2026
  expect_path: "4"
  on_date: "2027-06-01"
- query: что признается доходом экономического субъекта в результате поступления активов
  expect_standard: fsbu-9-2025
  expect_path: "3"
  on_date: "2027-06-01"
- query: что регулирует стандарт по инвентаризации активов и обязательств
  expect_standard: fsbu-28-2023
  expect_path: "1"
- query: должен ли бухгалтерский баланс давать представление о финансовом положении на отчетную дату
  expect_standard: fsbu-4-2023
  expect_path: "8"
- query: какие требования должна обеспечивать учетная политика организации
  expect_standard: pbu-1-2008
  expect_path: "6"
- query: что такое уменьшение экономических выгод, приводящее к уменьшению капитала организации
  expect_standard: pbu-10-99
  expect_path: "2"
- query: с какой доли голосов организация считается контролирующей другое юридическое лицо
  expect_standard: pbu-11-2008
  expect_path: "7"
- query: при каком проценте выручки от продаж сегмент признается отчетным
  expect_standard: pbu-12-2010
  expect_path: "10.а"
- query: на какие виды подразделяются бюджетные средства для целей бухгалтерского учета
  expect_standard: pbu-13-2000
  expect_path: "4"
- query: что является расходами по полученным займам - проценты и дополнительные расходы
