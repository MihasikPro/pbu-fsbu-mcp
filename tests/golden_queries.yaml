  expect_path: "3"
- query: при каком условии деятельность организации признается прекращаемой
  expect_standard: pbu-16-02
  expect_path: "7"
- query: что понимается под постоянными разницами - доходы и расходы, формирующие бухгалтерскую прибыль
  expect_standard: pbu-18-02
  expect_path: "4"
- query: какие документы должны подтверждать право организации на финансовые вложения при их признании
  expect_standard: pbu-19-02
  expect_path: "2"
- query: при каком условии выручка по договору строительного подряда признается способом по мере готовности
  expect_standard: pbu-2-2008
  expect_path: "17"
- query: что понимается под совместно осуществляемыми операциями по договору простого товарищества
  expect_standard: pbu-20-03
  expect_path: "6"
- query: как отражается изменение оценочного значения - путем включения в доходы или расходы
  expect_standard: pbu-21-2008
  expect_path: "4"
- query: когда ошибка в бухучете признается существенной
  expect_standard: pbu-22-2010
  expect_path: "3"
- query: что относится к денежным эквивалентам в отчете о движении денежных средств
  expect_standard: pbu-23-2011
  expect_path: "5"
- query: какие поисковые затраты признаются внеоборотными активами
  expect_standard: pbu-24-2011
  expect_path: "4"
- query: по какому курсу пересчитывается стоимость активов в иностранной валюте в рубли
  expect_standard: pbu-3-2006
  expect_path: "5"
- query: что признается событием после отчетной даты
  expect_standard: pbu-7-98
